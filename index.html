ems must establish a shared session key over an untrusted network so that a later compromise of a long-term private key does not expose past sessions. Which should be used?",["Hardcoded pre-shared symmetric key","Ephemeral Diffie-Hellman (ECDHE)","Static RSA key transport","MD5 key derivation"],1,"Ephemeral Diffie-Hellman generates a fresh key per session, giving perfect forward secrecy. Static RSA key transport exposes past sessions if the private key is later stolen."],[1,"An administrator needs to obtain a certificate for a new web server. What must the administrator submit to the certificate authority?",["An OCSP response","A certificate signing request (CSR)","The server's private key","A certificate revocation list"],1,"A CSR contains the public key and identity details to be signed by the CA. The private key must never leave the server."],[1,"A security researcher conceals a message inside the pixel data of a JPEG image so that observers do not realize a message exists. Which technique is this?",["Tokenization","Steganography","Salting","Key stretching"],1,"Steganography hides the existence of data within another file. Encryption protects content but does not hide that a message exists."],[1,"A certificate authority needs a dedicated, tamper-resistant appliance to generate and store its root private keys. Which device is BEST?",["Trusted platform module (TPM) on a laptop","Smart card","Self-encrypting USB drive","Hardware security module (HSM)"],3,"An HSM is a purpose-built, tamper-resistant device for protecting and using cryptographic keys at scale. A TPM is tied to a single endpoint."],[1,"An employee in accounts payable can both add new vendors and approve payments to them. Which security principle is MOST directly violated?",["Non-repudiation","Least privilege","Separation of duties","Defense in depth"],2,"Separation of duties splits critical tasks among people to prevent fraud. Least privilege concerns the amount of access, though it is related."],[1,"A security team deploys an unused server with fake data to lure attackers and study their techniques. What is this?",["Honeypot","Jump server","Bastion host","Sandbox"],0,"A honeypot is a decoy system designed to attract and observe attackers. A jump server is a legitimate hardened administrative gateway."],[2,"A switch port receives frames carrying two stacked 802.1Q tags, and the inner tag causes traffic to reach a VLAN the attacker's port is not assigned to. Which attack is this?",["VLAN hopping","ARP poisoning","MAC flooding","DHCP starvation"],0,"Double tagging is a classic VLAN hopping technique that exploits the native VLAN. MAC flooding targets the CAM table instead."],[2,"Which TWO actions help prevent VLAN hopping?",["Enable port-based QoS marking","Increase the MAC address aging timer","Disable trunk negotiation (DTP) on user-facing ports","Enable DHCP snooping","Change the native VLAN to an unused VLAN"],[2,4],"Statically setting access ports and moving the native VLAN away from user VLANs blocks switch spoofing and double tagging. DHCP snooping and QoS do not address trunk behavior."],[2,"A switch suddenly begins forwarding unicast traffic out of every port, and logs show thousands of new source MAC addresses on a single access port. Which attack is occurring?",["Evil twin","MAC flooding","Deauthentication","DNS poisoning"],1,"Flooding the CAM table forces the switch to fail open and behave like a hub, which lets an attacker sniff traffic. DNS poisoning affects name resolution, not switching."],[2,"Users who type the correct bank URL are directed to an attacker's server because the recursive resolver holds a forged record. Which control BEST protects against this?",["DNSSEC","DNS over UDP rate limiting","WPA3-Personal","DHCP snooping"],0,"DNSSEC digitally signs DNS records so resolvers can validate their authenticity and integrity. Rate limiting does not verify record authenticity."],[2,"After an attacker uses ARP spoofing, all traffic between a workstation and the default gateway passes through the attacker, who reads and alters it. Which attack is this?",["On-path attack","Smurf attack","Replay attack","Session fixation"],0,"The attacker sits between two parties, intercepting and modifying communications, which defines an on-path attack. A replay attack only resends captured traffic."],[2,"Which TWO controls help mitigate on-path attacks on a local network?",["Dynamic ARP inspection","HTTPS with HSTS and certificate validation","Disabling system logging","Longer user password length","Increasing DHCP lease time"],[0,1],"Dynamic ARP inspection blocks forged ARP replies and TLS with certificate validation protects data even if intercepted. Longer passwords do not stop interception."],[2,"Travelers at an airport connect to a Wi-Fi network that uses the same SSID as the airline lounge network but with a stronger signal, and a captive page then asks for corporate credentials. What is this attack?",["Bluesnarfing","Evil twin","War driving","Rogue access point plugged into the wired LAN"],1,"An evil twin impersonates a legitimate SSID to harvest credentials. A rogue AP is an unauthorized device connected to the organization's own network."],[2,"A wireless scan finds an unmanaged access point connected to a wall jack in a conference room, installed by an employee for convenience. What does this represent?",["Evil twin","Rogue access point","Bluejacking","Jamming"],1,"A rogue AP is an unauthorized AP attached to the internal network, bypassing controls. An evil twin copies an authorized SSID to deceive users."],[2,"Wireless clients keep disconnecting, and a capture shows many forged 802.11 management frames that tell clients to leave the network. Which attack is this?",["Bluesnarfing","Deauthentication attack","IV attack","SYN flood"],1,"Spoofed deauthentication frames force clients off an AP, often to capture handshakes or push them to an evil twin. Protected management frames (802.11w) help prevent it."],[2,"An attacker connects to a victim's phone over Bluetooth without permission and copies the contact list. Which attack is this?",["Bluesnarfing","Vishing","Typosquatting","Bluejacking"],0,"Bluesnarfing steals data over Bluetooth, while bluejacking only sends unsolicited messages."],[2,"A server has thousands of half-open TCP connections from spoofed addresses, and legitimate users cannot connect. Which attack is this?",["Directory traversal","Rainbow table attack","SYN flood","Pass-the-hash"],2,"A SYN flood exhausts the connection table by never completing the three-way handshake. SYN cookies are a common mitigation."],[2,"Attackers use usernames and passwords leaked from an unrelated website breach to log in to a company's customer portal. Which attack is this?",["Credential stuffing","Password spraying","Rainbow table attack","Keylogging"],0,"Credential stuffing reuses known username and password pairs from prior breaches. Password spraying tries a few common passwords across many accounts."],[2,"An endpoint scanner finds nothing, yet the system hides its own processes and files and survives reboots by modifying low-level OS components. Which malware type is MOST likely?",["Adware","Logic bomb","Worm","Rootkit"],3,"Rootkits operate with elevated privileges to conceal their presence from tools running in the OS. Worms are defined by self-replication across networks."],[2,"An attacker poses as a new external auditor in person and convinces a receptionist to share a list of server room badge holders. Which social engineering technique is this?",["Tailgating","Shoulder surfing","Pretexting","Whaling"],2,"Pretexting uses a fabricated scenario and identity to obtain information. Whaling is phishing aimed at senior executives."],[2,"A user logged in to an online bank visits another site, and a hidden request on that page triggers a funds transfer using the user's active session. Which attack is this?",["Cross-site request forgery (CSRF)","Directory traversal","Cross-site scripting (XSS)","SQL injection"],0,"CSRF abuses the browser's existing authenticated session to send unwanted requests. XSS injects script into a trusted page rather than forging cross-site requests."],[2,"Which control BEST prevents SQL injection in a web application?",["Client-side JavaScript validation only","Encrypting the database at rest","Hiding the login page URL","Parameterized queries with server-side input validation"],3,"Parameterized queries separate code from data so input cannot alter the SQL statement. Client-side checks can be bypassed."],[2,"A malicious update is delivered through a legitimate vendor's signed software distribution channel to thousands of customers. Which threat is this?",["Supply chain attack","Watering hole attack","Brand impersonation","Privilege escalation"],0,"Compromising a trusted supplier to reach downstream customers is a supply chain attack. A watering hole targets a site its victims visit."],[2,"A user logs in from Pune and 20 minutes later logs in from Frankfurt. What is this MOST likely an indicator of?",["Normal use of the corporate proxy","Compromised account credentials","Expired password policy","Clock drift on the server"],1,"Impossible travel strongly suggests the credentials are being used by someone else. Normal causes are less likely to explain two distant locations in minutes."],[2,"An attacker exploits a flaw that the software vendor does not yet know about, and no patch exists. What type of vulnerability is this?",["Misconfiguration","Unpatched known CVE","Legacy","Zero-day"],3,"A zero-day is unknown to the vendor and has no patch available at the time of exploitation."],[2,"An attacker with a stolen password hash file looks up each hash in a large precomputed table of hashes and plaintexts. Which attack is this?",["Password spraying","Credential stuffing","Pass-the-hash","Rainbow table attack"],3,"Rainbow tables are precomputed hash lookups, and unique salts defeat them."],[3,"A company hosts a public web server and wants an internal LAN to remain protected if the web server is compromised. Where should the server be placed?",["In a screened subnet between two firewalls","Outside the perimeter firewall with no filtering","In the same VLAN as the domain controllers","On the internal LAN with a host firewall"],0,"A screened subnet (DMZ) isolates public-facing systems so a compromise does not provide direct access to internal resources."],[3,"A firewall ruleset is processed top-down: (1) Allow TCP 443 any to web server, (2) Deny any any, (3) Allow TCP 22 from 10.1.1.0/24 to management server. Administrators on 10.1.1.0/24 cannot SSH to the management server. What is the cause?",["Rule 1 blocks all SSH traffic","Implicit deny is disabled","Rule 2 matches the SSH traffic before rule 3 is evaluated","SSH requires UDP, not TCP"],2,"Firewalls apply the first matching rule, so the deny-all rule placed above the SSH allow rule blocks it. Moving the allow rule above the deny fixes the problem."],[3,"A firewall has only two allow rules: TCP 80 and TCP 443 to a web server. A user tries to connect to the server on TCP 8080. What happens?",["The traffic is dropped by the implicit deny rule","The firewall asks the user to authenticate","The traffic is allowed because the destination is permitted","The traffic is redirected to TCP 80"],0,"Traffic that matches no rule is denied by the implicit deny at the end of the ruleset."],[3,"Which firewall rule BEST permits the 10.0.5.0/24 network to use SFTP to reach a file server at 10.0.9.10 while following least privilege?",["Allow TCP 22 from 10.0.5.0/24 to 10.0.9.10","Allow any protocol from 10.0.5.0/24 to any","Allow TCP 21 from any to 10.0.9.10","Allow UDP 69 from any to 10.0.9.10"],0,"SFTP runs over SSH on TCP 22. UDP 69 is TFTP and TCP 21 is plain FTP control."],[3,"A branch office and headquarters gateways need a VPN that encrypts the entire original IP packet, including its header, and adds a new outer header. Which IPsec mode is this?",["Tunnel mode","Transport mode","Aggressive mode","Authentication-only (AH) transport mode"],0,"Tunnel mode encapsulates the whole original packet and is typical for gateway-to-gateway VPNs. Transport mode protects only the payload and keeps the original header."],[3,"Contractors on unmanaged laptops need to reach a few internal web applications through a browser without installing any software. Which solution is BEST?",["Open the applications directly to the internet","IPsec site-to-site tunnel","Full-tunnel IPsec with an installed client","Clientless SSL/TLS VPN portal"],3,"A clientless SSL/TLS VPN provides browser-based access over HTTPS. A site-to-site tunnel connects networks, not individual contractors."],[3,"In an 802.1X deployment, which component is the switch port that relays authentication messages between the client and the RADIUS server?",["Supplicant","Authenticator","Authentication server","Certificate authority"],1,"The network access device (switch or AP) is the authenticator, the client is the supplicant, and RADIUS is the authentication server."],[3,"Which switch feature BEST mitigates MAC flooding by limiting the number of MAC addresses learned on an access port?",["Port security","Trunk negotiation","DNSSEC","Spanning tree"],0,"Port security caps allowed MAC addresses per port and can shut down or restrict the port on violation."],[3,"A rogue DHCP server on a user VLAN hands out an attacker's address as the default gateway. Which feature prevents this?",["DHCP snooping with trusted ports","MAC filtering on the router","NAT overload","Port mirroring"],0,"DHCP snooping permits server responses only on trusted ports, discarding offers from untrusted access ports."],[3,"Which security property does DNSSEC provide?",["Load balancing of name servers","Blocking of malicious domains","Encryption of DNS queries for confidentiality","Origin authentication and integrity of DNS data"],3,"DNSSEC signs records so they can be validated, but it does not encrypt queries. DoH or DoT provide confidentiality."],[3,"An application must query a directory service over an encrypted connection using the standard secure LDAP port. Which port should be used?",["TCP 88","TCP 3389","TCP 389","TCP 636"],3,"LDAPS uses TCP 636. TCP 389 is unencrypted LDAP by default, 88 is Kerberos and 3389 is RDP."],[3,"A network team wants to monitor devices with both authentication and encryption of management data. Which version of SNMP should be used?",["SNMP with a community string of private","SNMPv1","SNMPv2c","SNMPv3"],3,"SNMPv3 adds user-based authentication and encryption. Versions 1 and 2c send community strings in cleartext."],[3,"Which TWO protocols transmit credentials in cleartext and should be blocked at the perimeter in favor of secure alternatives?",["Telnet","FTP","LDAPS","SSH","SFTP"],[0,1],"Telnet and FTP send usernames and passwords unencrypted. SSH, SFTP and LDAPS are encrypted."],[3,"An IDS needs to see a copy of traffic without sitting in the data path or risking an outage if it fails. Which method is BEST?",["A network TAP or SPAN port","Inline placement behind the firewall","Using NAT to route traffic through it","Placing it in the screened subnet as a gateway"],0,"A TAP or SPAN port provides a passive copy of traffic, so the sensor failing does not interrupt production."],[3,"A database server needs storage that survives the failure of any single disk while still offering good read performance and efficient capacity use. Which RAID level is the BEST fit?",["RAID 0","JBOD","RAID 1 with a single disk","RAID 5"],3,"RAID 5 stripes data with distributed parity and tolerates one disk failure. RAID 0 has no redundancy."],[3,"Before deploying access points in a new warehouse, an engineer wants to determine optimal AP placement and identify coverage gaps. What should be performed?",["A penetration test of the SSID","A vulnerability scan of the APs","A password audit","A wireless site survey with a heat map"],3,"A site survey with heat maps shows signal strength and interference so APs can be placed for coverage."],[4,"A scan shows TCP 3389 reachable from the internet on a production server. What is the BEST remediation?",["Remove direct exposure and require access through a VPN or RD Gateway with MFA","Disable the host firewall","Change the port to 3390 on the same public IP","Share the RDP password only with administrators"],0,"RDP should not be directly exposed. Placing it behind a VPN or gateway with MFA reduces attack surface, while changing ports is only obscurity."],[4,"Network devices send logs to a central collector over UDP 514, and the security team needs encrypted, reliable delivery. Which is the BEST solution?",["UDP 514 with a larger buffer","Syslog over TLS using TCP","NetFlow export","SNMPv1 traps"],1,"Syslog over TLS (TCP 6514) provides confidentiality and reliable transport. Plain UDP syslog is unencrypted and may drop messages."],[4,"A mail client is configured to use implicit TLS for both retrieving and sending email. Which port pair is correct for IMAPS and SMTPS?",["993 and 465","995 and 143","143 and 25","110 and 25"],0,"IMAPS uses TCP 993 and SMTPS commonly uses TCP 465. Ports 143, 25 and 110 are cleartext by default."],[4,"Which protocol provides secure file transfer through an SSH subsystem on TCP 22?",["SMB","SFTP","FTPS","TFTP"],1,"SFTP runs over SSH on a single port. FTPS wraps FTP in TLS and uses additional ports."],[4,"Firewall logs show one external IP receiving denies for sequential TCP ports on a single host within seconds. What does this MOST likely indicate?",["Data exfiltration","A DDoS attack","A misconfigured NTP server","Reconnaissance through a port scan"],3,"Sequential connection attempts to many ports are the signature of a port scan used to enumerate services."],[4,"In the incident response lifecycle, which phase normally follows containment?",["Preparation","Eradication","Lessons learned","Detection"],1,"After containment limits the damage, eradication removes the root cause such as malware, followed by recovery."],[4,"A SOC is overwhelmed by SIEM alerts that investigation shows are benign. What is the BEST action?",["Ignore alerts with low severity","Stop collecting logs from noisy sources","Tune the correlation rules and thresholds to reduce false positives","Disable all alerting during business hours"],2,"Tuning improves detection quality without losing visibility. Disabling log sources or alerts creates blind spots."],[4,"Which data source BEST shows traffic volumes and communicating hosts across the network without storing full packet payloads?",["NetFlow","Vulnerability scan report","Application error logs","Full packet capture"],0,"NetFlow summarizes conversations such as source, destination, ports and byte counts with far less storage than full capture."],[4,"Which factor should MOST increase the remediation priority of a vulnerability?",["The vendor is well known","It was published over a year ago","The CVE description is lengthy","It is actively exploited in the wild on an internet-facing system"],3,"Active exploitation and exposure drive real risk, so they take priority over age or vendor reputation."],[4,"Which authentication protocol uses tickets issued by a key distribution center and runs on port 88?",["RADIUS","Kerberos","OAuth","SAML"],1,"Kerberos uses a KDC to issue tickets for single sign-on in Active Directory environments."],[4,"Network engineers need device administration AAA that encrypts the entire payload and allows per-command authorization on routers. Which protocol is BEST?",["RADIUS","LDAP","TACACS+","Kerberos"],2,"TACACS+ separates authentication, authorization and accounting and supports command-level authorization. RADIUS encrypts only the password."],[4,"Users report being flooded with MFA push requests until someone approves one. Which control BEST mitigates this?",["Increase the password length","Number matching or phishing-resistant MFA","Send push prompts more frequently","Disable lockout policies"],1,"Number matching requires the user to enter a value shown at the login screen, making blind approvals ineffective."],[4,"Administrators check out shared privileged account credentials from a secure repository that rotates them after each use. Which solution is this?",["Kerberos delegation","Privileged access management password vault","Single sign-on portal","Certificate pinning"],1,"A PAM vault controls, logs and rotates privileged credentials. SSO does not manage shared secrets."],[4,"Which email authentication mechanism uses a cryptographic signature in the message header so receivers can verify the message was not altered and came from the domain?",["SPF","MX records","S/MIME encryption","DKIM"],3,"DKIM signs outgoing messages with a domain key published in DNS. SPF only checks the sending IP address."],[4,"Before deploying a critical OS patch to all production servers, what should be done FIRST?",["Disable antivirus","Test it in a non-production environment","Remove the rollback plan","Deploy to all servers immediately"],1,"Testing in staging validates compatibility and avoids widespread outages."],[4,"Which backup strategy keeps three copies of data on two different media types with one copy stored off-site?",["Differential backup","The 3-2-1 rule","RAID 10","Grandfather-father-son rotation"],1,"The 3-2-1 rule describes three copies, two media types and one off-site copy."],[4,"An employee leaves the company, but their accounts remain active for months. Which control BEST addresses this?",["Longer password policy","Automated deprovisioning triggered by the HR system","Disabling account lockout","Annual security awareness training"],1,"Tying account removal to HR events removes orphaned accounts quickly and consistently."],[4,"Litigation is reasonably anticipated against a company. What should be issued to ensure relevant emails are not deleted?",["Legal hold","Retention reduction","Chain of custody","Data sanitization order"],0,"A legal hold suspends normal deletion so relevant information is preserved for e-discovery."],[4,"Which control prevents users from resolving domains known to host malware or phishing sites?",["DNS filtering","Port mirroring","MAC filtering","Disk encryption"],0,"DNS filtering blocks or sinkholes lookups for malicious domains before a connection is made."],[4,"A device attached to a SPAN port analyzes traffic and generates alerts but cannot stop malicious packets. What is it?",["Intrusion detection system (IDS)","Next-generation firewall inline","Intrusion prevention system (IPS)","Web application firewall"],0,"A passive device that only alerts is an IDS. An IPS sits inline and can block traffic."],[4,"Which TWO log sources would BEST help investigate suspected data exfiltration over the web?",["NetFlow records","Badge reader logs for the server room","Printer toner counters","Patch deployment reports","Web proxy logs"],[0,4],"Proxy logs show destinations and volumes of web requests and NetFlow shows outbound conversations. The others do not show network data movement."],[4,"Which TWO pairs correctly map an insecure protocol to a secure replacement?",["LDAP to LDAP over UDP","HTTP to HTTPS","FTP to TFTP","SNMPv3 to SNMPv1","Telnet to SSH"],[1,4],"SSH replaces Telnet and HTTPS replaces HTTP. TFTP is also insecure and SNMPv1 is weaker than v3."],[4,"An endpoint contacts the same unknown external IP address every 60 seconds, including at night. What does this MOST likely indicate?",["DNS zone transfer","Normal NTP synchronization","Command-and-control beaconing","A scheduled OS update"],2,"Regular, automated check-ins to an unfamiliar host are typical of malware beaconing to a C2 server."],[4,"Which incident response activity reviews what went well and poorly to improve future handling?",["Lessons learned","Containment","Preparation","Eradication"],0,"Lessons learned occurs after recovery and feeds improvements into the plan and controls."],[4,"A company buys phones, allows employees limited personal use, and enforces its own security policies. Which deployment model is this?",["CYOD","Unmanaged personal device","COPE","BYOD"],2,"Corporate-owned, personally enabled devices are owned and controlled by the organization with personal use allowed."],[5,"A single loss expectancy is $50,000 and the annualized rate of occurrence is 0.2. What is the annualized loss expectancy?",["$250,000","$50,000","$100,000","$10,000"],3,"ALE equals SLE multiplied by ARO, so 50,000 x 0.2 = $10,000."],[5,"The cost of mitigating a low-impact risk far exceeds the potential loss, and management formally acknowledges it. Which risk strategy is this?",["Transference","Mitigation","Avoidance","Acceptance"],3,"Acceptance is a documented decision to live with a risk when mitigation is not cost-effective."],[5,"A workshop rates each risk as high, medium or low based on expert opinion rather than monetary values. Which analysis type is this?",["Quantitative","Qualitative","Predictive","Forensic"],1,"Qualitative analysis uses subjective ratings. Quantitative uses figures such as SLE and ALE."],[5,"Which activity is an example of passive reconnaissance during a penetration test?",["Performing a ping sweep","Grabbing banners from services","Running a port scan","Searching public WHOIS and DNS records"],3,"Passive reconnaissance gathers information without interacting with target systems."],[5,"A penetration tester is given only the company name and no network details. Which type of test is this?",["Unknown environment","Compliance audit","Partially known environment","Known environment"],0,"A tester with no prior information is performing an unknown environment (black box) test."],[5,"Which metric represents the average time required to repair a failed component and restore it to service?",["ALE","MTTR","RPO","MTBF"],1,"MTTR measures repair time. MTBF measures the average time between failures."],[5,"Incident response staff gather to discuss how they would respond to a hypothetical ransomware scenario without touching any systems. What is this exercise?",["Failover test","Parallel processing test","Tabletop exercise","Penetration test"],2,"Tabletop exercises are discussion-based walk-throughs of a scenario."],[5,"A company shares confidential product plans with a potential vendor during evaluation. Which agreement BEST prevents disclosure?",["Memorandum of agreement","Service level agreement","Non-disclosure agreement (NDA)","Statement of work"],2,"An NDA legally restricts disclosure of confidential information."],[5,"Which activity should be completed BEFORE signing a contract with a new vendor that will handle sensitive customer data?",["Post-incident review","Annual penetration test of the vendor","Third-party risk assessment (due diligence)","Termination of the old vendor"],2,"Due diligence evaluates a vendor's security posture before the relationship starts."],[5,"Under GDPR, within what time frame must a controller notify the supervisory authority after becoming aware of a reportable personal data breach?",["30 days","7 days","72 hours","24 hours"],2,"GDPR requires notification within 72 hours where feasible."],[5,"Which standard governs organizations that store, process or transmit payment card data?",["HIPAA","SOX","FERPA","PCI DSS"],3,"PCI DSS is the industry standard for cardholder data. HIPAA covers health information."],[5,"Which governance document provides detailed step-by-step instructions for completing a specific task, such as onboarding a new user account?",["Policy","Guideline","Procedure","Standard"],2,"Procedures give step-by-step instructions, while policies state high-level intent."],[5,"In a data governance model, which role makes the final decision on how sensitive a particular business dataset is?",["Data owner","Data custodian","Data processor","System administrator"],0,"The data owner is accountable for classification and access decisions. A custodian carries out technical protection."],[5,"What is the primary purpose of a clean desk policy?",["Enforce hardware inventory","Prevent tailgating","Improve employee productivity","Reduce exposure of sensitive information left unattended"],3,"Clearing papers and media from desks reduces risk of theft or viewing of sensitive material."],[5,"An organization needs an independent party to assess its controls so it can obtain a formal certification. Which type of audit is needed?",["External audit","Internal audit","Peer review","Self-assessment"],0,"Certification generally requires an independent external auditor."],[5,"Which term describes the acceptable level of variation around an organization's risk appetite?",["Risk register","Inherent risk","Residual risk","Risk tolerance"],3,"Risk tolerance sets boundaries around the appetite. Residual risk remains after controls are applied."],[5,"A company invites independent researchers to report vulnerabilities in its applications in exchange for rewards. What is this program called?",["Red team exercise","Tabletop exercise","Vulnerability scan","Bug bounty"],3,"Bug bounty programs reward external researchers for responsibly disclosed vulnerabilities."],[5,"Which TWO are rights granted to data subjects under GDPR?",["Right of access to their data","Right to unlimited retention of data by the controller","Right to modify the controller's encryption keys","Right to audit the controller's source code","Right to data portability"],[0,4],"GDPR grants individuals access and portability rights, among others. The remaining options are not GDPR rights."]],[[1,"An inline intrusion prevention system drops packets that match a known exploit signature. Which control type and category does this represent?",["Corrective, managerial","Preventive, technical","Preventive, physical","Detective, technical"],1,"An inline IPS stops the traffic before it reaches the target, so it is preventive, and it is implemented in technology. An IDS that only alerts would be detective."],[1,"A bank needs a tamper-resistant dedicated device to generate, store and use cryptographic keys for its payment applications. Which solution BEST meets this need?",["Software-based key vault on a file server","Hardware security module","Trusted platform module on each laptop","Self-signed certificate on each application"],1,"An HSM is a dedicated, hardened appliance designed to generate and protect keys at scale. A TPM is bound to a single endpoint and is not meant for centralized application key services."],[1,"Which TWO actions should be part of a change management request for a production system upgrade?",["Deleting the audit logs of the system beforehand","Documenting a backout plan","Skipping approval when the change is scheduled overnight","Applying the change directly on production without testing","Performing an impact analysis"],[1,4],"Change management requires understanding impact and having a way to revert if the change fails. The other options bypass or undermine the control process."],[1,"In a Zero Trust model, which component sits in the data plane and actually allows or blocks the connection between a subject and a resource?",["Policy administrator","Adaptive identity store","Policy enforcement point","Policy engine"],2,"The policy enforcement point is the gatekeeper in the data plane. The engine and administrator are part of the control plane and decide and instruct, rather than enforce."],[1,"A malicious insider hides confidential data inside the pixels of a company logo image and emails it out. Which technique is being used?",["Salting","Steganography","Tokenization","Obfuscation of source code"],1,"Steganography conceals data inside another carrier file such as an image. Tokenization replaces sensitive values with surrogate tokens and is unrelated to hiding data in files."],[1,"A security architect wants the compromise of a web server's long-term private key to NOT allow an attacker to decrypt previously recorded TLS sessions. Which feature should be configured?",["Certificate pinning","Session resumption tickets","Longer RSA key length","Perfect forward secrecy using ephemeral key exchange"],3,"Ephemeral Diffie-Hellman key exchange creates unique session keys that are not derived from the long-term key. A longer RSA key does not protect past sessions if the key is later stolen."],[1,"A company deploys a server cluster and redundant power supplies for its customer portal. Which part of the CIA triad does this primarily support?",["Non-repudiation","Confidentiality","Integrity","Availability"],3,"Clustering and redundant power keep services running despite component failure, which is availability."],[1,"A system records which user deleted a file, and when it occurred. Which component of AAA provides this capability?",["Authentication","Federation","Accounting","Authorization"],2,"Accounting tracks and logs user actions for auditing. Authentication proves identity and authorization determines permissions."],[1,"Why is a root certificate authority commonly kept offline in a PKI hierarchy?",["Compromise of its private key would invalidate trust in every certificate beneath it","It allows the root to use symmetric encryption","Online root CAs cannot issue certificates","Offline CAs are required to publish CRLs"],0,"The root key is the trust anchor, so it is protected by being offline while intermediate CAs handle daily issuance. Root CAs can issue certificates whether online or not."],[1,"During a TLS session, which type of encryption is typically used to protect the bulk of the data after the handshake completes?",["Digital signatures on each packet","Asymmetric encryption with the server's public key","Hashing with a salt","Symmetric encryption with a session key"],3,"Symmetric algorithms are much faster, so asymmetric cryptography is used only to exchange or agree on the session key. Hashing is not encryption."],[1,"A security team builds a set of decoy servers, switches and databases that mimics the production network to study attacker behavior. What is this called?",["Honeypot","Honeynet","Honeytoken","Screened subnet"],1,"A honeynet is a network of multiple decoy systems. A single decoy host would be a honeypot, and a honeytoken is just a fake data item."],[2,"An attacker who has compromised one guest virtual machine manages to execute code on the underlying hypervisor and access other tenants' VMs. Which attack is this?",["Container image poisoning","Cross-site request forgery","VM escape","VM sprawl"],2,"VM escape breaks the isolation boundary between guest and host. VM sprawl is an uncontrolled growth of VMs and is a management problem, not an attack technique."],[2,"Over several years, teams have created hundreds of virtual machines that nobody tracks, patches or decommissions. Which risk does this describe?",["Resource reuse","VM escape","VM sprawl","Hypervisor rootkit"],2,"VM sprawl leaves unmanaged, unpatched systems that expand the attack surface. The remedy is lifecycle management, inventory and policy-based decommissioning."],[2,"A security researcher finds that a company's cloud object storage container holding customer invoices is readable by anyone on the internet. What is the MOST likely root cause?",["A DDoS attack against the storage endpoint","A hypervisor flaw at the provider","A zero-day vulnerability in the storage service","Cloud misconfiguration of access permissions"],3,"Publicly exposed buckets are almost always the result of customer-side misconfiguration under the shared responsibility model. The provider's infrastructure is not at fault."],[2,"A developer pulls a container image from a public registry and deploys it to production. Later, the image is found to contain a cryptominer. Which control would have BEST prevented this?",["Pulling only scanned and signed images from a trusted private registry","Running the container on a larger VM","Disabling logging in the container","Increasing CPU limits on the container"],0,"Image scanning and signing from a controlled registry verifies provenance and contents. Resource limits only constrain damage rather than prevent the malicious image being used."],[2,"A security analyst discovers a cloud access key committed in plaintext to a public source code repository. What should be done FIRST?",["Revoke and rotate the exposed key","Enable versioning on the repository","Delete the commit from the repository history only","Notify all employees by email"],0,"Once exposed, the key must be assumed compromised, so it is revoked or rotated immediately. Deleting the commit does not help because copies may already exist."],[2,"Thousands of internet-connected cameras with unchanged factory passwords are hijacked and used to flood a website with traffic. Which weakness MOST directly enabled this?",["Weak hashing of stored passwords","Lack of a web application firewall on the cameras","Default credentials on IoT devices","Unencrypted backup tapes"],2,"Default credentials let attackers log in at scale and enlist the devices in a botnet. Changing defaults during deployment would have prevented it."],[2,"An embedded controller in a medical device runs firmware that has a known vulnerability, but the vendor does not allow field updates. Which compensating approach is BEST?",["Install antivirus software on the device","Move the device to the guest wireless network","Isolate the device on a restricted network segment","Enable automatic OS updates"],2,"When a device cannot be patched, segmentation limits exposure to it. Embedded devices usually cannot run antivirus agents, and updates are unavailable by the vendor's policy."],[2,"Attackers insert malicious code into a trusted software vendor's build pipeline, so customers receive a signed update that contains a backdoor. Which attack is this?",["Brute force attack","Replay attack","Watering hole attack","Supply chain attack"],3,"The attacker compromises an upstream supplier to reach many downstream customers. A watering hole targets a website that victims visit rather than a vendor's software."],[2,"Which TWO of the following are common cloud misconfigurations that lead to data breaches?",["Overly permissive IAM roles that grant wildcard access","Storage buckets set to public access","Enforcing multifactor authentication for administrators","Encrypting data at rest with customer-managed keys","Enabling audit logging for API calls"],[0,1],"Excessive permissions and public storage are frequent root causes of cloud data exposure. The other options are good practices."],[2,"A container is started with the privileged flag and mounts the host's root file system. What is the MOST likely risk?",["Expiration of the container's TLS certificate","Container breakout that gives control of the host","Duplicate IP addresses on the network","Slower application performance"],1,"A privileged container with host mounts removes isolation, so a compromise of the container can lead to full host compromise."],[2,"A web application running in a cloud VM fetches URLs supplied by users. An attacker supplies an internal address that returns the instance's temporary credentials. Which vulnerability is being exploited?",["Directory traversal","Cross-site request forgery","Cross-site scripting","Server-side request forgery"],3,"SSRF tricks the server into making requests to internal resources, such as a cloud metadata service. XSS targets other users' browsers, not the server's outbound requests."],[2,"An accountant receives an email that appears to come from the CEO and asks for an urgent change to a vendor's bank account details. The email domain was legitimately registered and looks similar to the company's. Which attack is this?",["Pharming","Business email compromise","Smishing","Credential stuffing"],1,"BEC uses impersonation of an executive or vendor to trick staff into financial actions. Smishing uses SMS rather than email."],[2,"An attacker with a stolen password database compares hashes against a very large table of precomputed hashes. Which control makes this attack impractical?",["Adding a unique salt to each password before hashing","Adding a banner to the login page","Using longer usernames","Encrypting the database backups"],0,"Unique salts make precomputed rainbow tables useless because each password needs its own table. Backup encryption does not change how the hashes are stored."],[2,"A departing employee copies the customer database to a personal drive in the weeks before resigning. Which threat actor category BEST describes this person?",["Nation-state","Insider threat","Unskilled attacker","Hacktivist"],1,"The individual abused legitimate access from inside the organization, which is the defining characteristic of an insider threat."],[2,"A newly discovered vulnerability is being exploited in the wild, and the vendor has not yet released a patch. What is this called?",["Known false positive","Misconfiguration","Legacy vulnerability","Zero-day vulnerability"],3,"A zero-day has no available fix when exploitation begins. A false positive would be a scanner reporting a vulnerability that does not exist."],[2,"Users connect to a wireless network with the same SSID as the corporate network, but located in a nearby parking lot, and their traffic is intercepted. Which attack is this?",["Bluejacking","Evil twin","War driving","Disassociation attack"],1,"An evil twin is a rogue access point that mimics a legitimate one to capture traffic. War driving only searches for wireless networks and does not intercept data."],[2,"An attacker captures a valid session token on the network and resubmits it later to gain access. Which mitigation BEST counters this attack?",["Disabling ICMP","Using a larger hash output","Longer passwords","Short-lived tokens combined with nonces or timestamps"],3,"Replay attacks are defeated by making captured messages stale or single-use. Stronger passwords do not help because the attacker never needs the password."],[2,"While a user is logged in to an online bank, a malicious site causes the user's browser to silently submit a funds-transfer request to the bank. Which attack is this?",["Buffer overflow","Cross-site request forgery","Cross-site scripting","SQL injection"],1,"CSRF abuses the authenticated session in the victim's browser to trigger actions the user did not intend. The attacker does not need to inject code into the bank's site."],[2,"A threat actor runs a malicious PowerShell script entirely in memory without writing any file to disk. Which malware type is this?",["Logic bomb","Rootkit","Ransomware","Fileless malware"],3,"Fileless malware operates in memory using legitimate tools such as PowerShell, so it evades file-based scanning. The defining feature is the lack of a file on disk."],[2,"A user changes the account number in an API URL from /accounts/1001 to /accounts/1002 and receives another customer's data. Which weakness does this reveal?",["Broken object-level authorization","Insufficient logging","Missing rate limiting","Weak TLS ciphers"],0,"The API does not verify that the requester is authorized to access the specific object. This is commonly called an insecure direct object reference."],[3,"An organization uses a SaaS email platform. Which item remains the customer's responsibility?",["Updating the application code","Maintaining the physical data center","Patching the underlying operating system","Managing user accounts and data access settings"],3,"In SaaS the provider handles infrastructure and the application, but the customer is still responsible for its data, users and configuration."],[3,"A development team deploys code on a managed platform where the provider handles the operating system and runtime. Which responsibility stays with the customer in this PaaS model?",["Replacing failed servers","Patching the runtime environment","Securing the application code and its data","Securing the hypervisor"],2,"In PaaS, the customer owns the application and data while the provider manages the platform underneath."],[3,"A team is moving event-driven code to a serverless function platform. Which practice BEST improves security?",["Install host-based antivirus on the function runtime","Open inbound SSH for debugging","Give all functions the same administrator role","Assign each function a narrowly scoped, least-privilege role"],3,"Functions should have only the permissions they need to limit the blast radius. Customers have no access to the host runtime in serverless platforms, so host agents and SSH do not apply."],[3,"A microservices application's internal services communicate across a cluster. The architect wants each service to verify the identity of its peers and encrypt this east-west traffic. What should be implemented?",["A single shared API key","Service mesh with mutual TLS","A perimeter firewall at the edge","Network address translation"],1,"A service mesh with mTLS authenticates and encrypts service-to-service traffic. A perimeter firewall does not inspect or protect traffic that stays inside the cluster."],[3,"Which statement correctly describes a difference between containers and virtual machines?",["Containers cannot be isolated from one another","Containers share the host operating system kernel","Containers each include a full guest operating system","Containers require a hypervisor for each instance"],1,"Containers are lightweight because they share the host kernel, which also means a kernel flaw can affect all of them. VMs each carry their own guest OS."],[3,"A data center wants a hypervisor that runs directly on the server hardware, without a host operating system, to maximize performance and reduce attack surface. Which type should it choose?",["Type 2 hypervisor","Type 1 hypervisor","Emulator running on a desktop OS","Container runtime"],1,"A Type 1 (bare-metal) hypervisor runs directly on hardware. A Type 2 runs on top of a host OS and is typical for desktops."],[3,"A company wants visibility into which SaaS applications employees use and wants to enforce data-protection policies between users and those cloud services. Which solution BEST fits?",["Hardware security module","Web application firewall","Cloud access security broker","Network intrusion detection system"],2,"A CASB sits between users and cloud services to discover shadow IT and enforce policy such as DLP and access control. A WAF protects a specific web application, not user-to-cloud usage."],[3,"Which characteristic defines a software-defined network?",["The control plane is separated from the data plane and managed by a central controller","All traffic must pass through a single physical firewall","It only works with wireless devices","Each switch independently makes routing decisions with no central logic"],0,"SDN decouples the decision-making control plane from the forwarding data plane, allowing centralized, programmable management."],[3,"A cloud-hosted application must remain available if an entire data center in a region fails. Which design BEST meets this goal?",["Deploy several instances in the same rack","Deploy instances across multiple availability zones behind a load balancer","Take weekly snapshots of the VM","Use larger instances in a single zone"],1,"Spreading across independent availability zones removes the single data center as a point of failure. Snapshots help recovery but do not give continuous availability."],[3,"A factory robot controller must respond to sensor input within a guaranteed, fixed time. Which type of system is designed for this requirement?",["Hypervisor-based virtual desktop","General-purpose desktop operating system","Real-time operating system","Network-attached storage appliance"],2,"An RTOS provides deterministic timing guarantees, which is critical in embedded and industrial control. General-purpose systems cannot guarantee response times."],[3,"An organization wants to protect programmable logic controllers in its plant from threats on the corporate network while still allowing necessary data exchange. Which design is BEST?",["Allow remote desktop from the internet to the PLCs","Give the PLCs public IP addresses","Place the operational technology network in a separate segment behind a firewall","Place the PLCs on the same VLAN as user workstations"],2,"Segmentation with strict firewall rules limits what can reach ICS devices. Exposing or mixing them with IT systems greatly increases risk."],[3,"Which TWO are security constraints commonly associated with IoT and embedded devices?",["Difficulty applying patches over a long device lifespan","Frequent vendor-driven automatic updates","Abundant memory for endpoint protection agents","Built-in support for enterprise single sign-on","Limited processing power for strong cryptography"],[0,4],"Small, low-cost devices often cannot run heavy encryption or agents, and they remain deployed for years without patches. The other options describe the opposite of typical devices."],[3,"A security architect compares centralized and decentralized management of security policy. What is a key advantage of a centralized model?",["Reduced need for documentation","Consistent policy enforcement and easier auditing","Faster local decisions without any coordination","Elimination of any single point of failure"],1,"Central management provides uniform policy and simpler oversight, though it introduces a single point of failure. That latter point is a strength of decentralized designs."],[3,"An operations team replaces cloud servers with freshly built images from a pipeline instead of patching running servers. What is this approach called?",["Snapshot rollback","Immutable infrastructure","Shadow IT","Sandboxing"],1,"With immutable infrastructure, systems are never modified after deployment. Changes are made by redeploying a new, known-good image, which reduces configuration drift."],[3,"A web tier is configured so that all nodes handle requests at the same time, and if one fails the others absorb its load. Which configuration is this?",["Active-passive","Warm site","Active-active","Cold standby"],2,"In active-active, all nodes serve traffic simultaneously. Active-passive keeps a standby that only takes over after a failure."],[3,"Virtual machines in the same data center subnet should not communicate unless explicitly allowed, to stop lateral movement after a breach. Which technique BEST accomplishes this?",["Network address translation","Microsegmentation","Increasing the subnet size","Port mirroring"],1,"Microsegmentation applies granular policies between workloads, even within the same network segment, to restrict east-west traffic."],[4,"A cloud console log shows an administrator account signing in from two countries within ten minutes. The administrator confirms they did not do either one. What should be done FIRST?",["Wait for more events to confirm","Delete the account's audit logs","Disable the account and revoke active sessions","Reset the password only after the next review"],2,"The pattern indicates compromised credentials, so the immediate step is containment by disabling the account and revoking sessions. Deleting logs would destroy evidence."],[4,"A network team wants to analyze which hosts communicate, how much, and over which ports, without capturing full packet contents. Which data source is BEST?",["NetFlow records","Endpoint antivirus logs","Full packet captures","DNS zone files"],0,"NetFlow summarizes conversation metadata efficiently. Full captures provide payloads and require much more storage."],[4,"A vulnerability scan fails to report a flaw that is actually present on a server. How is this result classified?",["True positive","False positive","True negative","False negative"],3,"A false negative means a real vulnerability was missed. A false positive would report a vulnerability that does not exist."],[4,"A company with many cloud accounts wants to continuously detect configuration drift, such as newly public storage, and compare settings to benchmarks. Which tool BEST fits?",["Network access control","Endpoint detection and response","Cloud security posture management","Data loss prevention on email"],2,"CSPM monitors cloud configurations against policies and benchmarks and flags misconfigurations. EDR focuses on endpoint behavior."],[4,"An organization needs to scan files already stored in a SaaS application for sensitive data, without sitting inline in user traffic. Which CASB deployment mode is MOST appropriate?",["Reverse proxy","API-based integration","Transparent bridge","Forward proxy"],1,"An API-based CASB connects out-of-band to the SaaS service and can inspect data at rest. Proxy modes work on traffic in transit."],[4,"A cloud virtual machine is suspected of being compromised. To preserve evidence for investigation, what is the BEST action before terminating the instance?",["Delete the instance and restore from backup immediately","Reboot the instance to clear malware","Run a disk cleanup utility","Take a snapshot of the disk and, if possible, capture memory"],3,"Snapshots and memory captures preserve evidence. Rebooting or deleting the instance destroys volatile data and forensic artifacts."],[4,"A team has contained and removed malware from several servers. According to the standard incident response lifecycle, what should happen NEXT?",["Preparation","Containment","Recovery","Detection"],2,"After eradication, systems are restored to normal operation during recovery. Lessons learned follows afterward."],[4,"What is the BEST approach for deploying a critical patch to production servers?",["Test it in a staging environment, then roll out in phases with a rollback plan","Wait one year to see if others report problems","Apply it only to the test servers","Deploy to all servers at once to finish quickly"],0,"Testing and phased deployment catches problems early while limiting impact. Delaying critical patches leaves the organization exposed."],[4,"Which action BEST hardens a newly built Linux virtual machine in the cloud?",["Keep the default administrator password until the first audit","Disable unused services and default accounts","Open every port in the security group","Enable all available network services for flexibility"],1,"Hardening removes unnecessary services and default accounts to reduce attack surface. The other options increase exposure."],[4,"Network engineers want to monitor and manage switches remotely with authentication and encryption of management traffic. Which protocol version should be used?",["SNMPv1","SNMPv3","Telnet","SNMPv2c"],1,"SNMPv3 adds authentication and encryption, whereas versions 1 and 2c send community strings in cleartext."],[4,"A SOC wants to correlate detections across endpoints, network, email and cloud workloads in one platform for faster investigation. Which technology is MOST suitable?",["Antivirus","Extended detection and response","Proxy server","Vulnerability scanner"],1,"XDR collects and correlates telemetry from several security layers. Antivirus is limited to endpoint file-based detection."],[4,"Which DNS-based email control lets a domain owner publish the mail servers authorized to send mail for the domain?",["DNSSEC","SPF","DKIM","MX record"],1,"SPF lists the authorized sending hosts. DKIM signs messages, and an MX record only indicates where inbound mail is delivered."],[4,"A firewall contains a broad rule allowing all outbound traffic above a rule that denies traffic to a known malicious IP, and the malicious traffic is still passing. What is the MOST likely cause?",["The firewall is stateless","The implicit deny rule is disabled","The rules are evaluated top-down and the allow rule matches first","The IP address is encrypted"],2,"Firewalls process rules in order and stop at the first match, so the specific deny should be placed before the broad allow."],[4,"Which authentication method is MOST resistant to phishing attacks?",["FIDO2 hardware security key","Email-based one-time link","SMS one-time code","Security questions"],0,"FIDO2 keys bind authentication to the legitimate site's origin, so a fake site cannot capture a usable credential. SMS codes can be intercepted or relayed."],[4,"When an employee leaves, the company wants their access to all connected applications to be removed automatically. Which practice supports this?",["Shared administrator credentials","Automated deprovisioning integrated with the identity system","Annual password resets","Manual email requests to each application owner"],1,"Automated deprovisioning removes access quickly and consistently. Manual processes tend to be delayed or missed."],[4,"A SOC analyst receives hundreds of low-severity alerts per day, causing real incidents to be overlooked. What is the BEST action?",["Tune detection rules and thresholds to reduce noise","Stop reviewing low-severity alerts permanently","Disable all alerts","Add more analysts without changing rules"],0,"Alert tuning improves signal quality while keeping coverage. Disabling alerts removes visibility entirely."],[4,"Which standardized pair is used to share cyber threat intelligence in a machine-readable format between organizations?",["SNMP and Syslog","SAML and OAuth","STIX and TAXII","TLS and IPSec"],2,"STIX defines the structure of threat intelligence data, and TAXII is the transport mechanism for exchanging it."],[4,"A company invites independent researchers to find and report vulnerabilities in its web applications in exchange for rewards. What is this program called?",["Red team assessment","Vulnerability scanning","Bug bounty","Tabletop exercise"],2,"A bug bounty program pays outside researchers for responsibly disclosed findings."],[4,"A development team wants to find insecure coding patterns by analyzing source code without executing the application. Which technique should be used?",["Fuzzing","Static application security testing","Penetration testing","Dynamic application security testing"],1,"SAST examines code at rest, while DAST tests the running application."],[4,"Which backup strategy BEST protects against ransomware that tries to encrypt or delete backups?",["Maintain immutable or offline copies of backups","Use only incremental backups","Back up to the same server","Store backups on a mapped network drive that is always writable"],0,"Immutable or offline copies cannot be altered by malware that compromises the production network. Always-writable drives are exposed to the same attack."],[4,"A company leaves a cloud provider and must ensure its data cannot be recovered from the provider's shared storage. Physical destruction of drives is not possible. Which method is BEST?",["Cryptographic erase by destroying the encryption keys","Deleting the files from the console","Formatting the virtual disk","Emptying the recycle bin"],0,"If data was encrypted, destroying all copies of the key renders it unreadable. Simple deletion leaves data recoverable."],[4,"Which control can prevent users from resolving domain names associated with known malware command-and-control servers?",["MAC filtering","Port security","DNS filtering","Disk encryption"],2,"DNS filtering blocks or sinkholes resolution of known malicious domains before a connection is made."],[4,"Which TWO log sources would be MOST useful for investigating a suspected compromised cloud account?",["Print server job logs","Conference-room booking logs","Cloud audit trail of API activity","Building HVAC controller logs","Identity provider sign-in logs"],[2,4],"API audit logs show what actions were performed, and sign-in logs show how and from where the account authenticated. The other sources are unrelated to account activity."],[4,"During an investigation, an analyst cannot correlate events from several servers because the timestamps differ by several minutes. What should be implemented?",["Additional firewalls","Log compression","Larger log storage","Time synchronization using NTP"],3,"Consistent time sources are essential to build accurate timelines. Storage and compression do not fix timestamp drift."],[4,"A security team gathers stakeholders to walk through a ransomware scenario around a table to test the plan without touching production systems. What is this exercise?",["Vulnerability assessment","Tabletop exercise","Penetration test","Full failover test"],1,"A tabletop is a discussion-based exercise used to test decisions and communications with no operational impact."],[5,"A single loss event is expected to cost $50,000 and is expected to occur once every five years. What is the annualized loss expectancy?",["$250,000","$5,000","$10,000","$50,000"],2,"ARO is 0.2 (1/5), so ALE = SLE x ARO = $50,000 x 0.2 = $10,000."],[5,"The cost of mitigating a low-impact risk is greater than its expected loss, and senior management formally signs off on leaving it as is. Which risk response is this?",["Acceptance","Avoidance","Transference","Mitigation"],0,"Knowingly tolerating the risk with documented approval is acceptance. No controls are added or contracts transferred."],[5,"A customer wants proof that a vendor's controls operated effectively over a six-month period. Which report is MOST appropriate?",["SOC 2 Type I","Vulnerability scan results","Vendor marketing brochure","SOC 2 Type II"],3,"A Type II report tests control operation over time, whereas Type I describes controls at one point in time only."],[5,"Before sharing detailed network diagrams with a prospective vendor, which document should an organization require?",["Service-level agreement","Statement of work","Memorandum of agreement","Non-disclosure agreement"],3,"An NDA legally protects confidential information during discussions. An SLA defines service performance and would come later."],[5,"Which activity BEST reduces risk before onboarding a new cloud service provider that will process regulated data?",["Selecting the cheapest provider","Relying solely on the provider's website","Performing vendor due diligence and security assessment","Signing the contract and assessing later"],2,"Due diligence evaluates the vendor's controls before data is shared. Assessing after signing leaves the organization exposed."],[5,"Within a data governance program, which role holds accountability for setting a dataset's sensitivity label and approving who may access it?",["Data custodian","System administrator","Data processor","Data owner"],3,"The data owner is accountable for classification and access decisions. The custodian carries out technical handling under the owner's direction."],[5,"The legal department notifies IT of pending litigation. What should happen to relevant data that would normally be deleted according to the retention schedule?",["It is anonymized immediately","It is preserved under a legal hold","It is deleted on schedule","It is moved to a public share"],1,"Legal hold suspends normal deletion so potentially relevant evidence is preserved."],[5,"Under the GDPR, a data controller must generally notify the supervisory authority of a personal data breach within how long of becoming aware of it?",["30 days","24 hours","7 days","72 hours"],3,"The GDPR sets a 72-hour deadline for notifying the authority where feasible and required."],[5,"Which of the following is a possible consequence of failing to comply with applicable regulations?",["Lower cyber insurance premiums","Reduced audit frequency","Fines and sanctions","Automatic certification renewal"],2,"Non-compliance can lead to fines, sanctions, loss of licenses and reputational damage. The other options would be benefits, not consequences."],[5,"A regulator wants independent assurance that a company's controls meet a required standard. Which type of audit provides this?",["Self-assessment","Internal audit","External audit","Peer code review"],2,"External auditors are independent of the organization and can provide credible attestation to third parties."],[5,"A system administrator is terminated for cause. What should HR and IT do FIRST?",["Wait until the exit interview ends next week","Ask the employee to delete their files","Disable the user's accounts and revoke access","Delete the user's mailbox"],2,"Immediate revocation protects against retaliation or data theft. Deleting data could destroy evidence."],[5,"A company wants to test its disaster recovery capability by restoring systems at the alternate site while production keeps running normally. Which test is this?",["Walk-through","Tabletop exercise","Full interruption test","Parallel processing test"],3,"In a parallel test, recovery systems are brought up and verified alongside production without any interruption of it."],[5,"Which metric describes the average time a system operates before it experiences a failure?",["MTBF","RTO","MTTR","RPO"],0,"Mean time between failures measures reliability. MTTR measures how long repair takes."],[5,"Which business continuity metric defines the maximum acceptable time a system can be down after a disruption?",["Recovery point objective","Mean time between failures","Annualized rate of occurrence","Recovery time objective"],3,"RTO is the target time for restoring service, while RPO measures acceptable data loss."],[5,"A security manager tracks the number of unpatched critical vulnerabilities each month as an early signal of rising risk. What is this measure called?",["Key risk indicator","Risk register","Service-level agreement","Recovery time objective"],0,"A KRI is a metric that signals changes in risk exposure before an incident occurs."],[5,"An organization has a policy requiring encryption of sensitive data. Which document would specify the exact steps administrators follow to enable it on a given system?",["Standard","Charter","Guideline","Procedure"],3,"Procedures give step-by-step instructions to carry out policy. Standards define mandatory specifications rather than the steps."],[5,"A retailer stores and processes payment card data. Which compliance framework applies specifically to it?",["HIPAA","SOX","PCI DSS","FERPA"],2,"PCI DSS governs organizations that handle cardholder data. HIPAA covers health information and SOX covers financial reporting."],[5,"Which TWO items are typical outputs of a business impact analysis?",["Identification of critical business functions","A penetration test report","Vulnerability scan results for all hosts","A list of firewall rule changes","Recovery time and recovery point targets"],[0,4],"A BIA identifies which functions are critical and sets recovery objectives for them. The other items belong to technical security testing and configuration activities."]],[[1,"In a Kerberos realm, which component authenticates a user at logon and issues the ticket-granting ticket (TGT)?",["Key distribution center","Registration authority","RADIUS accounting server","Policy enforcement point"],0,"The authentication service of the Kerberos key distribution center verifies the user and issues the TGT, which is later exchanged for service tickets."],[1,"An auditor reviews a log showing every command a network engineer ran on a core switch. Which AAA function produced this record?",["Authentication","Authorization","Accounting","Attestation"],2,"Accounting records what an authenticated user did and when. Authorization only decides what the user may do."],[1,"A vendor states its fingerprint reader has a CER of 1.5%, while a competing reader has a CER of 4%. What does this indicate?",["The first reader is more accurate because its false acceptance and false rejection rates are equal at a lower value","The first reader is less accurate because its error rate is lower","The first reader never rejects legitimate users","The first reader enrolls users faster"],0,"The crossover error rate is where FAR equals FRR, and a lower CER means a more accurate biometric system. It says nothing about enrollment speed."],[1,"Which TWO of the following are 'something you are' authentication factors?",["Fingerprint","Smart card","Retina scan","PIN","Hardware token"],[0,2],"Fingerprints and retina patterns are inherent biometric traits. The smart card and hardware token are 'something you have' and the PIN is 'something you know'."],[1,"A user authenticated at 9 a.m. The access system now re-evaluates device posture and location before allowing each sensitive request, instead of trusting the earlier logon. Which Zero Trust concept does this describe?",["Implicit trust","Separation of duties","Adaptive identity","Static allow listing"],2,"Adaptive identity evaluates context continuously and adjusts access decisions. Implicit trust is the opposite of what is described."],[1,"Two parties with no pre-shared secret need to agree on a symmetric session key over an untrusted network. Which technique is designed for this?",["AES-GCM","SHA-256","Diffie-Hellman key exchange","HMAC"],2,"Diffie-Hellman lets two parties derive a shared secret over an open channel. AES encrypts data and SHA-256 and HMAC provide hashing and integrity, not key agreement."],[1,"Which mechanism provides BOTH integrity and authenticity of a message by using a shared secret key?",["Plain SHA-256 hash","Base64 encoding","HMAC","Salted hash"],2,"An HMAC mixes a secret key into the hash, so only a holder of the key can produce a valid value. A plain hash can be recomputed by anyone."],[1,"In an accounts payable system, one employee can add new vendors while a different employee must approve payments to them. Which security principle does this apply?",["Least privilege","Separation of duties","Job rotation","Mandatory vacation"],1,"Splitting a sensitive process across two people so that no one person can complete it alone is separation of duties."],[1,"During change management, which activity identifies the systems, users and processes that a proposed firewall change could affect before the change is approved?",["Backout plan","Maintenance window","Impact analysis","Version control"],2,"Impact analysis assesses what a change will touch and the associated risk. A backout plan describes how to reverse the change."],[1,"Which PKI component verifies a requester's identity and forwards approved certificate requests to the certificate authority?",["Registration authority","Certificate revocation list","OCSP responder","Key escrow agent"],0,"The registration authority vets the requester on behalf of the CA. CRLs and OCSP responders deal with revocation status, not enrollment."],[1,"A legacy application cannot support multifactor authentication, so the security team limits access to it from a monitored jump host with strict source-address rules. Which control type does this represent?",["Directive","Deterrent","Corrective","Compensating"],3,"A compensating control substitutes for a requirement that cannot be met directly, here MFA."],[2,"An attacker holding a standard domain account requests service tickets for accounts that have service principal names and cracks the tickets offline to recover service account passwords. Which attack is this?",["Kerberoasting","Golden ticket","Pass-the-hash","LDAP injection"],0,"Kerberoasting abuses the fact that service tickets are encrypted with the service account's secret, allowing offline password cracking. A golden ticket instead forges TGTs."],[2,"Investigators find that an attacker forged Kerberos TGTs using the key of the krbtgt account, gaining long-term access as any domain user. Which attack is this?",["Kerberoasting","Golden ticket","Credential stuffing","Pharming"],1,"Forging TGTs with the krbtgt key is a golden ticket attack. Kerberoasting only recovers service account passwords."],[2,"Attackers sign in to a company's employee portal using username and password pairs leaked in a breach of an unrelated retail site. Which attack is this?",["Password spraying","Credential stuffing","Rainbow table attack","Dictionary attack"],1,"Credential stuffing replays known leaked credential pairs on other services, relying on password reuse. Spraying instead tries a few common passwords against many accounts."],[2,"Employees report repeated, unrequested push approval prompts late at night, and one user approved a prompt that let an attacker sign in. Which control BEST mitigates this attack?",["Longer prompt timeouts","Sending the approval code by SMS instead","Number matching on the push prompt","Increasing password complexity"],2,"Number matching forces the user to enter a value shown on the sign-in screen, so blind approval of a prompt no longer works. SMS codes are weaker, not stronger."],[2,"A SIEM alert shows a user signing in from Pune and, 15 minutes later, from a hosting provider in another country, with no VPN in use. Which is the MOST likely explanation?",["The user's account credentials or session token have been compromised","The user changed the laptop time zone","The password reached its scheduled expiration","The identity provider certificate expired"],0,"Impossible travel means two sign-ins that are too far apart to be made by one person in the elapsed time, which usually indicates stolen credentials or tokens."],[2,"Attackers use a reverse proxy that relays a victim's password and one-time code to the real site in real time. Which MFA method is MOST resistant to this attack?",["SMS one-time code","TOTP code from an authenticator app","FIDO2 security key","Push notification approval"],2,"FIDO2 credentials are bound to the legitimate site's origin, so a proxy domain cannot obtain a usable assertion. Typed or approved codes can be relayed."],[2,"An attacker persuades a mobile carrier to move a victim's phone number to a new SIM card and then receives the victim's login verification texts. Which MFA method is MOST directly weakened?",["FIDO2 hardware key","SMS-based one-time passcodes","Smart card with PIN","Authenticator app TOTP seeded on the device"],1,"SIM swapping gives the attacker control of the phone number, so SMS codes can be intercepted. The other methods do not depend on the phone number."],[2,"A standard user exploits a kernel flaw and obtains administrator rights on the same workstation. Which type of attack is this?",["Horizontal privilege escalation","Vertical privilege escalation","Lateral movement","Session replay"],1,"Gaining a higher privilege level than the account was assigned is vertical privilege escalation. Horizontal escalation reaches another account at the same level."],[2,"Three weeks after being terminated, a former employee's credentials were used to download customer files. Which weakness MOST likely allowed this?",["Missing TLS on the file server","Failure to deprovision the account","Use of a weak hashing algorithm","An unpatched web browser"],1,"Orphaned accounts that remain active after termination are a direct result of incomplete deprovisioning."],[2,"A vulnerability scan of newly installed network cameras shows administrator logins that still accept the vendor's factory password. Which action BEST remediates this finding?",["Enable SNMPv1 on the cameras","Move the cameras to a guest VLAN only","Disable logging on the cameras","Replace default credentials with unique, strong ones before deployment"],3,"Default credentials are publicly documented and must be changed. Segmentation alone leaves the weak login in place."],[2,"A caller claiming to be a traveling executive urgently asks the help desk to reset the executive's password and read out the new one. Which control BEST prevents this social engineering attempt?",["Verify identity through a pre-registered out-of-band method before any reset","Reset any account when the caller knows the employee ID","Shorten the lifetime of temporary passwords","Log the call without further verification"],0,"Positive identity verification through a separate trusted channel defeats pretexting. Employee IDs are easily obtained and logging alone does not prevent the reset."],[2,"A malicious web page causes a logged-in user's browser to silently submit a request that changes the user's email address on a banking site. Which attack is this, and what BEST prevents it?",["XSS, prevented by output encoding","CSRF, prevented by anti-forgery tokens","SQL injection, prevented by parameterized queries","Directory traversal, prevented by input canonicalization"],1,"Cross-site request forgery abuses the browser's existing authenticated session, and unpredictable per-request tokens block forged requests."],[2,"An attacker exploits a flaw in a widely used application for which the vendor has not yet released a patch. Which term describes this vulnerability?",["Legacy vulnerability","Misconfiguration","Zero-day","Known false positive"],2,"A zero-day is unknown to the vendor or unpatched at the time of exploitation, so no fix is available."],[2,"Logs show 400 failed logons against one administrator account from a single external IP address, followed by one successful logon from the same address. What does this MOST likely indicate?",["A successful brute-force attack on the account","A DNS poisoning attempt","A legitimate password expiry event","A misconfigured NTP server"],0,"Many failures against one account followed by a success from the same source is the signature of a successful brute-force attack."],[2,"Visitors at an airport connect to a Wi-Fi network named like the airport's official network, but their credentials are later used by an attacker. The attacker's access point broadcast the same SSID with a stronger signal. Which attack is this?",["Bluesnarfing","Evil twin","Deauthentication flood","War driving"],1,"An evil twin is a rogue access point that impersonates a legitimate SSID to capture traffic and credentials."],[2,"An EDR alert shows PowerShell executing an encoded payload entirely in memory, with no new executable written to disk. Which type of malware activity is this?",["Ransomware","Logic bomb","Fileless malware","Boot sector virus"],2,"Fileless malware runs from memory using legitimate tools such as PowerShell, which evades signature-based file scanning."],[2,"A kiosk should run only the vendor-approved application and nothing else. Which mitigation BEST enforces this?",["Full-disk encryption","Application allow list","Host-based firewall logging","Screen lock timeout"],1,"An application allow list only permits approved programs to run, blocking unknown or malicious binaries. Encryption protects data at rest, not execution."],[2,"After a user logs in, an attacker copies the user's session cookie from an unsecured network and replays it to access the application without knowing any credentials. Which attack is this?",["Session hijacking","Credential stuffing","Brute force","Phishing"],0,"Replaying a valid session identifier takes over an authenticated session; short session lifetimes, Secure and HttpOnly cookies and TLS reduce the risk."],[2,"Which TWO controls BEST reduce the risk of password spraying against an organization's cloud accounts?",["Require MFA for all sign-ins","Force password changes every 30 days","Block passwords that appear on common-password lists","Display password hints on the login page","Remove the account lockout policy"],[0,2],"MFA stops a correct guess from granting access, and banning common passwords removes the targets spraying relies on. Frequent rotation does not stop guessing of common values."],[2,"Which TWO social-engineering techniques are carried out through text messages and telephone calls, respectively?",["Smishing","Whaling","Vishing","Typosquatting","Watering hole"],[0,2],"Smishing uses SMS and vishing uses voice calls. Whaling targets executives, typosquatting uses lookalike domains, and a watering hole compromises a site visited by the target."],[3,"A network team wants to authorize individual commands that administrators may run on routers and to encrypt the whole authentication payload. Which AAA protocol BEST fits?",["RADIUS","TACACS+","LDAP","SNMPv2"],1,"TACACS+ separates authentication, authorization and accounting, supports per-command authorization and encrypts the entire payload. RADIUS encrypts only the password."],[3,"In an 802.1X deployment, a laptop connects to a switch port and the switch forward
