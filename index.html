P spoofing (attacker sends fake DHCP offers → redirect traffic to attacker).<\/li>\n<\/ul>\n<h3>Q10: Explain DNS resolution; how does attacker spoof DNS?<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Resolution<\/strong>: Client → Resolver → Root → TLD → Authoritative server → IP returned.<\/li>\n<li><strong>Spoofing<\/strong>: Attacker sends fake DNS response (forged source IP) before legitimate response arrives.<\/li>\n<li><strong>Cache Poisoning<\/strong>: Fake response cached → all future queries return attacker&#39;s IP.<\/li>\n<li><strong>Example<\/strong>: User queries for bank.com; attacker intercepts, returns 10.10.10.10 (phishing server); user lands on fake banking site.<\/li>\n<li><strong>Defense<\/strong>: DNSSEC (signs DNS responses), source port randomization.<\/li>\n<\/ul>\n<hr>\n<h2>DNS &amp; Email Security Q&amp;A<\/h2>\n<h3>Q11: What does SPF record do? Limitations?<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Purpose<\/strong>: Publish list of IPs authorized to send mail for your domain.<\/li>\n<li><strong>Example<\/strong>: acme.com SPF = &quot;ip4:192.0.2.0 include:_spf.google.com ~all&quot;<\/li>\n<li><strong>Check<\/strong>: Receiver sees email from acme.com; checks SPF; if source IP in list → SPF pass.<\/li>\n<li><strong>Limitations<\/strong>:<ul>\n<li>Only checks envelope-from (5321.From), not display From (5322.From) → spoofing still possible.<\/li>\n<li>Broken by mail forwarding (forwarder&#39;s IP not in original sender&#39;s SPF).<\/li>\n<li>No integrity check (doesn&#39;t prevent tampering).<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC<\/strong>: If attacker&#39;s IP not in SPF record → email should fail SPF; receiving server has choice to accept anyway (depending on policy).<\/li>\n<\/ul>\n<h3>Q12: DKIM vs SPF—which is better?<\/h3>\n<p><strong>Answer<\/strong>: Both complement each other; neither complete alone.<\/p>\n<ul>\n<li><strong>SPF<\/strong>: Checks if sending IP authorized; broken by forwarding.<\/li>\n<li><strong>DKIM<\/strong>: Digitally signs email; survives forwarding; protects integrity.<\/li>\n<li><strong>Together<\/strong>: SPF (checks sender IP) + DKIM (checks signature) → strong phishing defense.<\/li>\n<li><strong>SOC<\/strong>: Check both in headers; if both fail + domain is known → phishing likely.<\/li>\n<\/ul>\n<h3>Q13: What does DMARC policy do?<\/h3>\n<p><strong>Answer<\/strong>: Defines what receiver should do if SPF/DKIM fails.<\/p>\n<ul>\n<li><strong>Policies<\/strong>:<ul>\n<li><code>p=none<\/code>: Accept anyway; just report failures (monitoring).<\/li>\n<li><code>p=quarantine<\/code>: Move to spam if fail.<\/li>\n<li><code>p=reject<\/code>: Reject entirely if fail.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Example<\/strong>: dmarc.acme.com = &quot;p=reject&quot; means &quot;if SPF/DKIM fail, reject email&quot; → strong phishing prevention.<\/li>\n<li><strong>SOC<\/strong>: Aggregate reports (daily summaries) help identify spoofing/phishing attempts.<\/li>\n<\/ul>\n<h3>Q14: You receive email with red flags. Walk me through the header check.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<pre><code>Email: &quot;Password Reset from support@acme.com&quot;\n\nStep 1: Check From header\n  From: support@acme.com\n  \nStep 2: Check authentication results\n  Authentication-Results: acme.com\n    spf=FAIL (email source IP not in acme.com SPF)\n    dkim=FAIL (signature domain is attacker.com, not acme.com)\n    dmarc=FAIL (spf/dkim not aligned to acme.com)\n\nStep 3: Check Return-Path / Sender\n  Return-Path: bounce@attacker.com ← MISMATCH!\n  \nStep 4: Check link destination\n  &lt;a href=&quot;https://acme-reset.xyz/password-reset&quot;&gt;\n  ← Domain is acme-reset.xyz, not acme.com → PHISHING\n\nAction: Block sender; quarantine email; alert user.\n<\/code><\/pre>\n<hr>\n<h2>Cryptography &amp; PKI Q&amp;A<\/h2>\n<h3>Q15: Hash vs encryption—explain with examples.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Hash<\/strong>: One-way function. Input → Output (hash). Can&#39;t reverse.<ul>\n<li>Example: password123 → (SHA256) → ef92b778...<\/li>\n<li>Use: Password storage, file integrity, fingerprinting.<\/li>\n<li>Can&#39;t decrypt: Even admin can&#39;t recover original password; users must reset if forgotten.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Encryption<\/strong>: Two-way function. Input + Key → Output (cipher). Reverse with key.<ul>\n<li>Example: password123 + key(AES) → ciphertext. Decrypt with key → password123 (recoverable).<\/li>\n<li>Use: Protecting data in transit (TLS), at rest (disk encryption).<\/li>\n<li>Risky for passwords: If encryption key leaked, passwords leaked.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Interview Twist<\/strong>: &quot;Your company accidentally stores passwords encrypted instead of hashed. Why is this bad?&quot; → If encryption key compromised, all passwords stolen instantly.<\/p>\n<h3>Q16: What is PKI? Components?<\/h3>\n<p><strong>Answer<\/strong>: Public Key Infrastructure = system for managing public keys, certificates, trust.<\/p>\n<ul>\n<li><strong>Components<\/strong>:<ul>\n<li><strong>CA (Certificate Authority)<\/strong>: Trusted entity signing certificates.<\/li>\n<li><strong>Certificate<\/strong>: Binding public key to identity (CN=example.com).<\/li>\n<li><strong>Public Key<\/strong>: Encrypt data; available to all.<\/li>\n<li><strong>Private Key<\/strong>: Decrypt data; kept secret.<\/li>\n<li><strong>Key Pair<\/strong>: Public + Private (asymmetric).<\/li>\n<li><strong>Trust Store<\/strong>: Browser/OS holding trusted root CAs.<\/li>\n<li><strong>CRL/OCSP<\/strong>: Revocation mechanisms (certificate no longer valid).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Q17: How does TLS handshake work (simplified)?<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<pre><code>Client → Server: &quot;I want secure connection&quot;\nServer → Client: &quot;Here&#39;s my certificate&quot; (public key inside)\nClient: &quot;Verify certificate with CA public key&quot; (in my trust store)\nClient → Server: &quot;Let&#39;s use AES key 0x123456&quot; (encrypted with server&#39;s public key)\nServer: &quot;Decrypt with my private key&quot; (gets AES key)\nBoth: Now communicate with AES (encrypted, fast)\n<\/code><\/pre>\n<hr>\n<h2>Web Application Security Q&amp;A<\/h2>\n<h3>Q18: Explain SQL injection; how to prevent.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Vulnerability<\/strong>: App builds SQL query by concatenating user input.<ul>\n<li>Vulnerable: <code>query = &quot;SELECT * FROM users WHERE username=&#39;&quot; + username + &quot;&#39;&quot;<\/code><\/li>\n<li>Input: <code>username = admin&#39; --<\/code><\/li>\n<li>Result: <code>SELECT * FROM users WHERE username=&#39;admin&#39; --&#39;<\/code> (comment removes password check)<\/li>\n<li>Impact: Bypass authentication, dump database, delete data, RCE.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Prevention<\/strong>:<\/li>\n<\/ul>\n<ol>\n<li><strong>Parameterized Queries<\/strong>: <code>query(&quot;SELECT * FROM users WHERE username=?&quot;, [username])<\/code>\n - Database treats ? as placeholder; user input never interpreted as SQL.<\/li>\n<li><strong>Input Validation<\/strong>: Whitelist allowed characters; reject special chars.<\/li>\n<li><strong>ORMs<\/strong>: Django ORM, SQLAlchemy handle queries safely.<\/li>\n<li><strong>WAF<\/strong>: Web Application Firewall detects SQL injection patterns.<\/li>\n<\/ol>\n<h3>Q19: What is XSS? Types and examples.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Definition<\/strong>: Attacker injects script into web app; runs in user&#39;s browser.<\/li>\n<li><strong>Stored XSS<\/strong>: Script saved in database; affects many users.<ul>\n<li>Example: Comment <code>&lt;script&gt;alert(&#39;XSS&#39;)&lt;/script&gt;<\/code> saved; all users see alert.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Reflected XSS<\/strong>: Script in URL; affects user who clicks link.<ul>\n<li>Example: <code>google.com/search?q=&lt;script&gt;alert(&#39;XSS&#39;)&lt;/script&gt;<\/code> → script in response.<\/li>\n<\/ul>\n<\/li>\n<li><strong>DOM-based XSS<\/strong>: Client-side JavaScript processes untrusted input unsafely.<ul>\n<li>Example: <code>document.getElementById(&#39;result&#39;).innerHTML = location.hash<\/code> → attacker controls HTML.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Prevention<\/strong>:<\/li>\n<\/ul>\n<ol>\n<li>Output encoding: <code>&lt;<\/code> → <code>&amp;lt;<\/code>, <code>&gt;<\/code> → <code>&amp;gt;<\/code>.<\/li>\n<li>Input validation: Whitelist characters.<\/li>\n<li>CSP header: <code>Content-Security-Policy: default-src &#39;self&#39;<\/code>.<\/li>\n<li>Frameworks: React, Vue auto-encode by default.<\/li>\n<\/ol>\n<h3>Q20: Explain CSRF; how to prevent.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Attack<\/strong>: Attacker&#39;s website makes request to victim&#39;s authenticated site without victim realizing.<ul>\n<li>Victim logged into bank.com (session cookie valid).<\/li>\n<li>Victim visits attacker.com (while logged into bank).<\/li>\n<li>attacker.com contains: <code>&lt;form action=&quot;bank.com/transfer&quot; method=&quot;POST&quot;&gt;<\/code> (auto-submit).<\/li>\n<li>Browser sends bank.com request WITH session cookie.<\/li>\n<li>Bank processes transfer (thinks request is from victim).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Prevention<\/strong>:<\/li>\n<\/ul>\n<ol>\n<li><strong>CSRF Token<\/strong>: Form includes unique token; attacker can&#39;t predict.<\/li>\n<li><strong>SameSite Cookie<\/strong>: Browser doesn&#39;t send cookie for cross-site requests.<\/li>\n<li><strong>Referer Check<\/strong>: Verify request came from your domain.<\/li>\n<\/ol>\n<hr>\n<h2>Malware &amp; Threat Analysis Q&amp;A<\/h2>\n<h3>Q21: What are IOCs? Give examples; explain their role in SOC.<\/h3>\n<p><strong>Answer<\/strong>: Indicators of Compromise = artifacts suggesting malware infection.<\/p>\n<ul>\n<li><strong>Types<\/strong>:<ul>\n<li>File hashes: Malware binary signature.<\/li>\n<li>IP addresses: C2 server.<\/li>\n<li>Domains: Attacker&#39;s domain.<\/li>\n<li>File paths: Where malware dropped (C:\\Temp\\malware.exe).<\/li>\n<li>Registry keys: Persistence mechanisms.<\/li>\n<li>Mutexes: Unique malware ID preventing reinfection.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Role<\/strong>:<\/li>\n<\/ul>\n<ol>\n<li>Receive IOCs from threat intel (VirusTotal, OSINT, incident response).<\/li>\n<li>Search SIEM for matches (hunt for malware).<\/li>\n<li>Block IOCs (firewall rules, DNS filtering).<\/li>\n<li>Escalate findings (send to incident response).<\/li>\n<\/ol>\n<ul>\n<li><strong>Example<\/strong>: Found malware.exe (MD5: abc123).<ul>\n<li>Step 1: Extract IOCs: MD5, strings (C2: attacker.com:4444).<\/li>\n<li>Step 2: Search SIEM for other files with same hash.<\/li>\n<li>Step 3: Search for connections to attacker.com:4444.<\/li>\n<li>Step 4: Notify affected systems for remediation.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Q22: What is living-off-the-land (LoTL)? Give examples; detect?<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Definition<\/strong>: Attacker uses legitimate OS tools (PowerShell, cmd, WMI) instead of malware.<\/li>\n<li><strong>Why<\/strong>: Bypasses signature-based detection (tools are trusted).<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>PowerShell IEX to download payload.<\/li>\n<li>certutil.exe to decode/encode files.<\/li>\n<li>psexec for lateral movement.<\/li>\n<li>Cron jobs for Linux persistence.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Detection<\/strong>:<\/li>\n<\/ul>\n<ol>\n<li>Monitor PowerShell command line (Event ID 4688).<\/li>\n<li>Look for suspicious patterns: IEX, DownloadString, base64.<\/li>\n<li>Whitelist known good scripts.<\/li>\n<li>Behavioral analysis: PowerShell rarely needs network access.<\/li>\n<li>Correlate: PowerShell + network connection + new file → suspicious.<\/li>\n<\/ol>\n<h3>Q23: What&#39;s in a malware report? Walk me through analysis.<\/h3>\n<p><strong>Answer<\/strong>: Reports from VirusTotal, Hybrid Analysis, ANY.RUN, etc.<\/p>\n<p><strong>Report Contents<\/strong>:<\/p>\n<ul>\n<li><strong>File Info<\/strong>: Hash (MD5, SHA256), size, type, creation date.<\/li>\n<li><strong>Detection<\/strong>: How many antivirus engines flag it? Verdict?<\/li>\n<li><strong>Strings<\/strong>: Readable text (C2 domain, file paths, error messages).<\/li>\n<li><strong>Behavior<\/strong>: What does it do? (Network connections, file ops, process creation).<\/li>\n<li><strong>Network<\/strong>: Domains/IPs it contacts; ports.<\/li>\n<li><strong>Static Analysis<\/strong>: Imports (what APIs it calls).<\/li>\n<li><strong>Dynamic Analysis<\/strong>: Sandbox execution log.<\/li>\n<\/ul>\n<p><strong>SOC Workflow<\/strong>:<\/p>\n<pre><code>1. File hash found in alert.\n2. Look up hash in VirusTotal.\n3. If 45+ engines flag as Trojan → confirmed malicious.\n4. Extract IOCs: domains, IPs, file paths, mutexes.\n5. Search SIEM for those IOCs.\n6. Escalate confirmed findings.\n<\/code><\/pre>\n<hr>\n<h2>Attack Frameworks Q&amp;A<\/h2>\n<h3>Q24: Map a phishing attack to Cyber Kill Chain.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<pre><code>1. Reconnaissance: Attacker researches company; finds CEO name on LinkedIn; finds employee emails on website.\n\n2. Weaponization: Attacker creates malicious Excel file with macro payload.\n\n3. Delivery: Attacker crafts email spoofing CEO; attaches &quot;Budget_2024.xlsx&quot;; sends to finance team.\n\n4. Exploitation: Finance employee opens Excel; macro prompts to &quot;Enable Macros&quot;; macro runs PowerShell.\n\n5. Installation: PowerShell downloads malware; installs as scheduled task for persistence.\n\n6. Command &amp; Control: Malware beacons to attacker.com:4444 every 60 seconds.\n\n7. Actions on Objectives: Attacker issues commands: steal credentials (Mimikatz), access files, move laterally.\n<\/code><\/pre>\n<h3>Q25: Map the same phishing attack to MITRE ATT&amp;CK.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<pre><code>Tactic: Reconnaissance\n  Technique: Search Open Websites/Domains (LinkedIn, company website)\n\nTactic: Resource Development\n  Technique: Develop Capabilities (create macro payload)\n  Technique: Acquire Infrastructure (attacker.com C2)\n\nTactic: Initial Access\n  Technique: Phishing (spear-phishing email with attachment)\n\nTactic: Execution\n  Technique: User Execution (user opens Excel, enables macros)\n  Technique: Command and Scripting Interpreter (PowerShell macro)\n\nTactic: Persistence\n  Technique: Scheduled Task/Job (malware creates scheduled task)\n\nTactic: Defense Evasion\n  Technique: Obfuscated Files or Information (base64 PowerShell)\n  Technique: Disable or Modify Tools (disable AV/logging)\n\nTactic: Credential Access\n  Technique: OS Credential Dumping (Mimikatz extract credentials)\n\nTactic: Lateral Movement\n  Technique: Use Alternate Authentication Material (pass-the-hash with stolen credentials)\n\nTactic: Command &amp; Control\n  Technique: Application Layer Protocol (HTTP POST beacons)\n\nTactic: Exfiltration\n  Technique: Exfiltration Over C2 Channel (send files to attacker)\n\nTactic: Impact\n  Technique: Data Encrypted for Impact (ransomware encryption)\n<\/code><\/pre>\n<h3>Q26: Pyramid of Pain—explain with example.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Level 1 (Hash)<\/strong>: Attacker recompiles code → new hash. Effort to change: trivial.<\/li>\n<li><strong>Level 2 (IP)<\/strong>: Attacker rents new VPS. Effort: easy.<\/li>\n<li><strong>Level 3 (Domain)<\/strong>: Attacker registers new domain. Effort: medium (days).<\/li>\n<li><strong>Level 4 (Attack Pattern)<\/strong>: Attacker learns new exploitation technique. Effort: weeks/months.<\/li>\n<li><strong>Level 5 (Tools)<\/strong>: Attacker develops new malware. Effort: months/years.<\/li>\n<li><strong>Level 6 (TTP)<\/strong>: Attacker changes fundamental approach. Effort: very hard (years).<\/li>\n<\/ul>\n<p><strong>Example<\/strong>:<\/p>\n<ul>\n<li>Attacker A uses Emotet malware; C2 domains: emotet1.com, emotet2.com; IPs: 10.0.0.1, 10.0.0.2.<\/li>\n<li>You block emotet1.com (Level 3) → attacker switches to emotet3.com (easy).<\/li>\n<li>You detect PowerShell + base64 + IEX pattern (Level 4) → attacker harder-pressed (learns different technique).<\/li>\n<li>You identify &quot;spear-phishing + Emotet + lateral movement via Pass-the-Hash&quot; TTP (Level 6) → attacker would need to fundamentally change operations (very hard).<\/li>\n<\/ul>\n<p><strong>SOC Lesson<\/strong>: Invest in TTP detection; more sustainable than blocking hashes/IPs.<\/p>\n<hr>\n<h2>Incident Response Q&amp;A<\/h2>\n<h3>Q27: Walk through incident response steps for &quot;Malware Detected on Workstation.&quot;<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<pre><code>PHASE 1: DETECTION &amp; ANALYSIS\n  1. Alert: &quot;Malware.exe (SHA256: abc123) detected on 192.168.1.100.&quot;\n  2. Triage: Is this real? Check multiple sources (AV, SIEM, endpoint EDR).\n  3. Owner: Who works on 192.168.1.100? Check inventory.\n  4. Timeline: When first detected? Any related alerts before this?\n  5. Context: Check SIEM for:\n     - Network connections from 192.168.1.100 (C2 IP/domain?).\n     - Process creation (parent of malware process?).\n     - File creation (where did it come from?).\n  6. Severity: Is malware known (VirusTotal lookup)? Does it exfiltrate data? → Severity HIGH.\n\nPHASE 2: CONTAINMENT\n  Short-term:\n    - Isolate 192.168.1.100 from network (unplug network cable or firewall rule).\n    - Notify user (avoid panic; explain for security).\n  \n  Investigation (don&#39;t shut down yet; preserve evidence):\n    - Collect memory dump (RAM contains running malware).\n    - Collect disk artifacts.\n    - Screenshot current state.\n    - Document timeline.\n\nPHASE 3: ERADICATION\n  - Quarantine malware.exe.\n  - Kill malware processes.\n  - Scan entire disk with multiple antivirus engines.\n  - Check for persistence (Registry Run keys, scheduled tasks, startup folders).\n  - Remove persistence mechanisms.\n  - Reset user password (attacker may have stolen credentials).\n\nPHASE 4: RECOVERY\n  - Reboot workstation (clean boot).\n  - Verify malware gone (AV scan, behavioral monitoring).\n  - Restore any deleted/corrupted files from backup.\n  - Restore network connectivity.\n\nPHASE 5: POST-INCIDENT\n  - Analyze: How did malware get there? (Phishing? Drive-by download?)\n  - Lessons learned: Update email filter? Disable macros? Deploy EDR?\n  - Share IOCs: Add malware hash + C2 domain to blocklist.\n  - Document case: Timeline, actions, resolution.\n<\/code><\/pre>\n<h3>Q28: User reports: &quot;I accidentally clicked a link in an email; browser warned about phishing.&quot;<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<pre><code>Step 1: Stay calm; thank user for reporting.\n\nStep 2: Immediate actions:\n  - Isolate user&#39;s workstation (disconnect from network).\n  - Don&#39;t shut down (preserve evidence).\n  - Ask user:\n    * Did you enter any credentials? Password? 2FA code?\n    * Did page load? What did you see?\n    * Timestamp? Any downloads?\n\nStep 3: Analysis:\n  - Check browser history (EDR, proxy logs) → confirm URL.\n  - Check for file downloads (malware?).\n  - Search SIEM for network connections from workstation.\n  - Check DNS queries (did browser try to resolve phishing domain?).\n  - Query firewall (was phishing site blocked at network level?).\n\nStep 4: Assess damage:\n  - If user entered password: Force password reset; monitor login attempts.\n  - If user entered 2FA code: Alert security team; watch for account compromise.\n  - If download occurred: Scan file with AV; run in sandbox.\n  - If no credential entry + no download: Likely no impact; monitor.\n\nStep 5: Actions:\n  - Block phishing domain at DNS/firewall.\n  - Report URL to phishing takedown services.\n  - Add to email filter blocklist.\n  - Educate user (don&#39;t click unknown links).\n  - Monitor user account for 24-48 hours.\n\nStep 6: Reconnect workstation:\n  - Scan for malware.\n  - Verify clean boot.\n  - Restore network access.\n  - Monitor for indicators of compromise (unusual logins, file access, network activity).\n<\/code><\/pre>\n<hr>\n<h2>Active Directory Q&amp;A<\/h2>\n<h3>Q29: Explain AD objects; how they&#39;re used for access control.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>User Objects<\/strong>: Represent people; contain credentials (password hash), attributes (email, department, manager).<\/li>\n<li><strong>Group Objects<\/strong>: Contain user members; used for assigning permissions.<\/li>\n<li><strong>Computer Objects<\/strong>: Represent devices; join domain; receive Group Policy.<\/li>\n<li><strong>OU (Organizational Unit)<\/strong>: Hierarchical container for organizing objects; GPOs apply to OUs.<\/li>\n<\/ul>\n<p><strong>Access Control Example<\/strong>:<\/p>\n<pre><code>1. Create group: &quot;Finance_Read_Access&quot;\n2. Add Finance team users to group.\n3. Share file/folder on server: &quot;\\\\server\\Finance_Shared&quot;\n4. Set NTFS permissions: &quot;Finance_Read_Access&quot; → Read-only.\n5. Result: All users in group automatically have read access; no per-user permissions needed.\n6. Benefit: Add/remove user from group → access granted/revoked.\n<\/code><\/pre>\n<h3>Q30: What is Kerberos? How does it prevent pass-the-hash?<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Kerberos<\/strong>: Network authentication protocol; uses tickets instead of passwords over network.<\/li>\n<li><strong>Flow<\/strong>:<\/li>\n<\/ul>\n<ol>\n<li>User enters password once at login.<\/li>\n<li>KDC validates password hash; issues TGT (proof of authentication).<\/li>\n<li>User caches TGT locally.<\/li>\n<li>When accessing resource, user presents TGT to get service ticket.<\/li>\n<li>Service ticket sent to resource; resource decrypts with its key; grants access.<\/li>\n<\/ol>\n<ul>\n<li><strong>Pass-the-Hash Prevention<\/strong>:<ul>\n<li>NTLM: Sends password hash over network; attacker intercepts and reuses hash.<\/li>\n<li>Kerberos: Password never sent over network (only hash at login); tickets used instead.<\/li>\n<li>Tickets are time-limited; encrypted with resource-specific key; harder to abuse.<\/li>\n<li>If attacker steals TGT, still bound to original user&#39;s ticket request.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Note<\/strong>: Kerberos still vulnerable to Pass-the-Ticket (TGT theft); better than NTLM, not perfect.<\/p>\n<h3>Q31: Explain AD privilege escalation; detection.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Vertical Escalation<\/strong>: User → Local Admin → Domain Admin.<\/li>\n<li><strong>Horizontal Escalation<\/strong>: User A → User B (same privilege level; more data access).<\/li>\n<\/ul>\n<p><strong>Common Techniques<\/strong>:<\/p>\n<ol>\n<li><strong>UAC Bypass<\/strong> (Windows): Attacker exploits UAC prompt bypass → elevate without admin password.<\/li>\n<li><strong>Unquoted Service Path<\/strong>: Service path not quoted; Windows executes first portion as program.<ul>\n<li>Example: <code>C:\\Program Files\\Vulnerable Service\\service.exe<\/code><\/li>\n<li>If executable without full path, attacker creates <code>C:\\Program Files\\Vulnerable.exe<\/code> → runs with service privilege.<\/li>\n<\/ul>\n<\/li>\n<li><strong>AD Delegation<\/strong>: Account A has &quot;delegate to&quot; service B. Attacker impersonates other users via delegation.<\/li>\n<li><strong>Group Membership Change<\/strong>: Attacker adds self to high-privilege group (requires admin first, but escalation).<\/li>\n<\/ol>\n<p><strong>Detection<\/strong>:<\/p>\n<ul>\n<li>Monitor for UAC bypass attempts (Event 4688 with specific keywords).<\/li>\n<li>Monitor service creation/modification.<\/li>\n<li>Monitor group membership changes (Event 4728 → member added to Domain Admins).<\/li>\n<li>Monitor logon type changes (normal logon vs service logon).<\/li>\n<li>Monitor for Kerberos delegation abuse (request for TGT for sensitive service).<\/li>\n<\/ul>\n<hr>\n<h2>Phishing &amp; Social Engineering Q&amp;A<\/h2>\n<h3>Q32: Analyze a phishing email; decide whether to escalate.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<pre><code>Email Received:\n  From: updates@microsoft.com\n  Subject: &quot;Urgent: Windows 10 Security Update&quot;\n  Body: &quot;Click here to install critical security patch.&quot;\n  Link: &quot;https://microsoft-updates.info/patch&quot;\n\nANALYSIS:\n\nStep 1: Sender Authentication\n  - Domain: microsoft.com? Check.\n  - Sub-check: updates@microsoft.com (mailbox, not subdomain).\n  - Reverse: Look up microsoft.com WHOIS → legitimate?\n  - SPF/DKIM/DMARC check:\n    spf=PASS (email from legitimate Microsoft IP)\n    dkim=PASS (signature valid)\n    dmarc=PASS (aligned)\n  - Wait, all pass? Suspicious (attacker spoofed domain or compromised account).\n\nStep 2: Link Analysis\n  - Display text: &quot;Click here&quot;\n  - Actual URL: https://microsoft-updates.info/patch\n  - Domain: microsoft-updates.info (NOT microsoft.com) ← RED FLAG!\n  - Typo attack: users might not notice &quot;updates.info&quot; vs &quot;microsoft.com&quot;\n  - URL reputation check: malicious.com? Phishing kit detected? → YES\n\nStep 3: Content Analysis\n  - Generic greeting (&quot;No recipient name mentioned&quot;) → likely mass phishing.\n  - Urgency (&quot;Critical update&quot;) → pressure tactic.\n  - Action button → trick to click link.\n\nStep 4: Timeline Context\n  - Is Windows 10 security update due? (Check Microsoft calendar)\n  - Do Microsoft update emails normally come from this address? (Check past emails)\n\nVERDICT: HIGH-CONFIDENCE PHISHING\n  - Spoofed Microsoft domain\n  - Attacker domain (microsoft-updates.info)\n  - Pressure tactic\n  - Generic content\n\nACTION:\n  - Block sender&#39;s domain (microsoft-updates.info)\n  - Add to email filter blocklist\n  - Notify users (don&#39;t click)\n  - Check if anyone clicked; if so, scan their device\n<\/code><\/pre>\n<h3>Q33: A user reports: &quot;I think I got phished. What do I do?&quot;<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<pre><code>Step 1: Reassure\n  - &quot;Thank you for reporting; you did the right thing.&quot;\n  - &quot;Don&#39;t panic; we&#39;ll investigate.&quot;\n\nStep 2: Immediate Actions\n  - &quot;Stop using that device until we check it.&quot;\n  - &quot;Don&#39;t click any more links from that email.&quot;\n  - &quot;We&#39;ll need your password reset soon.&quot;\n\nStep 3: Investigation (SOC)\n  - Get email details: Sender, timestamp, subject, link.\n  - Check email headers (SPF/DKIM/DMARC).\n  - Look up link in VirusTotal/URLhaus.\n  - Check user&#39;s mail logs (any logins from unusual location?).\n  - Check user&#39;s workstation (malware scan, file integrity).\n  - Check if email bounced (valid recipient?) or if user was targeted specifically.\n\nStep 4: Damage Assessment\n  - Did user click link? If yes:\n    * What happened? Did page load? Did user enter credentials?\n    * Is browser showing malware warning?\n    * Did any file download?\n  - Did user enter credentials? If yes:\n    * On attacker&#39;s site or legitimate site?\n    * If attacker&#39;s site → credentials compromised.\n    * If legitimate site (MITM attack) → monitor for unauthorized access.\n\nStep 5: Response\n  - If credentials entered on attacker site:\n    * Force immediate password reset.\n    * Enable MFA if not already.\n    * Monitor account for 48 hours (logins, access patterns).\n    * If admin account → full investigation.\n  - If malware detected:\n    * Isolate workstation; run full antivirus scan.\n    * Check for C2 connections.\n  - If no damage:\n    * Monitor anyway; educate user.\n\nStep 6: Post-Incident\n  - Block phishing domain/sender at firewall + email gateway.\n  - Send org-wide alert (low-key; don&#39;t blame user).\n  - Update security awareness training.\n  - Document case for future reference.\n<\/code><\/pre>\n<hr>\n<h2>Scenario: Real-World Incident<\/h2>\n<h3>Q34: Incident Scenario—&quot;Ransomware Detected on File Server&quot;<\/h3>\n<p><strong>Alert<\/strong>: &quot;Suspicious encryption activity detected on file server \\fs-main.&quot;<\/p>\n<pre><code>TIMELINE &amp; INVESTIGATION:\n\nT+0 (Alert Received):\n  - EDR alert: ransomware.exe detected on file server.\n  - Alert severity: CRITICAL.\n  - Immediate action: Isolate server (disconnect from network).\n\nT+5 min:\n  - Check SIEM for related alerts preceding ransomware:\n    * 10:15 AM: Successful logon to \\\\fs-main from 192.168.1.50 using admin account &quot;svc_backup&quot;\n    * 10:20 AM: powershell.exe spawned from explorer.exe (unusual)\n    * 10:25 AM: File modification spike (thousands of files modified in 2 minutes)\n    * 10:28 AM: Ransomware.exe created in C:\\Temp\n    * 10:30 AM: File encryption detected (system logs: .LOCKED extension added to files)\n\nT+15 min:\n  - Investigate svc_backup account:\n    * Check: Is this a service account? (Yes, used for backup software)\n    * Check: Who has access to this account? (Password shared with Backup Admin team)\n    * Check: Password last changed? (3 months ago)\n    * Risk: Backup admin&#39;s password may be compromised.\n\nT+20 min:\n  - Investigate 192.168.1.50 (source IP):\n    * Check inventory: 192.168.1.50 = BACKUP_SERVER (legitimate)\n    * Check EDR on BACKUP_SERVER:\n      - Multiple admin tool invocations (net.exe, psexec, PowerShell scripts)\n      - Lateral movement attempts to other servers\n      - Mimikatz-like process behavior (credential dump)\n    * Conclusion: BACKUP_SERVER compromised; attacker used it to pivot.\n\nT+30 min:\n  - Investigate BACKUP_SERVER compromise:\n    * When was it compromised?\n    * How did attacker get in?\n    * Check logs: Last logon? Failed attempts? Software vulnerabilities?\n\nHYPOTHESIS:\n  1. Attacker compromised BACKUP_SERVER (phishing? unpatched vuln?).\n  2. Attacker extracted svc_backup credentials from BACKUP_SERVER.\n  3. Attacker used svc_backup to access file server.\n  4. Attacker deployed ransomware; encrypted files.\n\nIMMEDIATE ACTIONS:\n  1. Isolate \\\\fs-main (done).\n  2. Isolate BACKUP_SERVER (disconnect from network).\n  3. Force password reset for svc_backup + all admins.\n  4. Scan all servers for similar lateral movement patterns.\n  5. Check backups: Are they clean (before encryption)?\n  6. Disable affected accounts pending investigation.\n\nESCALATION:\n  - Notify incident response team.\n  - Alert management (business impact assessment).\n  - Prepare legal/law enforcement notification (if required).\n  - Activate business continuity plan (recovery from backup).\n\nERADICATION:\n  - Remove ransomware from all systems.\n  - Close exploitation vector (patch BACKUP_SERVER vulnerability? Change poor password practices?).\n  - Verify network segmentation (file server shouldn&#39;t be accessible from backup server without approval).\n\nRECOVERY:\n  - Restore files from clean backup (before encryption timestamp).\n  - Verify no persistence (malware removed, backdoors closed).\n  - Restore network connectivity.\n\nFORENSICS / ROOT CAUSE:\n  - Why was BACKUP_SERVER vulnerable?\n  - Why was svc_backup password shared?\n  - Why wasn&#39;t file server segmented from backup server?\n  - Why did ransomware get to execute?\n\nPOST-INCIDENT:\n  - Improve:\n    * Network segmentation (file servers on isolated VLAN).\n    * Credential management (PAM for service accounts).\n    * Backup integrity (immutable snapshots; offsite copies).\n    * Detection (behavioral analytics for ransomware; file encryption patterns).\n  - Share IOCs: Ransomware hash, C2 domains, attacker IP.\n  - Train team on incident; incorporate lessons.\n<\/code><\/pre>\n<hr>\n<h2>Additional Scenario-Based Q&amp;A<\/h2>\n<h3>Q35: Detect DNS Tunneling – What are red flags?<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Scenario<\/strong>: Attacker exfiltrates data via DNS queries (encodes data in subdomain names).<\/li>\n<li><strong>Red Flags<\/strong>:<\/li>\n<\/ul>\n<ol>\n<li><strong>Unusually long DNS queries<\/strong>: Normal: <code>google.com<\/code>. Tunnel: <code>SGVsbG8gV29ybGRkYXRhYmFzZQ.attacker.com<\/code> (base64).<\/li>\n<li><strong>High DNS query volume from single workstation<\/strong>: Normal user: 100 DNS queries/day. Malware tunneling: 10,000 queries/day.<\/li>\n<li><strong>Requests to non-existent domains<\/strong>: Attacker-controlled nameserver (tunnel endpoint).<\/li>\n<li><strong>Suspicious domain patterns<\/strong>: Random subdomains changing rapidly (DGA-like).<\/li>\n<li><strong>DNS to unusual external IP<\/strong>: Nameserver not recognized; reverse DNS resolution shows attacker domain.<\/li>\n<\/ol>\n<p><strong>Detection (SIEM)<\/strong>:<\/p>\n<pre><code>| where sourcetype=&quot;dns&quot;\n| stats count by query_domain\n| where count &gt; 1000\n| search NOT query_domain IN (known_good_domains)\n| alert &quot;Possible DNS tunneling from [source_ip]&quot;\n<\/code><\/pre>\n<p><strong>Response<\/strong>:<\/p>\n<ul>\n<li>Block attacker.com at DNS firewall.<\/li>\n<li>Scan workstation for malware (likely tunnel client).<\/li>\n<li>Check for data exfiltration (what was sent?).<\/li>\n<\/ul>\n<hr>\n<h3>Q36: Lateral Movement via Pass-the-Hash – Detect &amp; Respond.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Attack<\/strong>: Attacker steals NTLM hash of Domain Admin; uses hash to access other servers without password.<\/li>\n<li><strong>Red Flag<\/strong>: Logon via NTLM from unexpected source.<ul>\n<li>Normal: User logs in with Kerberos.<\/li>\n<li>Attack: Attacker logs in with NTLM (doesn&#39;t have password; only hash).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Detection (Event Logs)<\/strong>:<\/p>\n<ul>\n<li>Event 4624 (logon) with Logon Type = 3 (network) + Authentication Package = NTLM (not Kerberos).<\/li>\n<li>For admin account at unusual time/location.<\/li>\n<\/ul>\n<p><strong>Example<\/strong>:<\/p>\n<pre><code>Event 4624:\n  Account: Domain Admin\n  Logon Type: 3 (network)\n  Auth Package: NTLM\n  Source IP: 10.0.0.50 (attacker-controlled box)\n  Time: 3 AM (unusual)\n  \nAlert: &quot;Admin login via NTLM from unusual IP/time&quot;\n<\/code><\/pre>\n<p><strong>Response<\/strong>:<\/p>\n<ol>\n<li>Isolate attacker-controlled box (10.0.0.50).<\/li>\n<li>Force password reset for Domain Admin.<\/li>\n<li>Invalidate all Kerberos tickets (reboot domain controller? Or revoke TGT).<\/li>\n<li>Check for persistence (backdoor accounts? Scheduled tasks?).<\/li>\n<li>Scan all servers accessed by Domain Admin in last 24 hours (attacker may have used admin access to install malware).<\/li>\n<\/ol>\n<hr>\n<h3>Q37: Detect Web Shell on Web Server – What to look for?<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Web Shell<\/strong>: Small script (PHP, ASP, JSP) left on web server by attacker for backdoor access.<\/li>\n<li><strong>Example<\/strong>: attacker.php (50 bytes) allowing attacker to execute commands.<\/li>\n<\/ul>\n<p><strong>Red Flags<\/strong>:<\/p>\n<ol>\n<li><strong>File in unexpected location<\/strong>: <code>/var/www/html/attacker.php<\/code> (web-accessible).<\/li>\n<li><strong>Recent creation<\/strong>: File created timestamp recent; older files are normal.<\/li>\n<li><strong>Unusual filename<\/strong>: <code>shell.php<\/code>, <code>cmd.php<\/code>, <code>admin.php<\/code>, <code>test.php<\/code> (not part of app).<\/li>\n<li><strong>Small file size<\/strong>: Shells are tiny (50-500 bytes vs normal app files 10+ KB).<\/li>\n<li><strong>Weird permissions<\/strong>: World-writable (chmod 777) to allow attacker modifications.<\/li>\n<li><strong>No owner in version control<\/strong>: File not tracked in git/SVN; unknown who created it.<\/li>\n<\/ol>\n<p><strong>Access Pattern<\/strong>:<\/p>\n<ul>\n<li>Web server logs show POST/GET requests to shell.php with command parameters.<\/li>\n<li>Example: <code>GET /shell.php?cmd=ls<\/code> → attacker listing files.<\/li>\n<li>Unusual activity (executing system commands, not serving web content).<\/li>\n<\/ul>\n<p><strong>Detection (File Integrity Monitoring)<\/strong>:<\/p>\n<pre><code>File created: /var/www/html/shell.php\n  Size: 234 bytes\n  Permissions: 644\n  Owner: www-data\n  Alert: Suspicious file in web root\n<\/code><\/pre>\n<p><strong>Detection (Web Server Logs)<\/strong>:<\/p>\n<pre><code>192.168.1.50 - - [timestamp] &quot;GET /shell.php?cmd=id HTTP/1.1&quot; 200 120\n192.168.1.50 - - [timestamp] &quot;GET /shell.php?cmd=whoami HTTP/1.1&quot; 200 50\n<\/code><\/pre>\n<p><strong>Response<\/strong>:<\/p>\n<ol>\n<li>Quarantine web server (take offline).<\/li>\n<li>Preserve shell.php for analysis.<\/li>\n<li>Check how shell was uploaded (vulnerable file upload? RCE exploit?).<\/li>\n<li>Search for other shells (pattern: *.php in web root with recent timestamps).<\/li>\n<li>Check for malware (shells often paired with backdoor malware).<\/li>\n<li>Patch vulnerability; harden web server.<\/li>\n<\/ol>\n<hr>\n<h3>Q38: Detect Data Exfiltration – Red Flags &amp; Response.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Scenario<\/strong>: Employee or insider downloads sensitive files to external device.<\/li>\n<\/ul>\n<p><strong>Red Flags<\/strong>:<\/p>\n<ol>\n<li><strong>Large outbound transfer<\/strong>: 10 GB download in 1 hour (abnormal).<\/li>\n<li><strong>Unusual destination<\/strong>: Upload to personal cloud (Dropbox, Google Drive) or external IP.<\/li>\n<li><strong>Off-hours activity<\/strong>: Transfer at 2 AM on weekday (unusual for that user).<\/li>\n<li><strong>Compression before transfer<\/strong>: Files zipped → single large file uploaded (indicates intent to hide).<\/li>\n<li><strong>VPN/Proxy use<\/strong>: User suddenly using VPN (hiding traffic).<\/li>\n<li><strong>High-risk file types<\/strong>: Database dumps (.bak), entire folder archives (.tar, .zip).<\/li>\n<li><strong>DLP alert<\/strong>: Data Loss Prevention system flags sensitive data (PII, confidential) leaving network.<\/li>\n<\/ol>\n<p><strong>Detection (Network/SIEM)<\/strong>:<\/p>\n<pre><code>Outbound traffic from [user] to [external_ip]:\n  Volume: 5 GB\n  Duration: 30 min\n  Time: 2:15 AM\n  Destination reputation: suspicious\n  Protocol: HTTPS (encrypted; can&#39;t inspect content)\n  \nAlert: Possible data exfiltration\n<\/code><\/pre>\n<p><strong>Detection (DLP)<\/strong>:<\/p>\n<pre><code>DLP alert: Sensitive data detected in outbound email\n  Pattern: SSN (XXX-XX-XXXX), Credit card (XXXX-XXXX-XXXX-XXXX)\n  File: customer_list.xlsx\n  Destination: personal.gmail.com\n  Action: Block email; alert user; escalate\n<\/code><\/pre>\n<p><strong>Response<\/strong>:<\/p>\n<ol>\n<li><strong>Immediate<\/strong>:<ul>\n<li>Revoke user&#39;s credentials (prevent further access).<\/li>\n<li>Block external IP at firewall.<\/li>\n<li>Preserve logs (network capture, endpoint logs).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Investigation<\/strong>:<ul>\n<li>Interview user (was this intentional? Accident?).<\/li>\n<li>Determine what data was exfiltrated.<\/li>\n<li>Check if malware involved (trojan stealing files?) or intentional (insider threat).<\/li>\n<li>Check user&#39;s access history (what files did they access before exfil?).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Damage Assessment<\/strong>:<ul>\n<li>Is data sensitive? (PII? Trade secrets? Financial?)<\/li>\n<li>Who is affected? (Customers? Employees?)<\/li>\n<li>Legal obligation to notify? (GDPR, CCPA, SOX).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Response<\/strong>:<ul>\n<li>If insider threat: Involve legal, HR, management.<\/li>\n<li>If malware: Full incident response (find malware, remove, scan).<\/li>\n<li>Notify affected parties (if required).<\/li>\n<li>Review access controls (why did user have access to that data?).<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<hr>\n<h2>Summary of Key Takeaways (SOC L1 Essentials)<\/h2>\n<ol>\n<li><strong>CIA Triad<\/strong>: Confidentiality (encryption), Integrity (hashing), Availability (redundancy, DDoS mitigation).<\/li>\n<li><strong>AAA Model<\/strong>: Authentication (MFA), Authorization (RBAC), Accountability (logging, auditing).<\/li>\n<li><strong>Networking<\/strong>: TCP (reliable, connection-oriented), UDP (fast, connectionless). SSH replaces Telnet (encryption).<\/li>\n<li><strong>Ports<\/strong>: FTP 20/21 (plaintext), SSH 22 (encrypted), DNS 53, HTTP 80, HTTPS 443, SMB 445, RDP 3389.<\/li>\n<li><strong>DNS<\/strong>: Resolution process; SPF/DKIM/DMARC prevent email spoofing; DNS tunneling exfiltrates data.<\/li>\n<li><strong>Email Security<\/strong>: SPF (checks IP), DKIM (signs message), DMARC (policy).<\/li>\n<li><strong>Cryptography<\/strong>: Hash (one-way, passwords), Encryption (two-way, TLS). PKI = trust infrastructure.<\/li>\n<li><strong>Web Security<\/strong>: OWASP Top 10; SQLi (prepared statements), XSS (output encoding), CSRF (tokens), Open Redirect (whitelist).<\/li>\n<li><strong>Malware<\/strong>: Classification (virus, worm, trojan, ransomware), IOCs (hash, IP, domain), LoTL (PowerShell, cmd, WMI).<\/li>\n<li><strong>Kill Chain<\/strong>: Reconnaissance → Weaponization → Delivery → Exploitation → Installation → C2 → Actions on Objectives.<\/li>\n<li><strong>MITRE ATT&amp;CK<\/strong>: Tactics (goals) → Techniques (how) → Sub-Techniques (variations). Map alerts to tactics.<\/li>\n<li><strong>Pyramid of Pain<\/strong>: Hash (easy to change) → IPs → Domains → Patterns → Tools → TTPs (hard to change). Invest in TTP detection.<\/li>\n<li><strong>IR<\/strong>: Detection → Containment → Eradication → Recovery → Post-Incident.<\/li>\n<li><strong>AD<\/strong>: Users, Groups, Computers, OUs, GPOs. Kerberos (tickets, time-limited) vs NTLM (hash-based, weak). Monitor for privilege escalation, pass-the-hash, credential theft.<\/li>\n<li><strong>SOC L1 Focus<\/strong>: Alert triage, SIEM queries, escalation, threat intel. Not deep forensics/rule writing (those are L2/L3).<\/li>\n<\/ol>\n"}];

function setSetting(k,v){ const s=settings(); s[k]=v; store.set("settings",s); }
function qstat(){ return store.get("qstat",{}); }
function bookmarks(){ return new Set(store.get("bm",[])); }
function toggleBm(id){ const b=bookmarks(); b.has(id)?b.delete(id):b.add(id); store.set("bm",[...b]); }
function missedIds(){ const s=qstat(); return Object.keys(s).filter(k=>s[k].last===false); }
function readSet(){ return new Set(store.get("read",[])); }
function markStudyDay(){ const d=new Date().toISOString().slice(0,10), days=store.get("days",[]); if(!days.includes(d)){days.push(d);store.set("days",days.slice(-400));} }
function applyFont(){ document.documentElement.style.setProperty("--fs",settings().fs+"px"); }
function recordAnswer(id,ok){ const s=qstat(); const r=s[id]||{c:0,w:0}; ok?r.c++:r.w++; r.last=ok; s[id]=r; store.set("qstat",s); markStudyDay(); }
function streak(){ const days=new Set(store.get("days",[])); let n=0; const d=new Date();
  if(!days.has(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1);
  while(days.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)} return n; }
function domainMastery(){
  const s=qstat(), by={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0},5:{c:0,t:0}};
  Object.keys(s).forEach(id=>{const q=Q(id); if(!q) return; const d=q[0]; by[d].t++; if(s[id].last) by[d].c++;}); return by;
}
function chap(n){ return NOTES.find(c=>c.n===n); }

/* ---------- notes: live refresh on GitHub Pages ---------- */
function cleanMd(md){ return md.replace(/^#\s+.*\n/,"").replace(/^\[Index\]\(\.\.\/README\.md\).*$/gm,"").replace(/(\n\s*---\s*)+\s*$/,"\n").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{2B55}\u{FE0F}]/gu,""); }
async function refreshNotes(){
  if(!/github\.io$/.test(location.hostname) || !window.marked) return;
  try{
    const base=location.pathname.replace(/[^/]*$/,"");
    const readme=await (await fetch(base+"README.md",{cache:"no-cache"})).text();
    const rows=[...readme.matchAll(/^\|\s*(\d+)\s*\|\s*\[([^\]]+)\]\((chapters\/[^)]+\.md)\)\s*\|\s*([^|]*)\|/gm)];
    if(!rows.length) return;
    const fresh=await Promise.all(rows.map(async r=>{const res=await fetch(base+r[3],{cache:"no-cache"}); if(!res.ok) throw 0;
      return {n:+r[1],title:r[2].trim(),file:r[3],covers:r[4].trim(),html:window.marked.parse(cleanMd(await res.text()))};}));
    NOTES=fresh; searchIndex=null;
    if(["home","notes","read"].includes(view)) renderView(true);
  }catch(e){}
}

/* ---------- search (notes + questions) ---------- */
function buildIndex(){
  const out=[]; const div=document.createElement("div");
  NOTES.forEach(c=>{ div.innerHTML=c.html; let cur={n:c.n,title:c.title,head:"",anchor:null,text:""};
    const used={};
    [...div.children].forEach(el=>{
      if(/^H[23]$/.test(el.tagName)){ if(cur.text.trim()) out.push(cur); let id=slugify(el.textContent)||"s"; used[id]=(used[id]||0)+1; if(used[id]>1) id+="-"+used[id];
        cur={n:c.n,title:c.title,head:el.textContent,anchor:id,text:""}; }
      else cur.text+=" "+el.textContent;
    });
    if(cur.text.trim()) out.push(cur);
  });
  return out;
}
function vSearch(){
  return '<div class="stack"><div class="stack" style="gap:6px"><span class="eyebrow">'+NOTES.length+' chapters and '+ALL.length+' practice questions</span><h1>Search</h1></div>'+
   '<input type="search" id="sq" placeholder="Try: Kerberos, DMARC, pass-the-hash, RPO" value="'+esc(searchTerm)+'" aria-label="Search notes and questions">'+
   '<div id="sres" class="stack"></div></div>';
}
function runSearch(){

  if(t.length<2){box.innerHTML='<p class="note">Type at least two characters. Results come from your notes and from the practice questions.</p>';return;}

  const hl=s=>esc(s).replace(re,"<mark>$1</mark>");
  const snip=txt=>{const s=txt.replace(/\s+/g," ").trim(); const i=s.toLowerCase().indexOf(t); if(i<0) return s.slice(0,160)+(s.length>160?"…":""); const a=Math.max(0,i-70); return (a?"…":"")+s.slice(a,i+110)+(i+110<s.length?"…":"");};
  const nh=searchIndex.filter(x=>(x.head+" "+x.text).toLowerCase().includes(t));

   (qh.length?'<div class="panel">'+qh.slice(0,40).map(id=>{const q=Q(id), r=ansSet(q);
     return '<div class="hit stack" style="gap:6px"><div class="qhead"><span class="tag src">'+srcOf(id)+'</span><span class="tag">'+SHORT[q[0]]+'</span></div><p>'+hl(q[1])+'</p>'+
       '<details><summary class="note" style="cursor:pointer">Show answer</summary><p style="margin-top:6px"><strong>'+r.map(k=>hl(q[2][k])).join(" + ")+'</strong></p><p class="muted" style="font-size:.92rem;margin-top:4px">'+hl(q[4])+'</p></details></div>';}).join("")+'</div>'+

/* ---------- practice sessions ---------- */
function newSession(o){
  return Object.assign({ cur:0, picks:o.ids.map(()=>[]), locked:o.ids.map(()=>false), flags:o.ids.map(()=>false), struck:o.ids.map(()=>[]),
    optOrder:o.ids.map(id=>shuffle(Q(id)[2].map((_,k)=>k))), elapsed:0, done:false }, o);
}
function startPaper(pi){
  const st=settings(); let ids=PAPERS[pi].map((_,i)=>pi+"-"+i); if(st.mix) ids=shuffle(ids);
  S=newSession({kind:"paper",pi,label:"Paper "+(pi+1),mode:st.mode,ids,limit:st.mode==="exam"?90*60:0});
  save(); quiz();
}
function startDrill(label,ids,mode,limit){
  if(!ids.length) return;
  S=newSession({kind:"drill",label,mode:mode||"practice",ids,limit:limit||0});
  save(); quiz();
}
function resume(){ S=store.get("attempt",null); if(!S){go("home");return;} quiz(); }
function save(){ if(S&&!S.done) store.set("attempt",S); }
function stopTimer(){ if(tick){clearInterval(tick);tick=null;} }
function startTimer(){
  stopTimer();
  tick=setInterval(()=>{ if(document.hidden&&!S.limit) return; S.elapsed++;
    const t=document.getElementById("tm");
    if(t){ if(S.limit){const left=S.limit-S.elapsed; t.textContent=fmt(left); t.classList.toggle("low",left<600);} else t.textContent=fmt(S.elapsed); }
    if(S.elapsed%10===0) save();
    if(S.limit&&S.elapsed>=S.limit) finish(); },1000);
}
function isCorrect(i){ return ansSet(Q(S.ids[i])).slice().sort().join()===S.picks[i].slice().sort().join(); }
function quiz(){ view="quiz"; confirmOpen=false; setHash("practice"); renderQuiz(); startTimer(); window.scrollTo(0,0); }
function lockCurrent(){ const i=S.cur; if(S.locked[i]) return; S.locked[i]=true; recordAnswer(S.ids[i],isCorrect(i)); save(); renderQuiz(); }
function renderQuiz(){
  applyFont();
  const i=S.cur, id=S.ids[i], q=Q(id), multi=Array.isArray(q[3]), need=multi?q[3].length:1, total=S.ids.length;
  const done=S.picks.filter(p=>p.length).length, lock=S.mode==="practice"&&S.locked[i], right=ansSet(q), bm=bookmarks().has(id);
  const opts=S.optOrder[i].map((oi,pos)=>{
    const sel=S.picks[i].includes(oi), st=S.struck[i].includes(oi);
    let cls="opt"+(sel?" sel":"")+(st&&!sel?" struck":"");
    if(lock) cls="opt locked"+(right.includes(oi)?" right":(sel?" wrong":""));
    return '<label class="'+cls+'"><input type="'+(multi?"checkbox":"radio")+'" name="o" id="o'+pos+'" value="'+oi+'"'+(sel?" checked":"")+(lock?" disabled":"")+'>'+
      '<span class="key">'+KEYS[pos]+'</span><span class="t">'+esc(q[2][oi])+'</span>'+
      (lock?'':'<button type="button" class="x" data-strike="'+oi+'" aria-label="'+(st?"Restore":"Cross out")+' option '+KEYS[pos]+'" title="Cross out">'+(st?"↺":"×")+'</button>')+'</label>';
  }).join("");
  const rel=(DOMAIN_CHAPTERS[q[0]]||[]).map(chap).filter(Boolean);
  const explain=lock?'<div class="explain '+(isCorrect(i)?"ok":"no")+'"><b>'+(isCorrect(i)?"Correct":"Incorrect")+'</b> · '+esc(q[4])+
    (rel.length&&!isCorrect(i)?'<br><span class="note">Revise in your notes: '+rel.map(c=>'<button class="linkbtn" data-rel="'+c.n+'">'+c.n+'. '+esc(c.title)+'</button>').join(", ")+'</span>':'')+'</div>':"";
  const grid=S.ids.map((_,k)=>{const c=[]; if(S.picks[k].length) c.push("ans"); if(S.flags[k]) c.push("flg"); if(k===i) c.push("cur");
    if(S.mode==="practice"&&S.locked[k]) c.push(isCorrect(k)?"g-ok":"g-no");
    return '<button data-go="'+k+'" class="'+c.join(" ")+'" aria-label="Question '+(k+1)+'">'+(k+1)+'</button>';}).join("");
  const flagged=S.flags.filter(Boolean).length;
  const checked=S.locked.map((x,k)=>x?k:-1).filter(k=>k>=0), corr=checked.filter(isCorrect).length;
  const clock=S.limit?'<span class="timer'+((S.limit-S.elapsed)<600?" low":"")+'" id="tm" aria-label="Time left">'+fmt(S.limit-S.elapsed)+'</span>':'<span class="timer muted" id="tm" aria-label="Time spent">'+fmt(S.elapsed)+'</span>';
  let primary;
  if(S.mode==="practice"&&!lock) primary='<button class="primary" id="check"'+(S.picks[i].length===need?"":" disabled")+'>Check</button>';
  else if(i<total-1) primary='<button class="primary" id="next">Next</button>';
  else primary='<button class="primary" id="sub">Finish</button>';
  app.innerHTML='<main class="wrap">'+
   '<div class="qbar"><div class="spread"><div><span class="eyebrow">'+esc(S.label)+' · '+(S.mode==="exam"?"Exam":"Practice")+'</span>'+
     '<div class="mono"><strong>'+(i+1)+'</strong> / '+total+(S.mode==="practice"&&checked.length?' <span class="muted">· '+corr+'/'+checked.length+' correct</span>':'')+'</div></div>'+
     '<div class="row">'+clock+'<button class="ghost" id="exit">Save and exit</button></div></div>'+
     '<div class="progress"><i style="width:'+(done/total*100)+'%"></i></div></div>'+
   '<div class="qcard">'+
     '<div class="qhead"><span class="tag">'+SHORT[q[0]]+'</span>'+(multi?'<span class="tag two">Choose '+need+'</span>':'')+(S.kind==="drill"?'<span class="tag src">'+srcOf(id)+'</span>':'')+'</div>'+
     '<p class="qtext">'+esc(q[1])+'</p>'+
     '<div class="opts" id="opts">'+opts+'</div>'+explain+
     (confirmOpen?'<div class="confirm" id="cf"><div><strong>Submit '+esc(S.label)+'?</strong><br><span class="muted">'+(total-done)+' unanswered · '+flagged+' flagged. Unanswered questions count as wrong.</span></div><div class="row"><button class="primary" id="cfy">Submit and score</button><button id="cfn">Keep going</button></div></div>':'')+
     '<details class="palette"'+(store.get("palOpen",false)?" open":"")+'><summary>All questions · '+done+' answered · '+flagged+' flagged</summary><div class="grid">'+grid+'</div>'+
       '<div class="row" style="margin-top:10px"><button id="sub2">Submit now</button></div></details>'+
     '<p class="keys keyhint"><kbd>A</kbd>-<kbd>E</kbd> or <kbd>1</kbd>-<kbd>5</kbd> select · <kbd>Enter</kbd> check / next · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>F</kbd> flag · <kbd>S</kbd> bookmark</p>'+
   '</div>'+
   '<div class="actions"><button id="prev"'+(i===0?" disabled":"")+'>Back</button>'+
     '<div class="mid"><button class="flag" id="flag" aria-pressed="'+S.flags[i]+'">'+(S.flags[i]?"Flagged":"Flag")+'</button><button class="bm" id="bm" aria-pressed="'+bm+'">'+(bm?"Saved":"Bookmark")+'</button></div>'+
     primary+'</div>'+
  '</main>';
  app.querySelectorAll("#opts input").forEach(inp=>inp.onchange=()=>pick(+inp.value,inp.checked));
  app.querySelectorAll("[data-strike]").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const v=+b.dataset.strike;const s=S.struck[i];
    S.struck[i]=s.includes(v)?s.filter(x=>x!==v):s.concat(v); if(!s.includes(v)) S.picks[i]=S.picks[i].filter(x=>x!==v); save(); renderQuiz();});
  app.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>{save(); openChapter(+b.dataset.rel);});
  const on=(id,f)=>{const el=document.getElementById(id); if(el) el.onclick=f;};
  on("prev",()=>move(-1)); on("next",()=>move(1)); on("check",lockCurrent);
  on("flag",()=>{S.flags[i]=!S.flags[i];save();renderQuiz();});
  on("bm",()=>{toggleBm(id);renderQuiz();});
  const ask=()=>{confirmOpen=true;renderQuiz();const c=document.getElementById("cf"); if(c) c.scrollIntoView({block:"center"});};
  on("sub",ask); on("sub2",ask); on("cfy",finish); on("cfn",()=>{confirmOpen=false;renderQuiz();});
  on("exit",()=>{save();go("home");});
  const pal=app.querySelector("details.palette"); pal.ontoggle=()=>store.set("palOpen",pal.open);
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.go;save();renderQuiz();window.scrollTo(0,0);});
}
function pick(v,checked){
  const i=S.cur, q=Q(S.ids[i]), multi=Array.isArray(q[3]), need=multi?q[3].length:1;
  if(S.mode==="practice"&&S.locked[i]) return;
  if(multi){ let p=S.picks[i].filter(x=>x!==v); if(checked){p.push(v); if(p.length>need) p=p.slice(-need);} S.picks[i]=p; }
  else S.picks[i]=[v];
  S.struck[i]=S.struck[i].filter(x=>!S.picks[i].includes(x));
  save(); renderQuiz();
}
function move(d){ const n=S.cur+d; if(n<0||n>=S.ids.length) return; S.cur=n; save(); renderQuiz(); window.scrollTo(0,0); }
document.addEventListener("keydown",e=>{
  if(view==="ref"&&e.key===" "&&document.activeElement===document.body){e.preventDefault();flashShow=!flashShow;renderView(true);return;}
  if(view!=="quiz"||!S||S.done) return;
  if(e.target.matches("input[type=text],input[type=search],textarea,select")||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toLowerCase(), i=S.cur, n=S.optOrder[i].length;
  let pos="abcde".indexOf(k); if(pos<0&&/^[1-5]$/.test(k)) pos=+k-1;
  if(pos>=0&&pos<n){ const oi=S.optOrder[i][pos]; pick(oi,!S.picks[i].includes(oi)); e.preventDefault(); return; }
  if(k==="s"){ toggleBm(S.ids[i]); renderQuiz(); return; }
  if(k==="f"){ S.flags[i]=!S.flags[i]; save(); renderQuiz(); return; }
  if(k==="arrowright"){ move(1); return; }
  if(k==="arrowleft"){ move(-1); return; }
  if(k==="enter"){ const b=document.getElementById("check")||document.getElementById("next")||document.getElementById("sub"); if(b&&!b.disabled){e.preventDefault();b.click();} }
});

/* ---------- results ---------- */
function finish(){
  stopTimer(); if(S.done) return; S.done=true;
  S.ids.forEach((id,i)=>{ if(!(S.mode==="practice"&&S.locked[i])) recordAnswer(id,isCorrect(i)); });
  const n=S.ids.length, correct=S.ids.filter((_,i)=>isCorrect(i)).length;
  const byDom={}; S.ids.forEach((id,i)=>{const d=Q(id)[0]; byDom[d]=byDom[d]||[0,0]; byDom[d][1]++; if(isCorrect(i)) byDom[d][0]++;});
  const rec={t:Date.now(),kind:S.kind,pi:S.pi,label:S.label,n,correct,scaled:scaledOf(correct/n),secs:S.elapsed,byDom};
  const hist=store.get("hist",[]); hist.push(rec); store.set("hist",hist.slice(-300));
  store.del("attempt"); S.result=rec; reviewFilter=correct<n?"wrong":"all"; view="results"; renderResults(); window.scrollTo(0,0);
}
function renderResults(){
  const R=S.result, pass=R.scaled>=750, isPaper=S.kind==="paper";
  const ledger=Object.keys(DOMAINS).filter(d=>R.byDom[d]).map(d=>{const [c,t]=R.byDom[d], p=c/t;
    return '<div class="lrow"><span class="name">'+d+'. '+DOMAINS[d]+' <span class="muted mono">('+c+'/'+t+')</span></span><span class="pct">'+Math.round(p*100)+'%</span><div class="meter"><i style="width:'+(p*100)+'%;background:'+colorFor(p)+'"></i></div></div>';}).join("");
  const weak=Object.keys(R.byDom).filter(d=>R.byDom[d][1]>=3).sort((a,b)=>R.byDom[a][0]/R.byDom[a][1]-R.byDom[b][0]/R.byDom[b][1])[0];
  const weakCh=weak?(DOMAIN_CHAPTERS[weak]||[]).map(chap).filter(Boolean):[];
  const items=S.ids.map((_,i)=>i).filter(i=>reviewFilter==="all"||(reviewFilter==="wrong"&&!isCorrect(i))||(reviewFilter==="flagged"&&S.flags[i]));
  const cnt={wrong:S.ids.filter((_,i)=>!isCorrect(i)).length,flagged:S.flags.filter(Boolean).length,all:S.ids.length};
  const bms=bookmarks();
  const rev=items.map(i=>{const id=S.ids[i], q=Q(id), right=ansSet(q), ok=isCorrect(i);
    const opts=S.optOrder[i].map((oi,pos)=>{const sel=S.picks[i].includes(oi);
      return '<div class="opt locked'+(right.includes(oi)?" right":(sel?" wrong":""))+'"><span class="key">'+KEYS[pos]+'</span><span class="t">'+esc(q[2][oi])+(sel?' <span class="muted">· your answer</span>':'')+'</span></div>';}).join("");
    return '<div class="panel rev"><div class="spread"><div class="qhead"><span class="tag">Q'+(i+1)+' · '+SHORT[q[0]]+'</span><span class="tag src">'+srcOf(id)+'</span>'+(S.picks[i].length?'':'<span class="tag two">Unanswered</span>')+(S.flags[i]?'<span class="tag two">Flagged</span>':'')+'</div>'+
      '<button class="bm ghost" data-bm="'+id+'" aria-pressed="'+bms.has(id)+'">'+(bms.has(id)?"Saved":"Bookmark")+'</button></div>'+
      '<p class="qtext">'+esc(q[1])+'</p><div class="opts">'+opts+'</div><div class="explain '+(ok?"ok":"no")+'"><b>'+(ok?"Correct":"Incorrect")+'</b> · '+esc(q[4])+'</div></div>';}).join("")||'<p class="note">Nothing to show for this filter.</p>';
  app.innerHTML=shell(
   '<div class="stack"><div class="stack" style="gap:6px"><span class="eyebrow">'+esc(S.label)+(isPaper?' · '+esc(FOCUS[S.pi]):'')+'</span><h1>Results</h1></div>'+
   '<div class="panel score"><div class="scaled mono">'+(isPaper?R.scaled+'<small> / 900</small>':Math.round(R.correct/R.n*100)+'<small>%</small>')+'</div><div class="stack" style="gap:6px">'+
     (isPaper?'<span class="verdict '+(pass?"pass":"fail")+'">'+(pass?"Above the 750 pass line":"Below the 750 pass line")+'</span>':'')+
     '<span class="mono">'+R.correct+' of '+R.n+' correct · '+fmt(R.secs)+(isPaper&&S.limit?' of 1:30:00 used':'')+'</span>'+
     (weak?'<span class="muted" style="font-size:.92rem">Weakest here: '+DOMAINS[weak]+'.'+(weakCh.length?' Revise '+weakCh.map(c=>'<button class="linkbtn" data-rel="'+c.n+'">chapter '+c.n+'</button>').join(", ")+'.':'')+'</span>':'')+
     '<div class="row" style="margin-top:4px">'+(weak?'<button class="primary" id="wd">Drill '+SHORT[weak]+'</button>':'')+(cnt.wrong?'<button id="rw">Retry the '+cnt.wrong+' wrong</button>':'')+'</div></div></div>'+
   '<div class="panel stack" style="gap:12px"><h2>By domain</h2><div class="ledger">'+ledger+'</div></div>'+
   '<div class="spread"><h2>Review</h2><div class="filters">'+["wrong","flagged","all"].map(f=>'<button data-f="'+f+'" aria-pressed="'+(reviewFilter===f)+'">'+({wrong:"Wrong",flagged:"Flagged",all:"All"})[f]+' ('+cnt[f]+')</button>').join("")+'</div></div>'+
   '<div class="stack">'+rev+'</div>'+
   '<div class="row">'+(isPaper?'<button class="primary" id="again">Retake '+esc(S.label)+'</button>':'')+'<button id="home2">Home</button></div></div>');
  wireNav();
  const wrong=S.ids.filter((_,i)=>!isCorrect(i));
  const on=(id,f)=>{const el=document.getElementById(id); if(el) el.onclick=f;};
  on("home2",()=>go("home")); on("again",()=>startPaper(S.pi));
  on("rw",()=>startDrill("Retry wrong answers",shuffle(wrong),"practice"));
  on("wd",()=>startDrill(SHORT[weak]+" drill",shuffle(ALL.filter(id=>Q(id)[0]===+weak)).slice(0,20),"practice"));
  app.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>openChapter(+b.dataset.rel));
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.f;renderResults();});
  app.querySelectorAll("[data-bm]").forEach(b=>b.onclick=()=>{toggleBm(b.dataset.bm);renderResults();});
}

/* ---------- boot ---------- */
(function boot(){
  let h=""; try{ h=location.hash.slice(1); }catch(e){}
  const m=h.match(/^ch-(\d+)$/);
  if(m&&chap(+m[1])){ chapterN=+m[1]; view="read"; }
  else if(h==="practice") view="papers";
  else if(TABS.some(t=>t[0]===h)) view=h;
  renderView();
  refreshNotes();
})();
</script>
