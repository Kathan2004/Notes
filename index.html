s the credentials to a RADIUS server. What role does the switch play?",["Supplicant","Authenticator","Authentication server","Certificate authority"],1,"The network device that relays credentials between the client (supplicant) and the RADIUS server (authentication server) is the authenticator."],[3,"An administrator must ensure that directory lookups and binds from application servers are encrypted in transit. Which option BEST accomplishes this?",["LDAP on TCP 389 without TLS","LDAPS on TCP 636","Telnet to the directory server","TFTP transfer of the directory database"],1,"LDAPS wraps LDAP in TLS, typically on TCP 636. Plain LDAP on 389 sends binds and queries in cleartext unless StartTLS is used."],[3,"A developer wants a mobile app to authenticate users and receive a signed JWT identity token from a cloud identity provider. Which protocol is designed for this?",["OAuth 2.0 alone","Kerberos","LDAP","OpenID Connect"],3,"OpenID Connect adds an authentication layer and ID token on top of OAuth 2.0, which by itself only handles authorization."],[3,"Employees of a partner company need to open the organization's procurement portal by using their own corporate credentials, without separate accounts being created. Which approach BEST provides this?",["Federation between the two identity providers","Shared generic accounts","Local account provisioning for each partner user","A site-to-site VPN only"],0,"Federation establishes trust between identity domains so users authenticate with their home identity provider. Shared accounts eliminate accountability."],[3,"Security wants cloud apps to deny sign-ins from unmanaged devices and to require MFA when the sign-in risk is high. Which capability BEST implements this?",["Static firewall ACLs","Port security","Disk quotas","Conditional access policies"],3,"Conditional access evaluates signals such as device state, location and risk to decide whether to allow, block or require extra authentication."],[3,"Several administrators share one privileged service account whose password is known to many staff. Which solution BEST improves accountability and reduces exposure?",["Writing the password on a card in a safe","A privileged access management vault with check-out and automatic rotation","Extending the password expiration to 365 days","Emailing the new password to the team monthly"],1,"A PAM vault stores the credential, logs each check-out and rotates it afterward, so use is attributable and old knowledge becomes useless."],[3,"A certificate authority needs tamper-resistant hardware to generate and store its private signing keys. Which device BEST meets this need?",["Hardware security module","Network load balancer","Web application firewall","Uninterruptible power supply"],0,"A hardware security module securely generates, stores and uses cryptographic keys inside tamper-resistant hardware."],[3,"Which design BEST limits lateral movement between workloads in the same data center subnet?",["Increasing the bandwidth of core switches","Microsegmentation with per-workload policies","Adding a second DNS server","Enabling jumbo frames"],1,"Microsegmentation applies granular policy between individual workloads, restricting east-west traffic that traditional perimeter controls do not see."],[3,"Two web servers behind a load balancer both serve user requests at the same time, and either can absorb the full load if the other fails. Which configuration is this?",["Active-passive","Cold standby","Active-active","Warm site"],2,"In an active-active cluster all nodes process traffic simultaneously, whereas active-passive keeps a node idle until failover."],[3,"An organization needs visibility into, and policy enforcement over, employee use of both approved and unapproved SaaS applications. Which technology BEST fits?",["Cloud access security broker","Network intrusion prevention system","Hardware security module","Honeynet"],0,"A CASB sits between users and cloud services to discover shadow IT and enforce data and access policies."],[3,"A file server needs to survive the failure of any single disk by using distributed parity, with a minimum of three drives. Which RAID level should be used?",["RAID 0","RAID 1","RAID 5","RAID 10 with two drives"],2,"RAID 5 stripes data with distributed parity and tolerates one drive failure with at least three drives. RAID 0 has no redundancy."],[3,"An administrator is replacing Telnet for remote management of switches. Which protocol and port should replace it?",["FTP on TCP 21","SSH on TCP 22","HTTP on TCP 80","SNMPv1 on UDP 161"],1,"SSH on TCP 22 provides encrypted remote command-line access. Telnet, FTP and HTTP send credentials in cleartext."],[3,"Which TWO controls protect data at rest on a company laptop?",["Full-disk encryption","TLS for web traffic","Self-encrypting drive","IPsec transport mode","SSH tunneling"],[0,2],"Full-disk encryption and self-encrypting drives protect stored data. TLS, IPsec and SSH protect data in transit."],[3,"Which TWO statements describe FIDO2 / WebAuthn authenticators?",["The private key never leaves the authenticator","A shared secret is sent to the server at each logon","Credentials are scoped to the legitimate website's origin","Verification depends on an SMS code","The server stores the user's biometric template"],[0,2],"FIDO2 uses public-key cryptography with a device-held private key and origin binding, which resists phishing. No shared secret or biometric leaves the device."],[3,"Which characteristic of containers MOST directly creates the risk of a container escape affecting other workloads?",["Containers share the host operating system kernel","Containers use immutable images","Containers start faster than virtual machines","Containers can be orchestrated automatically"],0,"Because containers share the host kernel, a kernel-level flaw can let an attacker break out and reach the host or other containers."],[4,"Which one-time password method generates a code from a shared secret and an incrementing counter, so a code remains valid until it is used?",["TOTP","HOTP","SMS OTP","Biometric template"],1,"HOTP is counter-based, while TOTP derives codes from the current time and expires after a short window."],[4,"A company wants new employees to receive correct role-based access on their first day without manual ticketing. Which approach BEST achieves this?",["Letting managers email requests to IT","Copying the permissions of a similar coworker","Automated provisioning triggered by the HR system and mapped to job roles","Giving all new hires temporary administrator rights"],2,"HR-driven automated provisioning applies consistent role-based access and reduces errors. Copying a coworker's access leads to privilege creep."],[4,"An employee is terminated effective immediately. Which action should the security team take FIRST?",["Delete the user's mailbox and home directory","Disable the account and revoke active sessions and tokens","Wait for the next quarterly access review","Reset the manager's password"],1,"Disabling the account and revoking sessions stops access right away while preserving data that may be needed for investigation or legal hold."],[4,"A quarterly process has managers confirm that each team member's access is still required. What is the primary purpose of this process?",["Detect and remove excess privileges and privilege creep","Increase password entropy","Encrypt data at rest","Measure network latency"],0,"User access reviews (recertification) find stale or excessive permissions that accumulate as people change roles."],[4,"Which password policy BEST aligns with current NIST SP 800-63B guidance?",["Minimum 8 characters, forced complexity, change every 30 days","Minimum 15 characters, screening against breached passwords, no forced periodic change","Four security questions in place of a password","Minimum 6 characters with a password hint"],1,"NIST favors length, checking against known-compromised lists, and changing only on evidence of compromise. Forced rotation and complexity rules encourage weak patterns."],[4,"An organization wants to eliminate passwords for workforce sign-in, using a device-bound cryptographic key unlocked by a local biometric or PIN. Which technology BEST fits?",["Security questions","SMS one-time codes","Passkeys based on FIDO2","Longer passphrases"],2,"Passkeys use public-key cryptography unlocked locally, giving passwordless and phishing-resistant authentication."],[4,"Employees complain that the new fingerprint readers frequently reject them even when they scan the correct finger. Which metric is too high?",["False acceptance rate","False rejection rate","Crossover error rate only","Enrollment rate"],1,"A false rejection occurs when a legitimate user is denied. Lowering the sensitivity threshold usually reduces FRR but raises FAR."],[4,"Which account lockout approach BEST slows online password guessing without enabling attackers to permanently lock out legitimate users?",["Permanent lockout after one failed attempt","Temporary lockout or increasing delay after repeated failures","No lockout, only complexity rules","Lockout that applies only to administrators"],1,"Temporary lockouts or progressive delays throttle guessing while limiting denial-of-service against accounts."],[4,"An identity protection tool flags a sign-in as high risk because of impossible travel. Which automated response is BEST?",["Allow access and only log the event","Require step-up MFA and a password change, or block the sign-in","Permanently delete the account","Add the source IP address to an allow list"],1,"A risk-based policy should challenge or block the sign-in and force credential recovery. Allowing it or allow-listing the IP ignores the likely compromise."],[4,"A vulnerability scanner fails to report a missing patch that is actually present on a server. What is this result called?",["False positive","True positive","False negative","True negative"],2,"A false negative is a real issue that the scanner did not detect."],[4,"A penetration tester is given no prior information about the target network or applications. Which test type is this?",["Known environment","Partially known environment","Unknown environment","Purple team exercise"],2,"Unknown environment (black box) testing starts with no knowledge of the target, simulating an external attacker."],[4,"Which factor MOST strongly justifies patching a vulnerability ahead of others with the same CVSS score?",["It is being actively exploited in the wild on internet-facing systems","It was published last month","It affects a system scheduled for a refresh next year","Its vendor name is well known"],0,"Active exploitation and exposure raise real-world risk and should drive prioritization beyond the base score."],[4,"Malware has been removed from all affected hosts. According to the standard incident response process, what is the NEXT phase?",["Containment","Recovery","Preparation","Detection"],1,"After eradication comes recovery, restoring systems to normal operation, followed by lessons learned."],[4,"A forensic examiner creates a bit-for-bit image of a suspect drive. What BEST proves the image is identical to the original?",["Compare the file names on both copies","Take a screenshot of the copy process","Compute and compare cryptographic hashes of the original and the image","Compress the image before storage"],2,"Matching hash values demonstrate that the image was not altered, supporting its admissibility."],[4,"A SOC analyst team is overwhelmed by SIEM alerts, most of which are benign. Which action BEST addresses this?",["Disable the SIEM","Tune alert rules and thresholds based on analysis of false positives","Delete older logs","Raise all alerts to critical severity"],1,"Tuning rules reduces noise and alert fatigue while keeping coverage of real threats."],[4,"Which email authentication record lists the servers that are authorized to send mail for a domain?",["SPF","DMARC alignment report","S/MIME certificate","MX"],0,"SPF publishes authorized sending hosts. DMARC then uses SPF and DKIM results to set policy."],[4,"An administrator needs to enforce the same password and lockout settings on thousands of domain-joined computers. Which tool is MOST appropriate?",["Group Policy","Packet sniffer","Honeypot","Hardware security module"],0,"Group Policy centrally pushes configuration and security settings to domain-joined systems."],[4,"A company allows personal phones for email and wants to keep corporate data separate from personal data and wipe only the corporate portion. Which solution BEST meets this?",["Rooting the device","Containerization or a managed work profile","Disabling the device camera","Using USB tethering"],1,"Containerization isolates corporate apps and data so they can be managed or wiped without touching personal content."],[4,"Scripts running on application servers contain hard-coded database passwords. Which remediation is BEST?",["Base64-encode the passwords in the scripts","Use a secrets manager that issues credentials at runtime and rotates them","Store the passwords in a shared spreadsheet","Email the passwords to the development team"],1,"A secrets manager removes static credentials from code and supports rotation. Base64 is an encoding, not protection."],[4,"What is the PRIMARY risk of deploying single sign-on without additional safeguards?",["Users must remember many passwords","Compromise of one credential can grant access to many connected applications","Applications can no longer use TLS","Logs can no longer be collected"],1,"SSO concentrates access behind one identity, so strong protections such as MFA are required. It reduces, not increases, the number of passwords."],[4,"Users in a Kerberos realm suddenly cannot authenticate, and logs show ticket validation failures on one client. What is the MOST likely cause?",["The client's clock is out of sync with the KDC","The client lacks a TPM","The client's DNS server is on IPv6","The client uses a different keyboard layout"],0,"Kerberos is time-sensitive and rejects tickets when clock skew exceeds the allowed tolerance, typically five minutes. NTP synchronization resolves it."],[4,"Which TWO actions should be included when deprovisioning a departing contractor?",["Disable the contractor's accounts and revoke tokens","Reset the project manager's password","Recover issued laptops and badges","Share the contractor's login with the replacement","Extend access for 30 days as a courtesy"],[0,2],"Deprovisioning removes logical access and returns physical assets. Sharing credentials or extending access leaves risk in place."],[4,"Stolen credentials were used against the VPN and cloud apps. Which TWO log sources would BEST show where the credentials were used?",["Identity provider sign-in logs","Printer spooler logs","VPN concentrator authentication logs","HVAC controller logs","Backup job logs"],[0,2],"Identity provider and VPN authentication logs record source addresses, times and results of sign-ins. The other logs are unrelated to credential use."],[4,"Which TWO practices are BEST for protecting administrator accounts?",["Use separate admin accounts distinct from daily-use accounts","Share one admin account among the team","Require MFA for all administrative sign-ins","Exclude admin actions from logging","Grant permanent standing privileges"],[0,2],"Separate accounts limit exposure of privileged credentials and MFA protects them. Sharing, no logging and standing privileges all weaken accountability and increase risk."],[4,"A security team proactively searches network and endpoint data for signs of intruders, assuming a breach may already have occurred. What is this activity?",["Vulnerability scanning","Threat hunting","Penetration testing","Patch management"],1,"Threat hunting is a hypothesis-driven search for undetected threats rather than a response to an alert."],[5,"A risk assessment rates each risk as high, medium or low based on expert judgment, without monetary values. Which approach is this?",["Quantitative analysis","Qualitative analysis","Annualized loss expectancy","Monte Carlo simulation"],1,"Qualitative analysis uses relative ratings, while quantitative analysis assigns numeric financial values."],[5,"Which metric would give leadership an early warning that risk exposure is rising, such as the number of critical systems missing patches?",["Key risk indicator","Recovery point objective","Mean time between failures","Service level agreement"],0,"Key risk indicators track conditions that signal increasing risk before incidents occur."],[5,"Under the GDPR, within what period must a controller generally notify the supervisory authority after becoming aware of a personal data breach?",["24 hours","72 hours","30 days","90 days"],1,"GDPR Article 33 requires notification without undue delay and, where feasible, within 72 hours."],[5,"Who is ultimately responsible for deciding how a data set is classified and for approving who may access it?",["Data custodian","Data owner","Data processor","System administrator"],1,"The data owner is accountable for classification and access decisions, while the custodian implements the technical controls."],[5,"HR often notifies IT of terminations days late, leaving accounts active. Which change BEST fixes the root cause?",["Ask managers to send reminders","Automate the offboarding workflow from the HR system with a defined time requirement","Lock all accounts every weekend","Increase password length"],1,"Integrating HR events with account disablement removes the manual delay and enforces a defined timeline."],[5,"Which document should be signed to protect confidential information shared with a vendor during evaluation, before any contract is awarded?",["Nondisclosure agreement","Service level agreement","Statement of work","Business impact analysis"],0,"An NDA legally obligates the recipient to protect shared confidential information."],[5,"Which practice BEST gives an organization ongoing visibility into the changing security posture of its third-party vendors?",["A one-time questionnaire at onboarding","Continuous monitoring such as external security ratings and periodic reassessment","Reviewing the vendor's marketing materials","Signing a longer contract"],1,"Vendor risk changes over time, so ongoing monitoring is needed beyond onboarding checks."],[5,"Which type of audit is performed by an independent third party, often to support certification or regulatory requirements?",["Internal audit","External audit","Self-assessment","Peer code review"],1,"External audits are conducted by independent parties and provide stronger assurance than internal reviews."],[5,"Which measure BEST increases the number of phishing emails that employees report to the security team?",["Adding a one-click report phishing button to the mail client","Publishing a policy that bans personal email","Blocking all external attachments","Annual training only"],0,"Reducing friction for reporting increases participation and gives the SOC faster detection data."],[5,"Which exercise gathers key staff to talk through a disaster scenario step by step without affecting any production systems?",["Failover test","Parallel processing test","Tabletop exercise","Full interruption test"],2,"A tabletop exercise is discussion-based and low-risk, used to validate plans and roles."],[5,"Which metric describes the average time that elapses between failures of a repairable system?",["MTTR","RTO","MTBF","RPO"],2,"Mean time between failures measures reliability. MTTR measures how long repair takes."],[5,"A privacy team decides to collect only the customer attributes strictly needed to complete a purchase. Which privacy principle is being applied?",["Data minimization","Data sovereignty","Tokenization","Data masking"],0,"Data minimization limits collection and retention to what is necessary for a stated purpose."],[5,"A retailer that stores and processes cardholder data must follow which industry standard?",["HIPAA","PCI DSS","SOX","FERPA"],1,"PCI DSS is the payment card industry standard for protecting cardholder data."],[5,"Which governance document provides the detailed, step-by-step instructions that staff follow to provision a new user account?",["Policy","Standard","Procedure","Guideline"],2,"Procedures define the specific steps for a task, while policies state high-level intent."],[5,"During a breach affecting customers, who should speak to the media?",["Any employee who is asked","The designated spokesperson named in the incident communication plan","The technician who found the breach","The attacker's contact"],1,"A single authorized spokesperson keeps messaging consistent and avoids disclosing unapproved details."],[5,"Which TWO elements are typically found in a service level agreement?",["Uptime or availability targets","Employee performance reviews","Penalties or remedies for missed targets","Source code of the service","Vendor's private encryption keys"],[0,2],"SLAs define measurable service targets and consequences for failing to meet them."],[5,"Which TWO activities are part of a user access review?",["Comparing current permissions to each person's job role","Rotating TLS certificates","Having managers recertify or revoke access","Applying operating system patches","Rebuilding the SIEM index"],[0,2],"Access reviews validate that permissions match current duties and remove those no longer required."],[5,"A publicly traded company must show effective internal controls over financial reporting. Which law requires this?",["GDPR","HIPAA","SOX","COPPA"],2,"The Sarbanes-Oxley Act requires internal controls over financial reporting for public companies."]],[[1,"An organization publishes an acceptable use policy and performs annual risk assessments. Which control category do these activities represent?",["Operational","Physical","Technical","Managerial"],3,"Policies and risk assessments are administrative, governance-level controls, which are managerial. Technical controls are implemented through systems and software."],[1,"A file integrity monitoring tool alerts when critical system binaries are altered. Which element of the CIA triad does this MOST directly support?",["Confidentiality","Availability","Anonymity","Integrity"],3,"File integrity monitoring detects unauthorized modification of data, which is the integrity property."],[1,"Firewall logs show which administrator changed a rule, from which workstation and at what time. Which part of AAA does this provide?",["Accounting","Authentication","Authorization","Accessibility"],0,"Accounting tracks and records user activity for later review and auditing. Authentication proves identity and authorization grants permissions."],[1,"Before approving a firewall change, a change board asks the requester to identify which applications and users could be affected if the change fails. Which change management activity is this?",["Writing a standard operating procedure","Backout planning","Impact analysis","Scheduling a maintenance window"],2,"Impact analysis assesses what the change could affect. A backout plan describes how to reverse the change."],[1,"Which of the following is a symmetric encryption algorithm suitable for encrypting large volumes of data?",["ECC","RSA","AES","Diffie-Hellman"],2,"AES uses a single shared key and is efficient for bulk data. RSA and ECC are asymmetric and Diffie-Hellman is a key exchange method."],[1,"A laptop must store disk encryption keys in a tamper-resistant chip on the motherboard that can also verify boot integrity. Which component provides this?",["Smart card","HSM appliance in the data center","USB security token","TPM"],3,"A Trusted Platform Module is a motherboard-bound chip that stores keys and supports measured boot. An HSM is a separate network or PCIe appliance."],[1,"A security researcher finds that a malicious actor concealed stolen data inside the pixels of a family photo posted online. Which technique was used?",["Salting","Obfuscation by hashing","Tokenization","Steganography"],3,"Steganography hides data inside another file such as an image. Tokenization substitutes values and salting protects hashes."],[1,"Two different input files produce the same hash value. Which term describes this condition?",["Digital signature","Key stretching","Salting","Collision"],3,"A hash collision occurs when different inputs yield the same digest, which weakens the algorithm's integrity guarantees."],[1,"A company installs concrete bollards in front of its data center entrance to stop vehicles. Which category and type BEST describe this control?",["Managerial and deterrent","Physical and preventive","Technical and detective","Operational and corrective"],1,"Bollards are a physical barrier that stops a vehicle ramming attack before it occurs, which makes them preventive."],[1,"A web server administrator needs to obtain a certificate from a certificate authority. What must the administrator generate and submit that contains the server's public key and identity information?",["Certificate signing request","OCSP response","Private key file","Certificate revocation list"],0,"A CSR contains the public key and subject details and is sent to the CA for signing. The private key must never be shared."],[1,"Which TWO of the following are examples of detective controls? (Choose two.)",["An intrusion detection system","A firewall deny rule","A mantrap at the server room door","Nightly data backups","Reviewing server logs for anomalies"],[0,4],"Log review and an IDS identify events after or as they occur. A mantrap and a deny rule are preventive, and backups support recovery."],[2,"An account logs in from Mumbai at 09:00 and from Frankfurt at 09:20 the same day. Which indicator of compromise is MOST likely being observed?",["Blocked content","Impossible travel","Resource inaccessibility","Out-of-cycle logging"],1,"Logins from locations that cannot be reached in the elapsed time suggest the credentials are being used by someone else."],[2,"Dozens of user accounts become locked out within a few minutes, each after several failed logons originating from one external IP address. What is the MOST likely cause?",["A DNS cache poisoning attack","A scheduled password expiration policy","A ransomware infection","A brute-force or password-guessing attack"],3,"Many failed logons across accounts that trigger lockout thresholds are a classic sign of automated guessing attempts."],[2,"The identity provider shows one user's account has active sessions on two devices in different cities at the same time, but the user owns only one laptop. Which indicator does this represent?",["Concurrent session usage","Out-of-cycle logging","Resource consumption","Missing logs"],0,"Simultaneous sessions from unexpected locations suggest stolen credentials or a hijacked session token."],[2,"After an administrator account logs in at 2 AM, an analyst finds that the audit service on the server was stopped and no log entries exist for the next three hours. What is the MOST likely explanation?",["A firewall rule update","An attacker disabled logging to hide their activity","Normal log rotation","A scheduled backup job"],1,"A gap in logs that follows a privileged logon, with the logging service stopped, is a strong sign of anti-forensic activity."],[2,"A file server's CPU is at 100 percent overnight and it maintains outbound connections to an unknown pool address on a known mining port. Which threat is MOST likely?",["Ransomware","Spyware keylogging","Logic bomb","Cryptojacking"],3,"Sustained high resource consumption plus mining-pool traffic indicates unauthorized cryptocurrency mining."],[2,"Antivirus reports a host as clean, and its process list looks normal, but network captures show regular beaconing to an external server. Kernel-level components appear to be hiding the process. Which malware type is MOST likely?",["Macro virus","Adware","Worm","Rootkit"],3,"A rootkit modifies the operating system to conceal processes, files and connections from normal tools."],[2,"A technician finds a small device connected between a keyboard cable and the USB port of an executive's PC. What is the device MOST likely to be?",["A wireless access point","A hardware keylogger","An RFID cloner","A card skimmer"],1,"An inline device between keyboard and computer records keystrokes, including passwords."],[2,"An accounts payable clerk receives an email that appears to be from the CEO, urgently requesting a wire transfer to a new vendor. The email domain is a close lookalike of the company's. Which attack is this?",["Watering hole attack","Business email compromise","Smishing","Vishing"],1,"BEC impersonates executives or vendors over email to trick staff into sending payments or sensitive data."],[2,"Which TWO controls BEST mitigate SQL injection against a web application? (Choose two.)",["Salting stored passwords","Parameterized queries","Longer session timeouts","Disabling application logging","Server-side input validation"],[1,4],"Parameterized queries and input validation prevent user input from being interpreted as SQL. The other options do not address injection."],[2,"Attackers exploit a flaw in a widely used application for which the vendor has no patch and was previously unaware. What is this called?",["A race condition","An end-of-life weakness","A zero-day vulnerability","A misconfiguration"],2,"A zero-day is a flaw unknown to the vendor, so no fix exists when it is first exploited."],[2,"An attacker with access to one guest virtual machine manages to run code on the underlying hypervisor and reach other tenants' VMs. Which attack is this?",["VM escape","VM sprawl","Session hijacking","Container image poisoning"],0,"VM escape breaks isolation between a guest and the host or other guests."],[2,"A trusted software vendor's build server is compromised, and customers receive a signed update that contains a backdoor. Which attack type is this?",["Supply chain attack","Phishing campaign","Zero-day exploit against the customers' firewalls","Brute-force attack"],0,"The attacker abused a trusted upstream supplier to deliver malicious code to downstream customers."],[2,"A teenager runs a freely available hacking toolkit they do not fully understand against a local retailer's site, just to show off online. Which actor type is this?",["Malicious insider","Nation-state","Unskilled attacker","Organized crime"],2,"Unskilled attackers use existing tools without deep understanding, usually for recognition rather than profit."],[2,"Which mitigation BEST prevents unapproved executables from running on a kiosk workstation?",["Full-disk encryption","Application block listing","Disabling the guest account only","Application allow listing"],3,"Allow listing permits only approved applications, so unknown programs cannot run. A block list only stops known-bad items."],[2,"A web service account that only reads one database table is compromised. Which prior control would MOST reduce the damage?",["Wider network access for the service","A longer password expiration period","Least privilege on the service account","Shared credentials across services"],2,"Limiting permissions to what the account requires restricts what an attacker can do with it."],[2,"A public web server has thousands of half-open TCP connections in the SYN_RECV state and legitimate users cannot connect. Which attack is occurring?",["DNS amplification","Session replay","SYN flood","ARP poisoning"],2,"A SYN flood exhausts the connection table with incomplete handshakes, causing denial of service."],[2,"During an investigation, an analyst finds that an intruder logged in by retransmitting a previously sniffed login exchange, never learning the password. Which control BEST defeats this attack?",["Larger disk quotas","Nonces or timestamps in the authentication exchange","Longer passwords","A web application firewall rule for XSS"],1,"A replay attack depends on reusing a captured message. Unique nonces or timestamps make old messages invalid."],[2,"Visitors at an airport connect to a Wi-Fi network named the same as the corporate guest SSID, but it is run from an attacker's laptop with a stronger signal. Which attack is this?",["Evil twin","Jamming","Bluejacking","War driving"],0,"An evil twin is a rogue access point that impersonates a legitimate network to intercept traffic."],[2,"Attackers use username and password pairs leaked in an unrelated breach to try logging into a company's customer portal. Which attack is this?",["Password spraying with common words","Rainbow table attack","Credential stuffing","Pass the hash"],2,"Credential stuffing reuses real leaked credentials on other services, relying on password reuse."],[2,"Several USB drives labeled 'Payroll 2026' are left in a company parking lot. Which social engineering technique does this represent?",["Baiting","Typosquatting","Pretexting","Tailgating"],0,"Baiting lures victims with an enticing physical item so they plug it in and run malicious content."],[3,"Which network location BEST limits an internal breach after a compromise of an internet-facing mail relay and web front end?",["Inside the database server segment","Directly on the internet with no firewall","In a screened subnet","On the internal user VLAN"],2,"A screened subnet (DMZ) isolates exposed servers between two firewalls, limiting lateral movement into the internal network."],[3,"A company needs two web servers to share traffic and keep the application available if one server fails. Which device BEST provides this?",["Honeypot","Web proxy","Network tap","Load balancer"],3,"A load balancer distributes requests across servers and removes failed nodes from rotation, supporting availability."],[3,"A switch must authenticate any device that plugs into a wall port before granting network access. Which standard provides this?",["IEEE 802.1X","IEEE 802.11n","IEEE 802.1Q","IEEE 802.3af"],0,"802.1X provides port-based network access control using an authenticator and an authentication server. 802.1Q is VLAN tagging."],[3,"An IDS is connected to a switch SPAN port and receives copies of traffic. What is a limitation of this deployment?",["It cannot block malicious traffic in real time","It cannot see any network traffic","It becomes a single point of failure for traffic flow","It adds latency to every packet"],0,"A passive, out-of-band sensor only observes copies of traffic, so blocking requires an inline IPS."],[3,"Which device sits in front of several web servers, terminates client connections and hides the servers' addresses from the internet?",["Reverse proxy","Network tap","Forward proxy","Jump server"],0,"A reverse proxy represents the servers to clients. A forward proxy represents clients to the internet."],[3,"A company wants all remote employee traffic, including web browsing, to pass through corporate inspection tools. Which VPN configuration should it use?",["Full tunnel","Split tunnel","No VPN with direct cloud access","Clientless split tunnel with local internet breakout"],0,"A full tunnel sends all traffic through the corporate network, allowing consistent inspection. Split tunnel sends only corporate traffic."],[3,"A company wants to protect database files if the storage disks are stolen, without changing the application. Which control BEST meets this?",["Data masking in reports","Transparent data encryption","Field-level tokenization in the application","Hashing the database files"],1,"TDE encrypts database files at rest and is transparent to applications. Hashing is one-way and cannot protect usable data."],[3,"Which TWO RAID levels provide fault tolerance against a single disk failure? (Choose two.)",["RAID 1","RAID 0","RAID 5","A VM snapshot","A full weekly backup"],[0,2],"RAID 1 mirrors and RAID 5 uses parity, so each survives one failed disk. RAID 0 stripes without redundancy."],[3,"A recovery site has power, networking and compatible hardware, but data must be restored from backups, taking one to several days. Which site type is this?",["Mirror site","Warm site","Hot site","Cold site"],1,"A warm site has equipment ready but lacks current data. A cold site has little more than space and power."],[3,"Ransomware encrypted a production server and also the network-attached backup share. Which design change would BEST protect backups in the future?",["Immutable or offline backup copies","More frequent incremental backups to the same share","Longer backup retention on the same share","Compressing the backup files"],0,"Immutable or offline backups cannot be modified or encrypted by malware that reaches the production network."],[3,"A company runs its redundant firewall pair on products from two different vendors so that a single flaw does not affect both. Which concept is this?",["Platform diversity","Geographic dispersion","Multi-cloud load shedding","Capacity planning"],0,"Platform diversity uses different technologies so a common vulnerability is unlikely to take out all systems."],[3,"An electronic door lock on a building exit must release automatically if power is lost so people can evacuate. Which failure mode is this?",["Fail-closed","Fail-open","Fail-secure","Fail-over"],1,"Fail-open (fail-safe) favors human safety by unlocking on failure. Fail-closed or fail-secure keeps the door locked."],[3,"Before deploying new access points, a network team measures signal strength and interference across the floor to decide where to mount them. What is this activity called?",["Penetration test","Site survey","Packet capture","Vulnerability scan"],1,"A site survey, often presented as a heat map, determines optimal access point placement and coverage."],[3,"Which protocol should replace FTP to transfer files with encryption over a single port?",["TFTP","SNMPv2","SFTP","Telnet"],2,"SFTP runs over SSH and encrypts credentials and data. TFTP has no encryption and Telnet is a remote shell."],[3,"Which email control signs outgoing messages with a private key so receivers can validate them using a DNS-published selector record?",["SPF","SMTP over port 25","MX records","DKIM"],3,"DKIM signs message headers with a private key and publishes the public key in DNS. SPF lists authorized sending servers."],[3,"Which feature ensures that a computer only loads a bootloader and operating system kernel signed by a trusted authority?",["UEFI Secure Boot","Disk defragmentation","Wake-on-LAN","BIOS password"],0,"Secure Boot verifies digital signatures of boot components to prevent boot-level malware."],[4,"A SOC analyst confirms ransomware is spreading from a file server. Using the standard incident response lifecycle, what phase comes immediately after analysis?",["Recovery","Lessons learned","Preparation","Containment"],3,"After detection and analysis, the team limits the spread of the incident through containment before eradication and recovery."],[4,"A document with step-by-step actions for handling a specific incident type, such as phishing or malware outbreaks, is called a:",["Business impact analysis","Playbook","Service level agreement","Acceptable use policy"],1,"A playbook gives responders defined steps for a particular scenario, making response consistent and repeatable."],[4,"Executives and IT leaders sit in a conference room and talk through how they would respond to a ransomware scenario, without touching any systems. Which exercise is this?",["Tabletop exercise","Live simulation","Penetration test","Failover test"],0,"A tabletop is a discussion-based walkthrough. A simulation involves performing actions in a realistic environment."],[4,"A red team injects malware into an isolated lab network, and the blue team must detect, contain and eradicate it using real tools. Which exercise is this?",["Walkthrough review","Policy attestation","Tabletop exercise","Simulation"],3,"Simulations exercise real tools and technical response under realistic conditions, unlike discussion-only tabletops."],[4,"After a breach, the team wants to identify the underlying reason a vulnerable server was exposed so the same failure does not recur. Which activity is this?",["Chain of custody tracking","Threat hunting","Containment","Root cause analysis"],3,"Root cause analysis finds the fundamental reason an incident occurred, supporting lessons learned and prevention."],[4,"A team begins searching its network for signs of an attacker using the hypothesis that a known threat actor may already be present, even though no alerts have fired. Which activity is this?",["Log rotation","Threat hunting","Incident eradication","Vulnerability scanning"],1,"Threat hunting is proactive, hypothesis-driven searching for undetected threats."],[4,"Legal counsel notifies IT that litigation is expected and instructs that all relevant email and documents be retained. Which term describes this requirement?",["Data sanitization","Retention exemption by classification","Legal hold","Chain of custody"],2,"A legal hold requires preservation of potentially relevant data and suspends normal deletion."],[4,"An investigator creates a bit-for-bit image of a seized drive. What is the BEST way to demonstrate the copy is identical to the original?",["Compare the file names and sizes","Compress the image and record the size","Encrypt the image with AES","Hash both the original and the image and compare the values"],3,"Matching cryptographic hashes demonstrate integrity. Names and sizes can match even when content differs."],[4,"A cloud virtual machine is suspected of being compromised. Which action BEST preserves evidence for investigation?",["Run a full antivirus cleanup on the live system","Delete the VM and rebuild it","Reboot the VM to clear the malware","Take a snapshot of the disk and capture memory before shutting down"],3,"Snapshots and memory capture preserve volatile and persistent state. Rebooting or cleaning destroys evidence."],[4,"Which term describes identifying, collecting and producing electronically stored information in response to a legal request?",["Data masking","E-discovery","Attestation","Key escrow"],1,"E-discovery covers the legal process of finding and delivering electronic evidence."],[4,"A firewall log shows: DENY TCP 203.0.113.50:44211 -> 10.0.5.12:3389, repeated against many 10.0.5.x addresses within minutes. What does this MOST likely indicate?",["A normal internal file transfer","A DNS zone transfer","A successful RDP session","An external host scanning for exposed RDP services"],3,"One external source hitting port 3389 across many addresses and being denied is typical reconnaissance for RDP."],[4,"Windows security log: 50 events of ID 4625 (logon failure) for user 'admin' from 198.51.100.7, followed by ID 4624 (successful logon) for 'admin' from the same address via RDP. What is the MOST likely conclusion?",["A scheduled task ran under the account","The user forgot a password and then recalled it","Normal service account behavior","A brute-force attempt succeeded and the account is likely compromised"],3,"Many failures followed by success from the same source indicates a guessing attack that worked."],[4,"A web server log contains: GET /ping?host=8.8.8.8;cat%20/etc/passwd HTTP/1.1. Which attack is being attempted?",["Directory traversal","Command injection","Cross-site scripting","Cross-site request forgery"],1,"The semicolon appends an operating system command to the parameter, which is command injection."],[4,"An analyst wants to identify top talkers and long-lived connections between hosts without storing the full content of every packet. Which data source is BEST?",["Application logs","DNS zone files","NetFlow","Full packet capture"],2,"NetFlow records summarize conversations, such as addresses, ports and byte counts, without payloads."],[4,"An investigator wants to know who authored a document, when it was created and which software produced it. Which data should be examined?",["File metadata","Page file contents","Firewall logs","Registry hives only"],0,"Metadata embedded in files includes author, timestamps and application details."],[4,"A SOC is flooded with high-severity alerts triggered by the company's own authorized vulnerability scanner. What is the BEST way to reduce the noise?",["Stop running vulnerability scans","Tune the rules to exclude the scanner's known source addresses","Disable the IDS signatures entirely","Raise the severity of all alerts"],1,"Tuning excludes known-benign activity while keeping detection active. Disabling signatures creates blind spots."],[4,"An IDS did not generate an alert even though a real attack occurred. Which term describes this event?",["False negative","True negative","False positive","True positive"],0,"A false negative is a missed detection of malicious activity."],[4,"Log entries from servers in several time zones cannot be correlated during an investigation. Which control would have BEST prevented this?",["Increasing log retention","Compressing logs","Synchronizing all systems with NTP","Encrypting log files"],2,"Consistent, accurate timestamps are required to build a timeline across systems, and NTP provides that."],[4,"An EDR alert shows: Parent: winword.exe -> Child: powershell.exe -enc JABz... What is the MOST likely cause?",["A malicious document macro launching an encoded script","An operating system update","A normal Word spell-check process","A scheduled antivirus scan"],0,"Word spawning an encoded PowerShell command is a common sign of a weaponized document."],[4,"Which TWO factors should be weighed MOST heavily when prioritizing vulnerability remediation? (Choose two.)",["Whether the flaw is being actively exploited","The age of the scanner software","The criticality of the affected asset","The number of scan reports generated","The vendor's marketing reputation"],[0,2],"Active exploitation and asset criticality drive real-world risk. The other options do not affect risk."],[4,"Administrators check out privileged credentials from a secure vault, and the passwords are automatically rotated after use. Which solution is this?",["Single sign-on","Password hashing","Federation","Privileged access management"],3,"PAM vaults privileged credentials and controls, rotates and logs their use."],[4,"Which TWO actions are part of the containment phase? (Choose two.)",["Rebuilding the server from a clean image","Isolating the infected host from the network","Restoring data from backups","Holding a lessons-learned meeting","Blocking the attacker's IP address at the firewall"],[1,4],"Isolation and blocking limit spread. Restoring and rebuilding belong to recovery and eradication, and the review comes last."],[4,"An ACL contains, in order: 1) permit any to any, 2) deny 203.0.113.0/24 to any. Why does traffic from 203.0.113.0/24 still get through?",["The first matching rule is applied, and the permit rule matches before the deny","The deny rule needs a logging flag","Firewalls ignore deny rules for external networks","ACLs only evaluate the last rule"],0,"ACLs are processed top down and stop at the first match, so specific denies must precede broad permits."],[4,"A company wants early warning if its employees' credentials appear for sale after a breach at another site. Which source BEST provides this?",["Internal vulnerability scans","Network access control logs","Host firewall rules","Dark web monitoring"],3,"Dark web monitoring looks for leaked credentials and data in criminal marketplaces."],[4,"Linux auth.log: 'Accepted password for root from 192.0.2.9' followed by 'useradd: new user: name=svc_backup2, UID=0'. What does this MOST likely indicate?",["A failed login attempt","An attacker logged in as root and created a backdoor account for persistence","A normal backup job setup","A password expiry notice"],1,"A new account with UID 0 created right after a remote root logon is a classic persistence technique."],[5,"A single loss event costs $20,000 and is expected to occur once every four years. What is the annualized loss expectancy?",["$10,000","$5,000","$80,000","$20,000"],1,"ALE = SLE x ARO = $20,000 x 0.25 = $5,000."],[5,"The annual cost of a control is $50,000, while the expected annual loss it prevents is $10,000. Management signs a formal statement acknowledging the risk and declines the control. Which risk response is this?",["Avoidance","Acceptance","Transference","Mitigation"],1,"When the cost of a control exceeds the risk, management may knowingly accept the risk and document it."],[5,"A metric that signals increasing risk exposure, such as the count of critical unpatched systems, is called a:",["Key risk indicator","Key performance indicator","Recovery time objective","Service level agreement"],0,"A KRI warns that risk is rising. A KPI measures performance against goals."],[5,"A risk assessment rates each risk as low, medium or high using a heat map based on opinion and experience. Which type of analysis is this?",["Quantitative","Statistical","Forensic","Qualitative"],3,"Qualitative analysis uses subjective rankings rather than monetary or numeric values."],[5,"Which metric represents the average time required to repair a failed system and return it to service?",["MTBF","MTTR","SLE","RPO"],1,"Mean time to repair measures repair duration. MTBF measures the average time between failures."],[5,"Under GDPR, within what timeframe must a controller generally notify the supervisory authority after becoming aware of a personal data breach?",["30 days","72 hours","7 days","24 hours"],1,"GDPR requires notification without undue delay and, where feasible, within 72 hours."],[5,"Two organizations want a non-binding document that outlines mutual intentions and general responsibilities for a security collaboration. Which document is MOST appropriate?",["Statement of work","Memorandum of understanding","Business partners agreement with penalties","Service level agreement"],1,"An MOU expresses intent without being legally binding, unlike an SLA or contract."],[5,"A regulator requires an independent party to evaluate the company's compliance. Which type of audit is this?",["Internal audit","Self-assessment","External audit","Peer review"],2,"External audits are performed by independent third parties and are often required for regulators and certification."],[5,"A document specifies mandatory minimum requirements, such as 14-character passwords on all corporate systems. Which type of governance document is this?",["Procedure","Standard","Charter","Guideline"],1,"Standards define specific mandatory requirements. Guidelines are recommendations and procedures are step-by-step instructions."],[5,"Who is ultimately accountable for deciding the classification level of a dataset?",["Data custodian","Help desk analyst","Data owner","Network administrator"],2,"The data owner is accountable for the data and its classification. Custodians implement the protections."],[5,"Which TWO are external considerations that affect an organization's compliance program? (Choose two.)",["The company's internal org chart","Contractual requirements such as PCI DSS","Local data protection laws","Number of employees in the break room","The internal ticketing tool"],[1,2],"Laws and contractual or industry requirements come from outside the organization. The others are internal factors."],[5,"During a breach, a reporter calls an employee asking for details. According to incident communication best practice, what should the employee do?",["Refer the inquiry to the designated spokesperson","Provide only technical details","Confirm the breach to avoid speculation","Post an update on social media"],0,"Only authorized spokespeople should communicate, to keep messages accurate and consistent."],[5,"A disaster recovery test restores systems at an alternate site while production continues to run at the primary site. Which test is this?",["Failover test that shuts down production","Walkthrough","Tabletop exercise","Parallel processing test"],3,"Parallel testing runs recovery systems alongside production without interrupting it."],[5,"A company pays outside researchers for responsibly reporting vulnerabilities in its applications. Which program is this?",["Bug bounty","Business impact analysis","Vulnerability scan","Red team engagement"],0,"A bug bounty rewards independent researchers for reporting valid vulnerabilities."],[5,"Which role is responsible for monitoring an organization's compliance with privacy regulations such as GDPR and advising on data protection?",["Data processor","Data protection officer","Change manager","Security guard"],1,"The DPO oversees privacy compliance. A processor handles data on behalf of the controller."],[5,"Before signing a contract with a new cloud provider, the company reviews the provider's security certifications, financial stability and breach history. Which activity is this?",["Penetration testing","Incident response","Due diligence","Due care"],2,"Due diligence is the investigation performed before entering a relationship. Due care is ongoing responsible action."],[5,"Email retention policy auto-deletes messages after one year, but legal counsel issues a litigation notice covering this year's email. What should happen?",["Delete the email as normal to follow policy","Move the email to unsecured storage","Suspend automatic deletion for the relevant email","Wait until the next audit"],2,"A legal hold overrides the retention schedule so potentially relevant data is preserved."],[5,"Which plan focuses on keeping critical business processes running during a disruption, including manual workarounds, rather than only restoring IT systems?",["Incident response plan","Disaster recovery plan","Change management plan","Business continuity plan"],3,"A BCP covers continuity of the whole business. A DRP focuses on restoring IT infrastructure."]],[[1,"A new document states that all company laptops must use AES-256 full-disk encryption. Which type of governance document is this?",["Policy","Standard","Procedure","Guideline"],1,"A standard defines specific, mandatory technical requirements. A policy states high-level intent, and a procedure gives step-by-step instructions."],[1,"The security team publishes a document suggesting, but not requiring, that staff use a password manager. Which document type is this?",["Policy","Standard","Procedure","Guideline"],3,"Guidelines are optional recommendations. Policies, standards and procedures are mandatory."],[1,"Which of the following is an example of a managerial control?",["Annual risk assessment","Host-based firewall rule","Security guard at the lobby","Biometric door lock"],0,"Managerial controls address risk through planning, assessment and oversight. The others are technical or physical controls."],[1,"A file integrity tool compares hashes of critical configuration files each night to detect unauthorized changes. Which element of the CIA triad is being protected?",["Confidentiality","Integrity","Availability","Non-repudiation"],1,"Detecting unauthorized modification of data protects integrity. Non-repudiation is not part of the CIA triad."],[1,"A RADIUS server records the time each user logged in and which network resources they used. Which AAA function does this describe?",["Authentication","Authorization","Accounting","Assurance"],2,"Accounting tracks user activity and resource usage. Authentication verifies identity and authorization determines permitted access."],[1,"A company requires that the employee who creates a new vendor record cannot also approve payments to that vendor. Which principle is being applied?",["Least privilege","Job rotation","Separation of duties","Mandatory vacation"],2,"Separation of duties splits a sensitive process among multiple people to prevent fraud. Least privilege limits rights but does not split a process."],[1,"Which TWO of the following are technical security controls?",["Host-based firewall","Security awareness training","Encryption of data at rest","Pre-employment background checks","Visitor sign-in policy"],[0,2],"Firewalls and encryption are implemented in technology. Training, background checks and policies are managerial or operational controls."],[1,"A change request includes a section describing which systems, users and processes could be affected if the change goes wrong. What is this section called?",["Backout plan","Impact analysis","Maintenance window","Standard operating procedure"],1,"Impact analysis evaluates the effects of a change. A backout plan describes how to reverse it."],[1,"Within a PKI, which entity verifies the identity of a requester before the certificate authority issues a certificate?",["Registration authority","Online responder","Key escrow agent","Certificate revocation list"],0,"The registration authority validates requests on behalf of the CA. An OCSP responder only reports revocation status."],[1,"An organization decides that every access request is evaluated using the user's identity, device health and location instead of trusting anything on the internal network. Which concept is this?",["Defense in depth","Zero Trust","Security through obscurity","Least functionality"],1,"Zero Trust removes implicit trust based on network location and continuously verifies each request."],[1,"A consultant documents the organization's current security controls, compares them with a target framework and lists the missing items. Which activity is this?",["Penetration test","Gap analysis","Tabletop exercise","Business impact analysis"],1,"A gap analysis measures the difference between the current and desired state. A BIA assesses the effect of disruption on business functions."],[2,"A disgruntled employee emails a customer list to a competitor shortly before resigning. Which threat actor type does this BEST represent?",["Hacktivist","Insider threat","Nation-state","Organized crime"],1,"The person already has legitimate access and misuses it, which defines an insider threat."],[2,"An attacker with little technical skill downloads a ready-made exploit kit and runs it against random websites. Which threat actor is this?",["Unskilled attacker","Nation-state","Advanced persistent threat","Shadow IT"],0,"Unskilled attackers rely on tools built by others. An APT would be well funded and use custom tools."],[2,"The finance department receives an email that appears to come from the CEO, urgently requesting a wire transfer to a new bank account. Which attack is this?",["Watering hole","Typosquatting","Business email compromise","Vishing"],2,"Business email compromise impersonates an executive or trusted party to trick staff into transferring money."],[2,"A caller claims to be from the IT help desk and asks an employee to read aloud the six-digit code just sent to their phone. Which attack is this?",["Smishing","Vishing","Whaling","Pharming"],1,"Voice-based social engineering is vishing. The code is a one-time MFA value that the attacker wants to reuse."],[2,"An attacker poses as an external auditor and invents a believable story to obtain a list of system administrators. Which social engineering technique is this?",["Pretexting","Tailgating","Shoulder surfing","Dumpster diving"],0,"Pretexting uses a fabricated scenario to gain information or access."],[2,"Attackers exploit a vulnerability for which the vendor has not yet released a patch. What is this called?",["Legacy vulnerability","Zero-day","Misconfiguration","Race condition"],1,"A zero-day is a flaw unknown to or unpatched by the vendor at the time of exploitation."],[2,"A trusted vendor's signed software update installs a backdoor on thousands of customer systems. Which attack category is this?",["Supply chain attack","Brute force","On-path attack","Replay attack"],0,"Compromising a trusted supplier to reach downstream customers is a supply chain attack."],[2,"Which TWO of the following are indicators of a compromised user account?",["A login from a distant country minutes after a local login","A scheduled patch window starting","Large outbound data transfers at 3 AM from the user's workstation","A routine backup completing successfully","The user changing their desk phone speed-dial"],[0,2],"Impossible travel and unusual off-hours data transfers are classic indicators of compromise. The other events are normal activity."],[2,"Malware modifies the operating system kernel to hide its processes and files from security tools. Which type of malware is this?",["Worm","Rootkit","Adware","Logic bomb"],1,"Rootkits conceal their presence by altering low-level OS components."],[2,"An attacker captures a valid authentication token from the network and later resubmits it to gain access. Which attack is this, and which control mitigates it?",["Replay; timestamps or nonces","Pass-the-hash; salting","Downgrade; longer keys","Smurf; egress filtering"],0,"Replaying captured data is mitigated by values that expire or are single-use, such as nonces and timestamps."],[2,"A process running in a guest virtual machine breaks out and gains control of the hypervisor. What is this attack called?",["VM escape","Buffer overflow","Cross-site request forgery","Sandbox fingerprinting"],0,"VM escape breaks the isolation between a guest and its host."],[2,"Which control BEST prevents unapproved executables from running on a set of kiosk computers?",["Application allow list","Host-based IDS","Full-disk encryption","Screen-lock timeout"],0,"An allow list permits only approved software to run. An IDS only detects, and encryption does not control execution."],[2,"An organization is experiencing credential stuffing using passwords leaked from other websites. Which control is MOST effective?",["Multifactor authentication","Longer password history","Hiding the login page URL","Disabling password hints"],0,"MFA means a stolen password alone is not enough, which defeats reuse of leaked credentials."],[2,"Analysts see a single workstation sending thousands of unusually long TXT record queries to one external domain. Which activity is MOST likely occurring?",["DNS tunneling","ARP poisoning","SYN flood","Domain hijacking"],0,"Encoding data in large DNS queries is a common covert exfiltration and command-and-control channel."],[2,"A stranger walks into a secured area directly behind an employee who has just badged in. Which attack is this?",["Pharming","Tailgating","Typosquatting","Credential stuffing"],1,"Following an authorized person through a door without presenting credentials is tailgating."],[2,"A database exposed to the internet is accessible with its factory-default administrator password. Which vulnerability type is this?",["Zero-day","Misconfiguration","Memory injection","Race condition"],1,"Leaving default credentials in place is an insecure configuration, not an unknown software flaw."],[2,"Two different files are found to produce the same hash value. Which term describes this?",["Salting","Collision","Key stretching","Obfuscation"],1,"A collision is when different inputs generate the same hash, which undermines integrity guarantees."],[2,"Malware spreads from host to host across a network on its own, without any user action. Which type is this?",["Trojan","Worm","Keylogger","Spyware"],1,"Worms self-replicate and propagate automatically. A trojan needs a user to run it."],[2,"Which TWO actions help reduce the risk of successful phishing?",["Email filtering with URL rewriting","Disabling mail server logging","Regular simulated phishing exercises","Enabling macros by default in documents","Removing DMARC records"],[0,2],"Technical filtering plus user training reduce phishing success. The other options weaken defenses."],[2,"Which control BEST ensures an organization can recover its data after a ransomware attack that encrypts network shares?",["Offline or immutable backups","Longer passwords","Screen savers with locks","Additional VLANs"],0,"Backups the attacker cannot reach or alter allow restoration without paying the ransom."],[3,"A device receives a copy of network traffic from a switch SPAN port and generates alerts without being able to block anything. What is this device?",["IPS","IDS","Next-generation firewall inline","Proxy server"],1,"A passive device on a mirrored port can only detect and alert, which is an IDS."],[3,"Which device distributes incoming requests across several servers and removes failed servers from rotation using health checks?",["Load balancer","Jump server","Honeypot","Network tap"],0,"Load balancers spread traffic and use health checks to maintain availability."],[3,"Where should public-facing web servers be placed so that a compromise does not give direct access to the internal network?",["Inside the internal LAN","In a screened subnet","On the management VLAN","Directly on the internet without a firewall"],1,"A screened subnet (DMZ) isolates exposed services between two filtering boundaries."],[3,"Which control BEST protects the data on a laptop if it is stolen?",["Full-disk encryption","File integrity monitoring","Data loss prevention agent","Application allow list"],0,"Full-disk encryption keeps data unreadable without the key when the drive is removed or the device is lost."],[3,"Two offices need a site-to-site tunnel that encrypts entire IP packets across the internet. Which protocol suite is MOST appropriate?",["IPsec","DNSSEC","S/MIME","SNMPv2"],0,"IPsec encrypts and authenticates IP traffic and is commonly used for site-to-site VPNs."],[3,"A company wants to block logins to its cloud application from countries where it has no employees. Which control is this?",["Geofencing","Tokenization","Obfuscation","Segmentation"],0,"Geofencing restricts access based on geographic location."],[3,"In a SaaS model, which of the following remains the customer's responsibility?",["Application code patches","Data classification and user access configuration","Physical data center security","Hypervisor maintenance"],1,"Customers always retain accountability for their data and how users are granted access."],[3,"Which technology shares the host operating system kernel while isolating applications in separate user spaces?",["Containers","Type 1 hypervisor virtual machines","Air-gapped hosts","Hardware security modules"],0,"Containers share the host kernel, making them lighter than full virtual machines."],[3,"Two servers are deployed so that one handles all traffic while the other waits idle and takes over if the first fails. Which design is this?",["Active-passive","Active-active","Load-sharing cluster","Hot aisle containment"],0,"Active-passive keeps a standby node that assumes the workload upon failure."],[3,"Which RAID level provides redundancy by writing identical data to two disks?",["RAID 0","RAID 1","RAID 5","RAID 6"],1,"RAID 1 mirrors data. RAID 0 stripes with no redundancy."],[3,"Which TWO changes replace insecure protocols with secure alternatives?",["Replace Telnet with SSH","Replace FTP with TFTP","Replace HTTP with HTTPS","Replace SNMPv3 with SNMPv1","Replace LDAPS with LDAP"],[0,2],"SSH and HTTPS add encryption. TFTP, SNMPv1 and plain LDAP are not more secure."],[3,"A switch is configured to accept only a specific MAC address on each access port. Which feature is this?",["Port security","Spanning tree","Link aggregation","Flood guard on the router"],0,"Port security limits which MAC addresses can use a switch port."],[3,"A data center needs to keep servers running for several hours during a prolonged utility outage. Which solution is required in addition to a UPS?",["Generator","Surge protector","Fire suppression","Redundant NIC"],0,"A UPS bridges short interruptions; a generator provides long-term power."],[3,"Which hardware component stores cryptographic keys and can attest to the integrity of the boot process on a single device?",["TPM","HSM","Smart card reader","Network tap"],0,"A Trusted Platform Module is a chip on the endpoint for key storage and measured boot. An HSM is a separate device serving many applications."],[3,"A certificate authority's private keys must be generated and stored in a dedicated tamper-resistant device. Which should be used?",["HSM","TPM","Secure enclave on a phone","USB flash drive"],0,"Hardware security modules are designed to protect high-value keys such as those of a CA."],[3,"Remote users send only traffic destined for corporate resources through the VPN, while other traffic goes directly to the internet. Which configuration is this?",["Split tunnel","Full tunnel","Site-to-site","Out-of-band"],0,"Split tunneling sends only selected traffic through the VPN, which reduces load but also reduces visibility."],[4,"A SOC is overwhelmed by alerts, most of which are benign. What is the BEST action?",["Disable the SIEM","Tune the detection rules and thresholds","Ignore low-severity alerts","Reduce log retention"],1,"Tuning reduces false positives while preserving detection. Disabling or ignoring sources creates blind spots."],[4,"Besides the CVSS base score, which factors BEST help prioritize remediation of vulnerabilities?",["Vendor logo and release date","Asset criticality and whether exploits are active","The scanner brand used","The alphabetical order of hosts"],1,"Business criticality and exploitability place the score in context."],[4,"Creating the incident response plan and training the response team occurs in which phase?",["Detection","Containment","Preparation","Recovery"],2,"Preparation covers plans, tools and training before an incident happens."],[4,"Legal counsel expects litigation and instructs IT to preserve all relevant email and documents. What is this instruction called?",["Legal hold","Data minimization","Chain of custody","Retention schedule"],0,"A legal hold suspends normal deletion so potentially relevant data is preserved."],[4,"Which practice BEST protects log integrity if an attacker compromises a server?",["Keep logs only on the local server","Forward logs to a separate central log server","Reduce log verbosity","Rotate logs weekly and delete old ones"],1,"Off-host logging means the attacker cannot easily alter or erase evidence."],[4,"How can a forensic analyst demonstrate that a copied disk image is identical to the original drive?",["Compare the hash values of the two","Compare their file names","Check the capacity only","Encrypt both with the same key"],0,"Matching cryptographic hashes show that the image is a bit-for-bit match."],[4,"An employee is terminated for cause. What should IT do FIRST?",["Delete the user's mailbox","Disable the user's accounts and revoke access","Archive the user's home directory","Reset the manager's password"],1,"Disabling access immediately limits risk. Deleting data would destroy potential evidence."],[4,"A manager reviews each quarter whether team members still need the access they hold. What is this process?",["Access recertification","Provisioning","Federation","Tokenization"],0,"Periodic access reviews confirm permissions remain appropriate and remove excess access."],[4,"Administrators check out shared privileged credentials from a vault, and their sessions are recorded. Which solution is this?",["Privileged access management","Single sign-on","Network access control","Data loss prevention"],0,"PAM vaults, rotates and audits privileged credentials and sessions."],[4,"A biometric system accepts an unauthorized person as legitimate. Which error rate does this affect?",["False rejection rate","False acceptance rate","Crossover error rate only","Failure to enroll rate"],1,"A false acceptance occurs when an impostor is incorrectly authenticated."],[4,"Which TWO activities belong to the eradication phase of incident response?",["Remove malware from affected hosts","Restore data from clean backups","Patch the exploited vulnerability","Issue a press release","Hold the lessons-learned meeting"],[0,2],"Eradication removes the cause and the weakness. Restoring is recovery and the meeting is lessons learned."],[4,"Which standard is used to automatically exchange structured cyber threat intelligence between organizations?",["TAXII","SAML","RADIUS","NTP"],0,"TAXII is the transport mechanism for sharing STIX-formatted threat intelligence."],[4,"Analysts form a hypothesis about attacker behavior and search the network for evidence that the existing alerts did not catch. What is this activity?",["Threat hunting","Vulnerability scanning","Patch management","Penetration testing"],0,"Threat hunting is proactive and hypothesis-driven, unlike reactive alert handling."],[4,"An exercise has attackers and defenders share their techniques and findings in real time to improve detection rules. Which team structure is this?",["Purple team","White team only","Red team only","Blue team only"],0,"Purple teaming combines offensive and defensive perspectives collaboratively."],[4,"Which DNS record defines which mail servers are authorized to send email for a domain?",["SPF","DMARC","MX","PTR"],0,"SPF lists authorized sending hosts. MX records identify servers that receive mail."],[4,"A company wants to block employees from visiting gambling and adult sites by category. Which control is MOST appropriate?",["Content or URL filter","Host-based firewall","Port security","File integrity monitor"],0,"URL filtering uses site categories to allow or deny web access."],[4,"Personal phones used for work must keep corporate data separated from personal apps. Which mobile control provides this?",["Containerization","Jailbreaking","Sideloading","Rooting"],0,"Containerization creates an isolated managed workspace on a BYOD device."],[4,"Servers gradually deviate from their approved settings over time. Which practice addresses this?",["Configuration baseline monitoring and enforcement","Increasing log retention","Disabling remote administration","Adding more RAM"],0,"Comparing systems with an approved baseline detects and corrects configuration drift."],[4,"Which action BEST verifies that backups will be usable during a disaster?",["Check the backup job completed with no errors","Perform periodic test restores","Increase the backup frequency","Encrypt the backup media"],1,"Only a restore test proves the data can be recovered. A successful job status does not."],[4,"Which authenticator is MOST resistant to phishing?",["SMS one-time code","FIDO2 hardware security key","Security questions","Email one-time code"],1,"FIDO2 keys bind authentication to the legitimate site origin, so a fake site cannot capture a usable response."],[4,"Which data source summarizes network conversations such as source, destination, ports and byte counts without capturing payloads?",["NetFlow","Full packet capture","Application logs","Vulnerability scan"],0,"NetFlow gives metadata on traffic flows with far less storage than packet capture."],[4,"A vendor shreds retired drives and provides a signed document listing their serial numbers. What is this document?",["Certificate of destruction","Chain of custody form","Service level agreement","Data retention schedule"],0,"A certificate of destruction records that media were destroyed, creating an audit record."],[4,"Logs from several systems cannot be correlated because the timestamps disagree. What should be done?",["Synchronize clocks using NTP","Compress the logs","Switch to UDP","Enable log rotation"],0,"Consistent time across systems is needed to build an accurate event timeline."],[4,"Which technique redirects requests for known malicious domains to an address controlled by the security team?",["DNS sinkhole","Reverse proxy","Port mirroring","Network tap"],0,"A DNS sinkhole returns a controlled address, blocking communication and identifying infected hosts."],[4,"An analyst wants to quickly find out whether a suspicious IP address has been reported as malicious by other organizations. Which resource is BEST?",["Threat intelligence feed","Change management log","Asset inventory","Business impact analysis"],0,"Threat intelligence feeds aggregate known malicious indicators such as IP addresses and domains."],[5,"The vice president of HR decides who may access employee records and how the data is classified. Which data role does the vice president hold?",["Data custodian","Data owner","Data processor","Data subject"],1,"The data owner is accountable for the data and sets classification and access rules. A custodian carries out the technical controls."],[5,"A retailer decides why and how customer personal data is collected and uses a third-party service to process it. Under GDPR, what is the retailer's role?",["Processor","Controller","Data subject","Supervisory authority"],1,"The controller determines the purposes and means of processing. The third party acting on its behalf is the processor."],[5,"A European customer database is breached and the controller becomes aware at 9 AM Monday. By roughly when must the supervisory authority generally be notified under GDPR?",["24 hours","72 hours","7 days","30 days"],1,"GDPR requires notification without undue delay and, where feasible, within 72 hours of becoming aware of the breach."],[5,"A start-up begins accepting credit card payments on its own website and handling cardholder data. Which compliance framework applies to it?",["HIPAA","PCI DSS","SOX","FERPA"],1,"PCI DSS is the contractual industry standard for protecting cardholder data."],[5,"Which regulation governs the protection of protected health information held by covered entities and their business associates?",["PCI DSS","GDPR","HIPAA","GLBA"],2,"HIPAA covers PHI in the United States healthcare context. GDPR is a broader EU privacy regulation."],[5,"Which is a likely consequence of a merchant failing to comply with PCI DSS?",["Loss of the ability to process card payments","Automatic revocation of its business license","Mandatory cyber insurance","Removal of its domain name"],0,"Non-compliance can bring fines from card brands, higher fees and loss of card processing privileges."],[5,"A holding company has one governance team that sets security policy for every subsidiary. Which governance structure is this?",["Decentralized","Centralized","Matrixed with no authority","Ad hoc"],1,"Centralized governance applies uniform decisions from a single group. In decentralized governance, each unit makes its own decisions."],[5,"What is the MAIN limitation of relying only on a vendor's completed security questionnaire?",["Answers are self-reported and not independently verified","It takes too long to read","It cannot include encryption controls","It is legally binding on the customer"],0,"Questionnaires are self-attested, so they should be supported by evidence such as audit reports."],[5,"Two government agencies sign a document that records their shared goals and general roles but creates no legally enforceable obligations. Which document is this?",["MOU","SLA","BPA","NDA"],0,"A memorandum of understanding expresses intent and is generally non-binding."],[5,"Two companies form a partnership and need a document defining each party's contributions, profit sharing and responsibilities. Which is MOST appropriate?",["BPA","NDA","MOU only","SOW"],0,"A business partners agreement defines the terms of a business relationship between partners."],[5,"A team rates each risk as High, Medium or Low based on expert judgment, without monetary values. Which type of analysis is this?",["Quantitative","Qualitative","Residual","Inherent only"],1,"Qualitative analysis uses descriptive ratings. Quantitative analysis uses numerical values such as SLE and ARO."],[5,"An asset loss is expected to cost $50,000 per event, and the event is expected once every four years. What is the annualized loss expectancy?",["$12,500","$25,000","$50,000","$200,000"],0,"ARO is 0.25, so ALE = $50,000 x 0.25 = $12,500."],[5,"Which tool displays risks on a grid by likelihood and impact, using colors to show severity?",["Heat map","Network diagram","Data flow diagram","Gantt chart"],0,"A risk heat map visualizes qualitative ratings on a likelihood and impact matrix."],[5,"A dashboard tracks the number of critical systems that are more than 30 days behind on patching to warn management that risk is i
