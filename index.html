ncreasing. This measure is an example of a:",["KRI","SLE","RTO","MTBF"],0,"A key risk indicator is a forward-looking metric that signals changes in risk exposure."],[5,"What is the PRIMARY advantage of an external audit compared with an internal audit?",["Independence and objectivity","Lower cost","Deeper knowledge of company politics","No need for evidence"],0,"External auditors are independent from the organization, which gives their findings more credibility."],[5,"A third-party firm examines a service provider's controls and issues a formal statement that they meet defined criteria. What is this process?",["Attestation","Self-assessment","Vulnerability scan","Tabletop exercise"],0,"Attestation is an independent assurance statement, such as a SOC 2 report, about controls."],[5,"Newly hired software developers should receive which additional training beyond general awareness training?",["Role-based training on secure coding","Facilities fire drill training","Executive board reporting","Help desk ticketing orientation"],0,"Role-based training addresses the specific risks and duties of a job function."],[5,"Which TWO are characteristics of an effective security awareness program?",["Simulated phishing campaigns with follow-up coaching","One annual training session and nothing further","A clear, easy way to report suspicious messages","Disciplining everyone who reports a phishing email","Excluding senior executives from training"],[0,2],"Ongoing simulation and easy reporting build good behavior. Punishing reporters and excluding executives weaken the program."]],[[1,"A software publisher wants customers to be able to confirm that an installer really came from the publisher and was not modified after release. Which technology should the publisher use?",["Code signing certificate","Full-disk encryption","Salted password hashing","Network access control"],0,"Code signing applies a digital signature backed by a certificate, which proves the publisher's identity and detects tampering after signing."],[1,"What is the PRIMARY reason a unique salt is added to each password before hashing?",["It makes the hash reversible for password recovery","It ensures identical passwords produce different hashes and defeats precomputed rainbow tables","It encrypts the hash with a symmetric key","It shortens the hash to save storage"],1,"Per-password salts make precomputed tables useless and hide duplicate passwords. Hashes are one-way and salting does not make them reversible."],[1,"A hospital discovers that an unauthorized user modified several patients' medication records. Which part of the CIA triad was MOST directly violated?",["Confidentiality","Availability","Integrity","Non-repudiation"],2,"Unauthorized modification of data violates integrity. Confidentiality concerns disclosure and availability concerns access."],[1,"A company requires that the employee who creates a vendor payment request cannot also approve it. Which security principle does this enforce?",["Least privilege","Defense in depth","Implicit trust","Separation of duties"],3,"Separation of duties splits a critical task among multiple people to prevent fraud. Least privilege limits rights, but does not divide one process between roles."],[1,"After a ransomware attack, a company restores its servers from clean backups. Which control type does the restoration represent?",["Corrective","Preventive","Deterrent","Directive"],0,"Corrective controls reduce the impact of an incident or restore normal operations after it has happened."],[1,"A laptop manufacturer includes a dedicated hardware chip that securely stores encryption keys and can attest to the integrity of the boot process. What is this chip?",["Hardware security module (HSM)","Trusted Platform Module (TPM)","Secure enclave on a network switch","Smart card reader"],1,"A TPM is a chip on the endpoint that stores keys and supports measured boot. An HSM is a separate, network-attached or PCIe appliance for enterprise key management."],[1,"Which TWO of the following are asymmetric cryptographic algorithms? (Choose TWO.)",["RSA","AES","ECC","Blowfish","SHA-512"],[0,2],"RSA and elliptic curve cryptography use public/private key pairs. AES and Blowfish are symmetric, and SHA-512 is a hash function."],[1,"A web service uses ephemeral Diffie-Hellman keys so that if the server's long-term private key is stolen later, previously captured sessions still cannot be decrypted. Which property is this?",["Key escrow","Non-repudiation","Perfect forward secrecy","Certificate pinning"],2,"Perfect forward secrecy uses per-session ephemeral keys, so compromise of the long-term key does not expose past traffic."],[1,"Which part of the AAA framework records the actions a user performed after logging in?",["Authentication","Authorization","Attestation","Accounting"],3,"Accounting tracks user activity, such as commands and resources used, for auditing and billing."],[1,"A threat actor hides a malicious configuration file inside the pixel data of a company logo image so it passes through email filters unnoticed. Which technique is this?",["Steganography","Tokenization","Key stretching","Data masking"],0,"Steganography conceals data within another file such as an image. The other options protect or replace data but do not hide its existence."],[1,"Which technology uses a distributed ledger of cryptographically chained blocks to make records tamper-evident?",["Certificate revocation list","Blockchain","Hardware security module","Key escrow"],1,"In a blockchain each block contains the hash of the previous one, so altering history breaks the chain and is detectable."],[2,"Within minutes, multiple servers on a flat network are infected by malware that spreads by exploiting an unpatched SMB flaw. No user opened any file. Which malware type is this?",["Virus","Trojan","Worm","Logic bomb"],2,"A worm self-replicates across networks without user action. A virus needs a host file to be executed by a user."],[2,"A user installs a free PDF converter from a website. It works as advertised, but it also quietly opens a backdoor to an external server. Which malware type is this?",["Worm","Rootkit","Adware","Trojan"],3,"A trojan masquerades as legitimate software while carrying a hidden malicious function."],[2,"An investigator finds that an attacker has an interactive session on a workstation with the ability to browse files, activate the webcam and run commands remotely. Which malware is MOST likely installed?",["Remote access Trojan (RAT)","Ransomware","Bloatware","Logic bomb"],0,"A RAT gives the attacker remote, interactive control of the victim machine."],[2,"An antivirus product running on a server reports no problems, but a scan from a bootable offline medium reveals hidden processes and a malicious kernel driver. Which malware type is MOST likely present?",["Keylogger","Rootkit","Macro virus","Adware"],1,"Rootkits hide at the kernel or firmware level and can conceal themselves from tools running in the infected OS, so an offline scan exposes them."],[2,"Analysts find that malicious PowerShell is running entirely in memory, launched through WMI, with no executable written to disk. Which control is MOST likely to detect this activity?",["Signature-based file scanning","Full-disk encryption","Endpoint detection and response with behavioral analysis","Removable media blocking"],2,"Fileless malware leaves no file to match signatures, so behavioral monitoring of process activity is needed. Signature file scanning would miss it."],[2,"New corporate laptops arrive with several trial applications and vendor utilities preinstalled that consume resources and expand the attack surface. What are these programs called?",["Spyware","Ransomware","Rootkits","Bloatware"],3,"Bloatware is unwanted preinstalled software that adds resource use and attack surface without being intentionally malicious."],[2,"A technician finds a small device plugged inline between a kiosk's keyboard and the PC. Several employees later report that their credentials were used by someone else. What is the device MOST likely?",["A hardware keylogger","A rogue access point","A USB data blocker","A smart card reader"],0,"Inline hardware keyloggers record every keystroke, including typed passwords, without any software on the host."],[2,"A browser extension quietly records the websites a user visits and sends the history to an advertising broker without consent. Which malware category does this describe?",["Worm","Spyware","Ransomware","Logic bomb"],1,"Spyware secretly gathers information about a user's activity and transmits it to a third party."],[2,"Malicious code attaches itself to a legitimate executable and spreads only when a user runs the infected file. Which malware type is this?",["Worm","Rootkit","Virus","Botnet"],2,"A virus needs a host file and user execution to spread, unlike a worm which spreads on its own."],[2,"A caller says he is from an external audit firm and invents a detailed story about a compliance deadline to convince a help desk employee to reveal the VPN configuration. Which social engineering technique is this?",["Tailgating","Shoulder surfing","Watering hole","Pretexting"],3,"Pretexting uses a fabricated scenario to gain trust and extract information."],[2,"The accounts payable team receives an email, apparently from a known supplier, with a new invoice and a request to send payment to a changed bank account. What should the team do FIRST?",["Verify the change by calling the supplier at a phone number already on file","Reply to the email asking if the change is legitimate","Pay the invoice and flag it for later review","Forward the email to the vendor's new contact"],0,"Out-of-band verification using trusted contact details defeats invoice scams and business email compromise. Replying to the email may reach the attacker."],[2,"A coordinated campaign spreads fabricated posts claiming that a company is about to declare bankruptcy, with the aim of damaging its stock price. Which term BEST describes this content?",["Typosquatting","Disinformation","Pharming","Vishing"],1,"Disinformation is deliberately false information spread to cause harm. Misinformation is false but shared without intent to deceive."],[2,"A man in a utility company uniform and carrying a clipboard persuades the receptionist to let him into the server room to inspect the cooling system. Which technique is this?",["Smishing","Typosquatting","Impersonation","Whaling"],2,"Impersonation is pretending to be a trusted person or role to gain physical or informational access."],[2,"A user who is logged in to an online bank visits a malicious page, which silently submits a funds transfer request using the user's session. Which TWO controls BEST mitigate this attack? (Choose TWO.)",["Anti-CSRF tokens","Output encoding","SameSite cookie attribute","Parameterized queries","Longer password requirements"],[0,2],"Anti-CSRF tokens and SameSite cookies stop cross-site requests from being accepted with the victim's session. Output encoding addresses XSS and parameterized queries address SQL injection."],[2,"A web application fetches an image from any URL a user supplies. An attacker submits http://169.254.169.254/latest/meta-data/ and obtains cloud instance credentials. Which attack is this?",["Cross-site request forgery","Directory traversal","Session fixation","Server-side request forgery (SSRF)"],3,"SSRF tricks the server into making requests on the attacker's behalf, here to the internal metadata service."],[2,"An attacker captures a valid authentication message from the network and resends it later to gain access. Which control BEST defends against this replay attack?",["Use nonces or timestamps so each message is valid only once","Increase the password length","Enable full-disk encryption","Use a longer certificate key"],0,"Unique, single-use values and short validity windows make a captured message useless when resent."],[2,"An attacker uses a stolen session cookie to access a user's account without knowing the password. Which cookie attribute prevents client-side scripts from reading the cookie and so reduces theft through XSS?",["Secure","HttpOnly","Expires","Domain"],1,"HttpOnly blocks JavaScript access to the cookie. Secure only restricts it to HTTPS transmission."],[2,"Customers receive a malicious update that was signed and distributed through a software vendor's legitimate update server after the vendor's build system was compromised. Which attack is this?",["Watering hole attack","Downgrade attack","Supply chain attack","Credential stuffing"],2,"Compromising a trusted supplier's build or distribution process to reach downstream customers is a supply chain attack."],[2,"An email appears to come from the CFO and demands that an employee wire funds within the hour. Which TWO social engineering principles is the attacker using? (Choose TWO.)",["Authority","Urgency","Consensus","Familiarity","Scarcity"],[0,1],"Impersonating a senior executive exploits authority, and the one-hour deadline creates urgency."],[2,"A scan shows that a production web application bundles an open-source library with a publicly known remote code execution flaw. Which action BEST addresses this third-party component risk?",["Obfuscate the application's source code","Add a banner warning to the login page","Increase the server's RAM","Upgrade to a patched version and use software composition analysis to monitor dependencies"],3,"Updating the vulnerable component and continuously tracking dependencies directly removes the known flaw. The other choices do not fix it."],[3,"A mail gateway opens unknown email attachments in an isolated virtual environment and observes their behavior before delivering them. Which security concept is this?",["Sandboxing","Sinkholing","Tokenization","Port mirroring"],0,"A sandbox runs untrusted code in isolation so malicious behavior can be observed without harming production systems."],[3,"Compared with virtual machines, which characteristic of containers represents a security concern?",["Containers require a separate hypervisor per instance","Containers share the host operating system kernel","Containers cannot be restricted by resource limits","Containers always run with an encrypted file system"],1,"All containers use the same host kernel, so a kernel vulnerability or escape can affect every container. VMs have separate guest kernels."],[3,"A company must host a public web server while keeping the internal network protected if that server is compromised. Where should the server be placed?",["On the internal LAN with the domain controllers","Directly on the Internet without a firewall","In a screened subnet (DMZ) between two firewalls","On the same VLAN as the HR workstations"],2,"A screened subnet isolates public-facing hosts so that a compromise does not give direct access to the internal network."],[3,"A company with many branch offices wants to combine WAN connectivity with cloud-delivered security services such as secure web gateway, CASB and zero trust network access. Which architecture does this describe?",["Demilitarized zone","Software-defined perimeter appliance","Air-gapped network","Secure Access Service Edge (SASE)"],3,"SASE converges network and security services delivered from the cloud at the edge close to users and sites."],[3,"A switch must authenticate every device that plugs into a port before allowing network access. Which standard provides this port-based access control?",["802.1X","802.11ac","802.3af","802.1Q"],0,"802.1X provides port-based network access control using an authenticator, supplicant and authentication server. 802.1Q is VLAN tagging."],[3,"Remote employees use a VPN, and the company wants all of their Internet-bound traffic to pass through corporate inspection tools. Which configuration is required?",["Split tunnel","Full tunnel","Out-of-band management","Clientless portal with no inspection"],1,"A full tunnel sends all traffic through the VPN, while a split tunnel sends only corporate-bound traffic."],[3,"Which RAID level duplicates the same data to two disks so that the array survives a single disk failure?",["RAID 0","RAID 5","RAID 1","JBOD"],2,"RAID 1 mirrors data across two drives. RAID 0 stripes with no redundancy."],[3,"A company wants the lowest-cost disaster recovery option and accepts a recovery time of several days. Which site type is MOST appropriate?",["Hot site","Warm site","Mirror site","Cold site"],3,"A cold site provides space and utilities only, so it is cheapest but has the longest recovery time."],[3,"A security team needs visibility into which unsanctioned cloud applications employees use and wants to enforce data policies on them. Which technology is BEST suited?",["Cloud access security broker (CASB)","Web application firewall","Hardware security module","Network TAP"],0,"A CASB sits between users and cloud services to discover shadow IT and enforce security policy."],[3,"In a serverless function-as-a-service model, who is responsible for patching the underlying operating system and runtime hosts?",["The customer","The cloud provider","The end user","The application developer exclusively"],1,"With serverless the provider manages the infrastructure, OS and runtime. The customer is responsible for the code and its configuration and data."],[3,"Which TWO controls protect data at rest? (Choose TWO.)",["Full-disk encryption","Transparent database encryption","TLS 1.3","IPsec tunnel mode","SSH port forwarding"],[0,1],"Disk and database encryption protect stored data. TLS, IPsec and SSH protect data in transit."],[3,"A manufacturer's industrial controller must respond to sensor input within strict, predictable time limits. Which type of operating system is typically used?",["Hypervisor-based desktop OS","Mobile device OS","Real-time operating system (RTOS)","Disk-imaging OS"],2,"An RTOS guarantees deterministic response times, which is critical in industrial and embedded systems."],[3,"An administrator still manages network switches with Telnet. Which protocol should replace it to protect credentials in transit?",["FTP","SNMPv1","HTTP","SSH"],3,"SSH encrypts the management session, while Telnet sends credentials in cleartext."],[3,"A certificate authority needs to protect its root private key with tamper-resistant hardware that performs cryptographic operations internally. Which device should it use?",["Hardware security module (HSM)","Trusted Platform Module in a user laptop","Network load balancer","Smart card"],0,"An HSM is a hardened device built to generate and store keys and perform cryptographic operations without exposing the keys."],[3,"A kiosk in a lobby should only be able to run a single approved application. Which endpoint hardening control BEST achieves this?",["Application deny list","Application allow list","Host-based IDS","Disk defragmentation"],1,"An allow list blocks everything not explicitly approved, whereas a deny list only blocks known bad programs."],[3,"Before deploying wireless access points in a new warehouse, the network team wants to find the best AP locations and detect dead spots. What should they perform?",["Penetration test","Vulnerability scan","Wireless site survey with heat mapping","Port scan"],2,"A site survey and heat map measure signal coverage and interference to plan AP placement."],[4,"Developers must prevent SQL injection in a new application. Which control is MOST effective at the code level?",["Client-side JavaScript validation only","Increasing the session timeout","Renaming database tables","Parameterized queries (prepared statements)"],3,"Parameterized queries separate code from data so input cannot change query logic. Client-side validation can be bypassed."],[4,"A web application displays user comments. Which developer practice BEST prevents stored cross-site scripting?",["Output encoding and server-side input sanitization","Enabling directory listing","Using longer session IDs","Hashing the comments"],0,"Encoding user data when it is rendered ensures the browser treats it as text, not script."],[4,"Which cookie attribute ensures a session cookie is only transmitted over encrypted HTTPS connections?",["HttpOnly","Secure","SameSite=None without Secure","Path"],1,"The Secure flag stops the browser from sending the cookie over unencrypted HTTP."],[4,"An organization wants to prevent users from running unapproved PowerShell scripts. Which control BEST supports this?",["Disable the firewall for script hosts","Rename the PowerShell executable","Require scripts to be digitally signed by a trusted publisher","Set longer passwords on user accounts"],2,"A signed-script execution policy only runs code whose signature chains to a trusted certificate, which also provides integrity."],[4,"During the build stage, a team wants to analyze application source code for vulnerabilities without running the program. Which technique should they use?",["Dynamic application security testing (DAST)","Fuzzing of the running service","Penetration test of production","Static application security testing (SAST)"],3,"SAST inspects source or compiled code without executing it, and can run early in the pipeline."],[4,"A security team has no access to a vendor's source code but wants to test the running web application for flaws by sending crafted requests. Which approach is BEST?",["Dynamic application security testing (DAST)","Static code review","Software composition analysis","Manual code signing review"],0,"DAST tests the application at runtime from the outside, without needing source code."],[4,"A tester sends large volumes of malformed and random data to a file parser to discover crashes and unhandled exceptions. Which technique is this?",["Code signing","Fuzzing","Sandboxing","Threat modeling"],1,"Fuzzing supplies unexpected inputs to reveal bugs and vulnerabilities such as memory corruption."],[4,"In the software development life cycle, when is it MOST cost-effective to address security requirements?",["After deployment to production","Only during penetration testing","During requirements and design","During end-of-life decommissioning"],2,"Shifting security left means fixing problems early, when changes are cheapest."],[4,"A scan of a source repository finds database passwords and API keys hard-coded in commits. Which action BEST fixes the problem in the CI/CD pipeline?",["Make the repository private only","Base64-encode the secrets in code","Rename the variables","Move secrets to a secrets management vault and add automated secret scanning"],3,"A vault keeps secrets out of code, and scanning prevents them from being committed again. Encoding is not protection."],[4,"A critical library vulnerability is announced, and the company must quickly identify which of its products include the affected component. Which artifact helps MOST?",["Software bill of materials (SBOM)","Business impact analysis","Service level agreement","Data flow diagram of the network"],0,"An SBOM lists the components and versions in each application, enabling fast identification of affected software."],[4,"A user opens an email attachment and shortly afterward reports pop-ups and a slow system. What should the analyst do FIRST?",["Reimage the system immediately","Isolate the host from the network","Delete the email from the server only","Run a defragmentation"],1,"Containment limits spread and preserves evidence before eradication or recovery steps."],[4,"Which control BEST prepares an organization to recover from a ransomware attack without paying?",["Longer password complexity rules","A second firewall","Offline or immutable backups that are regularly tested","Email footer disclaimers"],2,"Backups that attackers cannot encrypt or delete allow restoration, and testing proves they work."],[4,"An EDR alert shows that a Word document launched PowerShell, which then connected to an external IP address. What is the MOST likely cause?",["A failed disk drive","A DNS misconfiguration","A scheduled backup job","A malicious macro in the document"],3,"Office applications spawning command interpreters and making outbound connections are a classic sign of a malicious macro."],[4,"A user admits entering credentials on a fake login page after clicking an email link. What is the BEST first action?",["Reset the password and revoke active sessions and tokens","Wait for the next vulnerability scan","Send the user to training before taking any action","Add the user to the allow list"],0,"Invalidating the stolen credentials and sessions stops the attacker from using them."],[4,"Which email authentication mechanism adds a cryptographic signature to message headers so receivers can verify that a message was not altered and was authorized by the domain?",["SPF","DKIM","MX records","S/MIME encryption only"],1,"DKIM signs outgoing mail with a domain key published in DNS. SPF only lists authorized sending servers."],[4,"During a penetration test, the tester uses a compromised workstation to reach servers in a segment that was not directly accessible from the Internet. What is this technique called?",["Fuzzing","Reconnaissance","Pivoting","Footprinting"],2,"Pivoting uses a compromised host as a stepping stone to attack other systems on the network."],[4,"An analyst is investigating a suspected attack against an e-commerce web application. Which TWO log sources are MOST useful? (Choose TWO.)",["Web server access logs","Web application firewall logs","HVAC controller logs","Badge reader logs","Printer queue logs"],[0,1],"Web server and WAF logs record the HTTP requests and blocked attack patterns. The others are unrelated to the application layer."],[4,"After an incident response team has eradicated malware from the affected systems, which phase comes NEXT?",["Detection","Preparation","Containment","Recovery"],3,"The phases run preparation, detection and analysis, containment, eradication, recovery and lessons learned."],[4,"Legal counsel informs IT that litigation is likely and that all relevant emails and documents must be kept from deletion. What is this requirement called?",["Legal hold","Chain of custody","Data retention schedule","Sanitization"],0,"A legal hold suspends normal deletion so potentially relevant information is preserved."],[4,"Administrators must check out shared privileged credentials from a system that rotates the password after each use and records the session. Which solution is this?",["Single sign-on","Privileged access management (PAM)","Network access control","Security information and event management"],1,"PAM vaults privileged credentials, enforces check-out and rotation, and audits privileged sessions."],[4,"Which configuration change BEST reduces the risk of macro-based malware in an enterprise?",["Disable the Windows firewall","Allow all macros from email","Block macros in Office files downloaded from the Internet","Remove the antivirus agent"],2,"Blocking macros in files with the Internet mark removes a common initial access vector."],[4,"An employee installs a banking app on a corporate phone from a third-party website instead of the official app store. What is this practice called?",["Jailbreaking","Geofencing","Tethering","Sideloading"],3,"Sideloading is installing apps from unofficial sources, which bypasses store vetting. Jailbreaking removes OS restrictions."],[4,"Which protocol is designed to exchange structured cyber threat intelligence automatically between organizations?",["TAXII","SNMP","SMTP","LDAP"],0,"TAXII is the transport mechanism for sharing threat intelligence, commonly carrying STIX-formatted data."],[4,"Which TWO controls BEST reduce the risk of malware arriving through email attachments? (Choose TWO.)",["Attachment sandboxing at the email gateway","Blocking executable file types","Enabling WPA3 on wireless networks","Increasing password complexity","Installing more HVAC monitoring"],[0,1],"Detonating attachments in a sandbox and blocking risky file types directly intercept malicious attachments. The other choices do not address email-borne malware."],[4,"A SIEM generates hundreds of low-value alerts every day, and analysts are missing real incidents. What is the BEST action?",["Disable all alerting","Tune correlation rules and thresholds to reduce false positives","Add more log sources without changes","Ignore alerts from critical servers"],1,"Alert tuning improves signal quality, whereas disabling alerts or ignoring critical hosts creates blind spots."],[5,"A server worth protecting has a single loss expectancy of $80,000 and is expected to suffer such a loss once every four years. What is the annualized loss expectancy?",["$80,000","$320,000","$20,000","$4,000"],2,"ALE = SLE x ARO = $80,000 x 0.25 = $20,000."],[5,"A company deploys multifactor authentication to reduce the likelihood of account takeover. Which risk response is this?",["Avoidance","Acceptance","Transference","Mitigation"],3,"Applying controls to reduce likelihood or impact is risk mitigation."],[5,"A risk assessment rates risks as high, medium or low on a heat map using the team's judgment rather than monetary values. Which type of analysis is this?",["Qualitative","Quantitative","Statistical","Forensic"],0,"Qualitative analysis uses subjective ratings. Quantitative analysis assigns numeric values such as SLE and ALE."],[5,"Before signing a contract with a new cloud provider, the security team reviews the provider's certifications, audit reports and financial stability. Which activity is this?",["Incident response","Vendor due diligence","Change management","Penetration testing"],1,"Due diligence evaluates a third party's security and viability before entering a relationship."],[5,"Two companies are exploring a partnership and need to share confidential product plans during negotiations. Which agreement legally protects that information?",["Service level agreement","Memorandum of understanding","Non-disclosure agreement (NDA)","Statement of work"],2,"An NDA legally restricts the disclosure of confidential information shared between parties."],[5,"Which document expresses the intended cooperation between two organizations in a general, non-binding way?",["Master service agreement","Business partners agreement with penalties","Service level agreement","Memorandum of understanding (MOU)"],3,"An MOU records shared intentions and is usually not legally enforceable. An MSA and an SLA are contractual."],[5,"A retailer holding EU customers' personal data finds that an attacker exfiltrated records. What is its GENERAL obligation under GDPR?",["Notify the supervisory authority within 72 hours of becoming aware","Wait for the annual audit before reporting","Notify only the cyber insurance carrier","Publish the findings on its website only"],0,"GDPR generally requires reporting qualifying breaches to the regulator within 72 hours."],[5,"Which governance document provides specific, step-by-step instructions for performing a security task such as onboarding a user?",["Policy","Procedure","Standard","Guideline"],1,"A procedure lists detailed steps. A policy states high-level intent, and a standard defines mandatory requirements."],[5,"A document states that all laptops must use AES-256 disk encryption and passwords must be at least 14 characters. What type of document is this?",["Procedure","Policy","Standard","Business impact analysis"],2,"A standard defines specific mandatory requirements that support a policy."],[5,"The maximum amount of time a business function can be offline before unacceptable consequences occur is defined by which metric?",["Recovery point objective (RPO)","Mean time between failures","Annualized rate of occurrence","Recovery time objective (RTO)"],3,"RTO is the target time to restore service. RPO measures the acceptable data loss."],[5,"Staff meet in a conference room to talk through their roles in a simulated ransomware scenario, without touching any production systems. Which type of exercise is this?",["Tabletop exercise","Failover test","Parallel processing test","Full-interruption test"],0,"A tabletop is a discussion-based walkthrough with no impact on operations."],[5,"Which approach is MOST effective at reducing employee susceptibility to social engineering over time?",["A single annual slideshow","Role-based training combined with regular phishing simulations and reporting feedback","Posting a policy on the intranet only","Blocking all external email"],1,"Ongoing, targeted training with simulations reinforces behavior and gives measurable results."],[5,"An employee is terminated for cause. Which action should HR and IT perform FIRST?",["Wait until the end of the pay period","Archive the employee's email only","Disable the employee's accounts and retrieve company assets","Add the employee to the VPN allow list"],2,"Immediate account deactivation prevents retaliation and unauthorized access."],[5,"Who is ultimately accountable for deciding how a dataset is classified and who may access it?",["Data custodian","Data processor","System administrator","Data owner"],3,"The data owner is accountable for classification and access decisions. The custodian carries out technical controls."],[5,"A metric that shows an increasing number of unpatched critical vulnerabilities across the environment and signals rising exposure is an example of which measure?",["Key risk indicator (KRI)","Service level agreement","Recovery point objective","Annualized loss expectancy"],0,"KRIs are forward-looking metrics that warn when risk is increasing."],[5,"An organization invites independent researchers to find and report vulnerabilities in its public applications in exchange for payment. Which program is this?",["Red team exercise with no scope","Bug bounty","Tabletop exercise","Vendor audit"],1,"A bug bounty rewards external researchers for responsibly disclosed vulnerabilities."],[5,"A merchant keeps cardholder numbers in its order database. Which compliance framework governs how this data must be protected?",["HIPAA","SOX","PCI DSS","FERPA"],2,"PCI DSS sets security requirements for cardholder data. HIPAA covers health information, SOX financial reporting, and FERPA student records."],[5,"Which contract requirement BEST reduces supply chain risk when purchasing commercial software?",["Allow the vendor to subcontract without notice","Accept the vendor's default terms with no review","Limit the vendor's liability to zero","Require the vendor to supply an SBOM and attest to secure development practices"],3,"An SBOM and secure development attestation give the buyer visibility and assurance about components and vendor practices."]],[[1,"A data center installs steel bollards along the front of the building to stop vehicles from reaching the lobby. Which control category and type BEST describe them?",["Physical, preventive","Managerial, corrective","Operational, deterrent","Technical, detective"],0,"Bollards are a physical barrier that stops a vehicle from reaching the building, so they prevent the event rather than detect or correct it."],[1,"A server room is monitored in the dark by a sensor that raises an alarm when it detects the body heat of a person entering. Which sensor type is this?",["Microwave","Ultrasonic","Infrared","Pressure"],2,"Infrared sensors detect heat signatures such as a human body. Ultrasonic and microwave sensors emit energy and measure reflections, and pressure sensors respond to weight."],[1,"A facilities team places sensors under floor tiles in a restricted area that trigger an alarm when someone steps on them after hours. Which sensor type is this?",["Pressure","Ultrasonic","Infrared","Microwave"],0,"Pressure sensors detect physical weight or force, such as footsteps on a mat or tile. The other sensors detect heat or reflected energy."],[1,"Which TWO sensor types detect motion by emitting energy into a space and then measuring changes in the reflected signal?",["Pressure","Ultrasonic","Microwave","Passive infrared","Badge reader"],[1,2],"Microwave sensors emit radio waves and ultrasonic sensors emit high-frequency sound waves, both detecting disturbances in the reflections. Passive infrared only senses heat and does not emit energy."],[1,"During review of a request to upgrade a core switch's firmware, the change advisory board asks which applications, users and systems could be affected if the upgrade goes wrong. Which part of the change management process is being performed?",["Backout planning","Impact analysis","Post-change documentation","Maintenance window scheduling"],1,"Impact analysis identifies what a change could affect and how severely. Backout planning describes how to undo the change, not what it touches."],[1,"A retailer must apply a database patch that requires downtime but wants to avoid disrupting sales. Which change management practice BEST reduces the business disruption?",["Applying the patch immediately after it is approved","Skipping testing to shorten the downtime","Scheduling the change within an approved maintenance window during low-demand hours","Applying the patch during peak trading hours so staff are available"],2,"A maintenance window coordinates downtime with the business to limit impact. Applying changes at peak times or without testing increases risk."],[1,"Before approving a change to a production load balancer configuration, the change board requires evidence that the configuration was validated in a non-production environment that mirrors production. Which change management element does this address?",["Version control","Test results","Allow list","Ownership"],1,"Test results demonstrate that the change works as intended before it reaches production. Ownership identifies who is accountable, not whether the change was validated."],[1,"An administrator plans to restart a directory service. The change request notes that several applications rely on it for authentication and will fail during the restart. Which technical implication of change does this describe?",["Restricted activities","Deny list updates","Version control","Dependencies"],3,"Dependencies are other systems or services that rely on the component being changed. Failure of those systems during the restart is the dependency impact."],[1,"After a firewall migration, the network team discovers the topology diagrams and policy documents still show the old environment. Which change management activity was skipped?",["Performing a vulnerability scan","Installing a security patch","Updating documentation and diagrams","Obtaining executive approval"],2,"Change management requires that diagrams, policies and procedures be updated to reflect the new state so that later changes and troubleshooting use accurate information."],[1,"In a Zero Trust model, which component sits in the data plane and permits or blocks a subject's session to a resource based on decisions made by the control plane?",["Implicit trust zone","Policy administrator","Policy enforcement point","Policy engine"],2,"The policy enforcement point enables, monitors and terminates connections. The policy engine decides, and an implicit trust zone is what Zero Trust seeks to eliminate."],[1,"A company places three web servers behind a load balancer so users can still reach the site when one server fails. Which element of the CIA triad is this primarily addressing?",["Integrity","Non-repudiation","Availability","Confidentiality"],2,"Redundant servers behind a load balancer keep the service reachable during a failure, which is availability."],[2,"A caller tells a help desk agent they are a new executive's assistant, invents a detailed story about an urgent deadline, and persuades the agent to reset the executive's password. Which social engineering technique is this?",["Pretexting","Typosquatting","Tailgating","Watering hole"],0,"Pretexting uses a fabricated scenario and identity to gain trust and obtain information or access."],[2,"The finance team receives an email that appears to come from the CEO, sent from a lookalike domain, asking for an urgent wire transfer to a new vendor account. Which attack is this?",["Credential stuffing","Pharming","Smishing","Business email compromise"],3,"Business email compromise impersonates an executive or vendor by email to trick staff into fraudulent payments."],[2,"An attacker carrying boxes waits at a badge-controlled door and walks in behind an employee who holds it open. Which attack is this?",["Whaling","Tailgating","Dumpster diving","Shoulder surfing"],1,"Tailgating is following an authorized person through an access point without presenting credentials."],[2,"Ransomware encrypted both production file servers and the backup copies stored on a mapped network share. Which change would BEST improve future recoverability?",["Compress the backup files to save space","Give the backup service account domain administrator rights","Keep an offline or immutable backup copy that cannot be modified from the network","Run backups more often to the same network share"],2,"Backups reachable and writable from the compromised network are encrypted too. An offline, air-gapped or immutable copy survives the attack."],[2,"A public web server stops responding. Captures show a flood of TCP SYN packets from thousands of sources and a connection table full of half-open sessions. Which attack is occurring?",["DNS amplification","ARP poisoning","Distributed SYN flood denial of service","Session hijacking"],2,"Many sources sending SYN packets without completing the handshake exhausts the connection table, which is a distributed SYN flood."],[2,"A user who is logged in to an online bank visits a malicious page that silently submits a funds transfer request using the user's active session. Which attack is this?",["SQL injection","Cross-site request forgery","Cross-site scripting","Directory traversal"],1,"CSRF abuses the browser's authenticated session to send forged requests. XSS instead injects script into a page the victim views."],[2,"A web application fetches a URL supplied by the user. An attacker supplies an internal address so that the server retrieves data from a cloud metadata service. Which attack is this?",["Server-side request forgery","Cross-site request forgery","Replay attack","Buffer overflow"],0,"SSRF tricks the server into making requests on the attacker's behalf, often to internal resources the attacker cannot reach directly."],[2,"An attacker records a valid authentication exchange on the network and later retransmits it to gain access. Which attack is this?",["Rootkit installation","Birthday attack","Replay attack","Cross-site scripting"],2,"A replay attack captures legitimate traffic and resends it. Nonces, timestamps and session tokens help prevent it."],[2,"Which control BEST defeats precomputed rainbow table attacks against a stolen password database?",["Salting each password with a unique random value before hashing","Storing the hashes in a separate table","Hashing each password twice with the same algorithm and no salt","Requiring passwords to be changed every 30 days"],0,"Unique salts make precomputed tables useless because each hash must be attacked individually. Double hashing without a salt remains vulnerable to precomputation."],[2,"A vendor learns that attackers are exploiting a flaw in its product for which no patch yet exists. What is this type of vulnerability called?",["Race condition","Misconfiguration","Zero-day","Weak cipher suite"],2,"A zero-day is a flaw unknown to the vendor or without an available fix at the time it is exploited."],[2,"Signature-based antivirus finds nothing on a compromised host, yet analysts discover malicious code running only in memory through legitimate PowerShell. Which malware type is this?",["Worm","Fileless malware","Logic bomb","Ransomware"],1,"Fileless malware runs in memory and abuses trusted tools, leaving few or no files for signature scanning to detect."],[2,"An EDR agent reports that a host's process list differs from what the kernel reports. A hidden component loads at boot and conceals its own files from the operating system. Which malware type is this?",["Trojan dropper","Rootkit","Adware","Keylogger"],1,"Rootkits hide their presence by modifying operating system or boot components and persist at a low level."],[2,"A user signs in from Pune, and 20 minutes later the same account signs in from Frankfurt. Which indicator of malicious activity does this represent?",["Resource inconsistency","Missing logs","Concurrent session limit","Impossible travel"],3,"Logins from locations too far apart for the elapsed time suggest the credentials are being used by someone else."],[2,"Which TWO actions BEST reduce the impact of a ransomware infection?",["Maintaining offline, immutable backups","Disabling log retention to save storage","Segmenting the network so malware cannot spread freely","Installing a second UPS in the server room","Enabling a guest wireless network"],[0,2],"Offline backups allow recovery without paying, and segmentation limits how far encryption spreads. The other options do not reduce ransomware impact."],[2,"Attackers inserted malicious code into a legitimate update of a widely used IT management tool, which customers then installed. Which attack is this?",["Supply chain attack","Brute force attack","Evil twin attack","Watering hole attack"],0,"Compromising a trusted vendor's software to reach its customers is a supply chain attack. A watering hole targets a site the victims visit."],[2,"An audit finds that a critical database server is fed by a single power circuit and a single network uplink. Which weakness does this represent?",["Race condition","Single point of failure","Cryptographic downgrade","Zero-day vulnerability"],1,"Any component whose failure takes down a service with no redundancy is a single point of failure."],[2,"A standard user exploits a flaw in a kernel driver and obtains administrator rights on the same workstation. Which type of attack is this?",["Horizontal privilege escalation","Vertical privilege escalation","Lateral movement","Credential stuffing"],1,"Gaining higher privileges than assigned is vertical escalation. Horizontal escalation accesses peers' resources at the same level."],[2,"A company wants only approved executables to run on its point-of-sale terminals and to block everything else by default. Which mitigation is this?",["Content filtering","Network address translation","Application allow listing","Application deny listing"],2,"Allow listing permits only known-good software, blocking unknown and malicious programs by default. Deny listing blocks only known-bad items."],[2,"An employee who was passed over for promotion deletes shared project files on the last day of employment. Which motivation BEST describes this insider's actions?",["Service disruption as a political statement","Espionage","Financial gain","Revenge"],3,"Retaliating against the employer for perceived mistreatment is revenge. There is no profit or intelligence-gathering goal."],[2,"A user receives an automated phone call claiming to be from their bank's fraud department and is prompted to enter their card number and PIN on the keypad. Which attack is this?",["Typosquatting","Smishing","Pharming","Vishing"],3,"Vishing is voice-based phishing, conducted by phone call. Smishing uses text messages."],[3,"Two identical application servers both handle live user requests at the same time, with a load balancer spreading traffic across them. If one fails, the other absorbs the load. Which configuration is this?",["Cold standby","Active-passive","Active-active","Hot spare disk"],2,"In active-active, all nodes serve traffic simultaneously. In active-passive, a standby node only takes over on failure."],[3,"A database cluster has a primary node serving all requests while a secondary node monitors its heartbeat and takes over only if the primary fails. Which configuration is this?",["Active-active","Active-passive","Round-robin DNS","Sticky sessions"],1,"Only one node is serving requests; the standby assumes the role after failover, which is active-passive."],[3,"An organization uses firewalls from two different vendors and runs redundant servers on different operating systems so that one vulnerability is unlikely to affect all of them. Which resilience concept is this?",["Geographic dispersion","Tokenization","Obfuscation","Platform diversity"],3,"Platform diversity uses different technologies so a single flaw or failure mode does not compromise every system."],[3,"To avoid dependence on one provider and stay online if an entire cloud provider has an outage, a company deploys workloads across two public cloud providers. Which strategy is this?",["Private cloud","Community cloud","Single-region deployment","Multi-cloud"],3,"Multi-cloud spreads workloads across multiple providers for resilience and to reduce vendor lock-in."],[3,"Before applying a risky update, an administrator wants to capture the state of a virtual machine so it can be reverted within minutes. Which is the BEST option?",["Perform a full tape backup","Take a snapshot","Enable asynchronous replication","Defragment the virtual disk"],1,"A snapshot quickly captures a point-in-time state for fast rollback. Tape backup is far slower to restore."],[3,"Two data centers must hold identical copies of transaction data so that no committed transaction is lost if the primary site fails. Which replication method is required?",["Synchronous replication","Asynchronous replication","Incremental backup","Differential backup"],0,"Synchronous replication confirms writes at both sites before committing, giving a near-zero RPO. Asynchronous replication can lose recent data."],[3,"After a sudden power loss, a file system returns to a consistent state by replaying a log of changes recorded before they were written to disk. Which feature is this?",["Tokenization","Defragmentation","Deduplication","Journaling"],3,"Journaling logs pending changes so the system can complete or roll back operations after a crash."],[3,"A company keeps all its backups in a cabinet in the same building as its servers. Which change would BEST protect against a building fire?",["Store a copy of the backups at a geographically separate offsite location","Add a second copy next to the first","Move the cabinet to a different room in the same building","Switch from nightly to hourly backups"],0,"Backups kept near the production systems are lost in the same disaster. An offsite copy survives site-wide events."],[3,"Backup tapes are shipped to a third-party storage vendor. Which control BEST prevents data disclosure if a tape is lost in transit?",["Compress the backup data","Encrypt the backup data before it leaves the facility","Label the tapes with random names","Use incremental rather than full backups"],1,"Encryption protects confidentiality of data on lost media. Labels and compression do not provide protection."],[3,"A hospital data center must keep running through a power outage lasting many hours. Which combination BEST meets this requirement?",["Dual power supplies connected to the same circuit","A UPS alone","A UPS to bridge the switchover plus a generator for sustained power","Surge protectors on each rack"],2,"A UPS provides immediate short-term power while the generator starts and then supplies long-term power. A UPS alone has limited runtime."],[3,"An organization writes a plan to keep its essential functions running at an alternate location with alternate staff and systems after a major disruption. Which plan is this?",["Continuity of operations plan (COOP)","Vulnerability management plan","Data retention policy","Acceptable use policy"],0,"A COOP ensures critical functions can continue during and after a disruption, using alternate facilities, people and technology."],[3,"Ahead of a seasonal peak, a team forecasts expected demand and ensures it has enough staff, servers and bandwidth to handle it. Which activity is this?",["Capacity planning","Change control","Penetration testing","Risk transference"],0,"Capacity planning aligns people, technology and infrastructure with anticipated demand to avoid degraded service."],[3,"Which TWO actions would MOST improve the availability of a web application tier?",["Enabling multifactor authentication","Deploying a load balancer with health checks","Placing additional nodes in separate availability zones","Implementing role-based access control","Encrypting data at rest"],[1,2],"Load balancing with health checks and redundancy across zones keep the service up when a node or zone fails. The others protect confidentiality."],[3,"An attacker running inside a guest virtual machine exploits a hypervisor flaw to run code on the host and reach other guests. Which attack is this?",["Pass-the-hash","VM escape","Session replay","VM sprawl"],1,"VM escape breaks isolation between a guest and the hypervisor or host. VM sprawl is unmanaged growth of virtual machines."],[3,"A company maintains a recovery site with hardware and connectivity in place but must restore data from backups before it can operate, taking hours to days. Which site type is this?",["Mobile site","Hot site","Cold site","Warm site"],3,"A warm site has equipment ready but needs data restored. A hot site has current data and a cold site has little more than space and power."],[3,"To reduce the risk that a single regional disaster such as an earthquake disables both production and recovery, an organization places its recovery site in another region. Which concept is this?",["Microsegmentation","Geographic dispersion","Data masking","Platform diversity"],1,"Geographic dispersion separates sites so a regional event does not affect them all."],[4,"A security team gathers key staff in a conference room to talk through a ransomware scenario step by step, reviewing the plan and roles without touching any systems. Which exercise is this?",["Tabletop exercise","Parallel processing test","Penetration test","Failover test"],0,"A tabletop is a discussion-based walkthrough of a scenario that tests plans and roles without operational impact."],[4,"To validate high availability, an administrator deliberately shuts down the primary database node during a maintenance window and confirms that the secondary takes over. Which test is this?",["Parallel processing test","Failover test","Tabletop exercise","Attestation"],1,"A failover test verifies that redundant components assume the workload when the primary fails."],[4,"As part of disaster recovery validation, staff respond hands-on to a realistic outage in a lab, with injected events and timed objectives. Which exercise is this?",["Simulation","Vulnerability scan","Risk assessment","Policy review"],0,"A simulation recreates incident or outage conditions so responders practice actions, unlike a purely discussion-based tabletop."],[4,"To verify a recovery site, a team processes the same transactions there as at the production site at the same time and compares results, without moving the production workload. Which test is this?",["Full cutover failover test","Parallel processing test","Penetration test","Tabletop exercise"],1,"Parallel processing runs the recovery environment alongside production to confirm it works without disrupting live operations."],[4,"After an incident is resolved, the team meets to review what happened, what worked and what should change in the plan. Which incident response phase is this?",["Containment","Lessons learned","Eradication","Preparation"],1,"Lessons learned reviews the incident afterward to improve procedures, tools and training."],[4,"Which incident response phase includes building playbooks, contact lists and training, and deploying detection tools before any incident occurs?",["Preparation","Containment","Recovery","Detection"],0,"Preparation covers the work done in advance so the team can respond effectively."],[4,"An analyst needs to see which internal hosts communicated with an external IP address and how much data moved, without capturing packet contents. Which data source is BEST?",["Endpoint antivirus log","Authentication log","NetFlow","Full packet capture"],2,"NetFlow records metadata about conversations, such as endpoints, ports and volumes, without payloads."],[4,"A vulnerability scan reports no issues on a server, but a later penetration test exploits an unpatched flaw on it. How is the scan result classified?",["False positive","True negative","True positive","False negative"],3,"A false negative is a real vulnerability that the scanner failed to report."],[4,"After patching a critical vulnerability on a server, what should the team do to confirm the fix?",["Rescan the system to validate that the vulnerability is no longer present","Lower the vulnerability severity rating","Disable the scanner for that server","Close the ticket because the patch installer reported success"],0,"Rescanning validates remediation. Relying on the installer's status can miss failed or incomplete patches."],[4,"A SOC wants to automatically receive and share threat indicators with partners in a standardized format. Which pair of standards should it use?",["SAML and OAuth","CVSS and EPSS","STIX and TAXII","SNMP and NetFlow"],2,"STIX defines the format of threat information and TAXII defines how it is exchanged."],[4,"An analyst suspects malware on a host is using domain names to reach its command-and-control servers. Which log source is MOST useful for finding this?",["DNS logs","Backup job logs","Badge reader logs","Print server logs"],0,"DNS logs show which domains hosts looked up, revealing communication with malicious domains."],[4,"A firewall policy must drop any traffic that is not explicitly permitted. Which rule placed at the end of the ruleset accomplishes this?",["Implicit deny (deny any any)","Log-only rule","Allow any any","Explicit allow for management traffic"],0,"A final deny-all rule blocks everything not matched by earlier allow rules."],[4,"A company wants to block users from reaching sites categorized as gambling or known malware sources, regardless of which device they use on the corporate network. Which control is BEST?",["Data loss prevention","A load balancer","A web content filter with URL categorization","Network access control"],2,"Web filters allow or block sites by category and reputation. DLP controls data leaving the organization."],[4,"Which email authentication mechanism uses a digital signature, with the public key published in DNS, so receivers can verify a message came from the signing domain and was not altered?",["DKIM","SPF","DMARC","DNSSEC"],0,"DKIM signs messages. SPF lists authorized sending servers, and DMARC sets policy using SPF and DKIM results."],[4,"Administrators share a root password kept in a spreadsheet. The company wants checkout, automatic rotation and session recording for privileged accounts. Which solution BEST meets this need?",["Group Policy password length settings","Privileged access management with credential vaulting","Network access control","Full disk encryption"],1,"PAM vaults privileged credentials, controls checkout, rotates secrets and records sessions."],[4,"Which process should immediately remove an employee's accounts and access on their last day of employment?",["Quarterly access recertification","Deprovisioning as part of offboarding","Annual password rotation","Provisioning during onboarding"],1,"Offboarding with prompt deprovisioning prevents former employees from retaining access. Recertification is periodic, not immediate."],[4,"Which TWO are benefits of automating user account provisioning?",["Elimination of the need for audits","Guaranteed absence of vulnerabilities","Consistent enforcement of access standards","Removal of approval requirements","Reduced human error"],[2,4],"Automation applies the same rules every time and reduces mistakes. It does not remove audit or approval needs."],[4,"A critical vulnerability is being actively exploited and a firewall rule must be added now to stop it. Which approach BEST aligns with change management?",["Skip all records permanently since it is urgent","Use the emergency change process with expedited approval and complete documentation afterward","Wait for the next scheduled change board meeting","Make the change without telling anyone"],1,"Emergency changes follow an expedited approval path by designated authority and are documented and reviewed afterward."],[4,"Counsel anticipates litigation and instructs IT that emails and files about the dispute must not be deleted even if retention rules would normally purge them. What is this called?",["Order of volatility","Data minimization","Tokenization","Legal hold"],3,"A legal hold suspends normal deletion so relevant evidence is preserved."],[4,"A forensic examiner needs to make an image of a suspect drive without altering its contents. Which tool should be used?",["Antivirus scanner","Hardware write blocker","Password cracker","Disk defragmenter"],1,"A write blocker prevents any writes to the source drive during acquisition, preserving evidence integrity."],[4,"A laptop containing unencrypted customer data was lost in transit. Which control, had it been in place, would have BEST protected the data?",["Antivirus software","Screen lock timeout","Host-based firewall","Full disk encryption"],3,"Full disk encryption protects data at rest even if the drive is removed. A screen lock does not stop offline access."],[4,"An employee plugs an inexpensive personal wireless router into a wall jack, creating an unmanaged wireless entry point into the corporate network. What is this called?",["Bluejacking","Jamming","Evil twin","Rogue access point"],3,"An unauthorized AP connected to the network is a rogue AP. An evil twin deliberately imitates a legitimate AP to lure users."],[4,"SOC analysts are ignoring many alerts because most turn out to be benign. Which action BEST addresses the problem?",["Tune detection rules and thresholds to reduce false positives","Disable alerting for noisy sources entirely","Add more dashboards","Collect more logs without changing rules"],0,"Tuning reduces noise and alert fatigue while preserving meaningful detections."],[4,"A team proactively searches its environment for signs of attackers that evaded automated detection, assuming a breach has already occurred. What is this activity?",["Vulnerability scanning","Penetration testing","Patch management","Threat hunting"],3,"Threat hunting is a hypothesis-driven search for undetected threats, unlike scanning for known vulnerabilities."],[4,"How can an organization BEST verify that its backups are actually usable for recovery?",["Periodically perform test restorations and validate the restored data","Check that backup jobs report completion","Increase the retention period","Compress the backups"],0,"Only a restore test proves data can be recovered. Job success messages do not confirm that the data is intact."],[5,"A business impact analysis concludes that the order processing system must be back in service within four hours of an outage. Which metric is this?",["Recovery time objective","Recovery point objective","Mean time between failures","Annualized rate of occurrence"],0,"RTO is the maximum acceptable time to restore a service. RPO is the maximum acceptable data loss."],[5,"Which metric would BEST help compare the reliability of two disk models by showing the average operating time between failures?",["Single loss expectancy","Mean time between failures","Recovery time objective","Mean time to repair"],1,"MTBF measures expected uptime between failures. MTTR measures how long repairs take."],[5,"A server environment is valued at $250,000, and a flood would destroy 30 percent of it. What is the single loss expectancy?",["$30,000","$83,333","$75,000","$250,000"],2,"SLE equals asset value multiplied by exposure factor: 250,000 x 0.30 = 75,000."],[5,"A threat has a single loss expectancy of $20,000 and occurs three times a year. A control costing $15,000 per year reduces the occurrence to once per year. What is the annual net savings?",["$45,000","$25,000","$5,000","$40,000"],1,"ALE falls from 60,000 to 20,000, a 40,000 reduction. Subtracting the 15,000 control cost gives 25,000."],[5,"Management reviews a low-impact, low-likelihood risk and the risk owner signs a statement agreeing to take no further action. Which risk strategy is this?",["Accept","Avoid","Transfer","Mitigate"],0,"Formally acknowledging a risk and choosing not to treat it is risk acceptance."],[5,"The board sets a low risk appetite, and the security team defines unplanned downtime above two hours per quarter as the maximum acceptable deviation. Which term describes the two-hour limit?",["Risk tolerance","Inherent risk","Residual risk","Risk appetite"],0,"Risk tolerance is the acceptable variation around the appetite. Appetite is the broader amount of risk the organization will pursue."],[5,"A security manager tracks the number of internet-facing systems missing critical patches as an early signal of rising exposure. Which term describes this measure?",["Recovery point objective","Service level agreement","Key risk indicator","Annualized loss expectancy"],2,"A key risk indicator is a metric that signals changing risk levels before losses occur."],[5,"Two agencies sign a document outlining their intent to cooperate on sharing threat intelligence. It is not legally binding. Which document is this?",["Statement of work","Memorandum of understanding","Master service agreement","Service level agreement"],1,"An MOU expresses mutual intent and general terms without being a binding contract, unlike an MSA or SLA."],[5,"Before signing a contract with a new cloud provider, an organization reviews its financial stability, security certifications and breach history. Which activity is this?",["Due diligence","Penetration testing","Business impact analysis","Data sanitization"],0,"Due diligence evaluates a vendor before engagement to understand risks of working with it."],[5,"Under the GDPR, within how many hours of becoming aware of a personal data breach must a controller generally notify the supervisory authority?",["72 hours","30 days","7 days","24 hours"],0,"The GDPR requires notification without undue delay and, where feasible, within 72 hours of becoming aware of the breach."],[5,"Which role is accountable for deciding the classification of a dataset and approving who may access it?",["Data processor","System administrator","Data owner","Data custodian"],2,"The data owner is accountable for the data and its classification. The custodian implements the technical protections."],[5,"A penetration tester gathers a company's employee names, email formats and technology stack from public websites and job postings without contacting the target's systems. Which activity is this?",["Privilege escalation","Passive reconnaissance","Lateral movement","Active reconnaissance"],1,"Collecting open-source information without interacting with the target is passive reconnaissance."],[5,"A tester is given only the company name and must discover the targets on their own. Which type of penetration test is this?",["Known environment","Partially known environment","Compliance audit","Unknown environment"],3,"With no information provided, the test is unknown environment, also called black box."],[5,"Which TWO activities are part of a business impact analysis?",["Performing a source code review","Selecting a firewall vendor","Issuing employee badges","Determining recovery time and recovery point objectives for those functions","Identifying mission-essential functions"],[3,4],"A BIA identifies critical functions and sets recovery objectives based on the impact of disruption."],[5,"Which group is typically responsible for reviewing, approving and prioritizing proposed changes to production systems?",["Internal audit committee","Incident response team","Security operations center","Change advisory board"],3,"The change advisory board evaluates proposed changes for risk and business impact before approval."],[5,"Which governance document provides step-by-step instructions that staff follow to carry out a routine task, such as provisioning a new user account, consistently?",["Acceptable use policy","Business impact analysis","Standard operating procedure","Risk register"],2,"An SOP lists the specific steps to perform a task the same way each time. Policies state requirements at a higher level."],[5,"Each business unit in a company sets its own security rules and manages its own security staff, with little coordination from headquarters. Which governance structure is this?",["Board-led","Decentralized","Government-led","Centralized"],1,"When decision-making is distributed to individual units, governance is decentralized."],[5,"A company stores and processes payment card data. Which standard specifically applies to protecting that data?",["HIPAA","FERPA","PCI DSS","SOX"],2,"PCI DSS covers organizations that store, process or transmit cardholder data."]],[[1,"A zero trust deployment separates its architecture into a control plane and a data plane. Which TWO components operate in the control plane? (Choose TWO.)",["Policy engine","Policy enforcement point","Policy administrator","Implicit trust zone","Subject and system requesting access"],[0,2],"The policy engine decides whether access is granted and the policy administrator carries out that decision by configuring the path. The enforcement point and the implicit trust zone sit in the data plane."],[1,"A company formalizes a quarterly enterprise risk assessment process and a written change management policy approved by the board. Under the standard security control categories, these controls are BEST classified as which category?",["Operational","Physical","Managerial","Technical"],2,"Managerial controls address risk management and governance through policies, assessments and oversight. Technical controls are implemented in systems, and operational controls are carried out day to day by people."],[1,"A security architect needs to detect unauthorized modification of critical operating system and application configuration files on production servers and alert the team when a file changes. Which control BEST meets this requirement?",["Data loss prevention","File integrity monitoring","Application allow list","Full disk encryption"],1,"File integrity monitoring compares current file hashes with a trusted baseline and alerts on changes, which directly supports integrity. Encryption protects confidentiality and does not report modification of files."],[1,"An attacker records encrypted TLS traffic for years and later steals the web server's long-term private key, yet is unable to decrypt any of the recorded sessions. Which property of the key exchange explains this?",["Certificate pinning","Key stretching","Perfect forward secrecy","Salting"],2,"Perfect forward secrecy uses ephemeral session keys that are not derivable from the long-term private key. Pinning and salting do not protect previously recorded sessions."],[1,"A laptop fleet must encrypt local drives so that the encryption key is released only when the machine boots with an unmodified firmware and boot chain, and the key cannot simply be moved to another device. Which component BEST provides this?",["Smart card reader","Trusted Platform Module","Key management service in the cloud","Hardware security module in a rack-mounted appliance"],1,"A TPM is a chip bound to the individual machine that can seal keys to measured boot state. An HSM is a separate appliance designed to serve many applications and is not tied to a single laptop's boot integrity."],[1,"Which TWO statements about symmetric and asymmetric encryption are accurate? (Choose TWO.)",["Asymmetric encryption is generally slower than symmetric encryption for bulk data","Asymmetric key pairs can be used to create digital signatures","AES is an asymmetric algorithm","Symmetric encryption removes the need to securely share a key","RSA uses one shared secret key for both parties"],[0,1],"Asymmetric algorithms are computationally heavier, which is why they usually protect session keys, and the private key signs data. AES is symmetric, symmetric keys must be shared securely, and RSA uses a key pair."],[1,"A legacy payroll server cannot support multifactor authentication. The security team restricts access to it through a hardened jump host limited to three source IP addresses and enables detailed session logging. Which control type does this arrangement represent?",["Corrective","Deterrent","Preventive","Compensating"],3,"A compensating control substitutes for a requirement that cannot be met directly, here MFA. Preventive describes the function of the controls, but the reason they were chosen is compensation for a gap."],[1,"A help desk technician authenticates to a ticketing system, opens a ticket and tries to view an executive's HR record, which the system denies. Weeks later an auditor reviews which technician queried that record. Which AAA functions were involved, in order of the denial and the audit review?",["Authorization, then authentication","Authorization, then accounting","Authentication, then accounting","Accounting, then authorization"],1,"The denial is an authorization decision based on permissions, and the later review depends on accounting records of activity. Authentication only proves who the user is."],[1,"A certificate authority hierarchy is being designed. To BEST limit the damage if an intermediate CA is compromised and to protect the trust anchor, how should the root CA be handled?",["Kept online so that it can issue certificates quickly","Shared across partner organizations for cross-signing","Replaced by a self-signed certificate on each web server","Kept offline and used only to sign intermediate CA certificates"],3,"Keeping the root offline greatly reduces exposure of the highest-trust key, and intermediates issue day-to-day certificates. An online root defeats the purpose of the hierarchy."],[1,"A security engineer selects a hashing algorithm for verifying software releases. The primary requirement is that it be computationally infeasible to find two different files that produce the same digest. Which property is the engineer evaluating?",["Collision resistance","Forward secrecy","Key stretching","Reversibility"],0,"Collision resistance means two different inputs should not yield the same hash, which matters for integrity verification. Hashes are intentionally irreversible."],[1,"An organization uses one wildcard certificate (*.example.com) on dozens of servers to simplify management. What is the MOST significant security risk of this practice?",["Browsers never trust wildcard certificates","Wildcard certificates cannot use strong key lengths","Compromise of the single private key affects every subdomain that uses it","Wildcard certificates cannot be revoked"],2,"Because one private key is shared across many hosts, theft from any one server lets an attacker impersonate all of them. Wildcard certificates can be revoked and are broadly trusted."],[2,"Finance staff receive a message that looks like it came from the CFO's domain, though the reply-to address differs slightly. It urgently requests a wire to a new supplier and asks for confidentiality. Which attack is this MOST likely?",["Business email compromise","Watering hole attack","Whaling through a malicious attachment","Credential stuffing"],0,"Business email compromise impersonates an executive to authorize fraudulent payments. Whaling targets executives as victims, whereas here the executive is the impersonated party."],[2,"A caller with a spoofed internal phone number tells an employee that the bank has detected fraud on their corporate card, and asks the employee to read back the one-time code just sent to their phone. Which social engineering technique is this?",["Tailgating","Vishing","Typosquatting","Smishing"],1,"Vishing uses voice calls to manipulate victims, here to obtain an MFA code. Smishing would use text messages as the delivery channel."],[2,"A widely used IT management product ships a signed update that installs a hidden backdoor on thousands of customer networks. Investigators find the vendor's build server was compromised. Which attack category BEST describes this?",["Supply chain attack","Watering hole attack","Zero-day exploit against customers","Insider threat"],0,"The attackers compromised a trusted vendor to reach downstream customers. The customers were not individually targeted through a vulnerability in their own systems."],[2,"A vendor announces that a remote code execution flaw in its web application server is being exploited in the wild and that no patch will be available for two weeks. Which action is the BEST immediate mitigation?",["Deploy a virtual patch on the WAF or IPS and restrict network exposure of the server","Increase the password length requirement","Disable all logging to improve performance","Wait for the patch and take no action"],0,"A virtual patch and reduced exposure compensate for the missing fix. Waiting leaves an actively exploited flaw open, and password changes do not affect a code execution flaw."],[2,"A user opens a Word document and a macro launches PowerShell, which downloads and runs a payload directly in memory. No new executable is written to disk, and traditional signature-based antivirus raises no alert. Which malware type is this?",["Rootkit installed through a driver","Logic bomb","Fileless malware","Boot sector virus"],2,"Fileless malware runs in memory and abuses legitimate tools such as PowerShell, which evades file-based scanning. A rootkit would require persistence below the operating system, which is not described."],[2,"A tenant in a cloud environment runs code that breaks out of its virtual machine and gains control of the hypervisor, giving it access to other tenants' workloads. Which vulnerability type is this?",["Sandbox evasion in a browser","Virtual machine escape","Side-loading","Container image tampering"],1,"A VM escape lets code in a guest interact with the host or hypervisor. The other terms do not describe breaking out of virtualization."],[2,"A development team is concerned that attackers will exploit a stack buffer overflow by jumping to predictable memory addresses. Which operating system protection BEST makes this more difficult?",["Address space layout randomization","Mandatory access control labels","Data masking","Salting of memory pages"],0,"ASLR randomizes where code and data load in memory, so attackers cannot rely on fixed addresses. The other options do not address memory layout."],[2,"A bank customer is logged in to the online banking site and, in another tab, visits a malicious page that silently submits a funds transfer request using the customer's active session. Which TWO controls BEST mitigate this attack? (Choose TWO.)",["Anti-forgery tokens on state-changing requests","SameSite cookie attribute","Output encoding of user-supplied text","Parameterized database queries","Salted password hashing"],[0,1],"This is cross-site request forgery. Anti-forgery tokens and SameSite cookies stop cross-origin requests from riding on the session. Output encoding stops XSS and parameterized queries stop SQL injection."],[2,"Attackers use username and password pairs leaked from an unrelated retailer's breach to log in to the company's customer portal, making only one attempt per account from many IP addresses. Which control is MOST effective against this attack?",["Longer session timeouts","Account lockout after five failed attempts","Multifactor authentication","Blocking a single IP address"],2,"This is credential stuffing, and MFA stops stolen passwords from being sufficient. Lockout is weak because each account sees only one attempt, and the attempts come from many IP addresses."],[2,"Users who type the correct bank domain are being sent to a fraudulent site. Analysis shows the company's recursive resol
