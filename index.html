<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="SOC analyst field notes and Security+ SY0-701 practice in one place.">
<title>SOC Field Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: true-black study console. Sticky top nav with sections; reading column for notes; one question per screen with a sticky action bar */
:root{
  --bg:#000000; --surface:#0b0b0c; --raise:#141415; --sunk:#050505; --line:#1f1f22; --line-2:#2c2c30;
  --fg:#ececee; --muted:#9a9aa2; --dim:#626268;
  --accent:#8fb0ff; --accent-ink:#000000; --accent-soft:#16203a;
  --good:#5fd394; --good-soft:#0f2618; --bad:#f2797b; --bad-soft:#2c1012; --warn:#e8b553; --warn-soft:#2a200b;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --fs:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:var(--fs);line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2.1rem;line-height:1.08}
h2{font-size:1.4rem}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
button,select,input[type=text],input[type=search],textarea{font:inherit;color:var(--fg)}
button{cursor:pointer;border-radius:6px;border:1px solid var(--line-2);background:var(--raise);padding:.5rem .9rem;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-within,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{border-color:var(--bad);color:var(--bad);background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
select,input[type=text],input[type=search],textarea{background:var(--sunk);border:1px solid var(--line-2);border-radius:6px;padding:.5rem .7rem;min-height:40px;max-width:100%}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.78rem}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px}
.note{font-size:.82rem;color:var(--muted)}

/* Top nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:18px}
.top-in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;background:none;border:0;padding:0;min-height:0}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.02em}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--muted);min-height:36px;padding:.35rem .7rem;border-radius:6px;white-space:nowrap;font-size:.92rem}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.foot{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--dim);font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-align:center}

/* Home + dashboard */
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:1.9rem;line-height:1.05}
.kpi span{font-size:.78rem;color:var(--muted)}
.ready{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.gauge{width:110px;height:110px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ledger{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.lrow:first-child{border-top:0;padding-top:0}
.lrow .name{font-size:.92rem;min-width:0}
.lrow .pct{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.meter{grid-column:1 / -1;height:6px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.meter::after{content:"";position:absolute;top:0;bottom:0;left:83.3%;width:2px;background:var(--fg);opacity:.35}

/* Lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
button.item{width:100%;text-align:left;border-radius:0;border:0;border-top:1px solid var(--line);background:transparent;min-height:0}
button.item:first-child{border-top:0}
button.item:hover{background:var(--raise)}
.pnum{font-family:var(--f-display);font-size:1.6rem;font-weight:700;color:var(--accent);line-height:1}
.pnum.done{color:var(--good)}
.meta{min-width:0}
.meta strong{display:block;font-weight:600}
.meta small{color:var(--muted);font-size:.82rem;display:block}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.pill.prog{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;max-width:100%}
.seg label{display:flex;align-items:center;gap:6px;padding:.45rem .8rem;cursor:pointer;font-size:.9rem;background:var(--raise)}
.seg label+label{border-left:1px solid var(--line-2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--fg);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;min-width:0}
.card p{font-size:.88rem;color:var(--muted)}
.card .row{margin-top:auto}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.check input{accent-color:var(--accent);width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:.3rem .7rem;font-size:.85rem;cursor:pointer;background:var(--raise)}
.chips input{accent-color:var(--accent)}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* Reader */
.reader-head{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.readbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:11;height:2px;pointer-events:none}
.readbar i{display:block;height:100%;width:0;background:var(--accent)}
details.toc{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px}
details.toc summary{cursor:pointer;color:var(--muted);font-size:.9rem}
details.toc ol{margin:10px 0 0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.md{max-width:72ch;font-size:1.02em;line-height:1.7;overflow-wrap:anywhere}
.md>*+*{margin-top:.85em}
.md h2{font-size:1.55rem;margin-top:1.8em;padding-top:.4em;border-top:1px solid var(--line);scroll-margin-top:80px}
.md h3{font-size:1.2rem;margin-top:1.4em;color:var(--fg);scroll-margin-top:80px}
.md h4{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:1.2em}
.md p{margin:0}
.md ul,.md ol{padding-left:1.3rem;margin-block:0}
.md li+li{margin-top:.25em}
.md strong{color:#fff;font-weight:600}
.md code{font-family:var(--f-mono);font-size:.86em;background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:.05em .35em}
.md pre{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;line-height:1.5}
.md pre code{background:none;border:0;padding:0;font-size:.82rem}
.md blockquote{margin:0;border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line)}
.md .tablewrap{margin-top:1em}
.chapnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:28px}
.chapnav button{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px 14px;min-height:64px}
.chapnav button.nx{text-align:right;align-items:flex-end}
.chapnav small{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:10px;margin-bottom:6px}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.timer{font-family:var(--f-mono);font-size:1.05rem;font-weight:500}
.timer.low{color:var(--bad)}
.qcard{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--raise);color:var(--muted);border:1px solid var(--line)}
.tag.two{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.src{background:transparent}
.qtext{font-size:1.08em;line-height:1.62}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:grid;grid-template-columns:1.9rem minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 10px 11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .key{font-family:var(--f-mono);font-weight:500;width:1.9rem;height:1.9rem;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:5px;font-size:.85rem}
.opt .t{min-width:0;padding-top:3px}
.opt .x{min-height:28px;height:28px;width:28px;padding:0;border-radius:5px;background:transparent;border-color:transparent;color:var(--dim);font-size:.85rem;line-height:1}
.opt .x:hover{border-color:var(--line-2);color:var(--fg)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.struck .t{text-decoration:line-through;color:var(--dim)}
.opt.struck .key{color:var(--dim)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);color:var(--sunk);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--sunk);border-color:var(--bad)}
.opt.locked{cursor:default}
.explain{border-left:3px solid var(--accent);background:var(--surface);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.95em}
.explain b{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase}
.explain.ok{border-left-color:var(--good)} .explain.ok b{color:var(--good)}
.explain.no{border-left-color:var(--bad)} .explain.no b{color:var(--bad)}
.actions{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.actions .mid{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
button.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
button.bm[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{min-height:34px;padding:0;font-family:var(--f-mono);font-size:.76rem}
.grid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.grid button.flg{box-shadow:inset 0 -3px 0 var(--warn)}
.grid button.cur{outline:2px solid var(--fg);outline-offset:1px}
.grid button.g-ok{background:var(--good-soft);border-color:var(--good)}
.grid button.g-no{background:var(--bad-soft);border-color:var(--bad)}
details.palette{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
details.palette summary{cursor:pointer;font-size:.9rem;color:var(--muted)}
details.palette .grid{margin-top:10px}
.confirm{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.keys{font-size:.78rem;color:var(--dim)}
kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* Results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.scaled{font-family:var(--f-display);font-size:3.4rem;font-weight:700;line-height:1}
.scaled small{font-size:1rem;color:var(--muted);font-weight:600}
.verdict{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:10px}
.rev .opt{cursor:default;grid-template-columns:1.9rem minmax(0,1fr)}

/* Reference + search */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--raise);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.mono{white-space:nowrap}
.flash{min-height:190px;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;user-select:none}
.flash .front{font-family:var(--f-display);font-size:2.6rem;font-weight:700;letter-spacing:.02em}
.flash .back{font-size:1.15rem;max-width:44ch}
.hit{padding:12px 0;border-top:1px solid var(--line)}
.hit:first-child{border-top:0;padding-top:0}
.hit .snip{font-size:.92rem;color:var(--muted)}
mark{background:var(--warn-soft);color:var(--warn);border-radius:2px;padding:0 2px}
.history td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;min-height:0;color:var(--accent);text-align:left;font-weight:600;text-decoration:underline;text-underline-offset:3px}

@media (max-width:640px){
  h1{font-size:1.7rem}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards,.split,.chapnav{grid-template-columns:1fr}
  .item{grid-template-columns:2.4rem minmax(0,1fr)}
  .item .act{grid-column:1 / -1}
  .score,.ready{grid-template-columns:1fr}
  .scaled{font-size:2.8rem}
  .brand span{display:none}
  .actions .keyhint{display:none}
}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .25s ease}.meter i,.bar i{transition:width .4s ease}}
</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const PAPERS = [[[1,"A company posts signs at its entrances warning that the premises are under 24-hour video surveillance. Which control type do the signs primarily represent?",["Deterrent","Detective","Corrective","Compensating"],0,"Signs discourage an attacker before an attempt is made, which makes them deterrent. The cameras themselves would be detective."],[1,"Which of the following provides non-repudiation for an email message?",["Hashing the message","Encrypting the message with a symmetric key","Digitally signing the message","Salting the message"],2,"A digital signature is made with the sender's private key, which only the sender holds, so the sender cannot plausibly deny sending it."],[1,"In a Zero Trust architecture, which component makes the decision to grant, deny or revoke access to a resource?",["Policy enforcement point","Policy engine","Subject","Implicit trust zone"],1,"The policy engine (control plane) makes the decision. The policy administrator acts on it, and the policy enforcement point (data plane) enforces it."],[1,"A security analyst plants a fake administrator credential in a database. Any use of that credential triggers an alert. What is this called?",["Honeypot","Honeynet","Honeytoken","Honeyfile"],2,"A honeytoken is a piece of fake data, such as a credential or record, that has no legitimate use, so any use of it indicates compromise."],[1,"Before applying a major patch, a change advisory board requires a documented way to return the system to its previous state if the patch fails. What is this document?",["Impact analysis","Backout plan","Maintenance window","Standard operating procedure"],1,"A backout plan (rollback plan) describes how to reverse a change if it causes problems."],[1,"A company compares its current security controls against the NIST Cybersecurity Framework to identify which controls are missing. What is this activity?",["Risk register review","Gap analysis","Penetration test","Tabletop exercise"],1,"A gap analysis compares the current state with a target framework or baseline to find missing controls."],[1,"A user downloads an ISO image and wants to verify that it was not altered. Which should be used?",["AES-256","SHA-256","RSA-2048","ECDHE"],1,"Comparing a SHA-256 hash with the published value verifies integrity. AES is encryption, RSA is asymmetric crypto, and ECDHE is key exchange."],[1,"Which technique makes stored password hashes more resistant to brute-force attacks by deliberately increasing the computation time per guess?",["Key stretching","Tokenization","Obfuscation","Steganography"],0,"Key stretching algorithms (PBKDF2, bcrypt, Argon2) run many iterations, which slows each guess."],[1,"A browser needs to check, in real time, whether a server's certificate has been revoked. Which protocol is used?",["CRL","OCSP","CSR","CA"],1,"OCSP returns the status of a single certificate in real time. A CRL is a downloaded list that is updated periodically."],[1,"Alice wants to send Bob a message that only Bob can read. Which key should Alice use to encrypt it?",["Alice's private key","Alice's public key","Bob's public key","Bob's private key"],2,"Encrypting with the recipient's public key means only the recipient's private key can decrypt it."],[1,"What is the primary purpose of an access control vestibule?",["Prevent tailgating","Detect electromagnetic interference","Provide fire suppression","Speed up visitor sign-in"],0,"A vestibule (mantrap) lets only one door open at a time, which stops unauthorized people following an authorized person in."],[2,"An employee receives a text message claiming to be from the bank, with a link to verify an account. Which attack is this?",["Vishing","Smishing","Whaling","Pharming"],1,"Smishing is phishing over SMS. Vishing uses voice calls, and whaling targets executives."],[2,"An attacker registers 'paypa1.com' to capture credentials from users who mistype the real domain. Which attack is this?",["Typosquatting","Watering hole","DNS poisoning","Pretexting"],0,"Typosquatting relies on look-alike or misspelled domains."],[2,"Attackers compromise an industry forum that employees of a target company visit often, and use it to deliver malware to them. Which attack is this?",["Spear phishing","Watering hole","Business email compromise","Smishing"],1,"A watering hole attack compromises a site the target group already trusts and visits."],[2,"Which threat actor is MOST likely to have significant funding and to run long-term, persistent intrusions for espionage?",["Hacktivist","Unskilled attacker","Nation-state","Insider threat"],2,"Nation-state actors are well funded and conduct advanced persistent threat (APT) campaigns."],[2,"A group defaces a government website to protest a new law. Which threat actor is MOST likely responsible?",["Organized crime","Hacktivist","Shadow IT","Nation-state"],1,"Hacktivists are motivated by political or philosophical beliefs."],[2,"A department starts storing customer files in a personal cloud storage service that IT has not approved. What does this describe?",["Insider threat","Shadow IT","Supply chain attack","Hacktivism"],1,"Shadow IT is the use of technology without the organization's approval or oversight."],[2,"A web server log shows the input ' OR 1=1 -- in a login field. Which attack is being attempted?",["Cross-site scripting","SQL injection","Directory traversal","Cross-site request forgery"],1,"' OR 1=1 -- makes the WHERE clause always true and comments out the rest of the query, which is classic SQL injection."],[2,"A request to a web server contains ../../../../etc/passwd. Which attack is this?",["Command injection","Directory traversal","Buffer overflow","Replay attack"],1,"The ../ sequences try to move outside the web root to read arbitrary files."],[2,"A user posts a comment containing a <script> tag on a forum. The script runs in the browser of every user who views the comment. Which attack is this?",["Stored cross-site scripting","SQL injection","Cross-site request forgery","LDAP injection"],0,"The script is saved on the server and served to other users, which makes it stored (persistent) XSS."],[2,"A packet capture shows a long run of 0x90 bytes followed by shellcode sent to a service. Which attack does this indicate?",["Race condition","Buffer overflow","Pass-the-hash","Credential stuffing"],1,"0x90 is the x86 NOP instruction. A NOP sled followed by shellcode is a typical buffer overflow exploit."],[2,"An application checks a file's permissions and then opens the file. An attacker swaps the file between those two steps. What is this vulnerability?",["Memory leak","Time-of-check to time-of-use","Integer overflow","Misconfiguration"],1,"A TOCTOU race condition happens when the state changes between the check and the use."],[2,"Users report that their files now have a .locked extension and that a text file demands payment in cryptocurrency. What is the MOST likely cause?",["Ransomware","Rootkit","Logic bomb","Spyware"],0,"Encrypted, renamed files and a ransom note are the main indicators of ransomware."],[2,"A developer plants code that deletes payroll records if their name is ever removed from the HR system. What is this?",["Trojan","Worm","Logic bomb","Keylogger"],2,"A logic bomb runs its malicious action when a specific condition is met."],[2,"Authentication logs show a few common passwords tried once each against hundreds of different accounts. Which attack is this?",["Brute force","Password spraying","Rainbow table","Credential stuffing"],1,"Password spraying tries a small number of common passwords across many accounts to stay under lockout thresholds."],[2,"An attacker extracts an NTLM hash from memory and uses it to authenticate to another server without cracking it. Which attack is this?",["Pass-the-hash","Password spraying","Birthday attack","Downgrade attack"],0,"Pass-the-hash reuses the hash itself as the authenticator."],[2,"An on-path attacker forces a client and server to negotiate TLS 1.0 instead of TLS 1.3. Which attack is this?",["Downgrade attack","Collision attack","Replay attack","DNS amplification"],0,"A downgrade attack forces the use of an older, weaker protocol or cipher."],[2,"An analyst sees that several IP addresses in a host's ARP cache map to the same MAC address. Which attack is MOST likely?",["MAC flooding","ARP poisoning","DNS sinkholing","VLAN hopping"],1,"ARP poisoning maps the attacker's MAC to other IPs, often the gateway, so the attacker sits on the path of the traffic."],[2,"Attackers send small DNS queries with a spoofed source address, and open resolvers send large responses to the victim. Which attack is this?",["DNS amplification","DNS tunneling","Domain hijacking","Ping of death"],0,"Reflected amplification uses small requests that produce much larger responses aimed at a spoofed victim."],[2,"Which action BEST reduces the attack surface of a newly deployed server?",["Open all ports for monitoring","Disable unnecessary services and ports","Install additional management agents","Keep default credentials for consistency"],1,"Hardening removes anything not needed, which leaves fewer services and ports to attack."],[2,"Which mitigation BEST prevents compromised IoT devices from reaching finance servers?",["Network segmentation","Encryption at rest","Tokenization","Data masking"],0,"Segmentation (VLANs or ACLs) isolates the IoT devices so a compromise cannot spread to sensitive systems."],[3,"What is the primary security benefit of infrastructure as code (IaC)?",["It removes the need for patching","It produces consistent, repeatable configurations that can be reviewed and version-controlled","It removes the need for access control","It guarantees all data is encrypted"],1,"IaC defines environments in code, which reduces configuration drift and lets changes be reviewed like any other code."],[3,"In an IaaS cloud model, who is responsible for patching the guest operating system?",["The cloud provider","The customer","Both parties equally","The hardware vendor"],1,"In IaaS the provider secures the physical hosts and hypervisor, and the customer manages the OS and everything above it."],[3,"A plant's operational technology network has no physical or wireless connection to any other network. What is this design called?",["VLAN","Air gap","Screened subnet","VPN"],1,"An air gap isolates a network physically from all others."],[3,"Administrators must first connect to a hardened intermediate host before they can manage servers in a secure zone. What is this host called?",["Proxy server","Jump server","Load balancer","Honeypot"],1,"A jump server (jump box) is a single, controlled and monitored entry point for administrative access."],[3,"Which device is BEST suited to protecting a public web application from SQL injection and XSS?",["Web application firewall","Stateless packet filter","Passive IDS","NAT gateway"],0,"A WAF inspects HTTP traffic at Layer 7 and can block application attacks such as SQLi and XSS."],[3,"Policy requires a perimeter firewall to block all traffic if the device fails. Which behavior is required?",["Fail-open","Fail-closed","Active/active","Inline tap"],1,"Fail-closed (fail-secure) blocks traffic on failure, which favors confidentiality over availability."],[3,"A security device must be able to block malicious traffic in real time. How should it be deployed?",["As an IDS on a network TAP","As an inline IPS","As a sensor on a SPAN port","As a NetFlow collector"],1,"Only an inline device can drop traffic. TAP and SPAN deployments are passive and can only alert."],[3,"Data being processed in a server's RAM is in which state?",["Data at rest","Data in transit","Data in use","Data sovereignty"],2,"Data in use is data being processed in memory or by the CPU."],[3,"Which concept states that data is subject to the laws of the country where it is stored?",["Data sovereignty","Data minimization","Data retention","Data obfuscation"],0,"Data sovereignty means local law applies to data based on where it physically resides."],[3,"A payment system replaces each card number with a random value. The mapping to the real number is kept in a secure vault. What is this technique?",["Hashing","Tokenization","Masking","Encryption"],1,"Tokenization swaps sensitive data for a token that has no mathematical relationship to the original value."],[3,"Support staff should see only the last four digits of a customer's card number. Which technique meets this requirement?",["Masking","Tokenization","Steganography","Hashing"],0,"Masking hides part of the data in a display while keeping it partly visible."],[3,"Which metric defines the maximum acceptable amount of data loss, measured in time?",["RTO","RPO","MTBF","MTTR"],1,"The recovery point objective is how far back in time you can afford to lose data. RTO is how long you can be down."],[3,"A company needs a recovery site that is fully equipped with current data and can take over within minutes. Which site type is required?",["Cold site","Warm site","Hot site","Mobile site"],2,"A hot site is fully operational and kept in sync, so failover is nearly immediate."],[3,"A full backup runs on Sunday and incremental backups run Monday through Thursday. The server fails on Friday morning. What is needed to restore it?",["Sunday's full backup only","Sunday's full backup and Thursday's incremental","Sunday's full backup and the Monday-to-Thursday incrementals","Thursday's incremental only"],2,"Each incremental backup holds only the changes since the previous backup, so all of them are needed in order after the full backup."],[3,"Which provides short-term power so that servers can shut down gracefully during an outage?",["Generator","UPS","PDU","Redundant NIC"],1,"A UPS provides immediate battery power for minutes. A generator provides longer-term power."],[3,"Which model delivers network security services such as a secure web gateway, CASB and ZTNA from the cloud, combined with WAN capabilities?",["SASE","VPN concentrator","NAC","SIEM"],0,"Secure Access Service Edge (SASE) combines SD-WAN with cloud-delivered security services."],[4,"Which source provides prescriptive configuration baselines for hardening operating systems and applications?",["CIS Benchmarks","CVSS","STIX","OWASP Top 10"],0,"CIS Benchmarks are consensus hardening guides. CVSS scores vulnerabilities, STIX is a threat intelligence format, and the OWASP Top 10 lists web risks."],[4,"An employee loses a company smartphone. Which tool allows IT to wipe it remotely?",["MDM","DLP","EDR","SIEM"],0,"Mobile device management enforces policy and can lock or wipe devices remotely."],[4,"Which WPA3 feature replaces the pre-shared key handshake and protects against offline dictionary attacks?",["TKIP","SAE","WPS","CCMP"],1,"Simultaneous Authentication of Equals (SAE) replaces the WPA2 PSK four-way handshake and resists offline cracking."],[4,"A company wants each Wi-Fi user to authenticate with their own directory credentials. Which should be implemented?",["WPA3-Personal","Open network with a captive portal","802.1X with a RADIUS server","MAC filtering"],2,"Enterprise mode uses 802.1X/EAP with a RADIUS server for per-user authentication."],[4,"A security team cannot patch effectively because it does not know which systems exist. Which process should be improved FIRST?",["Asset inventory","Penetration testing","Threat hunting","Data retention"],0,"You cannot secure or patch what you don't know about. Asset management comes first."],[4,"Hard drives that held PHI are being retired and will not be reused. Which method BEST ensures the data cannot be recovered?",["Quick format","Shredding","Deleting the partitions","Renaming the volumes"],1,"Physical destruction such as shredding guarantees the data cannot be recovered. Formatting and deleting partitions leave data recoverable."],[4,"Which type of vulnerability scan gives the most accurate patch-level results with the fewest false positives?",["Non-credentialed","Credentialed","Passive","External"],1,"A credentialed scan logs in and can read installed versions directly."],[4,"A scanner reports an Apache vulnerability on a server that runs only IIS. What is this finding?",["True positive","False positive","False negative","True negative"],1,"The reported vulnerability does not exist on the server, so it is a false positive."],[4,"Which system provides a numerical severity score for vulnerabilities?",["CVE","CVSS","CWE","OVAL"],1,"CVSS scores severity from 0 to 10. CVE is an identifier and CWE classifies weakness types."],[4,"A legacy system cannot be patched because the vendor no longer supports it. What is the BEST action?",["Accept the risk without documenting it","Isolate the system on a segmented network with strict ACLs","Disable logging to improve performance","Remove antivirus to avoid conflicts"],1,"When patching isn't possible, isolation is a compensating control. The risk should also be formally documented."],[4,"Which tool aggregates logs from many sources and correlates events to generate alerts?",["SOAR","SIEM","NetFlow","DLP"],1,"SIEM collects, normalizes and correlates logs. SOAR automates the response."],[4,"A SOC wants to automatically isolate hosts and block IPs using predefined playbooks. Which tool should it use?",["SIEM","SOAR","EDR","CASB"],1,"Security orchestration, automation and response (SOAR) runs automated playbooks."],[4,"Which control can block outbound emails containing 16-digit numbers that pass a Luhn check?",["IDS","DLP","WAF","NAC"],1,"Data loss prevention uses pattern matching and validators such as Luhn to detect card numbers leaving the organization."],[4,"Before a laptop is allowed onto the network, a system checks that it has current antivirus and patches. What is this system?",["NAC","DLP","Proxy","VPN"],0,"Network access control performs posture checks before granting access."],[4,"Which tool detects suspicious process behavior on endpoints and lets an analyst isolate a host remotely?",["EDR","Signature-only antivirus","Host firewall","File integrity monitoring"],0,"Endpoint detection and response monitors behavior and supports response actions such as isolation."],[4,"Which DNS record tells receiving mail servers what to do with messages that fail SPF or DKIM alignment?",["SPF","DKIM","DMARC","MX"],2,"DMARC publishes the policy (none, quarantine or reject) and reporting addresses."],[4,"Which combination is an example of multifactor authentication?",["Password and PIN","Password and security question","Smart card and PIN","Fingerprint and face scan"],2,"A smart card is something you have and a PIN is something you know. The other options use two factors of the same type."],[4,"Two organizations want single sign-on that exchanges XML-based authentication assertions. Which standard should they use?",["SAML","Kerberos","RADIUS","LDAP"],0,"SAML uses XML assertions between an identity provider and a service provider for federated SSO."],[4,"A user wants a third-party app to access their calendar without giving the app their password. Which standard enables this?",["OAuth","TACACS+","NTLM","LDAP"],0,"OAuth is an authorization framework that issues scoped access tokens."],[4,"Administrators should receive elevated rights only when needed, and those rights should expire automatically. Which BEST meets this requirement?",["Just-in-time access through PAM","Shared administrator accounts","Permanent domain admin rights for all IT staff","A single admin password reused across systems"],0,"Privileged access management with just-in-time, time-limited elevation enforces least privilege."],[4,"Access is granted based on classification labels such as Secret and Top Secret assigned to users and data. Which access control model is this?",["DAC","MAC","RBAC","ABAC"],1,"Mandatory access control uses labels and clearances set by the system, not by data owners."],[4,"Access depends on the user's department, the time of day and whether the device is managed. Which model is this?",["ABAC","DAC","MAC","RBAC"],0,"Attribute-based access control evaluates multiple attributes of the user, resource and environment."],[4,"An infected host has just been isolated from the network. What is the NEXT step in incident response?",["Lessons learned","Eradication","Preparation","Detection"],1,"The order is preparation, detection, analysis, containment, eradication, recovery, then lessons learned. Isolation is containment, so eradication comes next."],[4,"Which document records who handled a piece of evidence and when?",["Legal hold","Chain of custody","E-discovery","Order of volatility"],1,"Chain of custody records every transfer of evidence so it remains admissible."],[4,"During forensic collection, which should be collected FIRST?",["Hard disk image","RAM contents","Archived backups","Printed logs"],1,"Following the order of volatility, memory is lost at power-off, so it is collected before disk."],[5,"An asset is worth $100,000, the exposure factor is 40%, and the event is expected once every two years. What is the ALE?",["$20,000","$40,000","$50,000","$200,000"],0,"SLE = $100,000 x 0.4 = $40,000. ARO = 0.5. ALE = SLE x ARO = $20,000."],[5,"A company buys cyber insurance to cover breach costs. Which risk response is this?",["Avoid","Transfer","Accept","Mitigate"],1,"Insurance transfers the financial impact of the risk to a third party."],[5,"A company stops offering a product feature because its security risk is too high. Which risk response is this?",["Acceptance","Avoidance","Transference","Mitigation"],1,"Avoidance removes the activity that creates the risk."],[5,"Which document lists identified risks with their owners, ratings and treatments?",["Risk register","BIA","SLA","MOU"],0,"A risk register tracks each risk, its likelihood and impact, its owner and its response."],[5,"Which assessment identifies critical business functions and the impact of their disruption?",["Penetration test","Business impact analysis","Vulnerability scan","Gap analysis"],1,"A BIA identifies critical processes and drives RTO and RPO targets."],[5,"A contract specifies 99.9% uptime and financial penalties if it is missed. What is this agreement?",["MOU","NDA","SLA","BPA"],2,"A service level agreement defines measurable service levels and the penalties for missing them."],[5,"Under an existing master agreement, which document defines the specific deliverables and timeline for a project?",["MSA","SOW","NDA","MOA"],1,"A statement of work describes the specific work, deliverables and schedule under an MSA."],[5,"Which contract clause lets an organization assess a vendor's security controls?",["Right-to-audit clause","Non-compete clause","Indemnity clause","Force majeure clause"],0,"A right-to-audit clause permits the customer to audit or assess the vendor."],[5,"A payroll provider processes employee data on behalf of a company. What is the provider's role?",["Data owner","Data controller","Data processor","Data subject"],2,"The company (controller) decides the purpose, and the provider (processor) processes the data on its behalf."],[5,"Which privacy right allows an individual to request deletion of their personal data?",["Data portability","Right to be forgotten","Data minimization","Purpose limitation"],1,"The right to be forgotten (erasure, under GDPR) lets data subjects request deletion."],[5,"A penetration tester is given full network diagrams and source code before testing. Which type of test is this?",["Unknown environment","Partially known environment","Known environment","Passive reconnaissance"],2,"In a known-environment (white-box) test, the tester has full information."],[5,"Which document defines the scope, timing and permitted techniques for a penetration test?",["Rules of engagement","Acceptable use policy","SLA","Attestation"],0,"Rules of engagement set the boundaries of the test and give authorization."],[5,"What is the BEST way to measure whether phishing awareness training is effective?",["Count the training slides delivered","Run simulated phishing campaigns and track click and report rates","Survey whether employees enjoyed the training","Add more firewall rules"],1,"Simulated phishing gives measurable behavioral metrics: how many people click and how many report."],[5,"Which document do employees sign that defines the permitted use of company IT resources?",["AUP","SLA","BCP","MOU"],0,"An acceptable use policy sets the rules for using organizational systems."],[5,"A customer is reviewing a vendor's controls. Which provides the MOST independent assurance?",["Vendor self-assessment","Vendor internal audit","External third-party audit","Vendor's risk acceptance memo"],2,"An independent external audit, such as SOC 2 Type II, gives the strongest assurance because the auditor is not part of the vendor."],[5,"Which term describes the amount of risk an organization is willing to accept in pursuit of its objectives?",["Risk appetite","Inherent risk","Residual risk","Risk transfer"],0,"Risk appetite is the broad level of risk the organization will accept. Risk tolerance is the acceptable deviation from it."],[5,"Which term describes the risk that remains after controls are applied?",["Inherent risk","Residual risk","Exception","Control risk"],1,"Residual risk is the inherent risk minus the effect of controls."],[5,"A department receives approval to deviate from a security policy for 90 days, with compensating controls in place. What is this?",["Policy exception","Policy violation","Risk transference","Risk avoidance"],0,"An exception is a documented, approved, time-limited deviation, usually with compensating controls."]],[[1,"A company wants one certificate to secure www.example.com, www.example.net and mail.example.org on a single server. Which certificate type BEST meets this need?",["Code signing certificate","Wildcard certificate for *.example.com","Subject alternative name (SAN) certificate","Self-signed certificate"],2,"A SAN certificate lists multiple distinct hostnames, including different domains. A wildcard only covers subdomains of a single domain."],[1,"An organization must store and generate cryptographic keys for many servers in a tamper-resistant, FIPS-validated network appliance. Which technology fits BEST?",["Trusted Platform Module (TPM)","Secure enclave","Software key store on a file server","Hardware security module (HSM)"],3,"An HSM is a dedicated, tamper-resistant device for generating and managing keys at scale. A TPM is a chip bound to a single device."],[1,"A laptop stores its disk-encryption key in a chip on the motherboard that also measures the boot process and releases the key only if the measurements match. Which component is this?",["Hardware security module (HSM)","Trusted Platform Module (TPM)","Smart card","Key management service in the cloud"],1,"A TPM is a motherboard-bound chip that stores keys and attests platform integrity. An HSM is a separate, shared appliance or card."],[1,"A smartphone processes fingerprint data inside an isolated region of the main processor that even the operating system kernel cannot read. What is this feature called?",["Hypervisor","Sandbox","Secure enclave","Hardware security module (HSM)"],2,"A secure enclave is an isolated, protected execution area within the processor used for sensitive data and keys. A sandbox is software isolation that does not protect against a compromised OS kernel in the same way."],[1,"An organization wants a trusted third party to hold a copy of its decryption keys so that data can be recovered if an employee leaves or loses their key. What is this practice?",["Key rotation","Key escrow","Key stretching","Perfect forward secrecy"],1,"Key escrow places a copy of keys with a trusted third party for recovery. Key rotation replaces keys on a schedule and does not preserve access."],[1,"An engineer must encrypt a live audio stream one byte at a time with minimal latency. Which type of cipher is the BEST fit?",["Hashing algorithm","Asymmetric cipher","Stream cipher","Block cipher in ECB mode"],2,"Stream ciphers encrypt data continuously bit by bit or byte by byte, which suits real-time streams. Block ciphers work on fixed-size chunks, and hashes are one-way."],[1,"Why is elliptic curve cryptography (ECC) often chosen for mobile and IoT devices?",["It does not require a private key","It is a symmetric algorithm and therefore faster than any asymmetric one","It eliminates the need for certificates","It offers comparable strength to RSA with much smaller keys, using less processing and power"],3,"ECC provides strong asymmetric security with shorter keys, reducing computation and power use. It still uses key pairs and certificates."],[1,"A web server's long-term private key is stolen a year after a set of encrypted sessions were recorded. The sessions remain unreadable because each used a unique, temporary key pair. Which property does this describe?",["Obfuscation","Perfect forward secrecy","Key escrow","Non-repudiation"],1,"Perfect forward secrecy uses ephemeral key exchange (such as ECDHE) so past sessions stay safe even if a long-term key is later compromised."],[1,"A file integrity monitoring tool alerts that the hash of a critical system binary has changed unexpectedly. Which security property is MOST directly in question?",["Confidentiality","Availability","Integrity","Non-repudiation"],2,"A changed hash means the file's content was modified, which is a violation of integrity."],[1,"One employee in the accounts department creates new vendors, and a different employee must approve payments to those vendors. Which principle does this illustrate?",["Least privilege","Implicit deny","Job rotation","Separation of duties"],3,"Separation of duties splits a critical process among people so that no one individual can commit fraud alone. Least privilege limits the rights each person has."],[1,"Which TWO of the following are asymmetric algorithms? (Choose TWO.)",["Elliptic curve cryptography (ECC)","ChaCha20","RSA","3DES","AES"],[0,2],"RSA and ECC use public/private key pairs. AES, 3DES and ChaCha20 are symmetric ciphers."],[2,"An attacker obtains a fraudulent certificate for a bank's domain from a compromised certificate authority and attempts an on-path attack against the bank's mobile app. Which control BEST prevents the app from trusting this certificate?",["Longer session timeouts","Certificate pinning","Using a wildcard certificate","Enabling OCSP only on the server"],1,"Pinning makes the app accept only a specific certificate or public key, so a fraudulent certificate from another or compromised CA is rejected."],[2,"An attacker steals an unsalted password database and recovers many passwords by looking up each hash in a large precomputed table. Which attack is this, and what would have mitigated it?",["Dictionary attack; shorter hashes","Pass-the-hash attack; MFA only","Birthday attack; larger tables","Rainbow table attack; unique salts per password"],3,"Rainbow tables are precomputed hash lookups. Unique salts make each hash different, rendering precomputed tables ineffective."],[2,"Two different documents are crafted so that they produce the same hash value, allowing a forged document to pass a signature check. Which attack is this?",["Rainbow table attack","Downgrade attack","Hash collision (birthday) attack","Replay attack"],2,"A collision attack finds two inputs with the same hash, exploiting weak hash functions such as MD5. Strong hashes like SHA-256 resist this."],[2,"Attackers use usernames and passwords leaked from one retailer's breach to log in to accounts at many unrelated websites. Which attack is this?",["Password spraying","Rainbow table","Brute force","Credential stuffing"],3,"Credential stuffing replays known username and password pairs from prior breaches against other sites, relying on password reuse. Spraying tries a few common passwords against many accounts."],[2,"An employee receives a phone call from someone claiming to be the IT help desk who asks for the employee's MFA code to fix an account problem. Which social engineering technique is this?",["Vishing","Smishing","Pharming","Typosquatting"],0,"Vishing is voice-based phishing conducted by phone."],[2,"The accounts payable team receives an email that appears to come from the CFO's real address, urgently requesting a wire transfer to a new vendor. Which attack is MOST likely occurring?",["Business email compromise","Bluejacking","Ransomware","Cross-site scripting"],0,"Business email compromise uses impersonation or a compromised mailbox of an executive to trick staff into fraudulent payments."],[2,"A novice with no programming skill downloads a point-and-click tool and uses it to attack a school website for fun. Which threat actor is this?",["Insider threat","Unskilled attacker (script kiddie)","Nation-state","Organized crime"],1,"Unskilled attackers use tools created by others and typically have little sophistication or funding, unlike nation-states or organized crime."],[2,"A routine software update from a trusted vendor installs a backdoor because the vendor's build system was compromised. Which attack category is this?",["Zero-day exploit","Supply chain attack","Evil twin attack","Watering hole attack"],1,"A supply chain attack compromises a trusted supplier so that malicious code reaches customers through legitimate channels."],[2,"A vulnerability is being exploited in the wild, and the vendor has not yet released a patch or even acknowledged the flaw. What is this called?",["Race condition","Misconfiguration","Legacy vulnerability","Zero-day vulnerability"],3,"A zero-day is a flaw unknown to or unpatched by the vendor, leaving defenders no available fix."],[2,"An attacker who has control of a guest virtual machine manages to execute code on the underlying hypervisor. Which vulnerability type is this?",["VM escape","Buffer overflow in a web form","Memory leak","Jailbreaking"],0,"A VM escape breaks the isolation between guest and host and may expose other VMs on the same hypervisor."],[2,"A malware infection hides its files and processes by modifying the operating system kernel, and standard antivirus tools cannot see it. Which malware type is this?",["Worm","Rootkit","Logic bomb","Adware"],1,"A rootkit gains privileged access and conceals its presence by altering low-level system components."],[2,"Security software finds a hidden process recording every key a user types and sending the data to a remote server. Which malware type is this?",["Trojan dropper","Ransomware","Botnet agent","Keylogger"],3,"A keylogger is spyware that records keystrokes to steal credentials and other input."],[2,"A piece of malware spreads across the network by itself, exploiting an unpatched service on each host without any user interaction. Which type is this?",["Trojan","Worm","Spyware","Virus"],1,"A worm is self-replicating and propagates on its own. A virus requires a host file and user action to spread."],[2,"A web server stops responding. Its connection table shows thousands of half-open TCP connections from spoofed addresses. Which mitigation is MOST appropriate?",["Implement input validation","Enable SYN cookies","Enable MAC filtering","Apply full disk encryption"],1,"This is a SYN flood. SYN cookies let the server avoid allocating resources until the three-way handshake is completed."],[2,"An attacker captures a valid authentication message and retransmits it later to gain access. Which control BEST defeats this attack?",["Disabling unused services","Longer password length","Port security on the switch","Nonces or timestamps in the authentication exchange"],3,"A replay attack resends captured data. Unique nonces or timestamps make each message valid only once."],[2,"A user signs in from Pune and, 20 minutes later, a successful sign-in for the same account occurs from another continent. Which indicator does this MOST likely represent?",["Impossible travel, indicating a possible account compromise","Normal VPN failover","A false negative","A denial-of-service attack"],0,"Sign-ins from distant locations in an impossibly short time suggest stolen credentials or session tokens."],[2,"Which control BEST ensures that only approved executables can run on a critical server?",["Application allow list","Application block list","Host-based firewall","Disk defragmentation"],0,"An allow list permits only approved software and denies everything else. A block list only stops known-bad entries."],[2,"A code review finds a cloud API key written directly into source code that is stored in a shared repository. What is the BEST remediation?",["Make the repository private only","Obfuscate the key with Base64 in the code","Reduce the key's length","Revoke the key and move secrets to a secrets management solution"],3,"Hard-coded secrets must be rotated once exposed and kept in a secrets vault. Base64 is encoding, not protection."],[2,"A server application slowly consumes more RAM the longer it runs and eventually crashes unless restarted. Which vulnerability is MOST likely responsible?",["SQL injection","Memory leak","Cross-site request forgery","Directory traversal"],1,"A memory leak fails to release allocated memory, eventually causing resource exhaustion and denial of service."],[2,"Which TWO controls BEST mitigate SQL injection in a web application? (Choose TWO.)",["Increasing password length","Server-side input validation","Multifactor authentication","Full disk encryption","Parameterized queries (prepared statements)"],[1,4],"Parameterized queries keep data separate from SQL code, and input validation rejects malicious input. The other options do not stop injected queries."],[3,"A company hosts mail.example.com, vpn.example.com and portal.example.com and wants one certificate that covers all current and future subdomains of example.com. Which certificate is the BEST choice?",["Wildcard certificate","Code signing certificate","Extended validation certificate for a single host","Self-signed certificate"],0,"A wildcard certificate (*.example.com) covers any one-level subdomain of the domain, including ones added later."],[3,"Users of an internal test application see a browser warning that the certificate is not trusted, although the traffic is encrypted. The certificate was generated by the application server itself. What is the cause?",["The certificate is a wildcard","The certificate has been revoked by OCSP","The certificate is self-signed and does not chain to a trusted CA","The certificate uses ECC instead of RSA"],2,"A self-signed certificate is not issued by a CA in the browser's trust store, so it raises a warning. It is acceptable only for internal or test use."],[3,"A software vendor wants customers to verify that an installer really comes from the vendor and was not altered after release. Which certificate type is required?",["Wildcard certificate","Machine/computer certificate","Code signing certificate","Email (S/MIME) certificate"],2,"Code signing certificates let a publisher digitally sign software so that users can verify its origin and integrity."],[3,"When requesting a certificate from a CA, an administrator generates a certificate signing request (CSR). Which statement about the CSR is correct?",["It contains the private key so the CA can sign it","It is the final signed certificate","It contains the public key and identity information, and the private key stays with the requester","It contains the CA's root private key"],2,"A CSR includes the requester's public key and subject details. The private key is never sent to the CA."],[3,"To reduce the risk of the root CA private key being compromised, a PKI architect should do which of the following?",["Place the root CA on the DMZ for easy access","Share the root private key with all subordinate CAs","Keep the root CA offline and issue certificates through subordinate (intermediate) CAs","Use the root CA to sign every end-entity certificate directly"],2,"An offline root CA is protected from network attacks, and intermediates handle daily issuance so a compromise can be contained and revoked."],[3,"A consortium of companies wants a shared record of transactions that is distributed across many parties, append-only, and in which tampering with earlier entries is easily detected through linked hashes. Which technology fits?",["Blockchain (open public ledger)","Hardware security module","Relational database with nightly backups","Certificate revocation list"],0,"A blockchain is a distributed ledger in which each block contains the hash of the previous one, making alterations evident."],[3,"Two branch offices need all traffic between their networks encrypted across the internet, including the original IP headers. Which solution BEST fits?",["SSH port forwarding on one host","IPsec in transport mode","WPA3 Enterprise","Site-to-site IPsec VPN in tunnel mode"],3,"Tunnel mode encapsulates and encrypts the entire original packet, including headers, which suits gateway-to-gateway VPNs."],[3,"A database server must continue operating without data loss if a single disk fails, and the team wants simple mirroring. Which RAID level should be used?",["RAID 1","RAID 0","JBOD","RAID with no redundancy"],0,"RAID 1 mirrors data across two disks and survives a single-disk failure. RAID 0 stripes data with no redundancy."],[3,"A developer wants applications to run in lightweight, isolated user-space environments that share the host kernel and start quickly. Which technology is this?",["Containerization","Air gapping","Bare-metal hypervisor","Full hardware virtualization with separate kernels"],0,"Containers share the host operating system kernel while isolating processes and file systems, making them lightweight compared with full VMs."],[3,"Which device BEST distributes incoming client requests across multiple web servers to improve availability and can also offload TLS processing?",["Load balancer","Proxy-based DLP appliance","Network tap","Honeypot"],0,"A load balancer spreads traffic across servers and can terminate TLS, which supports availability and scalability."],[3,"An organization hosts public-facing web and mail servers and wants to limit exposure of its internal network if one of them is compromised. Where should these servers be placed?",["On the same VLAN as the domain controllers","Directly on the internet with no firewall","In a screened subnet (DMZ) separated from the internal network by firewalls","On the internal LAN with workstations"],2,"A screened subnet isolates public-facing systems so that a compromise has limited ability to reach internal resources."],[3,"Which TWO of the following protect data at rest? (Choose TWO.)",["IPsec tunnels between sites","TLS for web traffic","Full-disk encryption","SSH sessions","Transparent database encryption"],[2,4],"Disk and database encryption protect stored data. TLS, IPsec and SSH protect data in transit."],[3,"Two parties who have never met need to establish a shared secret key over an untrusted network without sending the key itself. Which mechanism accomplishes this?",["Symmetric encryption with a pre-shared key","Digital signature verification","SHA-256 hashing","Diffie-Hellman key exchange"],3,"Diffie-Hellman lets two parties derive a shared secret over an insecure channel. Ephemeral variants (DHE, ECDHE) also provide forward secrecy."],[3,"During a holiday sale, an e-commerce site automatically adds servers as traffic grows and removes them as it drops. Which architectural concept does this describe?",["Persistence","Elasticity","Fault tolerance","Obfuscation"],1,"Elasticity is the automatic scaling of resources up and down to match demand. Fault tolerance concerns surviving component failures."],[3,"An IDS needs to receive a copy of all traffic on a critical link without being placed inline and without affecting network performance. Which device or technique is MOST suitable?",["Network TAP or SPAN port","Load balancer","Reverse proxy","Inline IPS"],0,"A TAP or SPAN port provides a passive copy of traffic for monitoring tools, with no risk of becoming a point of failure."],[3,"Two application servers share the workload and, if one fails, the other continues to handle all requests without interruption. Which high-availability configuration is this?",["Cold standby","Air gap","Active-active clustering","Differential backup"],2,"In active-active clustering, all nodes serve traffic, so a node failure causes no outage. A cold standby must be brought online manually."],[4,"A vendor's code signing private key has been stolen. What is the FIRST action the vendor's PKI team should take regarding the certificate?",["Revoke the certificate and publish the revocation through the CRL/OCSP","Wait for the certificate to expire","Rename the certificate","Re-sign the certificate with the same key"],0,"Revoking the certificate lets relying parties stop trusting software signed with the compromised key. Expiry may be years away."],[4,"Security policy requires that cryptographic keys be replaced periodically so that a single compromised key exposes only a limited amount of data. Which practice is this?",["Key rotation","Key stretching","Key escrow","Key exchange"],0,"Key rotation replaces keys at set intervals (the cryptoperiod) to limit exposure from compromise."],[4,"A customer-facing site went offline when its TLS certificate silently expired. Which action BEST prevents a recurrence?",["Use shorter passwords for the admin account","Disable TLS on the site","Switch to self-signed certificates","Maintain a certificate inventory with expiry monitoring and automated renewal"],3,"Tracking all certificates and automating renewal prevents unnoticed expiry. Self-signed certificates would expire too and are not trusted."],[4,"Which feature allows a web server to attach a recent, CA-signed certificate status response to the TLS handshake, sparing the client from contacting the CA?",["Certificate pinning","Key escrow","Certificate chaining","OCSP stapling"],3,"With OCSP stapling, the server fetches and delivers a signed status response, improving performance and client privacy."],[4,"A vulnerability scanner fails to report a missing patch that actually exists on a server. How is this result classified?",["True positive","False negative","True negative","False positive"],1,"A false negative is a real problem that the tool fails to detect. A false positive is a reported issue that does not exist."],[4,"Which tool would MOST directly detect an unauthorized change to system configuration files on a server?",["Content filter","Honeypot","Web application firewall","File integrity monitoring"],3,"File integrity monitoring compares file hashes or attributes against a baseline and alerts on unexpected changes."],[4,"What should be done BEFORE deploying a critical operating system patch to all production servers?",["Deploy to production immediately and monitor","Skip testing if the vendor is reputable","Disable the backups to speed up deployment","Test it in a staging environment and have the change approved"],3,"Testing and change approval reduce the chance that a patch breaks production systems."],[4,"A scan returns a critical finding on an isolated lab server and a high finding on an internet-facing payment server. Which factor should the team weigh MOST when deciding which to fix first?",["The age of the scanner signatures","The cost of the scanning licence","Alphabetical order of hostnames","Exposure and asset criticality in addition to severity score"],3,"Prioritization combines severity with exploitability, exposure and business impact, so the internet-facing payment server is likely first."],[4,"In which incident response phase are playbooks written, tools deployed and staff trained?",["Eradication","Containment","Lessons learned","Preparation"],3,"Preparation is the first phase, building the plans, tools and skills needed before an incident occurs."],[4,"During a confirmed malware outbreak, which TWO actions are containment measures? (Choose TWO.)",["Isolate the affected hosts on a quarantine VLAN","Hold a lessons-learned meeting","Rewrite the acceptable use policy","Restore systems from clean backups","Disable the compromised user accounts"],[0,4],"Containment limits the spread of an incident. Restoration is recovery and a lessons-learned meeting is post-incident."],[4,"A forensic analyst creates an image of a suspect drive. Which steps BEST preserve the evidence's integrity?",["Boot the suspect system and copy files manually","Image the drive without a hash to save time","Use a write blocker and record a hash of the original and the image","Run antivirus on the original drive first"],2,"A write blocker prevents changes, and matching hashes prove the copy is identical to the original."],[4,"Legal counsel informs the security team that litigation is likely and that relevant emails and files must not be deleted. What should be implemented?",["A legal hold","A tokenization policy","A data retention shortening","A change freeze"],0,"A legal hold suspends normal deletion so that potentially relevant data is preserved for e-discovery."],[4,"Attackers keep spamming a user with MFA push notifications until the user taps Approve. Which control BEST reduces the success of this attack?",["Disabling the account lockout","Number matching on the authenticator prompt","Longer password complexity","Switching to SMS-based codes"],1,"Number matching requires the user to enter a code displayed at sign-in, so a blind approval of a push request does not succeed."],[4,"An organization wants a standard that adds an identity layer on top of OAuth 2.0, allowing apps to verify the user who authenticated. Which one is it?",["Kerberos","RADIUS","OpenID Connect","SAML assertions only"],2,"OpenID Connect is an authentication layer built on OAuth 2.0, whereas OAuth alone handles authorization."],[4,"A privileged access management tool checks out admin passwords for a limited time and records the administrator's session. What is the primary benefit?",["Removal of audit logs","Accountability and reduced risk of standing privileged credentials","Elimination of the need for MFA","Faster password cracking"],1,"Vaulting and session recording limit standing privileges and create an audit trail of privileged actions."],[4,"Permissions are assigned to groups that map to job functions such as 'Nurse' or 'Billing Clerk', and users receive permissions by being placed in those groups. Which access control model is this?",["Mandatory access control","Discretionary access control","Rule-based access control","Role-based access control"],3,"RBAC grants permissions to roles aligned with job functions, simplifying administration."],[4,"A company owns smartphones and lets employees also use them for personal purposes, while retaining control of the device. Which mobile deployment model is this?",["Sideloading","COPE (corporate-owned, personally enabled)","CYOD","BYOD"],1,"In COPE the company owns and manages the device but permits personal use. In BYOD the employee owns the device."],[4,"What is a primary benefit of automating repetitive security tasks such as account provisioning and alert enrichment?",["Elimination of the need for any security policy","Consistent execution with fewer human errors","Reduced need for logging","Guaranteed zero false positives"],1,"Automation makes tasks repeatable and reduces errors and delays, though it still needs governance and monitoring."],[4,"Which TWO DNS-based mechanisms help receiving mail servers verify that an email genuinely comes from an authorized sender? (Choose TWO.)",["PTR for web servers","DKIM","SPF","CNAME","MX"],[1,2],"SPF lists authorized sending servers, and DKIM uses a digital signature verified through a public key in DNS. MX only directs inbound mail."],[4,"A SOC wants to share indicators of compromise with partner organizations in a standardized, machine-readable format. Which pair of standards is commonly used?",["STIX and TAXII","CVSS and CVE","SCAP and PCI DSS","SNMP and Syslog"],0,"STIX defines the format of threat information, and TAXII defines how it is exchanged."],[4,"A SIEM generates hundreds of low-value alerts daily from a noisy rule, and analysts begin to ignore alerts. What is the BEST action?",["Add more low-fidelity rules","Tune the rule and thresholds to reduce false positives","Delete the SIEM logs","Disable all alerting"],1,"Tuning removes noise and combats alert fatigue while retaining detection of genuine events."],[4,"Which data source shows which hosts communicated, over which ports and in what volume, without capturing packet payloads?",["Endpoint antivirus logs","NetFlow","Vulnerability scan report","Full packet capture"],1,"NetFlow records metadata about conversations, which is lightweight compared with full packet capture."],[4,"Investigators cannot correlate firewall and server log entries because the timestamps differ by several minutes. Which control would have prevented this?",["Time synchronization with NTP across all devices","Encrypting the logs at rest","Stronger passwords","Longer log retention"],0,"Synchronized clocks are essential for accurate event correlation and forensic timelines."],[4,"Which control blocks users from reaching domains known to host malware or phishing content by evaluating name lookups against threat categories?",["Port security","DNS filtering","Network tap","Disk encryption"],1,"DNS filtering refuses to resolve malicious or prohibited domains, stopping access before a connection is made."],[4,"Before deploying wireless access points in a large warehouse, the team wants to identify coverage gaps and interference. Which activity should they perform?",["A vulnerability scan of the firmware","A tabletop exercise","A penetration test","A wireless site survey with a heat map"],3,"A site survey measures signal strength and interference to determine optimal access point placement."],[5,"A server is valued at $200,000. A flood would destroy 25% of its value, and flooding is expected once every two years. What is the annualized loss expectancy (ALE)?",["$12,500","$50,000","$25,000","$100,000"],2,"SLE = $200,000 x 0.25 = $50,000. ARO = 0.5. ALE = SLE x ARO = $25,000."],[5,"A risk analyst rates risks as high, medium or low based on expert judgment, without using monetary values. Which approach is this?",["Qualitative risk analysis","Quantitative risk analysis","Annualized loss calculation","Business impact analysis"],0,"Qualitative analysis uses subjective ratings. Quantitative analysis uses numerical values such as SLE and ALE."],[5,"A European retailer discovers that customer personal data was exposed. By what deadline does the GDPR generally expect the supervisory authority to be notified, where feasible?",["24 hours","30 days","72 hours","7 days"],2,"GDPR requires notification to the supervisory authority without undue delay and, where feasible, within 72 hours of becoming aware of the breach."],[5,"Who is ultimately accountable for deciding the classification of a data set and approving who may access it?",["Data processor","Data custodian","System administrator","Data owner"],3,"The data owner has accountability for the data and sets classification and access decisions. The custodian carries out technical protection."],[5,"Which document gives a customer an inventory of all components and libraries in a vendor's software, helping them check exposure when a new library vulnerability is announced?",["Statement of work","Software bill of materials (SBOM)","Business impact analysis","Service level agreement"],1,"An SBOM lists the components in a software product so consumers can quickly identify affected products."],[5,"In a penetration testing exercise, which team simulates the attacker and which team defends?",["Blue team attacks; red team defends","Red team attacks; blue team defends","White team attacks; red team defends","Purple team attacks; green team defends"],1,"The red team plays the adversary and the blue team defends. A purple team facilitates collaboration between them."],[5,"Which metric represents the average time a system operates between failures and is used to assess reliability?",["Mean time between failures (MTBF)","Recovery point objective (RPO)","Mean time to repair (MTTR)","Recovery time objective (RTO)"],0,"MTBF measures expected operating time between failures. MTTR measures how long repairs take."],[5,"Which governance document gives detailed, step-by-step instructions for performing a specific task such as onboarding a new user account?",["Standard","Guideline","Policy","Procedure"],3,"Procedures are step-by-step instructions. Policies state high-level intent and standards define mandatory requirements."],[5,"A security standard states that all data at rest on laptops must use AES-256 encryption. Which governance document type is this?",["Guideline","Standard","Procedure","Business impact analysis"],1,"A standard defines specific mandatory requirements that support a broader policy."],[5,"Before signing a contract with a cloud provider, a company reviews the provider's financial stability, security certifications and references. What is this practice called?",["Right to audit","Due care","Due diligence","Continuous monitoring"],2,"Due diligence is the investigation performed before entering a relationship. Due care is acting responsibly afterward."],[5,"A group of executives and technical leaders walk through a ransomware scenario around a table to discuss their roles and decisions, without touching any systems. Which exercise is this?",["Penetration test","Failover test","Tabletop exercise","Parallel processing test"],2,"A tabletop exercise is a discussion-based walkthrough of an incident scenario and does not affect live systems."],[5,"Leadership accepts that a particular business unit may experience up to four hours of downtime per month before action is required. Which term describes this acceptable variation?",["Residual risk","Risk tolerance","Risk appetite","Inherent risk"],1,"Risk tolerance is the acceptable deviation from the risk appetite for specific objectives, while appetite is the broader amount of risk the organization is willing to pursue."],[5,"Which TWO of the following are managerial controls? (Choose TWO.)",["Intrusion prevention systems","Biometric door readers","Risk assessments","Perimeter fencing","Written security policies"],[2,4],"Managerial controls are administrative in nature, such as risk assessments and policies. The others are technical or physical controls."],[5,"Why is it important that an audit of security controls be performed by an independent external party?",["It provides objectivity and credibility to stakeholders and regulators","It is always cheaper than internal audits","It removes the need for internal controls","It guarantees that no findings will be reported"],0,"External auditors have no conflict of interest in the results, which increases trust in the findings."],[5,"A prospective customer wants evidence that a vendor's controls were tested over a period of several months, not just designed. Which report is MOST appropriate?",["SOC 2 Type II report","A vendor's marketing brochure","A self-assessment questionnaire","SOC 2 Type I report"],0,"A Type II report evaluates the operating effectiveness of controls over time, whereas Type I describes their design at a point in time."],[5,"A company keeps all customer records indefinitely, increasing the impact of any breach. Which policy would BEST address this issue?",["A clean desk policy","A bring-your-own-device policy","A data retention policy with defined disposal schedules","An acceptable use policy"],2,"Retention policies set how long data is kept and when it is securely destroyed, reducing unnecessary exposure."],[5,"A retailer stores and processes payment card numbers. Which standard MOST directly applies to the protection of that cardholder data?",["HIPAA","SOX","FERPA","PCI DSS"],3,"PCI DSS is the industry standard for organizations that store, process or transmit cardholder data."],[5,"Before sharing confidential product plans with a potential partner, which agreement should the organization MOST likely require?",["Memorandum of understanding","Non-disclosure agreement (NDA)","Bill of materials","Service level agreement"],1,"An NDA legally obliges the recipient to keep shared information confidential."]],[[1,"A data center posts a security guard at its main entrance. Which control category BEST describes the guard?",["Operational policy","Physical","Managerial","Technical"],1,"A guard is a physical control because it protects facilities and people through tangible means. Technical controls are implemented in systems and software."],[1,"A file server computes a SHA-256 hash of a configuration file every night and compares it with the previous value. Which part of the CIA triad is being verified?",["Integrity","Confidentiality","Non-repudiation","Availability"],0,"Hash comparison detects unauthorized changes to data, which is integrity. Hashing does not hide content, so it does not address confidentiality."],[1,"A router logs every command that an administrator types during a session. Which AAA function does this represent?",["Authentication","Federation","Authorization","Accounting"],3,"Accounting records what a user did and when. Authentication proves identity and authorization determines permitted actions."],[1,"Which TWO of the following are asymmetric cryptographic algorithms?",["ECC","RSA","SHA-256","AES","3DES"],[0,1],"RSA and ECC use public/private key pairs. AES and 3DES are symmetric ciphers and SHA-256 is a hashing algorithm."],[1,"An organization must encrypt very large volumes of data at rest with minimal performance impact. Which approach is BEST?",["Symmetric encryption such as AES","Steganography","Hashing with SHA-256","Asymmetric encryption such as RSA"],0,"Symmetric algorithms are much faster than asymmetric ones for bulk data. Hashing is one-way and cannot be reversed to recover the data."],[1,"Two syst
